    NotificationReason:
      type: string
      description: >
        Motivo (= tipo) di una notifica, usato dal filtro della casella e dalle preferenze email (C3, C5).
        `assigned`: la issue e' stata assegnata all'utente; `mentioned`: `@utente` in una issue o in un commento;
        `participating`: attivita' su una issue in cui l'utente e' autore o commentatore, o che gli e' assegnata;
        `subscribed`: attivita' su una issue seguita con Subscribe o su un repo in Watch `all`;
        `commit_linked`: un commit cita una issue seguita; `state_change`: chiusura o riapertura di una issue
        seguita (anche da commit); `webhook`: un webhook gestito dall'utente e' stato disattivato dai fallimenti (C7);
        `mirror`: un mirror in push di un repo di cui l'utente e' admin si e' fermato perche' la destinazione ha
        una storia diversa (V8); `credential`: avviso di sicurezza sulle credenziali dell'utente (cambio
        password, reset da un amministratore, nuovo token personale, nuova chiave SSH, token in scadenza, F13):
        senza repo ne' issue, `event` e' `credential.<tipo>`, sempre anche per email se l'SMTP e' attivo;
        `review_requested`: all'utente e' stata chiesta la review di una Pull Request (PR11), con l'email attiva di
        default come per `mentioned` e `assigned`. Le notifiche delle Pull Request riempiono `issue` con il numero
        condiviso (I1), il titolo e lo `state` (`closed` anche se unita) e hanno `event` `pull_request.*`,
        `pull_request_review.submitted` o `pull_request_comment.created`.
      enum:
        - assigned
        - mentioned
        - participating
        - subscribed
        - commit_linked
        - state_change
        - webhook
        - mirror
        - credential
        - review_requested
    NotificationRepo:
      type: object
      additionalProperties: false
      required: [id, fullName]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
          description: "`owner/repo`."
    NotificationIssue:
      type: object
      additionalProperties: false
      required: [number, title, state]
      properties:
        number:
          type: integer
          format: int64
        title:
          type: string
        state:
          type: string
          enum: [open, closed]
    NotificationWebhook:
      type: object
      description: Il webhook di una notifica `webhook`; assente se e' stato eliminato nel frattempo (la notifica sparisce con lui).
      additionalProperties: false
      required: [id, scope, url]
      properties:
        id:
          type: string
          format: uuid
        scope:
          $ref: "#/components/schemas/WebhookScope"
        url:
          type: string
    Notification:
      type: object
      additionalProperties: false
      required: [id, reason, read, archived, event, summary, createdAt]
      properties:
        id:
          type: string
          format: uuid
        reason:
          $ref: "#/components/schemas/NotificationReason"
        read:
          type: boolean
        archived:
          type: boolean
        event:
          type: string
          description: Nome dell'evento di dominio da cui nasce (es. `issue.closed`, docs/events.md).
          example: issue.closed
        summary:
          type: string
          description: Testo breve leggibile da persone, non contrattuale.
        repository:
          allOf:
            - $ref: "#/components/schemas/NotificationRepo"
          nullable: true
          type: object
        issue:
          allOf:
            - $ref: "#/components/schemas/NotificationIssue"
          nullable: true
          type: object
        commentId:
          type: string
          format: uuid
          nullable: true
          description: Il commento che ha causato la notifica, se c'e'.
        webhook:
          allOf:
            - $ref: "#/components/schemas/NotificationWebhook"
          nullable: true
          type: object
        actor:
          allOf:
            - $ref: "#/components/schemas/IssueUser"
          nullable: true
          type: object
          description: Chi ha causato la notifica; assente per gli eventi di sistema (es. chiusura da commit).
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
          nullable: true
    NotificationList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total, unreadCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
        unreadCount:
          type: integer
          description: Notifiche non lette e non archiviate dell'utente (filtri `reason` e `repo` compresi).
    UpdateNotificationInput:
      type: object
      additionalProperties: false
      properties:
        read:
          type: boolean
          description: "`true` segna come letta, `false` di nuovo come non letta."
        archived:
          type: boolean
          description: "`true` archivia, `false` ripristina."
    MarkedNotifications:
      type: object
      additionalProperties: false
      required: [marked]
      properties:
        marked:
          type: integer
          description: Quante notifiche sono passate da non letta a letta.
    DeletedNotifications:
      type: object
      additionalProperties: false
      required: [deleted]
      properties:
        deleted:
          type: integer
    NotificationPreferences:
      type: object
      additionalProperties: false
      required: [emailAvailable, email]
      properties:
        emailAvailable:
          type: boolean
          description: "`false` senza SMTP configurato o per un agente: le email non partono (C4, C5)."
        email:
          type: object
          description: Per ogni tipo (`NotificationReason`) se arriva anche una email. Sono sempre presenti tutti i tipi.
          additionalProperties:
            type: boolean
          example:
            assigned: true
            mentioned: true
            participating: false
            subscribed: false
            commit_linked: false
            state_change: false
            webhook: false
            mirror: false
    UpdateNotificationPreferencesInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: object
          description: Tipo (`NotificationReason`) → email si/no. I tipi omessi non cambiano.
          additionalProperties:
            type: boolean
    RepoWatchMode:
      type: string
      enum: [participating, all, ignore]
    RepoWatch:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          $ref: "#/components/schemas/RepoWatchMode"
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Assente finche' l'utente non ha mai scelto (default `participating`).
    SetRepoWatchInput:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          $ref: "#/components/schemas/RepoWatchMode"
    IssueSubscription:
      type: object
      additionalProperties: false
      required: [subscribed, reason]
      properties:
        subscribed:
          type: boolean
        reason:
          type: string
          description: >
            Perche' si segue: `author`, `assignee`, `commenter`, `mentioned` (automatico), `manual` (Subscribe),
            oppure `none` se non si segue (Unsubscribe esplicito o mai coinvolti).
          enum: [author, assignee, commenter, mentioned, manual, none]
    WebhookScope:
      type: string
      enum: [repo, org]
    WebhookEvent:
      type: string
      description: >
        Evento selezionabile (C6): `push`, `issues` (apertura, chiusura, riapertura, modifica, etichette,
        assegnatari, milestone, blocco), `issue_comment` (creato, modificato, eliminato), `repository` (creato,
        eliminato, archiviato, ripristinato, rinominato, visibilita'), `pull_request` (aperta, modificata,
        chiusa, riaperta, unita, pronta, bozza, nuovi commit, richieste di review), `pull_request_review`
        (review inviata, approvazione annullata) e `commit_status` (stato di un commit, PR11). Payload in
        docs/webhooks.md e negli schemi `WebhookPullRequestPayload`, `WebhookPullRequestReviewPayload` e
        `WebhookCommitStatusPayload`. `deployment` (app, v3-a H12): deploy avviato, riuscito, fallito o tornato
        indietro, payload `WebhookDeploymentPayload`.
      enum: [push, issues, issue_comment, repository, pull_request, pull_request_review, commit_status, workflow_run, workflow_job, release, deployment]
    RepoMirrorState:
      type: string
      description: >
        Stato di un mirror in push. `pending`: in coda (mai spinto, o un push nuovo da fare); `syncing`: un
        worker lo sta spingendo; `in_sync`: la destinazione ha lo stato dell'ultimo push riuscito; `error`:
        l'ultimo tentativo e' fallito (rete, credenziale, destinazione non ammessa...), si ritenta con attesa
        crescente 30 s, 2 min, 10 min, 1 ora fino a 6 ore, tranne un blocco egress (C8) che non si ritenta;
        `diverged`: la destinazione ha una storia diversa (non fast-forward, o un tag gia' presente con un altro
        commit): fermo, nessun tentativo automatico e nessuna sovrascrittura, gli admin del repo ricevono una
        notifica `mirror`; riparte solo con `syncRepoMirror`.
      enum: [pending, syncing, in_sync, error, diverged]
    RepoMirror:
      type: object
      additionalProperties: false
      required: [id, url, username, hasToken, enabled, state, attempts, lastPushed, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          description: Destinazione, `https://` senza credenziali.
        username:
          type: string
        hasToken:
          type: boolean
          description: "Sempre `true`: il token non torna mai nelle risposte."
        enabled:
          type: boolean
        state:
          $ref: "#/components/schemas/RepoMirrorState"
        attempts:
          type: integer
          description: Tentativi falliti consecutivi dall'ultimo successo.
        nextAttemptAt:
          type: string
          format: date-time
          nullable: true
          description: Quando e' previsto il prossimo tentativo; `null` se non c'e' niente in coda.
        lastAttemptAt:
          type: string
          format: date-time
          nullable: true
        lastSuccessAt:
          type: string
          format: date-time
          nullable: true
        lastError:
          type: string
          nullable: true
          description: Motivo dell'ultimo errore o della divergenza, senza credenziali; `null` dopo un successo.
        lastPushed:
          type: object
          description: Ref → SHA dell'ultimo push riuscito.
          additionalProperties:
            type: string
          example:
            refs/heads/main: 4f1c2a9e0b7d3c5a6e8f1b2c3d4e5f60718293a4
            refs/tags/v1.0.0: 9a8b7c6d5e4f30211203f4e5d6c7b8a998877665
        createdBy:
          allOf:
            - $ref: "#/components/schemas/IssueUser"
          nullable: true
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 0b9d2c1e-6f7a-4c3d-9e8f-1a2b3c4d5e6f
        url: https://github.com/example/gitstack.git
        username: gitstack-mirror
        hasToken: true
        enabled: true
        state: diverged
        attempts: 0
        nextAttemptAt: null
        lastAttemptAt: "2026-10-06T19:30:12Z"
        lastSuccessAt: "2026-10-06T18:02:44Z"
        lastError: "refs/heads/main: rifiutato (non-fast-forward): la destinazione ha una storia diversa"
        lastPushed:
          refs/heads/main: 4f1c2a9e0b7d3c5a6e8f1b2c3d4e5f60718293a4
        createdAt: "2026-10-01T08:00:00Z"
        updatedAt: "2026-10-06T19:30:12Z"
    RepoMirrorList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RepoMirror"
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
    CreateRepoMirrorInput:
      type: object
      additionalProperties: false
      required: [url, username, token]
      properties:
        url:
          type: string
          format: uri
          description: "`https://` senza credenziali, al massimo 2048 caratteri."
        username:
          type: string
          description: Da 1 a 256 caratteri.
        token:
          type: string
          writeOnly: true
          description: Token o password per la destinazione (da 1 a 512 caratteri); cifrato, non torna mai.
        enabled:
          type: boolean
          description: Default `true`.
      example:
        url: https://github.com/example/gitstack.git
        username: gitstack-mirror
        token: ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    UpdateRepoMirrorInput:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
        username:
          type: string
        token:
          type: string
          writeOnly: true
          description: Sostituisce il token; non si puo' togliere.
        enabled:
          type: boolean
    RepoMirrorRunOutcome:
      type: string
      description: >
        `success`: push riuscito (anche se tutto era gia' aggiornato); `error`: fallito, si ritenta;
        `diverged`: la destinazione ha una storia diversa, fermo; `blocked`: destinazione non ammessa dalla
        policy di uscita (C8), non si ritenta.
      enum: [success, error, diverged, blocked]
    RepoMirrorRunRef:
      type: object
      additionalProperties: false
      required: [ref, status]
      properties:
        ref:
          type: string
          example: refs/heads/main
        status:
          type: string
          enum: [pushed, up-to-date, rejected, error]
        sha:
          type: string
          description: SHA locale del ref, per `pushed` e `up-to-date`.
        reason:
          type: string
          description: Motivo del rifiuto o dell'errore, es. `non-fast-forward`, `fetch first`, `already exists`.
    RepoMirrorRun:
      type: object
      additionalProperties: false
      required: [id, startedAt, finishedAt, durationMs, outcome, attempt, refs]
      properties:
        id:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
        outcome:
          $ref: "#/components/schemas/RepoMirrorRunOutcome"
        attempt:
          type: integer
          description: Numero del tentativo (1 = il primo dopo un successo o una richiesta).
        error:
          type: string
          nullable: true
          description: Senza credenziali.
        refs:
          type: array
          items:
            $ref: "#/components/schemas/RepoMirrorRunRef"
    RepoMirrorRunList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RepoMirrorRun"
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
    PullMirrorMode:
      type: string
      description: >
        `mirror`: «mantieni sincronizzato», il repo resta in sola lettura e si aggiorna a intervalli (MP1-MP4);
        `once`: «copia una volta sola» (MP8), dopo la prima copia il mirror e' interrotto e il repo e' normale.
      enum: [mirror, once]
    PullMirrorState:
      type: string
      description: >
        Stato di un mirror in pull, con gli stessi nomi del mirror in push. `pending`: in coda (primo
        aggiornamento o prossimo giro); `syncing`: un worker lo sta aggiornando; `in_sync`: l'ultimo
        aggiornamento e' riuscito (anche con ref `diverged`: gli altri ref si aggiornano); `error`: l'ultimo
        tentativo e' fallito, si ritenta con attesa crescente 30 s, 2 min, 10 min, 1 ora, 3 ore, poi ogni 6
        ore, tranne un blocco della policy di uscita (C8) che non si ritenta; `paused`: fermato da un admin,
        repo in sola lettura; `stopped`: interrotto (MP6), il repo e' normale, restano registro e ref
        `diverged`.
      enum: [pending, syncing, in_sync, error, paused, stopped]
    PullMirrorDivergedRef:
      type: object
      additionalProperties: false
      required: [ref, kind, localSha, detectedAt]
      properties:
        ref:
          type: string
          example: refs/heads/main
        kind:
          type: string
          description: >
            `rewritten`: l'origine ha riscritto il ref (force-push, non fast-forward, tag spostato);
            `deleted`: l'origine l'ha cancellato. In entrambi i casi su GitStack resta la versione precedente.
          enum: [rewritten, deleted]
        localSha:
          type: string
          description: SHA su GitStack (la versione conservata).
        remoteSha:
          type: string
          nullable: true
          description: SHA nell'origine; `null` se il ref e' stato cancellato.
        detectedAt:
          type: string
          format: date-time
    PullMirror:
      type: object
      additionalProperties: false
      required: [id, origin, mode, intervalSeconds, state, hasToken, attempts, divergedRefs, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        origin:
          type: string
          format: uri
          description: Origine, `https://` senza credenziali (MP5).
        mode:
          $ref: "#/components/schemas/PullMirrorMode"
        intervalSeconds:
          type: integer
          minimum: 300
          maximum: 86400
          description: Ogni quanto si aggiorna (default 600, da 5 minuti a 24 ore, MP4).
        state:
          $ref: "#/components/schemas/PullMirrorState"
        username:
          type: string
          nullable: true
          description: Utente per l'origine; `null` senza credenziali.
        hasToken:
          type: boolean
          description: "`true` se c'e' un token per l'origine. Il token non torna mai nelle risposte."
        attempts:
          type: integer
          description: Tentativi falliti consecutivi dall'ultimo successo.
        nextSyncAt:
          type: string
          format: date-time
          nullable: true
          description: Prossimo aggiornamento previsto; `null` in pausa, interrotto o in corso.
        lastAttemptAt:
          type: string
          format: date-time
          nullable: true
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
          description: Ultimo aggiornamento riuscito.
        lastError:
          type: string
          nullable: true
          description: Motivo dell'ultimo errore, senza credenziali; `null` dopo un successo.
        divergedRefs:
          type: array
          description: Ref segnati `diverged` (MP1), vuoto se non ce ne sono.
          items:
            $ref: "#/components/schemas/PullMirrorDivergedRef"
        stoppedAt:
          type: string
          format: date-time
          nullable: true
        createdBy:
          allOf:
            - $ref: "#/components/schemas/IssueUser"
          nullable: true
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 5c1f0a3e-2b7d-4e68-9a41-0d8f6b2c7e19
        origin: https://github.com/example/gitstack.git
        mode: mirror
        intervalSeconds: 600
        state: in_sync
        username: gitstack-backup
        hasToken: true
        attempts: 0
        nextSyncAt: "2026-10-12T09:50:00Z"
        lastAttemptAt: "2026-10-12T09:40:00Z"
        lastSyncedAt: "2026-10-12T09:40:00Z"
        lastError: null
        divergedRefs:
          - ref: refs/heads/old-feature
            kind: rewritten
            localSha: 4f1c2a9e0b7d3c5a6e8f1b2c3d4e5f60718293a4
            remoteSha: 9a8b7c6d5e4f30211203f4e5d6c7b8a998877665
            detectedAt: "2026-10-11T22:10:00Z"
        createdAt: "2026-10-10T08:00:00Z"
        updatedAt: "2026-10-12T09:40:00Z"
    EnablePullMirrorInput:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: "`https://` senza credenziali, al massimo 2048 caratteri."
        username:
          type: string
          description: Facoltativo, da 1 a 256 caratteri.
        token:
          type: string
          writeOnly: true
          description: Facoltativo, da 1 a 512 caratteri; cifrato, non torna mai.
        intervalSeconds:
          type: integer
          minimum: 300
          maximum: 86400
          description: Default 600.
      example:
        url: https://github.com/example/gitstack.git
        username: gitstack-backup
        token: ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        intervalSeconds: 600
    ImportRepositoryInput:
      type: object
      additionalProperties: false
      required: [owner, name, url, mode]
      properties:
        owner:
          $ref: "#/components/schemas/Name"
        name:
          $ref: "#/components/schemas/RepoName"
        description:
          type: string
          maxLength: 1024
        visibility:
          $ref: "#/components/schemas/RepoVisibility"
        url:
          type: string
          format: uri
          description: Origine, `https://` senza credenziali, al massimo 2048 caratteri (MP5).
        mode:
          $ref: "#/components/schemas/PullMirrorMode"
        username:
          type: string
          description: Facoltativo, da 1 a 256 caratteri.
        token:
          type: string
          writeOnly: true
          description: Facoltativo, da 1 a 512 caratteri; cifrato, non torna mai e con `once` e' cancellato a copia finita.
        intervalSeconds:
          type: integer
          minimum: 300
          maximum: 86400
          description: "Solo con `mode: mirror`; default 600."
      example:
        owner: alice
        name: gitstack-backup
        visibility: private
        url: https://github.com/example/gitstack.git
        mode: mirror
        intervalSeconds: 600
    UpdatePullMirrorInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        intervalSeconds:
          type: integer
          minimum: 300
          maximum: 86400
        username:
          type: string
          description: Stringa vuota toglie l'utente.
        token:
          type: string
          writeOnly: true
          description: Sostituisce il token; stringa vuota lo toglie.
    StopPullMirrorInput:
      type: object
      additionalProperties: false
      required: [confirm]
      properties:
        confirm:
          type: string
          description: Il nome del repo (`name`), riscritto come conferma (MP6, G8).
      example:
        confirm: gitstack-backup
    PullMirrorRunOutcome:
      type: string
      description: >
        `success`: aggiornamento riuscito (anche se tutto era gia' allineato); `diverged`: riuscito ma almeno
        un ref e' divergente (conservato, gli altri si sono aggiornati); `error`: fallito, si ritenta;
        `blocked`: origine non ammessa dalla policy di uscita (C8), non si ritenta.
      enum: [success, diverged, error, blocked]
    PullMirrorRunRef:
      type: object
      additionalProperties: false
      required: [ref, status]
      properties:
        ref:
          type: string
          example: refs/heads/main
        status:
          type: string
          enum: [created, updated, up-to-date, diverged, error]
        oldSha:
          type: string
          nullable: true
        newSha:
          type: string
          nullable: true
        reason:
          type: string
          description: Motivo per `diverged` ed `error`, es. `non-fast-forward`, `deleted`.
    PullMirrorRun:
      type: object
      additionalProperties: false
      required: [id, trigger, startedAt, finishedAt, durationMs, outcome, attempt, refs]
      properties:
        id:
          type: string
          format: uuid
        trigger:
          type: string
          description: "`initial`: prima copia; `schedule`: a intervallo; `manual`: «Sincronizza ora»/Riprendi."
          enum: [initial, schedule, manual]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
        outcome:
          $ref: "#/components/schemas/PullMirrorRunOutcome"
        attempt:
          type: integer
          description: Numero del tentativo (1 = il primo dopo un successo o una richiesta).
        error:
          type: string
          nullable: true
          description: Senza credenziali.
        refs:
          type: array
          description: Cosa e' successo a ogni ref che e' cambiato o e' divergente (i ref invariati si omettono).
          items:
            $ref: "#/components/schemas/PullMirrorRunRef"
    PullMirrorRunList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PullMirrorRun"
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
    Webhook:
      type: object
      additionalProperties: false
      required: [id, scope, url, events, active, hasSecret, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        scope:
          $ref: "#/components/schemas/WebhookScope"
        repository:
          allOf:
            - $ref: "#/components/schemas/NotificationRepo"
          nullable: true
          type: object
          description: Il repo, per scope `repo`.
        organization:
          type: string
          nullable: true
          description: Nome dell'organizzazione, per scope `org`.
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEvent"
        active:
          type: boolean
        hasSecret:
          type: boolean
          description: Il segreto non torna mai nelle risposte; senza segreto la consegna non e' firmata.
        disabledAt:
          type: string
          format: date-time
          nullable: true
          description: Quando i fallimenti consecutivi lo hanno disattivato (C7); `null` se attivo o messo in pausa a mano.
        disabledReason:
          type: string
          nullable: true
          enum: [consecutive_failures]
        failingSince:
          type: string
          format: date-time
          nullable: true
          description: Inizio dei fallimenti consecutivi in corso; dopo 3 giorni il webhook si disattiva.
        lastDelivery:
          allOf:
            - $ref: "#/components/schemas/WebhookDeliverySummary"
          nullable: true
          type: object
        createdBy:
          allOf:
            - $ref: "#/components/schemas/IssueUser"
          nullable: true
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WebhookList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Webhook"
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
    CreateWebhookInput:
      type: object
      additionalProperties: false
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/WebhookEvent"
        secret:
          type: string
          writeOnly: true
          maxLength: 256
          description: Segreto per l'HMAC-SHA256 di `X-GitStack-Signature`. Facoltativo; scritto una volta, mai restituito.
        active:
          type: boolean
          default: true
    UpdateWebhookInput:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/WebhookEvent"
        secret:
          type: string
          writeOnly: true
          maxLength: 256
          description: Una stringa sostituisce il segreto; la stringa vuota lo toglie.
        active:
          type: boolean
    WebhookDeliveryStatus:
      type: string
      description: >
        `pending`: in coda o in attesa del prossimo tentativo; `success`: risposta 2xx; `failed`: tentativi esauriti
        (8 in circa 24 ore) o errore non ritentabile; `gone`: il destinatario ha risposto `410 Gone` e la consegna
        e' ferma (C7).
      enum: [pending, success, failed, gone]
    WebhookDeliverySummary:
      type: object
      additionalProperties: false
      required: [id, event, status, attempt, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Il valore dell'intestazione `X-GitStack-Delivery`.
        event:
          $ref: "#/components/schemas/WebhookEvent"
        action:
          type: string
          description: Azione dell'evento (es. `opened`, `closed`); vuota per `push`.
        status:
          $ref: "#/components/schemas/WebhookDeliveryStatus"
        attempt:
          type: integer
          minimum: 0
          maximum: 8
          description: Tentativi fatti, al massimo 8 (C7).
        nextAttemptAt:
          type: string
          format: date-time
          nullable: true
        statusCode:
          type: integer
          nullable: true
          description: Codice HTTP dell'ultimo tentativo; assente per errori di rete o timeout di 10 s.
        durationMs:
          type: integer
          nullable: true
        error:
          type: string
          description: Errore di rete o di protezione SSRF dell'ultimo tentativo; vuoto se c'e' stata una risposta.
        redeliveryOf:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
          nullable: true
    WebhookDelivery:
      $ref: "#/components/schemas/WebhookDeliverySummary"
    WebhookDeliveryList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebhookDeliverySummary"
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
    WebhookDeliveryRequest:
      type: object
      additionalProperties: false
      required: [headers, payload]
      properties:
        headers:
          type: object
          additionalProperties:
            type: string
          description: Le intestazioni inviate (`X-GitStack-Event`, `X-GitStack-Delivery`, `X-GitStack-Signature` se c'e' un segreto, ...).
        payload:
          type: object
          additionalProperties: true
          description: Il corpo JSON inviato (formato in docs/webhooks.md).
    WebhookDeliveryResponse:
      type: object
      additionalProperties: false
      required: [headers, body, truncated]
      properties:
        headers:
          type: object
          additionalProperties:
            type: string
        body:
          type: string
          description: Corpo della risposta, troncato a 4 KB (C8).
        truncated:
          type: boolean
    WebhookDeliveryDetail:
      allOf:
        - $ref: "#/components/schemas/WebhookDeliverySummary"
        - type: object
          required: [request]
          properties:
            request:
              $ref: "#/components/schemas/WebhookDeliveryRequest"
            response:
              allOf:
                - $ref: "#/components/schemas/WebhookDeliveryResponse"
              nullable: true
              type: object
              description: Assente se non c'e' stata nessuna risposta.
    PullRequestState:
      type: string
      description: >
        Stato (PR6): `open` (aperta, in bozza o pronta, vedi `draft`), `closed` (chiusa senza merge, si riapre
        se i branch esistono) o `merged` (unita, definitiva).
      enum: [open, closed, merged]
    MergeMethod:
      type: string
      description: Metodo di merge (PR3). Il rebase non esiste.
      enum: [merge, squash]
    ReviewDecision:
      type: string
      description: >
        Esito delle review (PR12): `none` nessuna review richiesta ne' inviata, `required` servono ancora
        approvazioni, `approved` approvazioni sufficienti, `changes_requested` c'e' una richiesta di modifiche
        non superata.
      enum: [none, required, approved, changes_requested]
    CommitStatusState:
      type: string
      description: Stato di un commit (PR9).
      enum: [pending, success, failure, error]
    PullRequest:
      type: object
      additionalProperties: false
      required:
        - id
        - number
        - title
        - body
        - state
        - draft
        - author
        - sourceBranch
        - targetBranch
        - headSha
        - requestedReviewers
        - reviewDecision
        - approvals
        - requiredApprovals
        - commentCount
        - unresolvedThreadCount
        - closingIssues
        - commitCount
        - changedFiles
        - additions
        - deletions
        - sourceBranchExists
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          format: int64
          description: "`#n`, dal contatore del repo condiviso con le issues (I1); non si riusa mai."
        title:
          type: string
          minLength: 1
          maxLength: 256
        body:
          type: string
          maxLength: 65536
          description: Markdown (D10).
        state:
          $ref: "#/components/schemas/PullRequestState"
        draft:
          type: boolean
          description: Bozza (PR6). Sempre false se `state` non e' `open`.
        author:
          $ref: "#/components/schemas/IssueUser"
        viaToken:
          $ref: "#/components/schemas/IssueViaToken"
        sourceBranch:
          type: string
          description: Branch di origine, dello stesso repo (PR1).
        targetBranch:
          type: string
          description: Branch di destinazione.
        headSha:
          type: string
          pattern: "^[0-9a-f]{40,64}$"
          description: Punta del branch di origine; per una PR unita quella al momento del merge.
        baseSha:
          type: string
          pattern: "^[0-9a-f]{40,64}$"
          description: Merge-base fra i due branch al momento dell'ultimo calcolo.
        sourceBranchExists:
          type: boolean
          description: Il branch di origine esiste ancora (condizione per riaprire, PR6).
        requestedReviewers:
          type: array
          items:
            $ref: "#/components/schemas/IssueUser"
        reviewDecision:
          $ref: "#/components/schemas/ReviewDecision"
        approvals:
          type: integer
          minimum: 0
          description: "Approvazioni valide: di persone con `write`, sull'ultimo commit, non dell'autore (PR2, PR4)."
        requiredApprovals:
          type: integer
          minimum: 0
          maximum: 5
          description: Approvazioni richieste dal branch di destinazione; 0 se «Richiedi una Pull Request» e' spenta.
        statusState:
          allOf:
            - $ref: "#/components/schemas/CombinedCommitStatusState"
          nullable: true
          type: object
          description: Stato complessivo dei commit sulla punta di `headSha` (PR9); `null` se non calcolato.
        commentCount:
          type: integer
          minimum: 0
          description: Commenti non eliminati, generali e sulle righe.
        unresolvedThreadCount:
          type: integer
          minimum: 0
        closingIssues:
          type: array
          description: Numeri delle issues che le parole chiave di C2 chiudono al merge (PR8).
          items:
            type: integer
            format: int64
        commitCount:
          type: integer
          minimum: 0
        changedFiles:
          type: integer
          minimum: 0
        additions:
          type: integer
          minimum: 0
        deletions:
          type: integer
          minimum: 0
        mergeMethod:
          allOf:
            - $ref: "#/components/schemas/MergeMethod"
          nullable: true
          type: object
          description: Solo per una PR unita.
        mergeCommitSha:
          type: string
          nullable: true
          pattern: "^[0-9a-f]{40,64}$"
          description: Commit creato dal merge; solo per una PR unita.
        mergedBy:
          allOf:
            - $ref: "#/components/schemas/IssueUser"
          nullable: true
          type: object
        mergedAt:
          type: string
          format: date-time
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true
          description: Chiusura senza merge; azzerato dalla riapertura.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PullRequestSummary:
      type: object
      description: "Pull Request negli elenchi: senza testo."
      additionalProperties: false
      required: [number, title, state, draft, author, sourceBranch, targetBranch, reviewDecision, commentCount, requestedReviewers, createdAt, updatedAt]
      properties:
        number:
          type: integer
          format: int64
        title:
          type: string
        state:
          $ref: "#/components/schemas/PullRequestState"
        draft:
          type: boolean
        author:
          $ref: "#/components/schemas/IssueUser"
        sourceBranch:
          type: string
        targetBranch:
          type: string
        reviewDecision:
          $ref: "#/components/schemas/ReviewDecision"
        statusState:
          allOf:
            - $ref: "#/components/schemas/CombinedCommitStatusState"
          nullable: true
          type: object
        requestedReviewers:
          type: array
          items:
            $ref: "#/components/schemas/IssueUser"
        commentCount:
          type: integer
          minimum: 0
        mergedAt:
          type: string
          format: date-time
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PullRequestList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PullRequestSummary"
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
    PullRequestSearchResult:
      type: object
      additionalProperties: false
      required: [repo, pullRequest]
      properties:
        repo:
          type: string
          description: "`owner/nome` del repo."
        pullRequest:
          $ref: "#/components/schemas/PullRequestSummary"
    PullRequestSearchResultList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PullRequestSearchResult"
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
    PullRequestEvent:
      type: object
      additionalProperties: false
      required: [id, type, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [opened, renamed, edited, retargeted, ready_for_review, converted_to_draft, closed, reopened, merged, branch_deleted]
        actor:
          allOf:
            - $ref: "#/components/schemas/IssueUser"
          nullable: true
          type: object
          description: Assente per gli eventi di sistema.
        data:
          type: object
          additionalProperties: true
          description: >
            Dettagli per tipo: `opened` ha `draft`, `sourceBranch` e `targetBranch`; `renamed` ha `from` e `to`;
            `retargeted` ha `from` e `to` (branch di destinazione); `merged` ha `method` e `sha`; `branch_deleted` ha `branch`.
        createdAt:
          type: string
          format: date-time
    PullRequestEventList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PullRequestEvent"
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
    CreatePullRequestInput:
      type: object
      additionalProperties: false
      required: [title, sourceBranch]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 256
        body:
          type: string
          maxLength: 65536
          description: Markdown (D10); le parole chiave di C2 collegano le issues (PR8).
        sourceBranch:
          type: string
          minLength: 1
          maxLength: 255
        targetBranch:
          type: string
          minLength: 1
          maxLength: 255
          description: Se manca, il branch principale del repo (R4).
        draft:
          type: boolean
          default: false
          description: Apre in bozza (PR6, PR10).
        reviewers:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/Name"
          description: Nomi utente dei revisori richiesti (PR12); almeno `read` sul repo.
    UpdatePullRequestInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 256
        body:
          type: string
          maxLength: 65536
        targetBranch:
          type: string
          minLength: 1
          maxLength: 255
    MergePullRequestInput:
      type: object
      additionalProperties: false
      required: [method]
      properties:
        method:
          $ref: "#/components/schemas/MergeMethod"
        commitTitle:
          type: string
          maxLength: 256
          description: Titolo del commit di merge o di squash; se manca lo propone il server.
        commitMessage:
          type: string
          maxLength: 65536
        expectedHeadSha:
          type: string
          pattern: "^[0-9a-f]{40,64}$"
          description: Se la punta del branch di origine e' cambiata, 409 `head_changed`.
        deleteBranch:
          type: boolean
          default: false
          description: Elimina il branch di origine dopo il merge (PR3); vale anche l'impostazione `deleteBranchOnMerge`.
    MergeBlocker:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - draft
            - not_open
            - conflicts
            - approvals_required
            - changes_requested
            - status_required
            - status_failed
            - nothing_to_merge
            - unrelated_histories
          description: >
            Perche' non si puo' unire: `draft` (PR6), `not_open`, `conflicts` (PR7), `approvals_required` e
            `changes_requested` (PR4), `status_required` (contesto obbligatorio mai arrivato o `pending`) e
            `status_failed` (contesto obbligatorio `failure` o `error`, PR9), `nothing_to_merge` (il branch di origine e' gia'
            contenuto nella destinazione) e `unrelated_histories` (nessuna storia in comune).
        message:
          type: string
        contexts:
          type: array
          items:
            type: string
          description: I contesti coinvolti, per `status_required` e `status_failed`.
    PullRequestMergeability:
      type: object
      additionalProperties: false
      required: [state, mergeable, conflictFiles, behindBy, aheadBy, blockers, allowedMethods, defaultMethod, approvals, requiredApprovals, headSha]
      properties:
        state:
          type: string
          enum: [mergeable, conflicts, blocked, unknown]
          description: >
            `mergeable` si puo' unire; `conflicts` il merge produce conflitti (PR7); `blocked` nessun conflitto ma
            c'e' un blocco in `blockers`; `unknown` calcolo non ancora pronto.
        mergeable:
          type: boolean
          description: True solo con `state` uguale a `mergeable`.
        conflictFiles:
          type: array
          description: >
            File in conflitto (percorsi), vuoto se non ce ne sono. Al massimo 100: oltre, `conflictFilesTruncated`.
          maxItems: 100
          items:
            type: string
        conflictFilesTruncated:
          type: boolean
        conflictInstructions:
          type: array
          description: >
            Con `state` uguale a `conflicts`, i comandi per risolvere i conflitti in locale (PR7), uno per riga:
            `gs pr checkout <numero>`, `git merge origin/<destinazione>`, poi commit e push. Vuoto negli altri stati.
          items:
            type: string
        behindBy:
          type: integer
          minimum: 0
          description: Commit della destinazione non ancora nel branch di origine. Non impedisce il merge (PR7).
        aheadBy:
          type: integer
          minimum: 0
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/MergeBlocker"
        allowedMethods:
          type: array
          items:
            $ref: "#/components/schemas/MergeMethod"
        defaultMethod:
          $ref: "#/components/schemas/MergeMethod"
        approvals:
          type: integer
          minimum: 0
        requiredApprovals:
          type: integer
          minimum: 0
          maximum: 5
        headSha:
          type: string
          pattern: "^[0-9a-f]{40,64}$"
          description: Punta del branch di origine su cui e' stato calcolato lo stato.
    PullRequestFiles:
      type: object
      additionalProperties: false
      required: [files, filesChanged, additions, deletions, truncated, viewedPaths, headSha, baseSha]
      properties:
        files:
          type: array
          maxItems: 300
          items:
            $ref: "#/components/schemas/FileDiff"
        filesChanged:
          type: integer
          minimum: 0
          description: Numero reale di file toccati, anche oltre i 300 elencati.
        additions:
          type: integer
          minimum: 0
        deletions:
          type: integer
          minimum: 0
        truncated:
          type: boolean
          description: Come in `CommitDetail`.
        listOnly:
          type: boolean
          description: Oltre i limiti di B6 solo l'elenco dei file, senza patch.
        ignoreWhitespace:
          type: boolean
        viewedPaths:
          type: array
          items:
            type: string
          description: File marcati Viewed da chi chiama (PR12).
        headSha:
          type: string
          pattern: "^[0-9a-f]{40,64}$"
        baseSha:
          type: string
          pattern: "^[0-9a-f]{40,64}$"
          description: Merge-base da cui e' calcolato il diff.
    SetFileViewedInput:
      type: object
      additionalProperties: false
      required: [path, viewed]
      properties:
        path:
          type: string
          minLength: 1
        viewed:
          type: boolean
    ReviewEvent:
      type: string
      description: Esito scelto all'invio (PR5).
      enum: [comment, approve, request_changes]
    ReviewState:
      type: string
      enum: [commented, approved, changes_requested]
    DiffSide:
      type: string
      description: Lato del diff su cui sta la riga (PR5), `old` e' il file prima, `new` dopo.
      enum: [old, new]
    ReviewCommentInput:
      type: object
      additionalProperties: false
      required: [path, side, line, body]
      properties:
        path:
          type: string
          minLength: 1
        side:
          $ref: "#/components/schemas/DiffSide"
        line:
          type: integer
          minimum: 1
          description: Ultima riga commentata.
        startLine:
          type: integer
          minimum: 1
          description: Prima riga, per un gruppo di righe; deve essere minore di `line` e sullo stesso lato.
        body:
          type: string
          minLength: 1
          maxLength: 65536
          description: Markdown (D10); un blocco `suggestion` si mostra come diff, senza «Applica» (PR5).
    CreatePullRequestReviewInput:
      type: object
      additionalProperties: false
      required: [event]
      properties:
        event:
          $ref: "#/components/schemas/ReviewEvent"
        body:
          type: string
          maxLength: 65536
        commitSha:
          type: string
          pattern: "^[0-9a-f]{40,64}$"
          description: Punta della PR che si e' vista; se e' cambiata, 409 `head_changed`.
        comments:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ReviewCommentInput"
    PullRequestReview:
      type: object
      additionalProperties: false
      required: [id, author, state, body, commitSha, stale, countsAsApproval, commentCount, submittedAt]
      properties:
        id:
          type: string
          format: uuid
        author:
          $ref: "#/components/schemas/IssueUser"
        state:
          $ref: "#/components/schemas/ReviewState"
        body:
          type: string
        commitSha:
          type: string
          pattern: "^[0-9a-f]{40,64}$"
          description: Punta della PR al momento della review.
        stale:
          type: boolean
          description: Nuovi commit hanno annullato l'approvazione (PR4); la review resta nella cronologia.
        countsAsApproval:
          type: boolean
          description: >
            True solo per `approved` di una persona con `write`, non annullata e non dell'autore. Gli agenti
            possono approvare ma non contano (PR2).
        commentCount:
          type: integer
          minimum: 0
          description: Commenti sulle righe inviati con la review.
        submittedAt:
          type: string
          format: date-time
    PullRequestReviewList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PullRequestReview"
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
    CreatePullRequestCommentInput:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 65536
        path:
          type: string
          minLength: 1
          description: File commentato; con `path` servono anche `side`, `line` e `commitSha`.
        side:
          $ref: "#/components/schemas/DiffSide"
        line:
          type: integer
          minimum: 1
        startLine:
          type: integer
          minimum: 1
        commitSha:
          type: string
          pattern: "^[0-9a-f]{40,64}$"
          description: Punta della PR su cui sta la riga (409 `head_changed` se non e' piu' quella).
        inReplyTo:
          type: string
          format: uuid
          description: "Id di un commento sulle righe: il nuovo entra nella sua conversazione. Esclude `path`."
    UpdatePullRequestCommentInput:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 65536
    PullRequestComment:
      type: object
      additionalProperties: false
      required: [id, author, body, edited, deleted, outdated, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        author:
          $ref: "#/components/schemas/IssueUser"
        viaToken:
          $ref: "#/components/schemas/IssueViaToken"
        body:
          type: string
          description: Vuoto se `deleted`.
        reviewId:
          type: string
          format: uuid
          nullable: true
          description: Review con cui e' stato inviato, se c'e'.
        threadId:
          type: string
          format: uuid
          nullable: true
          description: Conversazione sulle righe; `null` per un commento generale.
        path:
          type: string
          nullable: true
          description: File commentato; `null` per un commento generale.
        side:
          allOf:
            - $ref: "#/components/schemas/DiffSide"
          nullable: true
          type: object
        line:
          type: integer
          nullable: true
        startLine:
          type: integer
          nullable: true
        commitSha:
          type: string
          nullable: true
          description: Punta della PR su cui e' stato scritto il commento sulle righe.
        outdated:
          type: boolean
          description: Le righe commentate sono cambiate dopo il commento (PR5).
        edited:
          type: boolean
        deleted:
          type: boolean
          description: Segnaposto di un commento eliminato che ha ancora risposte.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PullRequestCommentList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PullRequestComment"
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
    PullRequestThread:
      type: object
      additionalProperties: false
      required: [id, path, side, line, resolved, outdated, comments]
      properties:
        id:
          type: string
          format: uuid
          description: Id del primo commento.
        path:
          type: string
        side:
          $ref: "#/components/schemas/DiffSide"
        line:
          type: integer
          minimum: 1
        startLine:
          type: integer
          nullable: true
        resolved:
          type: boolean
          description: Risolta dall'autore della PR o da chi ha `write` (PR5).
        resolvedBy:
          allOf:
            - $ref: "#/components/schemas/IssueUser"
          nullable: true
          type: object
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        outdated:
          type: boolean
        comments:
          type: array
          items:
            $ref: "#/components/schemas/PullRequestComment"
    PullRequestThreadList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PullRequestThread"
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
    RequestReviewersInput:
      type: object
      additionalProperties: false
      required: [reviewers]
      properties:
        reviewers:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/Name"
    CommitStatus:
      type: object
      additionalProperties: false
      required: [id, sha, state, context, creator, createdAt]
      properties:
        id:
          type: string
          format: uuid
        sha:
          type: string
          pattern: "^[0-9a-f]{40,64}$"
        state:
          $ref: "#/components/schemas/CommitStatusState"
        context:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 140
        targetUrl:
          type: string
          format: uri
          maxLength: 2048
          description: Link ai dettagli, per esempio il log della CI.
        creator:
          $ref: "#/components/schemas/IssueUser"
        viaToken:
          $ref: "#/components/schemas/IssueViaToken"
        createdAt:
          type: string
          format: date-time
    CreateCommitStatusInput:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          $ref: "#/components/schemas/CommitStatusState"
        context:
          type: string
          minLength: 1
          maxLength: 255
          default: default
        description:
          type: string
          maxLength: 140
        targetUrl:
          type: string
          format: uri
          maxLength: 2048
          description: Solo http o https (422 altrimenti).
    CommitStatusList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CommitStatus"
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
    CombinedCommitStatusState:
      type: string
      description: >
        Sintesi degli ultimi stati dei contesti (PR9): `failure` o `error` se uno lo e', altrimenti `pending`
        se uno e' in corso, altrimenti `success`; `none` se non ce ne sono.
      enum: [none, pending, success, failure, error]
    RequiredStatusContext:
      type: object
      additionalProperties: false
      required: [context, satisfied]
      properties:
        context:
          type: string
        state:
          allOf:
            - $ref: "#/components/schemas/CommitStatusState"
          nullable: true
          type: object
          description: Ultimo stato del contesto sul commit; `null` se non e' mai arrivato.
        satisfied:
          type: boolean
          description: True solo con ultimo stato `success`.
    CombinedCommitStatusBatch:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [sha, state]
            properties:
              sha:
                type: string
                pattern: "^[0-9a-f]{40,64}$"
              state:
                $ref: "#/components/schemas/CombinedCommitStatusState"
    CombinedCommitStatus:
      type: object
      additionalProperties: false
      required: [sha, state, statuses, totalCount, requiredContexts]
      properties:
        sha:
          type: string
          pattern: "^[0-9a-f]{40,64}$"
        state:
          $ref: "#/components/schemas/CombinedCommitStatusState"
        statuses:
          type: array
          description: L'ultimo stato di ciascun contesto.
          items:
            $ref: "#/components/schemas/CommitStatus"
        totalCount:
          type: integer
          minimum: 0
        requiredContexts:
          type: array
          items:
            $ref: "#/components/schemas/RequiredStatusContext"
    BranchSettings:
      type: object
      additionalProperties: false
      required:
        - allowMergeCommit
        - allowSquashMerge
        - defaultMergeMethod
        - deleteBranchOnMerge
        - requirePullRequest
        - requiredApprovals
        - requiredStatusContexts
        - dismissStaleApprovals
      properties:
        allowMergeCommit:
          type: boolean
          description: Ammette il merge commit (PR3). Default true.
        allowSquashMerge:
          type: boolean
          description: Ammette lo squash (PR3). Default true.
        defaultMergeMethod:
          $ref: "#/components/schemas/MergeMethod"
        deleteBranchOnMerge:
          type: boolean
          description: Elimina il branch di origine dopo ogni merge (PR3). Default false.
        requirePullRequest:
          type: boolean
          description: >
            «Richiedi una Pull Request» sul branch principale (PR4). Se acceso nessun push diretto,
            `admin` compresi. Default false.
        requiredApprovals:
          type: integer
          minimum: 1
          maximum: 5
          description: Approvazioni di persone con `write` richieste per il merge, quando `requirePullRequest` e' acceso (PR4). Default 1.
        requiredStatusContexts:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 255
          description: Contesti di stato (PR9) che devono essere `success` sulla punta della PR per unire.
        dismissStaleApprovals:
          type: boolean
          readOnly: true
          description: "Sempre true: nuovi commit annullano le approvazioni (PR4). Non configurabile nella v1.1."
    UpdateBranchSettingsInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        allowMergeCommit:
          type: boolean
        allowSquashMerge:
          type: boolean
        defaultMergeMethod:
          $ref: "#/components/schemas/MergeMethod"
        deleteBranchOnMerge:
          type: boolean
        requirePullRequest:
          type: boolean
        requiredApprovals:
          type: integer
          minimum: 1
          maximum: 5
        requiredStatusContexts:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 255
    WebhookRepositoryRef:
      type: object
      additionalProperties: false
      required: [id, fullName, owner, name, defaultBranch, visibility, archived]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        owner:
          type: string
        name:
          type: string
        defaultBranch:
          type: string
        visibility:
          $ref: "#/components/schemas/RepoVisibility"
        archived:
          type: boolean
    WebhookOrganizationRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    WebhookSender:
      type: object
      additionalProperties: false
      required: [id, username, type]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        type:
          type: string
          enum: [human, agent]
    WebhookPullRequestPayload:
      type: object
      description: >
        Corpo di una consegna con `X-GitStack-Event: pull_request` (PR11). Intestazioni, firma e corpo comune
        in docs/webhooks.md. Nessun webhook per le PR di un repo che l'evento non vede.
      additionalProperties: false
      required: [version, event, action, time, repository, sender, pullRequest]
      properties:
        version:
          type: integer
          enum: [1]
        event:
          type: string
          enum: [pull_request]
        action:
          type: string
          description: >
            `opened`, `edited` (titolo, testo o destinazione), `closed` (senza merge), `reopened`, `merged`,
            `ready_for_review`, `converted_to_draft`, `synchronize` (nuovi commit sul branch di origine, annullano
            le approvazioni), `review_requested` e `review_request_removed` (con `requestedReviewer`).
          enum:
            - opened
            - edited
            - closed
            - reopened
            - merged
            - ready_for_review
            - converted_to_draft
            - synchronize
            - review_requested
            - review_request_removed
        time:
          type: string
          format: date-time
        repository:
          $ref: "#/components/schemas/WebhookRepositoryRef"
        organization:
          $ref: "#/components/schemas/WebhookOrganizationRef"
        sender:
          allOf:
            - $ref: "#/components/schemas/WebhookSender"
          nullable: true
          type: object
        pullRequest:
          $ref: "#/components/schemas/PullRequest"
        requestedReviewer:
          $ref: "#/components/schemas/IssueUser"
    WebhookPullRequestReviewPayload:
      type: object
      description: "Corpo di una consegna con `X-GitStack-Event: pull_request_review` (PR11)."
      additionalProperties: false
      required: [version, event, action, time, repository, sender, pullRequest, review]
      properties:
        version:
          type: integer
          enum: [1]
        event:
          type: string
          enum: [pull_request_review]
        action:
          type: string
          description: >
            `submitted` (review inviata, con la sua `state`), `dismissed` (l'approvazione e' annullata da nuovi
            commit).
          enum: [submitted, dismissed]
        time:
          type: string
          format: date-time
        repository:
          $ref: "#/components/schemas/WebhookRepositoryRef"
        organization:
          $ref: "#/components/schemas/WebhookOrganizationRef"
        sender:
          allOf:
            - $ref: "#/components/schemas/WebhookSender"
          nullable: true
          type: object
        pullRequest:
          $ref: "#/components/schemas/PullRequestSummary"
        review:
          $ref: "#/components/schemas/PullRequestReview"
    WebhookCommitStatusPayload:
      type: object
      description: "Corpo di una consegna con `X-GitStack-Event: commit_status` (PR11)."
      additionalProperties: false
      required: [version, event, action, time, repository, sender, commitStatus]
      properties:
        version:
          type: integer
          enum: [1]
        event:
          type: string
          enum: [commit_status]
        action:
          type: string
          description: "`created`: un sistema esterno ha inviato uno stato (PR9)."
          enum: [created]
        time:
          type: string
          format: date-time
        repository:
          $ref: "#/components/schemas/WebhookRepositoryRef"
        organization:
          $ref: "#/components/schemas/WebhookOrganizationRef"
        sender:
          allOf:
            - $ref: "#/components/schemas/WebhookSender"
          nullable: true
          type: object
        commitStatus:
          $ref: "#/components/schemas/CommitStatus"
        combinedState:
          $ref: "#/components/schemas/CombinedCommitStatusState"
        branches:
          type: array
          description: Branch la cui punta e' il commit (al massimo 20).
          maxItems: 20
          items:
            type: string
    WebhookWorkflowRunPayload:
      type: object
      additionalProperties: false
      required: [version, event, action, time, repository, sender, workflowRun]
      properties:
        version: {type: integer, enum: [1]}
        event: {type: string, enum: [workflow_run]}
        action: {type: string, enum: [queued, in_progress, completed, cancelled]}
        time: {type: string, format: date-time}
        repository: {$ref: "#/components/schemas/WebhookRepositoryRef"}
        organization: {$ref: "#/components/schemas/WebhookOrganizationRef"}
        sender: {allOf: [{$ref: "#/components/schemas/WebhookSender"}], nullable: true, type: object}
        workflowRun: {$ref: "#/components/schemas/WorkflowRun"}
    WebhookWorkflowJobPayload:
      type: object
      additionalProperties: false
      required: [version, event, action, time, repository, sender, workflowRun, workflowJob]
      properties:
        version: {type: integer, enum: [1]}
        event: {type: string, enum: [workflow_job]}
        action: {type: string, enum: [queued, in_progress, completed, cancelled]}
        time: {type: string, format: date-time}
        repository: {$ref: "#/components/schemas/WebhookRepositoryRef"}
        organization: {$ref: "#/components/schemas/WebhookOrganizationRef"}
        sender: {allOf: [{$ref: "#/components/schemas/WebhookSender"}], nullable: true, type: object}
        workflowRun: {$ref: "#/components/schemas/WorkflowRun"}
        workflowJob: {$ref: "#/components/schemas/WorkflowJob"}
    WebhookReleasePayload:
      type: object
      additionalProperties: false
      required: [version, event, action, time, repository, sender, release]
      properties:
        version: {type: integer, enum: [1]}
        event: {type: string, enum: [release]}
        action: {type: string, enum: [created, edited, published, deleted]}
        time: {type: string, format: date-time}
        repository: {$ref: "#/components/schemas/WebhookRepositoryRef"}
        organization: {$ref: "#/components/schemas/WebhookOrganizationRef"}
        sender: {allOf: [{$ref: "#/components/schemas/WebhookSender"}], nullable: true, type: object}
        release: {$ref: "#/components/schemas/Release"}
    AppName:
      type: string
      description: >
        Nome dell'app dentro il repo (H5): lettere minuscole, cifre e trattini, 1-30 caratteri. Entra nell'indirizzo
        automatico `<app>-<repo>-<owner>.<dominio delle app>` (H2): se l'etichetta DNS risultante supera 63
        caratteri la creazione risponde 422 `address_too_long`; se l'indirizzo e' gia' usato da un'altra app risponde 409
        `address_conflict`. Il nome dell'app non si cambia dopo la creazione (`AppUpdateInput` non ha `name`).
      pattern: "^[a-z0-9]([a-z0-9-]{0,28}[a-z0-9])?$"
      minLength: 1
      maxLength: 30
    AppEnvName:
      type: string
      description: Nome di una variabile o di un segreto dell'app (variabile d'ambiente).
      pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
      maxLength: 100
    AppActor:
      type: object
      description: Chi ha fatto un'azione sull'app; un agente compare con la sua identita' (H13).
      additionalProperties: false
      required: [id, username, type]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        type: {type: string, enum: [human, agent]}
    AppResourceAmount:
      type: object
      description: CPU e memoria, per copia.
      additionalProperties: false
      required: [cpuMillis, memoryBytes]
      properties:
        cpuMillis: {type: integer, minimum: 1, description: "Millesimi di vCPU (500 = 0,5 vCPU)."}
        memoryBytes: {type: integer, format: int64, minimum: 1}
    AppStatus:
      type: string
      description: >
        Stato osservato: `starting` (nessuna copia ancora sana), `running`, `restarting`, `unhealthy` (alcune copie non
        sane), `failed` (nessuna versione parte), `stopped` (fermata a mano o per il repo, vedi `stoppedReason`).
      enum: [starting, running, restarting, unhealthy, failed, stopped]
    AppStoppedReason:
      type: string
      description: Perche' e' ferma (H5). `repo_archived` e `repo_deleted` tornano avviabili con il repo; `manual` con scala a zero copie.
      enum: [manual, repo_archived, repo_deleted]
    AppAccessMode:
      type: string
      description: "`login` (login GitStack, default, H6), `none` (senza login, scelta esplicita di admin), `public` (su internet, H1, solo con le app pubbliche abilitate)."
      enum: [login, none, public]
    AppDeployState:
      type: string
      description: >
        Esito di una versione: `in_progress` (in avvio o in attesa del controllo di salute), `serving` (serve il
        traffico), `superseded` (sostituita da una piu' recente), `failed` (non ha superato il controllo di salute)
        e `rolled_back` (fallita con ritorno automatico alla versione precedente, H12).
      enum: [in_progress, serving, superseded, failed, rolled_back]
    AppImageSource:
      type: string
      description: "`registry`: immagine del registry del repo (RG1). `external`: altro registry, mai `verified` a meno di una firma fidata."
      enum: [registry, external]
    AppImage:
      type: object
      description: Immagine di una versione e sua verifica (H10).
      additionalProperties: false
      required: [reference, source, verified]
      properties:
        reference: {type: string, maxLength: 512, description: "Riferimento completo, per esempio `homehub.local/acme/handbook/web:sha-7f3a91c`."}
        digest: {type: string, nullable: true, pattern: '^sha256:[0-9a-f]{64}$'}
        source: {$ref: "#/components/schemas/AppImageSource"}
        verified: {type: boolean, description: "Firmata con cosign dalla CI dello stesso repo o da una chiave fidata. Falso e' l'etichetta «non verificata» (H10)."}
        signedBy: {type: string, nullable: true, description: "Impronta o nome della chiave che ha firmato."}
        runsAsRoot: {type: boolean, nullable: true, description: "Vero se l'immagine gira come root (avviso baseline, H9); null se non ancora letto."}
    AppFollow:
      type: object
      description: "Sorgente del deploy automatico (H7): un branch oppure una regola sui tag, mai tutte e due."
      additionalProperties: false
      required: [paused]
      properties:
        branch: {type: string, description: "Branch seguito; assente se l'app segue una regola sui tag."}
        tagPattern: {type: string, description: "Regola sui tag (glob, per esempio `v*-test.*`); assente se l'app segue un branch."}
        paused: {type: boolean, description: "Deploy automatici sospesi (per esempio dopo un rollback)."}
    AppHealthCheck:
      type: object
      additionalProperties: false
      required: [path, intervalSeconds]
      properties:
        path: {type: string, maxLength: 200, description: "Percorso HTTP richiesto, per esempio `/healthz`.", example: /healthz}
        intervalSeconds: {type: integer, minimum: 1, maximum: 3600, default: 10}
        timeoutSeconds: {type: integer, minimum: 1, maximum: 300, default: 120, description: "Dopo quanto un deploy che non risponde e' considerato fallito."}
    AppLastDeploy:
      type: object
      description: Ultimo deploy tentato, anche fallito (H12).
      additionalProperties: false
      required: [version, state, startedAt]
      properties:
        version: {type: integer}
        state: {$ref: "#/components/schemas/AppDeployState"}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time, nullable: true}
        reason: {type: string, nullable: true, description: "Per `failed` e `rolled_back` il perche', per esempio «GET /healthz ha risposto 500 per 2 min»."}
    AppUsage:
      type: object
      description: Uso corrente, somma delle copie. Le richieste e gli errori ci sono solo per le app web.
      additionalProperties: false
      required: [cpuMillis, memoryBytes]
      properties:
        cpuMillis: {type: integer, minimum: 0}
        memoryBytes: {type: integer, format: int64, minimum: 0}
        requestsPerSecond: {type: number, nullable: true}
        errorRatio: {type: number, nullable: true, description: "Quota di risposte 5xx, da 0 a 1."}
        restarts24h: {type: integer, minimum: 0}
    App:
      type: object
      additionalProperties: false
      required: [id, name, owner, repo, status, access, image, activeVersion, copies, readyCopies, resources, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {$ref: "#/components/schemas/AppName"}
        owner: {type: string, description: "Owner del repo: su di lui contano le quote (H5)."}
        repo: {type: string}
        status: {$ref: "#/components/schemas/AppStatus"}
        stoppedReason: {allOf: [{$ref: "#/components/schemas/AppStoppedReason"}], nullable: true, type: string}
        runningPreviousVersion: {type: boolean, description: "Il deploy dell'ultima versione e' fallito e serve ancora la precedente."}
        access: {$ref: "#/components/schemas/AppAccessMode"}
        address: {type: string, format: uri, nullable: true, description: "Indirizzo automatico (H2); assente per un'app senza indirizzo, raggiungibile solo dalle app dello stesso repo."}
        image: {$ref: "#/components/schemas/AppImage"}
        activeVersion: {type: integer, description: "Numero della versione che serve il traffico."}
        follow: {allOf: [{$ref: "#/components/schemas/AppFollow"}], nullable: true, type: object}
        port: {type: integer, minimum: 1, maximum: 65535, nullable: true, description: "Porta del container. Null per un'app senza indirizzo (worker)."}
        healthCheck: {allOf: [{$ref: "#/components/schemas/AppHealthCheck"}], nullable: true, type: object}
        copies: {type: integer, minimum: 0, description: "Copie volute."}
        readyCopies: {type: integer, minimum: 0, description: "Copie sane."}
        resources: {$ref: "#/components/schemas/AppResources"}
        volumes: {type: array, items: {$ref: "#/components/schemas/AppVolume"}, description: "Volumi persistenti (H3, v3-b); con almeno un volume l'app gira in una sola copia."}
        usage: {allOf: [{$ref: "#/components/schemas/AppUsage"}], nullable: true, type: object, description: "Uso corrente; null vuol dire metriche non disponibili."}
        lastDeploy: {allOf: [{$ref: "#/components/schemas/AppLastDeploy"}], nullable: true, type: object}
        createdAt: {type: string, format: date-time}
        createdBy: {allOf: [{$ref: "#/components/schemas/AppActor"}], nullable: true, type: object}
        updatedAt: {type: string, format: date-time}
    AppList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/App"}}
        quota: {allOf: [{$ref: "#/components/schemas/AppOwnerQuota"}], nullable: true, type: object, description: "Quota dell'owner del repo (H5, H11), per la riga sopra l'elenco."}
    AppCreated:
      type: object
      additionalProperties: false
      required: [app, version]
      properties:
        app: {$ref: "#/components/schemas/App"}
        version: {$ref: "#/components/schemas/AppVersion"}
    AppCreateInput:
      type: object
      additionalProperties: false
      required: [name, image]
      properties:
        name: {$ref: "#/components/schemas/AppName"}
        image: {type: string, minLength: 1, maxLength: 512, description: "Riferimento dell'immagine. Per il registry del repo basta `nome:tag` o il solo tag, risolti contro `<host>/<owner>/<repo>`; altrimenti un riferimento completo a un registry esterno."}
        port: {type: integer, minimum: 1, maximum: 65535, description: "Assente: app senza indirizzo, che parla solo con le app dello stesso repo (H9)."}
        healthCheck: {$ref: "#/components/schemas/AppHealthCheck"}
        followBranch: {type: string, nullable: true, description: "Branch da seguire (H7). Non disponibile per un'immagine esterna. Non insieme a `followTagPattern` (422 `follow_both`)."}
        followTagPattern: {type: string, nullable: true, maxLength: 128, description: "Regola sui tag (glob, per esempio `v*-test.*`): un'immagine firmata dalla CI con un tag che la rispetta va in produzione (H7). Non disponibile per un'immagine esterna. Non insieme a `followBranch` (422 `follow_both`)."}
        resources: {$ref: "#/components/schemas/AppResourcesInput"}
        copies: {type: integer, minimum: 1, default: 1}
        restricted: {type: boolean, default: false, description: "Rifiuta immagini che girano come root (H9). L'istanza puo' imporlo comunque."}
    AppUpdateInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        port: {type: integer, minimum: 1, maximum: 65535, nullable: true}
        healthCheck: {$ref: "#/components/schemas/AppHealthCheck"}
        followBranch: {type: string, nullable: true, description: "Branch da seguire; `null` torna ai deploy a mano. Se l'app segue una regola sui tag va tolta prima (o nella stessa richiesta con `followTagPattern: null`), altrimenti 422 `follow_both`."}
        followTagPattern: {type: string, nullable: true, maxLength: 128, description: "Regola sui tag; `null` la toglie. Se l'app segue un branch va tolto prima (o nella stessa richiesta con `followBranch: null`), altrimenti 422 `follow_both`."}
        autoDeployPaused: {type: boolean}
        restricted: {type: boolean}
    AppDeployInput:
      type: object
      additionalProperties: false
      required: [image]
      properties:
        image: {type: string, minLength: 1, maxLength: 512, description: "Come in `AppCreateInput`: un tag del registry del repo (`sha-91be20d`), `nome:tag`, un digest o un riferimento esterno completo."}
    AppRollbackInput:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: {type: integer, minimum: 1, description: "Versione da ripristinare come nuova versione."}
        pauseAutoDeploy: {type: boolean, default: false}
    AppScaleInput:
      type: object
      additionalProperties: false
      required: [copies]
      properties:
        copies: {type: integer, minimum: 0, maximum: 50, description: "Zero ferma l'app (`stoppedReason: manual`)."}
    AppVersionTrigger:
      type: string
      description: "`manual` (deploy a mano), `branch_push` (la CI ha pubblicato un'immagine per il branch seguito, H7), `tag_push` (e' arrivata nel registry un'immagine firmata con un tag che rispetta la regola seguita, H7), `config` (variabile, segreto, risorse, porta, volume), `rollback`, `create`."
      enum: [create, manual, branch_push, tag_push, config, rollback]
    AppVersionConfig:
      type: object
      description: Configurazione di una versione. I segreti compaiono solo per nome (H8).
      additionalProperties: false
      required: [variables, secretNames, resources, copies]
      properties:
        port: {type: integer, nullable: true}
        healthCheck: {allOf: [{$ref: "#/components/schemas/AppHealthCheck"}], nullable: true, type: object}
        variables: {type: object, additionalProperties: {type: string}}
        secretNames: {type: array, items: {$ref: "#/components/schemas/AppEnvName"}}
        resources: {$ref: "#/components/schemas/AppResources"}
        copies: {type: integer, minimum: 0}
        restricted: {type: boolean}
        volumes: {type: array, items: {$ref: "#/components/schemas/AppVolumeSpec"}, description: "Volumi dell'app quando la versione e' stata creata (H3). Un rollback non li cambia: i volumi sono dati."}
    AppVersion:
      type: object
      additionalProperties: false
      required: [number, trigger, state, image, imageAvailable, inBackup, createdAt]
      properties:
        number: {type: integer, minimum: 1}
        trigger: {$ref: "#/components/schemas/AppVersionTrigger"}
        state: {$ref: "#/components/schemas/AppDeployState"}
        stateReason: {type: string, nullable: true}
        image: {$ref: "#/components/schemas/AppImage"}
        imageAvailable: {type: boolean, description: "L'immagine si puo' ancora scaricare: falso se l'ha tolta la pulizia del registry (RG2)."}
        inBackup: {type: boolean, description: "Versione attiva e precedente: sempre nei backup (H4)."}
        branch: {type: string, nullable: true, description: "Per `branch_push`, il branch."}
        commitSha: {type: string, nullable: true}
        summary: {type: string, nullable: true, description: "Per `config` e `rollback`, che cosa e' cambiato, per esempio «variabile SEARCH_TIMEOUT»; i valori dei segreti non compaiono mai."}
        rollbackOf: {type: integer, nullable: true, description: "Per `rollback`, la versione ripristinata."}
        config: {$ref: "#/components/schemas/AppVersionConfig"}
        createdAt: {type: string, format: date-time}
        createdBy: {allOf: [{$ref: "#/components/schemas/AppActor"}], nullable: true, type: object}
    AppVersionList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AppVersion"}}
        total: {type: integer}
    AppVariable:
      type: object
      additionalProperties: false
      required: [name, value, managed, updatedAt]
      properties:
        name: {$ref: "#/components/schemas/AppEnvName"}
        value: {type: string}
        managed: {type: boolean, description: "Impostata da GitStack (per esempio l'intestazione dell'utente, H6): sola lettura."}
        version: {type: integer, nullable: true, description: "Versione creata dall'ultima modifica."}
        updatedAt: {type: string, format: date-time}
        updatedBy: {allOf: [{$ref: "#/components/schemas/AppActor"}], nullable: true, type: object}
    AppVariableList:
      type: object
      additionalProperties: false
      required: [items]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/AppVariable"}}}
    AppVariableInput:
      type: object
      additionalProperties: false
      required: [value]
      properties: {value: {type: string, maxLength: 32768}}
    AppSecret:
      type: object
      additionalProperties: false
      required: [name, updatedAt]
      properties:
        name: {$ref: "#/components/schemas/AppEnvName"}
        version: {type: integer, nullable: true}
        updatedAt: {type: string, format: date-time}
        updatedBy: {allOf: [{$ref: "#/components/schemas/AppActor"}], nullable: true, type: object}
    AppSecretList:
      type: object
      additionalProperties: false
      required: [items]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/AppSecret"}}}
    AppSecretInput:
      type: object
      additionalProperties: false
      required: [value]
      properties: {value: {type: string, writeOnly: true, maxLength: 32768}}
    AppDomainName:
      type: string
      minLength: 1
      maxLength: 253
      description: "Nome DNS completo, minuscolo, senza schema, porta o wildcard (es. `shop.retail.it`)."
    AppDomainStatus:
      type: string
      description: "Stato del dominio (v3-c): `pending_dns` il record atteso non c'e' ancora, `verified` il DNS punta a GitStack, `error` il DNS risponde altro (motivo in `statusReason`)."
      enum: [pending_dns, verified, error]
    AppDomainCertificateMode:
      type: string
      description: "`letsencrypt` emissione e rinnovo automatici (HTTP-01 sulla porta 80), `custom` certificato caricato dal cliente."
      enum: [letsencrypt, custom]
    AppDomainCertificateState:
      type: string
      description: "`none` nessun certificato (DNS non ancora `verified`), `issuing` emissione in corso, `valid` certificato valido (vedi `validUntil`), `error` emissione o rinnovo falliti (vedi `error`)."
      enum: [none, issuing, valid, error]
    AppDomainDnsRecord:
      type: object
      additionalProperties: false
      required: [type, name, value, alternatives]
      description: "Record DNS atteso. `type` e' `CNAME` verso l'indirizzo automatico dell'app, oppure `A`/`AAAA` verso l'IP pubblico dichiarato dell'istanza. Per un dominio all'apice (dove il CNAME non e' ammesso) l'unica forma e' A/AAAA."
      properties:
        type: {type: string, enum: [CNAME, A, AAAA]}
        name: {type: string, description: "Nome del record, cioe' il dominio."}
        value: {type: string, description: "Valore atteso: l'host dell'indirizzo automatico (CNAME) o l'IP (A/AAAA)."}
        alternatives:
          type: array
          description: "Altri record equivalenti accettati dal controllo (es. A e AAAA quando l'istanza dichiara entrambi). Vuoto se non ce ne sono."
          items:
            type: object
            additionalProperties: false
            required: [type, value]
            properties:
              type: {type: string, enum: [CNAME, A, AAAA]}
              value: {type: string}
    AppDomainCertificate:
      type: object
      additionalProperties: false
      required: [mode, state]
      properties:
        mode: {$ref: "#/components/schemas/AppDomainCertificateMode"}
        state: {$ref: "#/components/schemas/AppDomainCertificateState"}
        validFrom: {type: string, format: date-time, nullable: true}
        validUntil: {type: string, format: date-time, nullable: true, description: "Scadenza del certificato in uso; null se non c'e' ancora."}
        issuer: {type: string, nullable: true, description: "Emittente (es. «Let's Encrypt R11» o l'emittente del certificato del cliente)."}
        error: {type: string, nullable: true, description: "Motivo dell'ultimo errore di emissione o rinnovo; null se `state` non e' `error`."}
        lastAttemptAt: {type: string, format: date-time, nullable: true}
    AppDomain:
      type: object
      additionalProperties: false
      required: [id, domain, status, dns, certificate, createdAt]
      properties:
        id: {type: string, format: uuid}
        domain: {$ref: "#/components/schemas/AppDomainName"}
        status: {$ref: "#/components/schemas/AppDomainStatus"}
        statusReason: {type: string, nullable: true, description: "Motivo quando `status` e' `error` (es. il DNS risponde un altro IP); null altrimenti."}
        dns: {$ref: "#/components/schemas/AppDomainDnsRecord"}
        certificate: {$ref: "#/components/schemas/AppDomainCertificate"}
        lastCheckedAt: {type: string, format: date-time, nullable: true, description: "Ultimo controllo del DNS."}
        verifiedAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        createdBy: {allOf: [{$ref: "#/components/schemas/AppActor"}], nullable: true, type: object}
    AppDomainList:
      type: object
      additionalProperties: false
      required: [items]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/AppDomain"}}}
    AppDomainInput:
      type: object
      additionalProperties: false
      required: [domain]
      properties:
        domain: {$ref: "#/components/schemas/AppDomainName"}
    AppDomainCertificateInput:
      type: object
      additionalProperties: false
      required: [certificate, privateKey]
      properties:
        certificate: {type: string, maxLength: 65536, description: "Certificato e catena intermedia, in PEM, foglia per prima."}
        privateKey: {type: string, writeOnly: true, maxLength: 16384, description: "Chiave privata in PEM (PKCS#8, PKCS#1 o EC), senza passphrase. Solo scrittura."}
    AppsLetsEncryptStatus:
      type: object
      additionalProperties: false
      required: [enabled, port80Reachable]
      description: "Stato di Let's Encrypt sull'istanza (v3-c), in sola lettura dentro `AppsInstanceSettings`."
      properties:
        enabled: {type: boolean, description: "Let's Encrypt e' attivo: c'e' un'email ACME e le app pubbliche sono abilitate."}
        acmeEmail: {type: string, format: email, nullable: true, description: "Email per l'account ACME; null se non impostata."}
        port80Reachable: {type: boolean, nullable: true, description: "La porta 80 dell'istanza e' raggiungibile da internet (serve alla sfida HTTP-01). null = non ancora verificato."}
        port80CheckedAt: {type: string, format: date-time, nullable: true}
        port80Error: {type: string, nullable: true, description: "Motivo quando `port80Reachable` e' false."}
        publicIps: {type: array, items: {type: string}, description: "IP pubblici dichiarati dell'istanza (A/AAAA) contro cui si controlla il DNS dei domini propri."}
    AppAccess:
      type: object
      additionalProperties: false
      required: [mode, publicAppsEnabled]
      properties:
        mode: {$ref: "#/components/schemas/AppAccessMode"}
        publicAppsEnabled: {type: boolean, description: "L'amministratore ha abilitato le app pubbliche (H1, doppio consenso)."}
        address: {type: string, format: uri, nullable: true}
        certificate: {type: string, enum: [instance_ca, lets_encrypt, uploaded], nullable: true, description: "Origine del certificato dell'indirizzo automatico (H2): CA interna per le interne."}
        identityHeaders: {type: boolean, description: "Con `login` l'app riceve nome, email e team dell'utente in intestazioni firmate (H6): X-GitStack-User, X-GitStack-Email, X-GitStack-Teams, X-GitStack-Auth-Time, X-GitStack-Key-Id e X-GitStack-Signature (Ed25519, chiave pubblica su /.well-known/gitstack-app-keys del gateway). Forma della firma e esempio in docs/apps-login.md."}
        changedAt: {type: string, format: date-time, nullable: true}
        changedBy: {allOf: [{$ref: "#/components/schemas/AppActor"}], nullable: true, type: object}
    AppAccessInput:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: {$ref: "#/components/schemas/AppAccessMode"}
    AppAccessMember:
      type: object
      additionalProperties: false
      required: [id, kind, name, addedAt]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [user, team]}
        name: {type: string, description: "Nome utente oppure `organizzazione/team`."}
        email: {type: string, nullable: true, description: "Email dell'utente, se ne ha una."}
        memberCount: {type: integer, nullable: true, description: "Persone del team (solo `team`)."}
        addedBy: {allOf: [{$ref: "#/components/schemas/AppActor"}], nullable: true, type: object}
        addedAt: {type: string, format: date-time}
    AppAccessMemberList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AppAccessMember"}}
    AppAccessMemberInput:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind: {type: string, enum: [user, team]}
        name: {type: string, minLength: 1, maxLength: 200, description: "Nome utente oppure `organizzazione/team`."}
    AppAccessInvite:
      type: object
      additionalProperties: false
      required: [guideUrl, address, caMode, text]
      properties:
        guideUrl: {type: string, format: uri, description: "Guida CA di GIT-383 (`/help/ca`) con l'indirizzo dell'app come parametro `app`."}
        fingerprintSha256: {type: string, nullable: true, description: "Impronta SHA-256 della CA interna, letta come `GET /instance/ca`; assente se non c'e' niente da installare."}
        address: {type: string, format: uri, description: "Indirizzo dell'app."}
        caMode: {type: string, enum: [internal, custom, none], description: "Come `InstanceCa.mode`."}
        text: {type: string, description: "Invito gia' composto, da copiare e mandare con i propri strumenti."}
    AppAccessMembership:
      type: object
      additionalProperties: false
      required: [member]
      properties:
        member: {type: boolean}
    AppResources:
      type: object
      description: Parte garantita (sempre riservata) e tetto (usato se il server ha spazio), per copia (H11).
      additionalProperties: false
      required: [guaranteed, limit]
      properties:
        guaranteed: {$ref: "#/components/schemas/AppResourceAmount"}
        limit: {$ref: "#/components/schemas/AppResourceAmount"}
        maxPerApp: {allOf: [{$ref: "#/components/schemas/AppResourceAmount"}], nullable: true, type: object, description: "Massimo consentito dall'istanza per app."}
    AppVolumeName:
      type: string
      description: "Nome del volume dentro l'app: lettere minuscole, cifre e trattini, 1-30 caratteri. Il PVC si chiama `vol-<nome>`."
      pattern: "^[a-z0-9]([a-z0-9-]{0,28}[a-z0-9])?$"
      minLength: 1
      maxLength: 30
    AppVolumeSpec:
      type: object
      description: Un volume come lo congela una versione (H3, H8).
      additionalProperties: false
      required: [name, mountPath, sizeBytes]
      properties:
        name: {$ref: "#/components/schemas/AppVolumeName"}
        mountPath: {type: string, minLength: 2, maxLength: 512, description: "Percorso assoluto nel container."}
        sizeBytes: {type: integer, format: int64, minimum: 1048576}
    AppVolume:
      type: object
      description: Volume persistente dell'app (PVC su local-path, dimensione fissa, H3).
      additionalProperties: false
      required: [name, mountPath, sizeBytes, version, createdAt, includeInBackup, looksLikeDatabase]
      properties:
        name: {$ref: "#/components/schemas/AppVolumeName"}
        mountPath: {type: string, description: "Percorso di mount nel container."}
        includeInBackup: {type: boolean, description: "Il volume entra in `gitstack backup` (anche verso S3) e torna con `gitstack restore` (H3, D19). Di default si; si esclude con `updateAppVolume`."}
        looksLikeDatabase: {type: boolean, description: "Avviso database (D19): il percorso di mount, il nome del volume o l'immagine dell'app fanno pensare a un database. La copia del backup si fa con l'app accesa: per un database dentro un container non e' garantita la coerenza, quindi la guida (docs/operations.md, «Volumes and databases») dice di pianificare un dump in un altro volume."}
        sizeBytes: {type: integer, format: int64, minimum: 1048576, description: "Dimensione fissa; conta nella quota disco dell'owner. local-path non la applica come limite fisico del disco."}
        version: {type: integer, minimum: 1, description: "Versione creata dall'aggiunta del volume."}
        createdAt: {type: string, format: date-time}
        createdBy: {allOf: [{$ref: "#/components/schemas/AppActor"}], nullable: true, type: object}
    AppVolumeUpdate:
      type: object
      additionalProperties: false
      required: [includeInBackup]
      properties:
        includeInBackup: {type: boolean, description: "`false` toglie il volume dal backup (e dal restore); `true` lo rimette."}
    AppVolumeInput:
      type: object
      additionalProperties: false
      required: [name, mountPath, sizeBytes]
      properties:
        name: {$ref: "#/components/schemas/AppVolumeName"}
        mountPath: {type: string, minLength: 2, maxLength: 512, description: "Percorso assoluto e normalizzato; non la radice e non sotto /proc, /sys, /dev."}
        sizeBytes: {type: integer, format: int64, minimum: 1048576, description: "Almeno 1 MiB."}
    AppVolumeList:
      type: object
      additionalProperties: false
      required: [items, quota]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AppVolume"}}
        quota: {$ref: "#/components/schemas/AppOwnerQuota"}
    AppVolumeChange:
      type: object
      description: Esito di un'aggiunta o di una rimozione di volume.
      additionalProperties: false
      required: [volume, version, quota]
      properties:
        volume: {$ref: "#/components/schemas/AppVolume"}
        version: {$ref: "#/components/schemas/AppVersion"}
        quota: {$ref: "#/components/schemas/AppOwnerQuota"}
    AppResourcesInput:
      type: object
      additionalProperties: false
      required: [guaranteed, limit]
      properties:
        guaranteed: {$ref: "#/components/schemas/AppResourceAmount"}
        limit: {$ref: "#/components/schemas/AppResourceAmount"}
    AppLogLine:
      type: object
      additionalProperties: false
      required: [time, source, message]
      properties:
        time: {type: string, format: date-time}
        source: {type: string, enum: [app, platform]}
        copy: {type: string, nullable: true, description: "Copia che ha scritto la riga (`web-1`); assente per gli eventi della piattaforma."}
        message: {type: string}
    AppMetricPoint:
      type: object
      additionalProperties: false
      required: [time, value]
      properties:
        time: {type: string, format: date-time}
        value: {type: number}
    AppMetricSeries:
      type: object
      additionalProperties: false
      required: [unit, points]
      properties:
        unit: {type: string, enum: [millicores, bytes, per_second, ratio, count]}
        points: {type: array, items: {$ref: "#/components/schemas/AppMetricPoint"}}
    AppCopyStatus:
      type: object
      additionalProperties: false
      required: [name, ready, restarts]
      properties:
        name: {type: string}
        ready: {type: boolean}
        restarts: {type: integer, minimum: 0}
    AppMetrics:
      type: object
      additionalProperties: false
      required: [available, range, stepSeconds, cpu, memory, restarts24h, copies]
      properties:
        available: {type: boolean, description: "Falso se la sorgente delle metriche non risponde: le serie sono vuote, non zero."}
        range: {type: string, enum: ["1h", "6h", "24h", "7d"]}
        stepSeconds: {type: integer, minimum: 1}
        cpu: {$ref: "#/components/schemas/AppMetricSeries"}
        memory: {$ref: "#/components/schemas/AppMetricSeries"}
        requests: {allOf: [{$ref: "#/components/schemas/AppMetricSeries"}], nullable: true, type: object, description: "Solo app web."}
        errors5xx: {allOf: [{$ref: "#/components/schemas/AppMetricSeries"}], nullable: true, type: object, description: "Solo app web."}
        restarts24h: {type: integer, minimum: 0}
        copies: {type: array, items: {$ref: "#/components/schemas/AppCopyStatus"}}
        usage: {allOf: [{$ref: "#/components/schemas/AppUsage"}], nullable: true, type: object, description: "Uso corrente; null vuol dire metriche non disponibili."}
    AppsCapacity:
      type: object
      description: Capacita' del server e priorita' servizi di GitStack, poi app, poi job della CI (H11).
      additionalProperties: false
      required: [server, services, apps, ci, appsShareWarning]
      properties:
        server: {type: object, additionalProperties: false, required: [cpuMillis, memoryBytes], properties: {cpuMillis: {type: integer}, memoryBytes: {type: integer, format: int64}, profile: {type: string, nullable: true, description: "Profilo hardware rilevato (per esempio `recommended`)."}}}
        services: {type: object, additionalProperties: false, required: [reserved], properties: {reserved: {$ref: "#/components/schemas/AppResourceAmount"}}}
        apps:
          type: object
          additionalProperties: false
          required: [share, guaranteed]
          properties:
            share: {$ref: "#/components/schemas/AppResourceAmount"}
            guaranteed: {$ref: "#/components/schemas/AppResourceAmount"}
            shareIsDefault: {type: boolean, description: "La riserva e' quella calcolata dall'hardware, non modificata."}
        ci: {type: object, additionalProperties: false, required: [guaranteedCpuMillis, slots], properties: {guaranteedCpuMillis: {type: integer}, usedCpuMillis: {type: integer}, slots: {type: integer}}}
        appsShareWarning: {type: boolean, description: "Il garantito supera l'80% della riserva: i nuovi deploy possono essere rifiutati."}
    AppsReserveInput:
      $ref: "#/components/schemas/AppResourceAmount"
    AppOwnerQuota:
      type: object
      description: Quota delle app di un owner (H5, H11).
      additionalProperties: false
      required: [owner, limits, used, warning]
      properties:
        owner: {type: string}
        isDefault: {type: boolean, description: "Valgono i default dell'istanza."}
        limits: {$ref: "#/components/schemas/AppOwnerQuotaInput"}
        used: {$ref: "#/components/schemas/AppOwnerQuotaInput"}
        warning: {type: boolean, description: "Un valore e' oltre l'80% della quota."}
    AppOwnerQuotaInput:
      type: object
      additionalProperties: false
      required: [cpuMillis, memoryBytes, diskBytes]
      properties:
        cpuMillis: {type: integer, minimum: 0, description: "CPU garantita."}
        memoryBytes: {type: integer, format: int64, minimum: 0, description: "RAM garantita."}
        diskBytes: {type: integer, format: int64, minimum: 0, description: "Disco dei volumi (v3-b)."}
    AppOwnerQuotaList:
      type: object
      additionalProperties: false
      required: [items]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/AppOwnerQuota"}}}
    AppsInstanceSettings:
      type: object
      additionalProperties: false
      required: [appsDomain, publicAppsEnabled, signedImagesOnly, restricted, maxPerApp, logRetention]
      properties:
        appsDomain: {type: string, nullable: true, description: "Dominio wildcard delle app (H2), scelto all'installazione; solo lettura."}
        appsDomainIsDefault: {type: boolean, description: "Senza `--apps-domain` vale il default, con avviso."}
        publicAppsEnabled: {type: boolean}
        letsEncrypt: {allOf: [{$ref: "#/components/schemas/AppsLetsEncryptStatus"}], type: object, description: "Stato di Let's Encrypt (v3-c). Assente finche' core non lo calcola."}
        signedImagesOnly: {type: boolean}
        restricted: {type: boolean}
        maxPerApp: {$ref: "#/components/schemas/AppResourceAmount"}
        logRetention: {$ref: "#/components/schemas/AppLogRetention"}
    AppsInstanceSettingsInput:
      type: object
      additionalProperties: false
      required: [publicAppsEnabled, signedImagesOnly, restricted, maxPerApp, logRetention]
      properties:
        publicAppsEnabled: {type: boolean}
        acmeEmail: {type: string, format: email, nullable: true, description: "Email dell'account ACME (v3-c). Assente = invariata; null = la toglie."}
        publicIps: {type: array, items: {type: string}, description: "IP pubblici dell'istanza (A/AAAA) per il controllo DNS (v3-c). Assente = invariati; [] li toglie. Solo IP validi e non privati: 422 altrimenti."}
        signedImagesOnly: {type: boolean}
        restricted: {type: boolean}
        maxPerApp: {$ref: "#/components/schemas/AppResourceAmount"}
        logRetention: {$ref: "#/components/schemas/AppLogRetention"}
    AppEgressDestination:
      type: object
      additionalProperties: false
      required: [host, port]
      properties:
        host: {type: string, maxLength: 253, description: "Indirizzo IP o nome DNS, senza schema ne' porta."}
        port: {type: integer, minimum: 1, maximum: 65535, description: "Porta TCP."}
    AppPrivateDestination:
      type: object
      additionalProperties: false
      required: [host, port, note]
      properties:
        host: {type: string, maxLength: 253}
        port: {type: integer, minimum: 1, maximum: 65535}
        note: {type: string, maxLength: 200, description: "A cosa serve (es. database del backoffice)."}
        createdAt: {type: string, format: date-time}
        createdBy: {allOf: [{$ref: "#/components/schemas/AppActor"}], nullable: true, type: object}
    AppPrivateDestinationInput:
      type: object
      additionalProperties: false
      required: [host, port]
      properties:
        host: {type: string, maxLength: 253}
        port: {type: integer, minimum: 1, maximum: 65535}
        note: {type: string, maxLength: 200}
    AppsEgressSettings:
      type: object
      additionalProperties: false
      required: [privateDestinations]
      properties:
        privateDestinations:
          type: array
          items: {$ref: "#/components/schemas/AppPrivateDestination"}
    AppsEgressSettingsInput:
      type: object
      additionalProperties: false
      required: [privateDestinations]
      properties:
        privateDestinations:
          type: array
          maxItems: 200
          items: {$ref: "#/components/schemas/AppPrivateDestinationInput"}
    AppEgress:
      type: object
      additionalProperties: false
      required: [restricted, destinations, allowedPrivate, instanceProxy]
      properties:
        restricted: {type: boolean, description: "L'app ha una restrizione propria."}
        instanceProxy: {type: boolean, description: "L'istanza ha un proxy di uscita configurato (N9): un'app con l'uscita ristretta esce in modo diretto, senza il proxy."}
        destinations:
          type: array
          items: {$ref: "#/components/schemas/AppEgressDestination"}
          description: "Le destinazioni della restrizione; vuoto se `restricted` e' false."
        allowedPrivate:
          type: array
          items: {$ref: "#/components/schemas/AppPrivateDestination"}
          description: "Le destinazioni private aperte dall'amministratore: l'app puo' sceglierle."
        updatedAt: {type: string, format: date-time}
        updatedBy: {allOf: [{$ref: "#/components/schemas/AppActor"}], nullable: true, type: object}
    AppEgressInput:
      type: object
      additionalProperties: false
      required: [destinations]
      properties:
        destinations:
          type: array
          maxItems: 200
          items: {$ref: "#/components/schemas/AppEgressDestination"}
    AppLogRetention:
      type: object
      additionalProperties: false
      required: [days, maxBytes]
      properties:
        days: {type: integer, minimum: 1, default: 7}
        maxBytes: {type: integer, format: int64, minimum: 1, default: 1073741824}
    AppTrustedKey:
      type: object
      additionalProperties: false
      required: [id, name, fingerprint, instanceKey, createdAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        fingerprint: {type: string}
        publicKey: {type: string, description: "Chiave pubblica cosign in PEM."}
        instanceKey: {type: boolean, description: "La chiave della CI dell'istanza (H10): sempre presente, non si toglie."}
        createdAt: {type: string, format: date-time}
        createdBy: {allOf: [{$ref: "#/components/schemas/AppActor"}], nullable: true, type: object}
    AppTrustedKeyList:
      type: object
      additionalProperties: false
      required: [items]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/AppTrustedKey"}}}
    AppTrustedKeyInput:
      type: object
      additionalProperties: false
      required: [name, publicKey]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        publicKey: {type: string, maxLength: 4096, description: "Chiave pubblica cosign in PEM."}
    AdminApp:
      type: object
      description: Riga della tabella Apps dell'amministratore (H9, H11).
      additionalProperties: false
      required: [owner, repo, name, status, copies, guaranteed, limit, usage, verified, runsAsRoot, aboveGuaranteed]
      properties:
        owner: {type: string}
        repo: {type: string}
        name: {$ref: "#/components/schemas/AppName"}
        status: {$ref: "#/components/schemas/AppStatus"}
        copies: {type: integer}
        guaranteed: {$ref: "#/components/schemas/AppResourceAmount"}
        limit: {$ref: "#/components/schemas/AppResourceAmount"}
        usage: {$ref: "#/components/schemas/AppUsage"}
        verified: {type: boolean}
        runsAsRoot: {type: boolean, nullable: true}
        aboveGuaranteed: {type: boolean, description: "Sta usando piu' della parte garantita: e' il primo a essere rallentato."}
        violatesInstanceRules: {type: boolean, description: "Non rispetta `restricted` o `signedImagesOnly` d'istanza (valgono dal deploy successivo)."}
    AdminAppList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AdminApp"}}
        total: {type: integer}
    WebhookDeploymentPayload:
      type: object
      description: >
        Payload del webhook `deployment` (H12). `action`: `started` (deploy avviato), `succeeded` (la versione e'
        sana), `failed` (non ha superato il controllo di salute; resta la precedente), `rolled_back` (rollback a
        mano riuscito). Una notifica «deploy fallito» va anche a chi l'ha fatto e agli `admin` del repo.
      additionalProperties: false
      required: [version, event, action, time, repository, sender, app, deployment]
      properties:
        version: {type: integer, enum: [1]}
        event: {type: string, enum: [deployment]}
        action: {type: string, enum: [started, succeeded, failed, rolled_back]}
        time: {type: string, format: date-time}
        repository: {$ref: "#/components/schemas/WebhookRepositoryRef"}
        organization: {$ref: "#/components/schemas/WebhookOrganizationRef"}
        sender: {allOf: [{$ref: "#/components/schemas/WebhookSender"}], nullable: true, type: object}
        app: {$ref: "#/components/schemas/App"}
        deployment: {$ref: "#/components/schemas/AppVersion"}

  headers:
    ContentTypeOptions:
      description: Sempre `nosniff`.
      schema:
        type: string
        enum: [nosniff]
    ContentSecurityPolicy:
      description: "Sempre `sandbox`; anche se un browser aprisse il file, non puo' eseguire script."
      schema:
        type: string
        enum: [sandbox]
    ContentDispositionAttachment:
      description: "`attachment; filename=\"<nome>\"`: il browser scarica, non mostra."
      schema:
        type: string

  responses:
    RawFile:
      description: >
        Byte del file (regola B3). Testo (non SVG): `text/plain; charset=utf-8`
        in linea. Ogni altro file, SVG compreso: `application/octet-stream` con
        `Content-Disposition: attachment`. Mai `text/html`,
        `image/svg+xml` o altro tipo che un browser eseguirebbe.
      headers:
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        Content-Security-Policy:
          $ref: "#/components/headers/ContentSecurityPolicy"
        Content-Disposition:
          $ref: "#/components/headers/ContentDispositionAttachment"
      content:
        text/plain:
          schema:
            type: string
            format: binary
        application/octet-stream:
          schema:
            type: string
            format: binary
    Archive:
      description: L'archivio, sempre come allegato (regola B3).
      headers:
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        Content-Security-Policy:
          $ref: "#/components/headers/ContentSecurityPolicy"
        Content-Disposition:
          $ref: "#/components/headers/ContentDispositionAttachment"
      content:
        application/zip:
          schema:
            type: string
            format: binary
        application/gzip:
          schema:
            type: string
            format: binary
    Patch:
      description: >
        Il diff completo del commit, sempre come allegato `.diff` o
        `.patch`, `text/plain; charset=utf-8` senza limiti di dimensione
        (streaming).
      headers:
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        Content-Security-Policy:
          $ref: "#/components/headers/ContentSecurityPolicy"
        Content-Disposition:
          $ref: "#/components/headers/ContentDispositionAttachment"
      content:
        text/plain:
          schema:
            type: string
            format: binary
    TooManyRequests:
      description: >
        Troppi tentativi (`too_many_attempts`): riprovare dopo il numero di
        secondi indicato in `Retry-After`.
      headers:
        Retry-After:
          description: Secondi da attendere prima di riprovare.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Richiesta non valida.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Token mancante o non valido.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Risorsa non trovata.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RepoNameConflict:
      description: >
        Il nome e' occupato per l'owner. Codice `conflict` se lo tiene un repo attivo; `name_in_trash`, con
        `details` di tipo `NameInTrashDetails`, se lo tiene un repo eliminato ancora nel cestino (R2).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RepoNameConflictError"
    Conflict:
      description: Conflitto con lo stato attuale della risorsa.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnexpectedError:
      description: Errore imprevisto.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >
        Autenticato ma non autorizzato: scope del token insufficiente
        (`insufficient_scope`, con `details.required`) o permesso mancante
        (`forbidden`), oppure password iniziale ancora da cambiare
        (`password_change_required`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: >
        Corpo o file oltre il limite (`body_too_large`, `attachment_too_large`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: >
        Richiesta ben formata ma non valida semanticamente (`validation_failed`,
        con `details.fields` = mappa campo -> motivo).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

security:
  - bearerAuth: []
  - sessionCookie: []
