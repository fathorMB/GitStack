          $ref: "#/components/schemas/Name"

    GitCreateRepoInput:
      type: object
      additionalProperties: false
      required: [repoId, name, author]
      properties:
        repoId:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/RepoName"
        description:
          type: string
          maxLength: 1024
        defaultBranch:
          type: string
          default: main
        readme:
          type: boolean
          default: false
        gitignoreTemplate:
          $ref: "#/components/schemas/GitignoreTemplate"
        licenseTemplate:
          $ref: "#/components/schemas/LicenseTemplate"
        licenseHolder:
          type: string
          maxLength: 255
        author:
          type: object
          additionalProperties: false
          required: [name, email]
          properties:
            name:
              type: string
            email:
              type: string

    GitRepoCreated:
      type: object
      additionalProperties: false
      required: [repoId, empty]
      properties:
        repoId:
          type: string
          format: uuid
        empty:
          type: boolean

    GitRepoState:
      type: object
      additionalProperties: false
      required: [repoId, trashed, empty]
      properties:
        repoId:
          type: string
          format: uuid
        trashed:
          type: boolean
        empty:
          type: boolean
        branches:
          type: array
          description: Branch esistenti (`refs/heads`), in ordine alfabetico (R4).
          items:
            type: string

    CodeUser:
      type: object
      description: >
        Utente GitStack che corrisponde all'email di un commit (confronto
        senza distinguere maiuscole con l'email di identity). `kind` da' il
        badge umano/agente.
      additionalProperties: false
      required: [id, username, kind, avatarUrl]
      properties:
        id:
          type: string
          format: uuid
        username:
          $ref: "#/components/schemas/Name"
        kind:
          type: string
          enum: [human, agent]
        avatarUrl:
          type: string
          format: uri
          nullable: true

    CommitPerson:
      type: object
      description: >
        Autore o committer dichiarato nel commit. Non e' una prova d'identita':
        chiunque puo' scrivere un nome e un'email qualsiasi in un commit. `user`
        e' null se nessun utente GitStack ha quell'email (e sempre assente
        nelle risposte del servizio git, che non conosce gli utenti).
      additionalProperties: false
      required: [name, email, date]
      properties:
        name:
          type: string
        email:
          type: string
        date:
          type: string
          format: date-time
        user:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CodeUser"

    CommitSummary:
      type: object
      additionalProperties: false
      required: [sha, subject, author, committer, parents]
      properties:
        sha:
          type: string
          pattern: "^[0-9a-f]{40,64}$"
        subject:
          type: string
          description: Prima riga del messaggio.
        message:
          type: string
          description: Messaggio completo (omesso nell'ultimo commit di una voce d'albero).
        author:
          $ref: "#/components/schemas/CommitPerson"
        committer:
          $ref: "#/components/schemas/CommitPerson"
        parents:
          type: array
          items:
            type: string

    TreeEntry:
      type: object
      additionalProperties: false
      required: [name, path, type, mode, lastCommit]
      properties:
        name:
          type: string
        path:
          type: string
        type:
          type: string
          enum: [file, dir, symlink, submodule]
        mode:
          type: string
          description: Modo Git in ottale, es. `100644`.
        size:
          type: integer
          format: int64
          description: Byte, solo per i file.
        lastCommit:
          $ref: "#/components/schemas/CommitSummary"

    Tree:
      type: object
      additionalProperties: false
      required: [ref, commitSha, path, entries, truncated]
      properties:
        ref:
          type: string
          description: Il `ref` risolto (il branch principale se non indicato).
        commitSha:
          type: string
        path:
          type: string
        entries:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/TreeEntry"
        truncated:
          type: boolean
          description: True se la cartella ha piu' di 1 000 voci e queste sono le prime 1 000.

    FileContent:
      type: object
      additionalProperties: false
      required: [ref, path, name, sha, size, binary, kind, display, truncated, lastCommit]
      properties:
        ref:
          type: string
        path:
          type: string
        name:
          type: string
        sha:
          type: string
          description: Sha del blob.
        size:
          type: integer
          format: int64
          description: Dimensione reale in byte, sempre, anche se `content` manca.
        binary:
          type: boolean
          description: True per tutto cio' che non e' testo (anche le immagini, SVG compreso).
        kind:
          type: string
          enum: [text, image, binary]
          description: >
            `text`; `image` per PNG, JPEG, GIF, WebP e SVG (riconosciuti dal
            contenuto, non dall'estensione; SVG solo come immagine, mai come
            pagina); `binary` per ogni altro file non di testo.
        mimeType:
          type: string
          description: Solo per `kind` `image`, es. `image/png`, `image/svg+xml`.
        display:
          type: string
          enum: [highlight, plain, image, download]
          description: >
            Regola B1, sempre presente. `highlight`: testo fino a 1 MB
            (1 048 576 byte, `fileHighlightMaxBytes`), `content` intero, da
            evidenziare. `plain`: testo da 1 MB a 5 MB (5 242 880 byte,
            `filePlainMaxBytes`), `content` intero, senza evidenziazione.
            `image`: immagine fino a 1 MB (`imageInlineMaxBytes`),
            `content` in base64. `download`: nessun `content` (testo oltre
            5 MB, immagine oltre 1 MB, altri binari): si scarica con `raw`.
        truncated:
          type: boolean
          description: >
            True se `content` non porta tutto il file per il limite di
            dimensione: un testo oltre 5 MB (`display` `download`, nessun
            contenuto). Mai true per binari e immagini, che per natura non
            hanno `content` testuale; mai true per `highlight`, `plain` e
            `image`, il cui `content` e' sempre intero.
        encoding:
          type: string
          enum: [utf-8, base64]
          description: Codifica di `content`; assente se `content` manca. `base64` solo per le immagini.
        content:
          type: string
          description: >
            Testo UTF-8 (`display` `highlight` o `plain`) o immagine in
            base64 (`display` `image`); assente con `display` `download`.
        lastCommit:
          $ref: "#/components/schemas/CommitSummary"

    Branch:
      type: object
      additionalProperties: false
      required: [name, isDefault, protected, commit]
      properties:
        name:
          type: string
        isDefault:
          type: boolean
        protected:
          type: boolean
          description: Protezione del branch principale (R9). Per il servizio git e' sempre false, la imposta core.
        commit:
          $ref: "#/components/schemas/CommitSummary"

    BranchList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Branch"
        total:
          type: integer
          minimum: 0

    Tag:
      type: object
      additionalProperties: false
      required: [name, commit, annotated, taggedAt]
      properties:
        name:
          type: string
        annotated:
          type: boolean
        message:
          type: string
          description: Messaggio del tag; solo se `annotated`.
        taggedAt:
          type: string
          format: date-time
          description: Data del tag; per un tag leggero quella del commit (regola B7).
        commit:
          $ref: "#/components/schemas/CommitSummary"
        zipUrl:
          type: string
          description: >
            Indirizzo di scaricamento ZIP (`getRepositoryArchive` con
            `ref` il nome del tag, relativo a `/v1`). Lo aggiunge core: il
            servizio git non conosce owner e nome, quindi nella sua risposta
            manca; sempre presente in quella pubblica.
        tarGzUrl:
          type: string
          description: Come `zipUrl`, per il tar.gz.

    TagList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        total:
          type: integer
          minimum: 0

    CommitList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, hasMore]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/CommitSummary"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
          maximum: 100
        hasMore:
          type: boolean
          description: Non c'e' un totale, contarlo costa un giro completo della storia.

    FileDiff:
      type: object
      additionalProperties: false
      required: [path, status, additions, deletions, binary, truncated]
      properties:
        path:
          type: string
        oldPath:
          type: string
          description: Percorso precedente, per rinomine e copie.
        status:
          type: string
          enum: [added, modified, deleted, renamed, copied]
        additions:
          type: integer
          minimum: 0
        deletions:
          type: integer
          minimum: 0
        binary:
          type: boolean
        truncated:
          type: boolean
          description: True se il patch supera 1 MB o il limite totale di 20 000 righe e' gia' esaurito; `patch` e' parziale o assente.
        collapsed:
          type: boolean
          description: >
            B6: il file e' «chiuso di default» nella UI. Il patch c'e' comunque,
            se non e' stato omesso per i limiti.
        collapseReason:
          type: string
          enum: [large, lock, generated]
          description: >
            Perche' e' chiuso: `large` (piu' di 500 righe cambiate, aggiunte
            piu' tolte), `lock` (file di lock: package-lock.json, pnpm-lock.yaml,
            yarn.lock, go.sum, Cargo.lock, ...) o `generated` (file generato o
            minificato: *.min.js, *.min.css, *.pb.go, ...). Elenco completo nel
            README del servizio git; lock e generated vincono su large.
        patch:
          type: string
          description: Diff unificato (hunk), assente per i binari.

    CommitDetail:
      type: object
      additionalProperties: false
      required: [commit, files, filesChanged, additions, deletions, truncated]
      properties:
        commit:
          $ref: "#/components/schemas/CommitSummary"
        files:
          type: array
          maxItems: 300
          items:
            $ref: "#/components/schemas/FileDiff"
        filesChanged:
          type: integer
          minimum: 0
          description: Numero reale di file toccati, anche oltre i 300 elencati.
        additions:
          type: integer
          minimum: 0
        deletions:
          type: integer
          minimum: 0
        truncated:
          type: boolean
          description: True se i file sono oltre 300 o le righe di diff oltre 20 000 in totale.
        listOnly:
          type: boolean
          description: >
            B6: oltre 300 file o 20 000 righe cambiate la risposta porta solo
            l'elenco dei file con righe aggiunte e tolte, senza `patch`.
        ignoreWhitespace:
          type: boolean
          description: Il diff e' stato calcolato ignorando gli spazi (`git diff -w`); i file che cambiano solo negli spazi non compaiono.
        tags:
          type: array
          items:
            type: string
          description: Tag che puntano al commit (anche annotati), in ordine alfabetico.

    BlameRange:
      type: object
      additionalProperties: false
      required: [startLine, endLine, commit]
      properties:
        startLine:
          type: integer
          minimum: 1
        endLine:
          type: integer
          minimum: 1
        commit:
          $ref: "#/components/schemas/CommitSummary"

    Blame:
      type: object
      additionalProperties: false
      required: [ref, path, ranges]
      properties:
        ref:
          type: string
        path:
          type: string
        ranges:
          type: array
          items:
            $ref: "#/components/schemas/BlameRange"

    LanguageShare:
      type: object
      additionalProperties: false
      required: [name, bytes, percent]
      properties:
        name:
          type: string
        bytes:
          type: integer
          format: int64
          minimum: 0
        percent:
          type: number
          minimum: 0
          maximum: 100

    Languages:
      type: object
      additionalProperties: false
      required: [languages, totalBytes]
      properties:
        languages:
          type: array
          items:
            $ref: "#/components/schemas/LanguageShare"
        totalBytes:
          type: integer
          format: int64
          minimum: 0

    FileList:
      type: object
      additionalProperties: false
      required: [ref, commitSha, paths, truncated]
      description: >
        Percorsi di tutti i file del ref per "Go to file" (regola B5): la
        corrispondenza approssimata la fa il client sull'elenco.
      properties:
        ref:
          type: string
          description: Il `ref` risolto (il branch principale se non indicato).
        commitSha:
          type: string
        paths:
          type: array
          maxItems: 50000
          description: Percorsi dei file (non delle cartelle), in ordine alfabetico, al massimo 50 000 (`fileListMaxPaths`).
          items:
            type: string
        truncated:
          type: boolean
          description: True se il repo ha piu' di 50 000 file e questi sono i primi 50 000.

    CodeSearchHit:
      type: object
      additionalProperties: false
      required: [path, line, fragment]
      properties:
        path:
          type: string
        line:
          type: integer
          minimum: 1
          description: Numero di riga (da 1) della corrispondenza.
        fragment:
          type: string
          maxLength: 300
          description: La riga della corrispondenza, tagliata a 300 caratteri (`searchFragmentMaxChars`) attorno al testo cercato.

    CodeSearchResult:
      type: object
      additionalProperties: false
      required: [ref, query, results, limitReached, timedOut]
      description: >
        Risultato di "Search code" (regola B5): ricerca testuale senza indice
        sul ref scelto, in un solo repo.
      properties:
        ref:
          type: string
        query:
          type: string
        results:
          type: array
          maxItems: 100
          description: Al massimo 100 risultati (`searchMaxResults`), per percorso e riga. Si cerca solo nei file di testo fino a 1 MB (`searchFileMaxBytes`).
          items:
            $ref: "#/components/schemas/CodeSearchHit"
        limitReached:
          type: boolean
          description: True se ci sono altri risultati oltre i 100 restituiti.
        timedOut:
          type: boolean
          description: "True se la ricerca e' stata interrotta dopo 10 secondi (`searchTimeoutSeconds`); i risultati sono parziali."

    LookupEmailsInput:
      type: object
      additionalProperties: false
      required: [emails]
      properties:
        emails:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            maxLength: 320

    LookupEmailsResult:
      type: object
      additionalProperties: false
      required: [users]
      properties:
        users:
          type: array
          description: Solo le email che corrispondono a un utente; le altre mancano.
          items:
            type: object
            additionalProperties: false
            required: [email, id, username, kind, avatarUrl]
            properties:
              email:
                type: string
              id:
                type: string
                format: uuid
              username:
                $ref: "#/components/schemas/Name"
              kind:
                type: string
                enum: [human, agent]
              avatarUrl:
                type: string
                format: uri
                nullable: true
    IssueState:
      type: string
      enum: [open, closed]
    IssueCloseReason:
      type: string
      enum: [completed, not_planned, duplicate]
      description: Motivo di chiusura (I2). `completed` e' anche quello di `fixes #n`.
    IssueUser:
      type: object
      additionalProperties: false
      required: [id, username, kind]
      properties:
        id:
          type: string
          format: uuid
        username:
          $ref: "#/components/schemas/Name"
        kind:
          type: string
          enum: [human, agent]
        displayName:
          type: string
    IssueLabelRef:
      type: object
      additionalProperties: false
      required: [id, name, color]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          $ref: "#/components/schemas/LabelColor"
    IssueMilestoneRef:
      type: object
      additionalProperties: false
      required: [number, title, state]
      properties:
        number:
          type: integer
          format: int64
        title:
          type: string
        state:
          type: string
          enum: [open, closed]
    LabelColor:
      type: string
      pattern: '^[0-9a-fA-F]{6}$'
      description: Colore esadecimale a sei cifre, senza `#`.
      example: d73a4a
    Issue:
      type: object
      additionalProperties: false
      required:
        - id
        - number
        - title
        - body
        - state
        - author
        - labels
        - assignees
        - locked
        - hidden
        - edited
        - commentCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          format: int64
          description: >
            `#n`, dal contatore del repo condiviso con le PR (I1); non si riusa mai.
        title:
          type: string
          minLength: 1
          maxLength: 256
        body:
          type: string
          maxLength: 65536
          description: Markdown (D10).
        state:
          $ref: "#/components/schemas/IssueState"
        closeReason:
          allOf:
            - $ref: "#/components/schemas/IssueCloseReason"
          nullable: true
          type: object
          description: Presente solo se `state` e' `closed`; azzerato dalla riapertura (I2).
        duplicateOf:
          type: integer
          format: int64
          nullable: true
          description: Numero della issue di cui questa e' un duplicato (solo con `closeReason=duplicate`).
        author:
          $ref: "#/components/schemas/IssueUser"
        labels:
          type: array
          items:
            $ref: "#/components/schemas/IssueLabelRef"
        assignees:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/IssueUser"
        milestone:
          allOf:
            - $ref: "#/components/schemas/IssueMilestoneRef"
          nullable: true
          type: object
        locked:
          type: boolean
          description: Discussione bloccata (I11).
        hidden:
          type: boolean
          description: "Nascosta (I4). Chi non e' `admin` non la riceve mai: e' 404."
        edited:
          type: boolean
          description: Il testo e' stato modificato (I4); le versioni precedenti sono per `admin`.
        commentCount:
          type: integer
          minimum: 0
          description: Commenti non eliminati.
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/IssueAttachment"
        closedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IssueSummary:
      type: object
      description: "Issue negli elenchi: senza testo."
      additionalProperties: false
      required: [number, title, state, author, labels, assignees, commentCount, createdAt, updatedAt]
      properties:
        number:
          type: integer
          format: int64
        title:
          type: string
        state:
          $ref: "#/components/schemas/IssueState"
        closeReason:
          allOf:
            - $ref: "#/components/schemas/IssueCloseReason"
          nullable: true
          type: object
        author:
          $ref: "#/components/schemas/IssueUser"
        labels:
          type: array
          items:
            $ref: "#/components/schemas/IssueLabelRef"
        assignees:
          type: array
          items:
            $ref: "#/components/schemas/IssueUser"
        milestone:
          allOf:
            - $ref: "#/components/schemas/IssueMilestoneRef"
          nullable: true
          type: object
        locked:
          type: boolean
        commentCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IssueList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IssueSummary"
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
    IssueSearchResult:
      type: object
      additionalProperties: false
      required: [repo, issue]
      properties:
        repo:
          type: string
          description: "`owner/nome` del repo."
        issue:
          $ref: "#/components/schemas/IssueSummary"
    IssueSearchResultList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IssueSearchResult"
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
    CreateIssueInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 256
        body:
          type: string
          maxLength: 65536
          default: ""
        labels:
          type: array
          description: Nomi di etichette del repo. Richiede `write`.
          items:
            type: string
        assignees:
          type: array
          maxItems: 10
          description: Nomi utente con `write`. Richiede `write`.
          items:
            $ref: "#/components/schemas/Name"
        milestone:
          type: integer
          format: int64
          description: Numero di una milestone del repo. Richiede `write`.
        attachmentIds:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
    UpdateIssueInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 256
        body:
          type: string
          maxLength: 65536
    CloseIssueInput:
      type: object
      additionalProperties: false
      properties:
        reason:
          allOf:
            - $ref: "#/components/schemas/IssueCloseReason"
          default: completed
          type: object
        duplicateOf:
          type: integer
          format: int64
          minimum: 1
          description: Obbligatorio con `reason=duplicate`, vietato altrimenti.
    SetIssueHiddenInput:
      type: object
      additionalProperties: false
      required: [hidden]
      properties:
        hidden:
          type: boolean
    LockIssueInput:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 256
          description: Motivo facoltativo, mostrato nella cronologia.
    SetIssueAssigneesInput:
      type: object
      additionalProperties: false
      required: [assignees]
      properties:
        assignees:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/Name"
    SetIssueLabelsInput:
      type: object
      additionalProperties: false
      required: [labels]
      properties:
        labels:
          type: array
          maxItems: 100
          items:
            type: string
    SetIssueMilestoneInput:
      type: object
      additionalProperties: false
      required: [milestone]
      properties:
        milestone:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          description: Numero della milestone, o `null` per toglierla.
    IssueComment:
      type: object
      additionalProperties: false
      required: [id, issueNumber, body, author, edited, deleted, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        issueNumber:
          type: integer
          format: int64
        body:
          type: string
          maxLength: 65536
          description: Markdown; vuoto se `deleted`.
        author:
          $ref: "#/components/schemas/IssueUser"
        edited:
          type: boolean
        deleted:
          type: boolean
          description: "Eliminato (comment deleted, I4): resta la traccia, senza testo."
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/IssueAttachment"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IssueCommentList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IssueComment"
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
    CreateIssueCommentInput:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 65536
        attachmentIds:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
    UpdateIssueCommentInput:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 65536
    TextVersion:
      type: object
      additionalProperties: false
      required: [version, body, editor, createdAt]
      properties:
        version:
          type: integer
          minimum: 1
          description: 1 e' il testo originale.
        title:
          type: string
          description: Solo per le versioni della issue.
        body:
          type: string
        editor:
          $ref: "#/components/schemas/IssueUser"
        createdAt:
          type: string
          format: date-time
          description: Quando questa versione e' stata sostituita.
    TextVersionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TextVersion"
    IssueEventType:
      type: string
      enum:
        - opened
        - closed
        - reopened
        - renamed
        - edited
        - labeled
        - unlabeled
        - assigned
        - unassigned
        - milestoned
        - demilestoned
        - locked
        - unlocked
        - hidden
        - unhidden
        - comment_deleted
        - referenced
    IssueEvent:
      type: object
      additionalProperties: false
      required: [id, type, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/IssueEventType"
        actor:
          allOf:
            - $ref: "#/components/schemas/IssueUser"
          nullable: true
          type: object
          description: Assente per gli eventi di sistema (es. chiusura da `fixes #n`).
        data:
          type: object
          additionalProperties: true
          description: >
            Dettagli dell'evento: `closed` ha `reason` e `duplicateOf`; `labeled` e `unlabeled` ha `label`;
            `assigned` e `unassigned` ha `assignee`; `milestoned` ha `milestone`; `renamed` ha `from` e `to`;
            `referenced` e `closed` da commit hanno `commit`; `comment_deleted` ha `commentId`.
        createdAt:
          type: string
          format: date-time
    IssueEventList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IssueEvent"
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
    UploadIssueAttachmentInput:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
    IssueAttachment:
      type: object
      additionalProperties: false
      required: [id, filename, contentType, size, createdAt]
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
          description: Nome originale, solo metadato (mai nel percorso su disco).
        contentType:
          type: string
        size:
          type: integer
          format: int64
        url:
          type: string
          description: Percorso di `getIssueAttachment`; richiede autenticazione.
        createdAt:
          type: string
          format: date-time
    IssueTemplate:
      type: object
      additionalProperties: false
      required: [name, body]
      properties:
        name:
          type: string
          description: Nome del file senza estensione.
        title:
          type: string
          description: Titolo proposto (front matter `title`).
        about:
          type: string
        labels:
          type: array
          items:
            type: string
        body:
          type: string
          description: Testo Markdown iniziale, senza front matter.
    IssueTemplateList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IssueTemplate"
    Label:
      type: object
      additionalProperties: false
      required: [id, name, color, description, openIssues]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 50
        color:
          $ref: "#/components/schemas/LabelColor"
        description:
          type: string
          maxLength: 256
        openIssues:
          type: integer
          minimum: 0
    LabelList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Label"
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
    CreateLabelInput:
      type: object
      additionalProperties: false
      required: [name, color]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        color:
          $ref: "#/components/schemas/LabelColor"
        description:
          type: string
          maxLength: 256
    UpdateLabelInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        color:
          $ref: "#/components/schemas/LabelColor"
        description:
          type: string
          maxLength: 256
    Milestone:
      type: object
      additionalProperties: false
      required: [number, title, description, state, openIssues, closedIssues, createdAt, updatedAt]
      properties:
        number:
          type: integer
          format: int64
        title:
          type: string
          minLength: 1
          maxLength: 256
        description:
          type: string
          maxLength: 4096
        dueOn:
          type: string
          format: date
          nullable: true
        state:
          type: string
          enum: [open, closed]
        openIssues:
          type: integer
          minimum: 0
          description: Issues aperte.
        closedIssues:
          type: integer
          minimum: 0
          description: Issues chiuse come `completed` (I2); le altre chiusure non contano.
        closedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MilestoneList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Milestone"
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
    CreateMilestoneInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 256
        description:
          type: string
          maxLength: 4096
        dueOn:
          type: string
          format: date
          nullable: true
    UpdateMilestoneInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 256
        description:
          type: string
          maxLength: 4096
        dueOn:
          type: string
          format: date
          nullable: true
        state:
          type: string
          enum: [open, closed]

  headers:
    ContentTypeOptions:
      description: Sempre `nosniff`.
      schema:
        type: string
        enum: [nosniff]
    ContentSecurityPolicy:
      description: "Sempre `sandbox`; anche se un browser aprisse il file, non puo' eseguire script."
      schema:
        type: string
        enum: [sandbox]
    ContentDispositionAttachment:
      description: "`attachment; filename=\"<nome>\"`: il browser scarica, non mostra."
      schema:
        type: string

  responses:
    RawFile:
      description: >
        Byte del file (regola B3). Testo (non SVG): `text/plain; charset=utf-8`
        in linea. Ogni altro file, SVG compreso: `application/octet-stream` con
        `Content-Disposition: attachment`. Mai `text/html`,
        `image/svg+xml` o altro tipo che un browser eseguirebbe.
      headers:
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        Content-Security-Policy:
          $ref: "#/components/headers/ContentSecurityPolicy"
        Content-Disposition:
          $ref: "#/components/headers/ContentDispositionAttachment"
      content:
        text/plain:
          schema:
            type: string
            format: binary
        application/octet-stream:
          schema:
            type: string
            format: binary
    Archive:
      description: L'archivio, sempre come allegato (regola B3).
      headers:
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        Content-Security-Policy:
          $ref: "#/components/headers/ContentSecurityPolicy"
        Content-Disposition:
          $ref: "#/components/headers/ContentDispositionAttachment"
      content:
        application/zip:
          schema:
            type: string
            format: binary
        application/gzip:
          schema:
            type: string
            format: binary
    Patch:
      description: >
        Il diff completo del commit, sempre come allegato `.diff` o
        `.patch`, `text/plain; charset=utf-8` senza limiti di dimensione
        (streaming).
      headers:
        X-Content-Type-Options:
          $ref: "#/components/headers/ContentTypeOptions"
        Content-Security-Policy:
          $ref: "#/components/headers/ContentSecurityPolicy"
        Content-Disposition:
          $ref: "#/components/headers/ContentDispositionAttachment"
      content:
        text/plain:
          schema:
            type: string
            format: binary
    TooManyRequests:
      description: >
        Troppi tentativi (`too_many_attempts`): riprovare dopo il numero di
        secondi indicato in `Retry-After`.
      headers:
        Retry-After:
          description: Secondi da attendere prima di riprovare.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Richiesta non valida.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Token mancante o non valido.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Risorsa non trovata.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflitto con lo stato attuale della risorsa.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnexpectedError:
      description: Errore imprevisto.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >
        Autenticato ma non autorizzato: scope del token insufficiente
        (`insufficient_scope`, con `details.required`) o permesso mancante
        (`forbidden`), oppure password iniziale ancora da cambiare
        (`password_change_required`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: >
        Corpo o file oltre il limite (`body_too_large`, `attachment_too_large`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: >
        Richiesta ben formata ma non valida semanticamente (`validation_failed`,
        con `details.fields` = mappa campo -> motivo).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

security:
  - bearerAuth: []
  - sessionCookie: []
