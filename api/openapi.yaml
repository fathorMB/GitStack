        createdAt:
          type: string
          format: date-time

    SetTeamMemberInput:
      type: object
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/TeamRole"

    TeamMemberList:
      type: object
      additionalProperties: false
