        sandbox`). `refAndPath` occupa piu' segmenti: il router di core e
        la tabella del gateway lo trattano come coda (`x-path-tail`), non
        come un segmento solo. Servono sessione o token con `read`.
        Come per `getRepository`: un repo che l'utente non puo' leggere, o
        eliminato, risponde 404. Un ref che non corrisponde a nessun
        branch, tag o sha risponde 404 `ref_not_found`.
