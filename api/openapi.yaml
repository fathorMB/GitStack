      summary: Stato complessivo di un commit
      description: >
        Per ogni contesto vale l'ultimo stato (PR9). `state` e' `failure` o `error` se almeno un contesto lo e',
        altrimenti `pending` se almeno uno e' in corso, altrimenti `success`; `none` se non ci sono stati.
        `requiredContexts` sono i contesti obbligatori del branch principale (PR4) con il loro ultimo stato,
        `null` se non e' mai arrivato. Un repo che l'utente non puo' leggere risponde 404.
      responses:
