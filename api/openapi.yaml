        commit e' indietro rispetto alla destinazione (una PR solo «indietro» si unisce, niente «Update branch»),
        e i blocchi di PR4, PR6 e PR9 (bozza, approvazioni mancanti, modifiche richieste, stati obbligatori).
        `allowedMethods` sono i metodi di merge che l'impostazione del repo ammette (PR3). Lo stesso stato e'
        usato da `mergePullRequest`. Se il calcolo non e' ancora pronto `state` e' `unknown` e va richiesto di nuovo.
        Un repo che l'utente non puo' leggere risponde 404.
