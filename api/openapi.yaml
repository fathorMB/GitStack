          $ref: "#/components/schemas/LicenseTemplate"

    UpdateRepositoryInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        description:
          type: string
          maxLength: 1024
        visibility:
          $ref: "#/components/schemas/RepoVisibility"
        defaultBranch:
          type: string
          minLength: 1
          maxLength: 255
        protectDefaultBranch:
          type: boolean
        archived:
          type: boolean

    RepositoryList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Repository"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

