  # ---------------------------------------------------------------------
  # Interfaccia interna identity <-> altri servizi. NON esposta dal gateway
  # (che deve rifiutare /v1/internal/*): raggiungibile solo dalla rete del
  # cluster e protetta da un segreto condiviso di servizio (`serviceAuth`).
  # ---------------------------------------------------------------------

  /repos:
    get:
      operationId: listRepositories
      tags: [repos]
      x-required-scopes: ["read:resource"]
      x-mcp:
        expose: true
        name: repo_list
        destructive: false
      summary: Elenca i repo leggibili dall'utente
      description: >
        Repo che l'utente corrente puo' leggere (P1, P3, P6), esclusi quelli
        eliminati; con `owner` solo quelli di quell'utente o organizzazione.
        Paginazione come `GET /resources`.
      parameters:
        - $ref: "#/components/parameters/RepoOwnerFilter"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
      responses:
        "200":
          description: Pagina di repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"
    post:
      operationId: createRepository
      tags: [repos]
      x-required-scopes: ["write:resource"]
      x-mcp:
        expose: true
        name: repo_create
        destructive: false
      summary: Crea un repo
      description: >
        `owner` e' il nome dell'utente o dell'organizzazione (spazio di nomi
        unico, R1). Serve poter creare repo per quell'owner: se stesso, o un
        owner dell'organizzazione. Il creatore riceve il ruolo `admin`.
        Senza opzioni di contenuto iniziale (R5) il repo nasce vuoto.
        Risponde 409 se il nome e' occupato: `conflict` se lo tiene un repo attivo, `name_in_trash` (con
        `details`: `NameInTrashDetails`) se lo tiene un repo eliminato ancora nel cestino (R2); 404 se `owner`
        non esiste.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRepositoryInput"
      responses:
        "201":
          description: Repo creato.
          headers:
            Location:
              description: URL del repo creato.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RepoNameConflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /repos/import:
    post:
      operationId: importRepository
      tags: [repos]
      x-required-scopes: ["write:resource"]
      x-mcp:
        expose: false
        name: repository_import
        destructive: false
      summary: Crea un repo importandolo da un URL
      description: >
        «Importa da URL» (MP3, MP8). Crea un repo nuovo copiando tutti i branch e i tag di un repo Git
        raggiungibile in `https://` (MP5: senza credenziali nell'indirizzo, controllata con la policy di uscita
        C8, 422 `url_not_allowed` con `details.fields.url`). `mode: mirror` («mantieni sincronizzato») tiene il
        repo in sola lettura e lo aggiorna ogni `intervalSeconds` (MP1, MP2, MP4); `mode: once` («copia una volta
        sola», MP8) copia una volta e poi cancella le credenziali: il repo e' normale e scrivibile, senza legami
        con l'origine. In entrambi i casi la copia parte in background: la risposta e' 201 col repo (che nasce
        `empty` finche' la prima copia non e' finita) e si segue con `getRepoPullMirror` e
        `listRepoPullMirrorRuns`. `owner`, nome, visibilita' e permessi come `createRepository` (il creatore e'
        `admin`); 409 se il nome e' occupato (`conflict` o `name_in_trash`, come `createRepository`). `username` e `token` sono facoltativi e il token non torna
        mai. Senza chiave dei segreti sul server: 503 `mirror_secrets_unavailable`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRepositoryInput"
      responses:
        "201":
          description: Repo creato; la copia e' in corso.
          headers:
            Location:
              description: URL del repo creato.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RepoNameConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /users/{username}/access:
    parameters:
      - $ref: "#/components/parameters/UsernameParam"
    get:
      operationId: getUserAccess
      tags: [repos]
      x-required-scopes: ["read:user"]
      x-mcp:
        expose: false
        name: user_access_get
        destructive: false
      summary: Accesso effettivo di un utente ai repository
      description: >
        Solo l'amministratore dell'installazione (403 agli altri, anche per
        se stessi), scope `read:user`. Per ogni repository non eliminato che
        l'utente `username` (persona o agent) puo' raggiungere: il ruolo
        effettivo, il piu' alto fra le fonti (P1-P6), e l'elenco delle
        fonti (`sources`): grant diretto, grant di un team di cui e' membro
        (o di un'organizzazione di cui e' owner), owner del repo
