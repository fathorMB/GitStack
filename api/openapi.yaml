  # ---------------------------------------------------------------------
  # Interfaccia interna identity <-> altri servizi. NON esposta dal gateway
  # (che deve rifiutare /v1/internal/*): raggiungibile solo dalla rete del
  # cluster e protetta da un segreto condiviso di servizio (`serviceAuth`).
  # ---------------------------------------------------------------------

  /repos:
    get:
      operationId: listRepositories
      tags: [repos]
      x-required-scopes: ["read:resource"]
      summary: Elenca i repo leggibili dall'utente
      description: >
        Repo che l'utente corrente puo' leggere (P1, P3, P6), esclusi quelli
        eliminati; con `owner` solo quelli di quell'utente o organizzazione.
        Paginazione come `GET /resources`.
      parameters:
        - $ref: "#/components/parameters/RepoOwnerFilter"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
      responses:
        "200":
          description: Pagina di repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"
    post:
      operationId: createRepository
      tags: [repos]
      x-required-scopes: ["write:resource"]
      summary: Crea un repo
      description: >
        `owner` e' il nome dell'utente o dell'organizzazione (spazio di nomi
        unico, R1). Serve poter creare repo per quell'owner: se stesso, o un
        owner dell'organizzazione. Il creatore riceve il ruolo `admin`.
        Senza opzioni di contenuto iniziale (R5) il repo nasce vuoto.
        Risponde 409 se il nome e' occupato, anche da un repo eliminato (R2);
        404 se `owner` non esiste.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRepositoryInput"
      responses:
        "201":
          description: Repo creato.
          headers:
            Location:
              description: URL del repo creato.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /repos/deleted:
    get:
      operationId: listDeletedRepositories
      tags: [repos]
      x-required-scopes: ["read:resource"]
      summary: Elenca i repo eliminati e ancora ripristinabili
      description: >
        Repo eliminati da meno di 7 giorni (R2) su cui l'utente ha il ruolo
        `admin` (R12). Con `owner` solo quelli di quell'owner.
      parameters:
        - $ref: "#/components/parameters/RepoOwnerFilter"
      responses:
        "200":
          description: Repo eliminati.
          content:
            application/json:
