        destructive: false
      summary: Contenuto di un file
      description: >
        Contenuto di `path` a `ref` con dimensione, tipo e ultimo commit (mockup 08). Regola B1: la risposta dice sempre in `display` come mostrarlo. Testo fino a 1 MB (1 048 576 byte): `highlight`, `content` intero. Testo da 1 MB a 5 MB (5 242 880 byte): `plain`, `content` intero da mostrare senza evidenziazione. Testo oltre 5 MB: `download`, nessun `content` e `truncated` true (solo scaricamento con `raw`). Immagini comuni (PNG, JPEG, GIF, WebP, SVG; `kind` `image`) fino a 1 MB: `display` `image`, `content` in base64 (`encoding` `base64`) e `mimeType`, cosi' la UI le mostra come immagine anche se `raw` le serve come allegato; oltre 1 MB `download`. Altri binari: `kind` `binary`, `download`, nessun `content`. `size` e' sempre la dimensione reale. 404 se `path` non esiste o non e' un file. Come per `getRepository`: un repo che l'utente non puo'
        leggere, o eliminato, risponde 404. `ref` puo' essere branch, tag o
        sha; se manca vale il branch principale (R4). Un `ref` non valido
        risponde 400 `invalid_ref`, uno inesistente 404 `ref_not_found`.
