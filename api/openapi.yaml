        name:
          $ref: "#/components/schemas/Name"
        displayName:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 1024
        createdAt:
          type: string
          format: date-time
          readOnly: true

    CreateOrganizationInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/Name"
        displayName:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 1024

    UpdateOrganizationInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 1024

    OrganizationList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
