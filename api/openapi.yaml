  # ---------------------------------------------------------------------
  # Interfaccia interna identity <-> altri servizi. NON esposta dal gateway
  # (che deve rifiutare /v1/internal/*): raggiungibile solo dalla rete del
  # cluster e protetta da un segreto condiviso di servizio (`serviceAuth`).
  # ---------------------------------------------------------------------

  /internal/verify:
    post:
      operationId: verifyCredential
      tags: [internal]
      summary: Verifica una credenziale (per il gateway)
      description: >
        Il gateway invia il valore grezzo della credenziale (cookie di
        sessione oppure token `gst_...`) e riceve il principal. Non c'e'
        distinzione fra "sconosciuta", "scaduta" e "revocata": `active` false.
        Aggiorna `last_used_at` (al piu' una volta al minuto per credenziale).
      security:
        - serviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyCredentialInput"
      responses:
        "200":
          description: Esito della verifica.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyCredentialResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/permissions/check:
    post:
      operationId: checkPermission
      tags: [internal]
      summary: Verifica un permesso su una risorsa
      description: >
        Usata da core e git per applicare i permessi: `allowed` e' vero se
        l'utente ha almeno il ruolo richiesto sulla risorsa (grant diretto,
        via team o amministratore).
      security:
        - serviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckPermissionInput"
      responses:
        "200":
          description: Esito.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckPermissionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/ssh-keys/{fingerprint}:
    parameters:
      - name: fingerprint
        in: path
        required: true
        description: Fingerprint `SHA256:...` (URL-encoded).
        schema:
          type: string
          pattern: "^SHA256:[A-Za-z0-9+/]{43}$"
    get:
      operationId: lookupSshKey
      tags: [internal]
      summary: Risolve un utente dal fingerprint di una chiave SSH
      description: Usata dal servizio git all'accesso SSH. Aggiorna `lastUsedAt`.
      security:
        - serviceAuth: []
      responses:
        "200":
          description: Chiave e utente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SshKeyLookup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
      description: >
        Token personale `gst_...` verificato dal `gateway` tramite identity.
        Stesso schema per CLI `gs`, skills e agenti. Ogni operazione di
        identity indica gli scope richiesti in `x-required-scopes`; le
        sessioni web (cookie) non hanno scope.
    sessionCookie:
      type: apiKey
      in: cookie
      name: gst_session
      description: >
        Sessione web creata da `POST /auth/login` o dal login OIDC. Valore
        opaco; identity ne conserva solo l'hash.
    serviceAuth:
      type: http
      scheme: bearer
      description: >
        Solo interfaccia interna: segreto condiviso di servizio fra gateway,
        core, git e identity. Non e' un token utente.

  parameters:
    ResourceIdParam:
      name: resourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Identificatore della risorsa.
    ResourceTypeFilter:
      name: type
      in: query
      required: false
      schema:
        type: string
        minLength: 1
      description: Filtra per tipo di risorsa (es. `repo`).
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPageParam:
      name: perPage
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UsernameParam:
      name: username
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Name"
    OrgParam:
      name: org
      in: path
      required: true
      description: Nome (slug) dell'organizzazione.
      schema:
        $ref: "#/components/schemas/Name"
    TeamParam:
      name: team
      in: path
      required: true
      description: Nome (slug) del team, unico dentro l'organizzazione.
      schema:
        $ref: "#/components/schemas/Name"
    TokenIdParam:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SshKeyIdParam:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GrantIdParam:
      name: grantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OidcProviderParam:
      name: provider
      in: path
      required: true
      description: Slug del provider OIDC.
      schema:
        $ref: "#/components/schemas/Name"

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          description: Versione del contratto API in esecuzione (`info.version`).

    Resource:
      type: object
      description: >
        Risorsa generica (D15): oggi usata dalla prova end-to-end, in futuro
        anche per repository, applicazioni e database, senza cambiare forma.
      additionalProperties: false
      required: [id, type, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        type:
          type: string
          minLength: 1
          example: repo
          description: "Tipo di risorsa, aperto: non un enum fisso (D15)."
        name:
          type: string
          minLength: 1
          maxLength: 255
        attributes:
          type: object
          description: Attributi specifici del tipo di risorsa, a forma libera.
          additionalProperties: true
          default: {}
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    CreateResourceInput:
      type: object
      additionalProperties: false
      required: [type, name]
      properties:
        type:
          type: string
          minLength: 1
          example: repo
        name:
          type: string
          minLength: 1
          maxLength: 255
        attributes:
          type: object
          additionalProperties: true

    UpdateResourceInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        attributes:
          type: object
          additionalProperties: true

    ResourceList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Resource"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    Error:
      type: object
      description: >
        Formato unico degli errori per tutta l'API pubblica. Codici comuni per
        stato: 400 `bad_request`; 401 `unauthenticated`, `invalid_credentials`;
        403 `forbidden`, `insufficient_scope`; 429 `too_many_attempts`; 404 `not_found`; 409 `conflict`
        e varianti specifiche (`already_exists`, `last_admin`, `last_owner`,
        `ssh_key_in_use`, `oidc_identity_unlinked`); 422 `validation_failed`
        (`details.fields`). Le risposte 401 non distinguono mai "utente
        inesistente" da "password errata".
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: Codice stabile leggibile da macchina (es. `not_found`).
              example: not_found
            message:
              type: string
              description: Messaggio leggibile da persone, non contrattuale.
            details:
              type: object
              additionalProperties: true
              description: Dettagli opzionali specifici dell'errore.
    Name:
      type: string
      description: >
        Nome breve in minuscolo (username, organizzazione, team, provider):
        lettere minuscole, cifre e trattini, 1-39 caratteri, inizia e finisce
        con un carattere alfanumerico.
      pattern: "^[a-z0-9]([a-z0-9-]{0,37}[a-z0-9])?$"
      minLength: 1
      maxLength: 39
      example: alice

    TokenScope:
      type: string
      description: >
        Catalogo degli scope dei token personali (unico, condiviso da tutti i
        servizi). Le sessioni web non hanno scope: valgono i permessi
        dell'utente. `write:*` include `read:*` dello stesso ambito;
        `admin:org` include `write:org`.
      enum:
        - read:user
        - write:user
        - read:org
        - write:org
        - admin:org
        - read:resource
        - write:resource

    ResourceRole:
      type: string
      description: Ruolo su una risorsa, in ordine crescente di potere.
      enum: [read, write, admin]

    LoginInput:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 254
          description: Username oppure email.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
          writeOnly: true

    User:
      type: object
      description: >
        Profilo utente. `email`, `isAdmin`, `isActive`, `createdAt` sono
        presenti solo per l'utente stesso e per gli amministratori.
      additionalProperties: false
      required: [id, username, kind, displayName]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          $ref: "#/components/schemas/Name"
        kind:
          type: string
          enum: [human, agent]
        displayName:
          type: string
          maxLength: 128
        bio:
          type: string
          maxLength: 1024
        avatarUrl:
          type: string
          format: uri
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        isAdmin:
          type: boolean
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
          readOnly: true

    CreateUserInput:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username:
          $ref: "#/components/schemas/Name"
        kind:
          type: string
          enum: [human, agent]
          default: human
        email:
          type: string
          format: email
        displayName:
          type: string
          maxLength: 128
        password:
          type: string
          minLength: 12
          maxLength: 1024
          format: password
          writeOnly: true
          description: Assente per gli agenti (accedono solo con token) e per chi entra solo via OIDC.
        isAdmin:
          type: boolean
          default: false

    UpdateUserInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          maxLength: 128
        bio:
          type: string
          maxLength: 1024
        avatarUrl:
          type: string
          format: uri
          nullable: true
        email:
          type: string
          format: email
        isAdmin:
          type: boolean
          description: Solo amministratori.
        isActive:
          type: boolean
          description: Solo amministratori. Disattivare revoca le sessioni e i token.

    UserList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    ChangePasswordInput:
      type: object
      additionalProperties: false
      required: [newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          writeOnly: true
          maxLength: 1024
        newPassword:
          type: string
          minLength: 12
          maxLength: 1024
          format: password
          writeOnly: true

    CurrentSession:
      type: object
      additionalProperties: false
      required: [user, authMethod]
      properties:
        user:
          $ref: "#/components/schemas/User"
        authMethod:
          type: string
          enum: [password, oidc, token]
          description: Come e' stato autenticato il chiamante.
        scopes:
          type: array
          description: Solo per `authMethod` = `token`.
          items:
            $ref: "#/components/schemas/TokenScope"
        expiresAt:
          type: string
          format: date-time
          nullable: true

    OidcProvider:
      type: object
      additionalProperties: false
      required: [slug, displayName]
      properties:
        slug:
          $ref: "#/components/schemas/Name"
        displayName:
          type: string

    OidcProviderList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OidcProvider"

    Token:
      type: object
      description: Token personale, senza il valore (che non e' recuperabile).
      additionalProperties: false
      required: [id, name, scopes, hint, createdAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 64
        scopes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TokenScope"
        hint:
          type: string
          minLength: 4
          maxLength: 4
          description: Ultimi 4 caratteri del token, per riconoscerlo.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true

    CreateTokenInput:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TokenScope"
        expiresAt:
          type: string
          format: date-time
          description: >
            Obbligatoria: la scadenza deve essere nel futuro e non oltre il
            massimo configurato dall'installazione (default 365 giorni), altrimenti 422.

    CreatedToken:
      description: Il token appena creato; `token` compare solo in questa risposta.
      allOf:
        - $ref: "#/components/schemas/Token"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              pattern: "^gst_[A-Za-z0-9_-]{32,}$"
              description: Valore in chiaro, formato `gst_<casuale>`. Non viene salvato.

    TokenList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Token"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    SshKey:
      type: object
      additionalProperties: false
      required: [id, title, keyType, fingerprint, createdAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          minLength: 1
          maxLength: 64
        keyType:
          type: string
          example: ssh-ed25519
        fingerprint:
          type: string
          pattern: "^SHA256:[A-Za-z0-9+/]{43}$"
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true

    AddSshKeyInput:
      type: object
      additionalProperties: false
      required: [title, publicKey]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 64
        publicKey:
          type: string
          maxLength: 8192
          example: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... alice@laptop"
          description: Riga in formato `authorized_keys` (tipo, base64, commento facoltativo).

    SshKeyList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SshKey"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    SshKeyLookup:
      type: object
      additionalProperties: false
      required: [key, user]
      properties:
        key:
          $ref: "#/components/schemas/SshKey"
        user:
          $ref: "#/components/schemas/User"

    Organization:
      type: object
      additionalProperties: false
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          $ref: "#/components/schemas/Name"
        displayName:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 1024
        createdAt:
          type: string
          format: date-time
          readOnly: true

    CreateOrganizationInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/Name"
        displayName:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 1024

    UpdateOrganizationInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 1024

    OrganizationList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Organization"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    OrgRole:
      type: string
      description: "`owner` gestisce organizzazione, team e membri; `member` no."
      enum: [owner, member]

    OrgMember:
      type: object
      additionalProperties: false
      required: [user, role, createdAt]
      properties:
        user:
          $ref: "#/components/schemas/User"
        role:
          $ref: "#/components/schemas/OrgRole"
        createdAt:
          type: string
          format: date-time

    SetOrgMemberInput:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/OrgRole"

    OrgMemberList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrgMember"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    Team:
      type: object
      additionalProperties: false
      required: [id, orgId, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        orgId:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/Name"
        description:
          type: string
          maxLength: 1024
        createdAt:
          type: string
          format: date-time
          readOnly: true

    CreateTeamInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/Name"
        description:
          type: string
          maxLength: 1024

    UpdateTeamInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: "#/components/schemas/Name"
        description:
          type: string
          maxLength: 1024

    TeamList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Team"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    TeamRole:
      type: string
      description: "`maintainer` gestisce i membri del team."
      enum: [member, maintainer]

    TeamMember:
      type: object
      additionalProperties: false
      required: [user, role, createdAt]
      properties:
        user:
          $ref: "#/components/schemas/User"
        role:
          $ref: "#/components/schemas/TeamRole"
        createdAt:
          type: string
          format: date-time

    SetTeamMemberInput:
      type: object
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/TeamRole"

    TeamMemberList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TeamMember"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    Grant:
      type: object
      description: Ruolo su una risorsa generica (D15) per un utente o un team.
      additionalProperties: false
      required: [id, resourceId, subjectType, subjectId, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        resourceId:
          type: string
          format: uuid
        subjectType:
          type: string
          enum: [user, team]
        subjectId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ResourceRole"
        createdAt:
          type: string
          format: date-time
          readOnly: true

    CreateGrantInput:
      type: object
      additionalProperties: false
      required: [subjectType, subjectId, role]
      properties:
        subjectType:
          type: string
          enum: [user, team]
        subjectId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ResourceRole"

    UpdateGrantInput:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/ResourceRole"

    GrantList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Grant"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    EffectivePermission:
      type: object
      additionalProperties: false
      required: [resourceId, role]
      properties:
        resourceId:
          type: string
          format: uuid
        role:
          type: string
          allOf:
            - $ref: "#/components/schemas/ResourceRole"
          nullable: true
          description: Ruolo effettivo; `null` = nessun accesso.

    VerifyCredentialInput:
      type: object
      additionalProperties: false
      required: [credential]
      properties:
        credential:
          type: string
          minLength: 1
          maxLength: 512
          writeOnly: true
          description: Valore grezzo della credenziale (cookie `gst_session` o token `gst_...`).
        kind:
          type: string
          enum: [session, token]
          description: Facoltativo, evita l'ambiguita' se il gateway la conosce.

    Principal:
      type: object
      description: Chi ha presentato la credenziale.
      additionalProperties: false
      required: [userId, username, kind, isAdmin, authMethod]
      properties:
        userId:
          type: string
          format: uuid
        username:
          $ref: "#/components/schemas/Name"
        kind:
          type: string
          enum: [human, agent]
        isAdmin:
          type: boolean
        authMethod:
          type: string
          enum: [password, oidc, token]
        scopes:
          type: array
          description: Solo per i token; assenti per le sessioni.
          items:
            $ref: "#/components/schemas/TokenScope"
        credentialId:
          type: string
          format: uuid
          description: Id della sessione o del token (per audit).
        expiresAt:
          type: string
          format: date-time
          nullable: true

    VerifyCredentialResult:
      type: object
      additionalProperties: false
      required: [active]
      properties:
        active:
          type: boolean
        principal:
          $ref: "#/components/schemas/Principal"
        cacheTtlSeconds:
          type: integer
          minimum: 0
          description: Per quanto tempo il gateway puo' tenere in cache l'esito.

    CheckPermissionInput:
      type: object
      additionalProperties: false
      required: [userId, resourceId, role]
      properties:
        userId:
          type: string
          format: uuid
        resourceId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ResourceRole"

    CheckPermissionResult:
      type: object
      additionalProperties: false
      required: [allowed]
      properties:
        allowed:
          type: boolean
        effectiveRole:
          type: string
          allOf:
            - $ref: "#/components/schemas/ResourceRole"
          nullable: true

  responses:
    TooManyRequests:
      description: >
        Troppi tentativi (`too_many_attempts`): riprovare dopo il numero di
        secondi indicato in `Retry-After`.
      headers:
        Retry-After:
          description: Secondi da attendere prima di riprovare.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Richiesta non valida.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Token mancante o non valido.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Risorsa non trovata.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflitto con lo stato attuale della risorsa.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnexpectedError:
      description: Errore imprevisto.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >
        Autenticato ma non autorizzato: scope del token insufficiente
        (`insufficient_scope`, con `details.required`) o permesso mancante
        (`forbidden`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: >
        Richiesta ben formata ma non valida semanticamente (`validation_failed`,
        con `details.fields` = mappa campo -> motivo).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

security:
  - bearerAuth: []
  - sessionCookie: []
