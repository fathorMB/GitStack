openapi: 3.0.3
info:
  title: GitStack API
  version: "0.1.0"
  description: >
    API pubblica di GitStack (fonte unica del contratto, decisione D8
    [c_f68d7615da93197a]). Unico punto d'ingresso: il servizio `gateway`.
    UI web, CLI `gs`, skills per agenti e in futuro server MCP usano tutti
    questa stessa API (principio API-first, decisione D7 [c_3780bc749c6ed28d]).

    Il modello dati usa risorse generiche (decisione D15
    [c_4ef209e79c5b2ddb]): oggi la sola risorsa di prova dello scheletro
    end-to-end, domani repository, applicazioni, database e altro senza
    cambiare forma dell'API.

    Ogni versione dell'API vive sotto un prefisso di percorso esplicito
    (`/v1`); `info.version` segue in aggiunta il contratto stesso (SemVer).
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
externalDocs:
  description: Architettura e decisioni di GitStack
  url: https://github.com/fathorMB/GitStack/tree/main/.lmbrain-lite/knowledge
x-code-read-limits:
  description: >
    Costanti delle letture del codice (M-04, regole B1, B5, B6; GIT-91). Sono
    la fonte unica: schemi, descrizioni e docs/repos.md le riportano, e i
    servizi le definiscono una volta sola come costanti con questi nomi.
  fileHighlightMaxBytes: 1048576
  filePlainMaxBytes: 5242880
  imageInlineMaxBytes: 1048576
  blameMaxBytes: 1048576
  treeMaxEntries: 1000
  commitsPerPageMax: 100
  diffCollapseLines: 500
  diffMaxFiles: 300
  diffMaxLines: 20000
  diffFileMaxBytes: 1048576
  fileListMaxPaths: 50000
  searchMaxResults: 100
  searchTimeoutSeconds: 10
  searchFragmentMaxChars: 300
  searchFileMaxBytes: 1048576
servers:
  - url: /v1
    description: Gateway pubblico di GitStack (dietro Traefik)

tags:
  - name: system
    description: Stato del sistema.
  - name: resources
    description: >
      Risorsa di prova generica, usata dal flusso end-to-end (UI → gateway →
      core → Postgres) e come base del modello a risorse generiche (D15).
  - name: auth
    description: Login, logout, sessione corrente, login OIDC esterno (M-02, D5).
  - name: users
    description: Utenti (persone e agenti) e profilo.
  - name: tokens
    description: Token personali con scope dell'utente corrente.
  - name: ssh-keys
    description: Chiavi SSH pubbliche dell'utente corrente.
  - name: organizations
    description: Organizzazioni e loro membri.
  - name: teams
    description: Team di un'organizzazione e loro membri.
  - name: permissions
    description: Grant e permessi effettivi su risorse generiche (D15).
  - name: internal
    description: >
      Interfaccia interna fra servizi (verifica credenziali, permessi, chiavi
      SSH). Non esposta dal gateway.
  - name: repos
    description: >
      Repository Git (M-03): creazione, impostazioni, eliminazione e
      ripristino; letture del codice (M-04): albero, file, branch, tag,
      commit, diff, blame, archivio, lingue, README. Un repo e' una risorsa generica `type=repo` (D15); servita
      da core.
  - name: issues
    description: >
      Issues di un repo (M-05): commenti, cronologia, etichette, milestone,
      assegnatari, allegati, modelli e ricerca. Regole I1-I11. Servite da core.
  - name: pulls
    description: >
      Pull Request tra due branch dello stesso repo (v1.1, regole PR1-PR12): bozza, chiusura, merge e
      mergeability con i file in conflitto, commit e file della PR, review, commenti sulle righe,
      conversazioni risolte, richiesta di review, casella Viewed, stati dei commit (PR9) e impostazioni
      «Branches & merge» del repo (PR3, PR4). Il numero `#n` e' condiviso con le issues (I1). Ogni operazione
      porta l'estensione `x-mcp` (M2, M3). Servite da core.
  - name: notifications
    description: >
      Notifiche in-app dell'utente corrente, iscrizioni alle issues, Watch dei repo e preferenze email (M-06,
      regole C3-C5, C9). Servite da core.
  - name: webhooks
    description: >
      Webhook di repo e di organizzazione, log delle consegne e Redeliver (M-06, regole C6-C8). Formato dei
      payload in docs/webhooks.md. Serviti da core.
  - name: mirrors
    description: >
      Mirror in push di un repo verso un altro server Git in HTTPS (V8, GIT-179): branch principale e tag,
      mai push forzato. Mirror in pull (MP1-MP8, GIT-195): un repo esterno copiato in un repo di GitStack,
      in sola lettura, con ref `diverged` al posto di cancellazioni e sovrascritture (`/pull-mirror`;
      import da URL con `POST /repos/import`). Serviti da core, eseguiti dal servizio git.
  - name: git-internal
    description: >
      Interfaccia interna del servizio git verso core (creazione su disco,
      cestino, cancellazione). Non esposta dal gateway, implementata a mano.
  - name: ci
    description: >
      Workflow compatibili con GitHub Actions, esecuzioni, job, artefatti, cache,
      segreti e variabili (CI1-CI7 [c_baa86c8ddb5db70d]). Serviti da core.
  - name: registry
    description: >
      Metadati e politiche del registry OCI (RG1-RG2 [c_71844eeffde33356]). Il
      protocollo di distribuzione delle immagini e' lo standard OCI Distribution
      Specification e non fa parte di questo contratto REST.
  - name: registry-public
    description: Endpoint del gateway per i metadati pubblici del registry.
  - name: releases
    description: Release, note e allegati di un repository (REL1 [c_776d5e1e3d1df05c]).
  - name: apps
    description: >
      Hosting di app (v3-a, regole H1-H13 [c_c4431e5184995e4f], H5 [c_111f298013335dbc]): app di un repo, versioni,
      deploy, rollback, riavvio e scala, variabili e segreti, accesso, risorse, log e metriche; console
      dell'amministratore (capacita', riserva, quote per owner, impostazioni d'istanza, chiavi fidate). Il permesso
      del repo di ogni operazione e' in `x-repo-permission` (read, write, admin) e nella descrizione; le
      operazioni da `admin` portano `x-mcp.destructive: true` (H13). Servite da core.

paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      x-mcp:
        expose: false
        name: health_get
        destructive: false
      summary: Stato del servizio
      description: >
        Controllo di salute, senza autenticazione: usato da orchestratore
        (k3s) e dai probe di deploy.
      security: []
      responses:
        "200":
          description: Il servizio è operativo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                version: "0.1.0"

  /meta:
    get:
      operationId: getMeta
      tags: [system]
      x-mcp:
        expose: false
        name: meta_get
        destructive: false
      summary: Versione del server
      description: >
        Versione dell'installazione e del contratto API, senza
        autenticazione. Usato da gs per il controllo di compatibilita (G6).
      security: []
      responses:
        "200":
          description: Versioni del server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
              example:
                server_version: "v0.1.0"
                api_version: "0.1.0"

  /instance/ca:
    get:
      operationId: getInstanceCa
      tags: [system]
      x-mcp:
        expose: false
        name: instance_ca_get
        destructive: false
      summary: CA interna dell'istanza e sua impronta
      description: >
        Senza autenticazione (H2, N5, guida CA per i tester): dice se l'istanza usa la CA interna e,
        in quel caso, l'impronta SHA-256 del certificato `ca.crt`, nel formato di
        `openssl x509 -fingerprint -sha256` (byte esadecimali maiuscoli separati da due punti), e l'indirizzo da cui
        scaricarlo. E' l'unica fonte dell'impronta: la guida `/help/ca` e l'invito ai tester la leggono da qui.
        `mode` e' `internal` con la CA interna, `custom` con un certificato del cliente o Let's Encrypt (niente da installare),
        `none` senza HTTPS o se il certificato della CA non e' leggibile.
      security: []
      responses:
        "200":
          description: Stato della CA dell'istanza.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceCa"
              example:
                mode: internal
                fingerprintSha256: "AB:CD:01:23:45:67:89:AB:CD:EF:01:23:45:67:89:AB:CD:EF:01:23:45:67:89:AB:CD:EF:01:23:45:67:89:AB"
                downloadUrl: /downloads/ca.crt

  /registry/signing-key:
    get:
      operationId: getRegistrySigningKey
      tags: [registry-public]
      x-mcp:
        expose: false
        name: registry_signing_key_get
        destructive: false
      summary: Chiave pubblica delle firme del registry
      description: Chiave PEM dell'istanza per `cosign verify`; richiede un utente autenticato.
      responses:
        "200":
          description: Chiave pubblica ECDSA P-256 in PEM.
          content:
            application/x-pem-file:
              schema:
                type: string
        "401":
          description: Credenziali mancanti o non valide.


  /admin/system:
    get:
      operationId: getAdminSystem
      tags: [system]
      x-required-scopes: ["read:resource"]
      x-mcp:
        expose: false
        name: admin_system_get
        destructive: false
      summary: Stato dell'installazione (Admin · System)
      description: >
        Database (interno o esterno, N8), backup locale e S3 con l'esito
        dell'ultimo caricamento (N7), rete aziendale (N9) e versioni di
        GitStack e k3s con l'aggiornamento disponibile (N10). Solo
        l'amministratore dell'installazione. Le informazioni dell'host le
        pubblica `gitstack` in un ConfigMap che core legge da un file montato:
        niente accesso all'host dai servizi. La versione del server Postgres è
        quella letta ora da core sulla sua connessione. Mai segreti: né
        password, né chiavi S3, né credenziali del proxy.
      responses:
        "200":
          description: Stato del sistema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSystem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/UnexpectedError"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /resources:
    get:
      operationId: listResources
      tags: [resources]
      x-required-scopes: ["read:resource"]
      x-mcp:
        expose: false
        name: resources_list
        destructive: false
      summary: Elenca le risorse
      description: >
        Elenco paginato delle risorse, con filtro opzionale per tipo (es.
        `repo`). Il tipo non è vincolato a un insieme fisso: nuove milestone
        aggiungono nuovi tipi senza cambiare l'endpoint (D15).
      parameters:
        - $ref: "#/components/parameters/ResourceTypeFilter"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
      responses:
        "200":
          description: Pagina di risorse.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"
    post:
      operationId: createResource
      tags: [resources]
      x-required-scopes: ["write:resource"]
      x-mcp:
        expose: false
        name: resource_create
        destructive: false
      summary: Crea una risorsa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResourceInput"
      responses:
        "201":
          description: Risorsa creata.
          headers:
            Location:
              description: URL della risorsa creata.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /resources/{resourceId}:
    parameters:
      - $ref: "#/components/parameters/ResourceIdParam"
    get:
      operationId: getResource
      tags: [resources]
      x-required-scopes: ["read:resource"]
      x-mcp:
        expose: false
        name: resource_get
        destructive: false
      x-required-permission: read
      summary: Legge una risorsa
      responses:
        "200":
          description: Risorsa trovata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
    patch:
      operationId: updateResource
      tags: [resources]
      x-required-scopes: ["write:resource"]
      x-mcp:
        expose: false
        name: resource_update
        destructive: false
      x-required-permission: write
      summary: Aggiorna una risorsa
      description: "Aggiornamento parziale: solo i campi presenti nel corpo cambiano."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateResourceInput"
      responses:
        "200":
          description: Risorsa aggiornata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
    delete:
      operationId: deleteResource
      tags: [resources]
      x-required-scopes: ["write:resource"]
      x-mcp:
        expose: false
        name: resource_delete
        destructive: true
      x-required-permission: admin
      summary: Elimina una risorsa
      responses:
        "204":
          description: Risorsa eliminata.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
  # ---------------------------------------------------------------------
  # Identity (M-02): autenticazione, utenti, token, chiavi SSH,
  # organizzazioni, team, permessi. Servite dal servizio `identity` dietro il
  # gateway (services/identity/README.md).
  # ---------------------------------------------------------------------

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      x-mcp:
        expose: false
        name: auth_login
        destructive: false
      summary: Accede con username e password
      description: >
        Crea una sessione. La risposta imposta il cookie `gst_session` (con
        prefisso `__Host-`, quindi `__Host-gst_session`, quando e' servita in
        HTTPS; i due nomi sono equivalenti per i client) (HttpOnly, Secure,
        SameSite=Lax); il valore non e' nel corpo. Le
        credenziali sbagliate e l'utente disattivato rispondono entrambi 401
        con `invalid_credentials`, senza distinguere i casi. Dopo troppi
        tentativi falliti (per utente o per indirizzo IP) risponde 429
        `too_many_attempts` con l'header `Retry-After` in secondi.

        Secondo fattore (F11): se l'utente ha attivato il TOTP, la sola
        password non basta. Il login e' a due passi: il primo invio con la
        sola password giusta risponde 401 `second_factor_required` (nessuna
        sessione, nessun cookie); il secondo ripete username e password con
        `totpCode` (codice a 6 cifre, finestra +-1 passo da 30 secondi,
        ogni codice vale una volta sola) oppure `recoveryCode` (codice di
        recupero monouso). Un codice sbagliato risponde 401
        `invalid_credentials` e conta come tentativo fallito. Gli utenti che
        entrano con OIDC prendono l'MFA dal loro provider.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Sessione creata.
          headers:
            Set-Cookie:
              description: Cookie di sessione `gst_session`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      x-mcp:
        expose: false
        name: auth_logout
        destructive: false
      x-password-change-exempt: always
      x-totp-enroll-exempt: always
      summary: Termina la sessione corrente
      description: Revoca la sessione del cookie `gst_session` e lo cancella.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Sessione terminata.
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /auth/session:
    get:
      operationId: getCurrentSession
      tags: [auth]
      x-mcp:
        expose: false
        name: current_session_get
        destructive: false
      x-password-change-exempt: always
      x-totp-enroll-exempt: always
      summary: Sessione corrente
      description: >
        Chi e' il chiamante e con quale credenziale (sessione o token
        personale, con i suoi scope). Non richiede scope: basta essere
        autenticati.
      responses:
        "200":
          description: Chiamante autenticato.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /auth/totp:
    get:
      operationId: getTotpStatus
      tags: [auth]
      x-mcp:
        expose: false
        name: totp_status_get
        destructive: false
      x-totp-enroll-exempt: always
      summary: Stato del secondo fattore TOTP dell'utente corrente
      description: >
        Solo sessione (i token personali non hanno secondo fattore).
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Stato del TOTP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /auth/totp/enroll:
    post:
      operationId: enrollTotp
      tags: [auth]
      x-mcp:
        expose: false
        name: totp_enroll
        destructive: false
      x-totp-enroll-exempt: always
      summary: Inizia l'attivazione del TOTP
      description: >
        Genera un segreto nuovo (cifrato nel database) e lo restituisce una
        sola volta, con l'URI `otpauth://` per il QR code. Il TOTP non e'
        attivo finche' `POST /auth/totp/verify` non conferma un codice;
        ripetere `enroll` prima della conferma sostituisce il segreto. Se il
        TOTP e' gia' attivo: 409 `already_enabled`. Account senza password
        (agent, solo OIDC): 409 `not_local`. Installazione senza chiavi
        TOTP: 503 `totp_unavailable`.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Segreto e URI di provisioning.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpEnrollment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /auth/totp/verify:
    post:
      operationId: verifyTotp
      tags: [auth]
      x-mcp:
        expose: false
        name: totp_verify
        destructive: false
      x-totp-enroll-exempt: always
      summary: Conferma l'attivazione del TOTP
      description: >
        Verifica un codice del segreto in attesa, attiva il TOTP e restituisce
        una sola volta i codici di recupero monouso. Codice sbagliato: 422
        `validation_failed`; nessuna attivazione in corso: 409 `not_pending`.
        I tentativi sbagliati passano dal limitatore del login.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeInput"
      responses:
        "200":
          description: TOTP attivo; codici di recupero.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpRecoveryCodes"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /auth/totp/disable:
    post:
      operationId: disableTotp
      tags: [auth]
      x-mcp:
        expose: false
        name: totp_disable
        destructive: true
      summary: Disattiva il TOTP
      description: >
        Chiede la password e un codice TOTP (o un codice di recupero). Se
        l'installazione impone il TOTP agli amministratori, un amministratore
        non puo' disattivarlo: 409 `totp_required`. Dati errati: 403
        `forbidden`. Revoca le altre sessioni.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpDisableInput"
      responses:
        "204":
          description: TOTP disattivato.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /auth/oidc/providers:
    get:
      operationId: listOidcProviders
      tags: [auth]
      x-mcp:
        expose: false
        name: oidc_providers_list
        destructive: false
      summary: Provider OIDC abilitati
      description: Elenco pubblico per la pagina di login. Nessun segreto.
      security: []
      responses:
        "200":
          description: Provider abilitati.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProviderList"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /auth/oidc/{provider}/start:
    parameters:
      - $ref: "#/components/parameters/OidcProviderParam"
    get:
      operationId: startOidcLogin
      tags: [auth]
      x-mcp:
        expose: false
        name: oidc_login_start
        destructive: false
      summary: Avvia il login OIDC
      description: >
        Redirect (302) all'authorization endpoint del provider (authorization
