                $ref: "#/components/schemas/VerifyCredentialResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/permissions/check:
    post:
      operationId: checkPermission
      tags: [internal]
      summary: Verifica un permesso su una risorsa
      description: >
        Usata da core e git per applicare i permessi: `allowed` e' vero se
        l'utente ha almeno il ruolo richiesto sulla risorsa (grant diretto,
        via team, amministratore; owner dell'organizzazione e proprietario
        del repo personale sono admin, una risorsa interna e' leggibile da
        ogni utente attivo: P1, P6, P3).
      security:
        - serviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckPermissionInput"
      responses:
        "200":
          description: Esito.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckPermissionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/permissions/user-access:
    post:
      operationId: getUserAccessSources
      tags: [internal]
      summary: Risorse raggiungibili da un utente, con ruolo e fonti
      description: >
        Per core (`getUserAccess`): per ogni risorsa con un grant o un
        attributo che riguarda l'utente, il ruolo effettivo e le fonti
        (stesse regole di `checkPermission`). Per l'amministratore di
        sistema `admin` e' vero e `items` e' vuoto (core elenca tutti i
        repo). Utente disattivato: nessun elemento. Utente inesistente: 404.
      security:
        - serviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadableResourcesInput"
      responses:
        "200":
          description: Risorse raggiungibili con le fonti.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccessSources"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/permissions/readable-resources:
    post:
      operationId: listReadableResources
      tags: [internal]
      summary: Risorse leggibili da un utente
      description: >
        Usata da core per filtrare l'elenco delle risorse: `resourceIds` sono
        le risorse su cui l'utente ha almeno read (grant diretto, via team o
        via owner dell'organizzazione, owner della risorsa o visibilita'
        interna: stesse regole di `checkPermission`). `all` e' vero solo per
        l'amministratore di sistema, e in quel caso `resourceIds` e' vuoto.
        Un utente inesistente o disattivato riceve `all` falso e nessuna
        risorsa.
      security:
        - serviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadableResourcesInput"
      responses:
        "200":
          description: Risorse leggibili.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadableResourcesResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/resources/{resourceId}/grants/creator:
    parameters:
      - name: resourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: grantResourceCreator
      tags: [internal]
      summary: Assegna il ruolo admin al creatore di una risorsa
      description: >
        Usata da core dopo la creazione di una risorsa: l'utente indicato
        riceve il grant admin (granted_by = lo stesso utente). Idempotente:
        se l'utente ha gia' un grant sulla risorsa lo porta ad admin e
        risponde 200.
      security:
        - serviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantResourceCreatorInput"
      responses:
        "200":
          description: Il grant dell'utente esisteva gia' ed e' ora admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Grant"
        "201":
          description: Grant creato.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Grant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/ssh-keys/{fingerprint}:
    parameters:
      - name: fingerprint
        in: path
        required: true
        description: Fingerprint `SHA256:...` (URL-encoded).
        schema:
          type: string
          pattern: "^SHA256:[A-Za-z0-9+/]{43}$"
    get:
      operationId: lookupSshKey
      tags: [internal]
      summary: Risolve un utente dal fingerprint di una chiave SSH
      description: Usata dal servizio git all'accesso SSH. Aggiorna `lastUsedAt`.
      security:
        - serviceAuth: []
      responses:
        "200":
          description: Chiave e utente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SshKeyLookup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/resources/{resourceId}/attributes:
    parameters:
      - name: resourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: setResourceAttributes
      tags: [internal]
      summary: Imposta owner e visibilita' di una risorsa (per core)
      description: >
        Servita da identity (D-C, M-03). Core la chiama alla creazione di un
        repo, prima di `grantResourceCreator`, e a ogni cambio di
        visibilita'. L'owner non cambia mai (R3). Idempotente. Una risorsa
        senza attributi si comporta come prima di M-03. Con attributi valgono
        P1 (owner dell'organizzazione: admin), P6 (proprietario del repo
        personale: admin) e P3 (interno: read a ogni utente attivo), sia in
        `checkPermission` sia in `listReadableResources`. 404 se l'owner non
        esiste, 409 se la risorsa ha gia' un altro owner.
      security:
        - serviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceAttributesInput"
      responses:
        "204":
          description: Attributi impostati.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/resources/{resourceId}:
    parameters:
      - name: resourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: purgeResourceAccess
      tags: [internal]
      summary: Toglie grant e attributi di una risorsa cancellata (per core)
      description: >
        Per core (M-03/F): dopo la cancellazione definitiva di un repo (R2)
        toglie tutti i grant (`resource_grants`) e gli attributi di owner e
        visibilita' della risorsa. Idempotente: 204 anche se non c'era niente
        da togliere.
      security:
        - serviceAuth: []
      responses:
        "204":
          description: Grant e attributi tolti.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/owners/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 39
    get:
      operationId: resolveOwner
      tags: [internal]
      summary: Risolve il nome di un utente o di un'organizzazione
      description: >
        Spazio di nomi unico (R1): restituisce tipo e id di chi si chiama
        cosi', 404 se il nome non esiste.
      security:
        - serviceAuth: []
      responses:
        "200":
          description: Owner trovato.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerRef"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/git/repos:
    post:
      operationId: gitCreateRepo
      tags: [git-internal]
      summary: Crea il repo su disco (per core)
      description: >
        Implementata a mano dal servizio git (non generata). Crea il bare
        repo e, se richiesto (R5), il primo commit su `defaultBranch`.
      security:
        - serviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitCreateRepoInput"
      responses:
        "201":
          description: Repo creato.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitRepoCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/git/repos/{repoId}:
    parameters:
      - $ref: "#/components/parameters/GitRepoIdParam"
    get:
      operationId: gitGetRepo
      tags: [git-internal]
      summary: Stato di un repo su disco
      security:
        - serviceAuth: []
      responses:
        "200":
          description: Stato del repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitRepoState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
    delete:
      operationId: gitDeleteRepo
      tags: [git-internal]
      summary: Cancella definitivamente un repo (solo dal cestino)
      description: Risponde 409 se il repo non e' nel cestino.
      security:
        - serviceAuth: []
      responses:
        "204":
          description: Repo cancellato.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/git/repos/{repoId}/trash:
    parameters:
      - $ref: "#/components/parameters/GitRepoIdParam"
    post:
      operationId: gitTrashRepo
      tags: [git-internal]
      summary: Sposta un repo nel cestino (R2)
      security:
        - serviceAuth: []
      responses:
        "204":
          description: Repo nel cestino.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/git/repos/{repoId}/restore:
    parameters:
      - $ref: "#/components/parameters/GitRepoIdParam"
    post:
      operationId: gitRestoreRepo
      tags: [git-internal]
      summary: Ripristina un repo dal cestino (R2)
      security:
        - serviceAuth: []
      responses:
        "204":
          description: Repo ripristinato.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/users/lookup-emails:
    post:
      operationId: lookupUsersByEmail
      tags: [internal]
      summary: Trova gli utenti GitStack dalle email dei commit
      description: >
        Per core (M-04): confronta le email, senza distinguere maiuscole, con
        `users.email` (unica su lower(email)). Massimo 100 email per
        chiamata; core la chiama una volta per pagina di storico, dettaglio o
        blame. Le email senza utente non compaiono nella risposta.
      security:
        - serviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LookupEmailsInput"
      responses:
        "200":
          description: Gli utenti trovati.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupEmailsResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/git/repos/{repoId}/tree:
    parameters:
      - $ref: "#/components/parameters/GitRepoIdParam"
    get:
      operationId: gitGetTree
      tags: [git-internal]
      summary: "Albero di una cartella con l'ultimo commit per voce (per core)"
      description: >
        Corrispondente interno di `getRepositoryTree`: parla solo per
        repoId e non conosce utenti ne' permessi. `ref` e' sempre esplicito
        (lo risolve core). Gli autori non portano `user`: lo aggiunge core.
        Voci della cartella `path` (radice se assente) a `ref`, con l'ultimo commit che ha toccato ciascuna (mockup 07). Al massimo 1 000 voci: oltre, `truncated` e' true. Ordine: cartelle, poi file, per nome. 404 se `path` non esiste o non e' una cartella.
      security:
        - serviceAuth: []
      parameters:
        - $ref: "#/components/parameters/GitRefParam"
        - $ref: "#/components/parameters/PathParam"
      responses:
        "200":
          description: Contenuto della cartella.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tree"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/git/repos/{repoId}/contents:
    parameters:
      - $ref: "#/components/parameters/GitRepoIdParam"
    get:
      operationId: gitGetFile
      tags: [git-internal]
      summary: "Contenuto di un file (per core)"
      description: >
        Corrispondente interno di `getRepositoryFile`: parla solo per
        repoId e non conosce utenti ne' permessi. `ref` e' sempre esplicito
        (lo risolve core). Gli autori non portano `user`: lo aggiunge core.
        Stesse regole B1 di `getRepositoryFile` per `kind`, `display`, `content`, `encoding`, `mimeType` e `truncated` (1 MB evidenziato, 5 MB testo semplice, immagini inline fino a 1 MB). 404 se `path` non esiste o non e' un file.
      security:
        - serviceAuth: []
      parameters:
        - $ref: "#/components/parameters/GitRefParam"
        - $ref: "#/components/parameters/FilePathParam"
      responses:
        "200":
          description: Il file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/git/repos/{repoId}/raw:
    parameters:
      - $ref: "#/components/parameters/GitRepoIdParam"
    get:
      operationId: gitGetRaw
      tags: [git-internal]
      summary: "Contenuto grezzo di un file (streaming) (per core)"
      description: >
        Corrispondente interno di `getRepositoryRaw`: parla solo per
        repoId e non conosce utenti ne' permessi. `ref` e' sempre esplicito
        (lo risolve core). Gli autori non portano `user`: lo aggiunge core.
        Byte del file `path` a `ref`, senza limite di dimensione, in streaming (nessun buffer in memoria), `Content-Length` quando noto. Le intestazioni di sicurezza della regola B3 le scrive questo servizio (non nginx, ne' core le riscrive): vedi `getRepositoryRaw`. 404 se `path` non esiste o non e' un file.
      security:
        - serviceAuth: []
      parameters:
        - $ref: "#/components/parameters/GitRefParam"
        - $ref: "#/components/parameters/FilePathParam"
      responses:
        "200":
          $ref: "#/components/responses/RawFile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/git/repos/{repoId}/branches:
    parameters:
      - $ref: "#/components/parameters/GitRepoIdParam"
    get:
      operationId: gitGetBranches
      tags: [git-internal]
      summary: "Branch del repo, con conteggi (per core)"
      description: >
        Corrispondente interno di `getRepositoryBranches`: parla solo per
        repoId e non conosce utenti ne' permessi. Gli autori non portano `user`: lo aggiunge core.
        Tutti i branch, con il branch principale (R4) per primo; `total` e' il conteggio (mockup 07: "4 branches").
      security:
        - serviceAuth: []
      responses:
        "200":
          description: Branch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/git/repos/{repoId}/tags:
    parameters:
      - $ref: "#/components/parameters/GitRepoIdParam"
    get:
      operationId: gitGetTags
      tags: [git-internal]
      summary: "Tag del repo, con conteggi (per core)"
      description: >
        Corrispondente interno di `getRepositoryTags`: parla solo per
        repoId e non conosce utenti ne' permessi. Gli autori non portano `user`: lo aggiunge core.
        Tutti i tag, dal piu' recente; `total` e' il conteggio (mockup 07: "7 tags").
      security:
        - serviceAuth: []
      responses:
        "200":
          description: Tag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/git/repos/{repoId}/commits:
    parameters:
      - $ref: "#/components/parameters/GitRepoIdParam"
    get:
      operationId: gitGetCommits
      tags: [git-internal]
      summary: "Storico dei commit, paginato (per core)"
      description: >
        Corrispondente interno di `getRepositoryCommits`: parla solo per
        repoId e non conosce utenti ne' permessi. `ref` e' sempre esplicito
        (lo risolve core). Gli autori non portano `user`: lo aggiunge core.
        Commit raggiungibili da `ref`, dal piu' recente (mockup 09). Filtri `author` (nome o email, senza distinguere maiuscole) e `path` (solo i commit che toccano quel percorso). Pagina di default 30, massimo 100. Ogni autore porta `user` se la sua email corrisponde a un utente GitStack, altrimenti null.
      security:
        - serviceAuth: []
      parameters:
        - $ref: "#/components/parameters/GitRefParam"
        - $ref: "#/components/parameters/CommitAuthorFilter"
        - $ref: "#/components/parameters/PathParam"
        - $ref: "#/components/parameters/CommitPageParam"
        - $ref: "#/components/parameters/CommitPerPageParam"
      responses:
        "200":
          description: Pagina di commit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/git/repos/{repoId}/commits/{sha}:
    parameters:
      - $ref: "#/components/parameters/GitRepoIdParam"
    get:
      operationId: gitGetCommit
      tags: [git-internal]
      summary: "Dettaglio di un commit con diff per file (per core)"
      description: >
        Corrispondente interno di `getRepositoryCommit`: parla solo per
        repoId e non conosce utenti ne' permessi. `ref` e' sempre esplicito
        (lo risolve core). Gli autori non portano `user`: lo aggiunge core.
        Messaggio, autore e diff per file (mockup 10). Limiti: al massimo 300 file e 20 000 righe di diff in totale, e 1 MB per file; oltre, il file o la risposta sono marcati `truncated` e il patch e' omesso o parziale. `sha` e' lo sha completo o un prefisso univoco di almeno 7 caratteri; 400 se non e' esadecimale, 404 se non esiste.
      security:
        - serviceAuth: []
      parameters:
        - $ref: "#/components/parameters/CommitShaParam"
        - $ref: "#/components/parameters/IgnoreWhitespaceParam"
      responses:
        "200":
          description: Il commit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/git/repos/{repoId}/commits/{sha}/diff:
    parameters:
      - $ref: "#/components/parameters/GitRepoIdParam"
    get:
      operationId: gitGetCommitDiff
      tags: [git-internal]
      summary: "Diff completo di un commit come .diff, in streaming (per core)"
      description: >
        B6: `git diff --binary` del commit contro il primo genitore (contro
        l'albero vuoto per il commit iniziale), accettato da `git apply`.
        Content-Type `text/plain`, Content-Disposition `attachment` con nome
        `<sha12>.diff`, `X-Content-Type-Options: nosniff`. Nessun limite di
        righe e nessun buffer in memoria. Gli errori (400, 404) escono come
        JSON prima del primo byte; un errore a meta' interrompe la risposta.
      security:
        - serviceAuth: []
      parameters:
        - $ref: "#/components/parameters/CommitShaParam"
        - $ref: "#/components/parameters/IgnoreWhitespaceParam"
      responses:
        "200":
          description: Il diff.
          content:
            text/plain:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/git/repos/{repoId}/commits/{sha}/patch:
    parameters:
      - $ref: "#/components/parameters/GitRepoIdParam"
    get:
      operationId: gitGetCommitPatch
      tags: [git-internal]
      summary: "Patch di un commit in formato git format-patch, in streaming (per core)"
      description: >
        B6: come `gitGetCommitDiff`, ma con messaggio e autore in forma di
        email (`git format-patch --stdout`; per un commit di merge, contro il
        primo genitore). Nome `<sha12>.patch`. Accettato da `git apply` e
        `git am`.
      security:
        - serviceAuth: []
      parameters:
        - $ref: "#/components/parameters/CommitShaParam"
        - $ref: "#/components/parameters/IgnoreWhitespaceParam"
      responses:
        "200":
          description: La patch.
          content:
            text/plain:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/git/repos/{repoId}/blame:
    parameters:
      - $ref: "#/components/parameters/GitRepoIdParam"
    get:
      operationId: gitGetBlame
      tags: [git-internal]
      summary: "Blame di un file (per core)"
      description: >
        Corrispondente interno di `getRepositoryBlame`: parla solo per
        repoId e non conosce utenti ne' permessi. `ref` e' sempre esplicito
        (lo risolve core). Gli autori non portano `user`: lo aggiunge core.
        Per ogni intervallo di righe di `path` a `ref`, il commit che l'ha scritto per ultimo (mockup 08, scheda Blame). Un file binario o oltre 1 MB risponde 400 `blame_unavailable`.
      security:
        - serviceAuth: []
      parameters:
        - $ref: "#/components/parameters/GitRefParam"
        - $ref: "#/components/parameters/FilePathParam"
      responses:
        "200":
          description: Blame del file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Blame"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/git/repos/{repoId}/archive:
    parameters:
      - $ref: "#/components/parameters/GitRepoIdParam"
    get:
      operationId: gitGetArchive
      tags: [git-internal]
      summary: "Archivio ZIP o tar.gz di un ref (streaming) (per core)"
      description: >
        Corrispondente interno di `getRepositoryArchive`: parla solo per
        repoId e non conosce utenti ne' permessi. `ref` e' sempre esplicito
        (lo risolve core). Gli autori non portano `user`: lo aggiunge core.
        Archivio dell'albero a `ref`, in ZIP (default) o tar.gz secondo `format`, in streaming (nessun buffer in memoria). Il nome del file (`Content-Disposition`) lo mette il servizio con il nome del repo che gli passa core in `name`; stesse intestazioni di sicurezza di `getRepositoryRaw`.
      security:
        - serviceAuth: []
      parameters:
        - $ref: "#/components/parameters/GitRefParam"
        - $ref: "#/components/parameters/ArchiveFormatParam"
        - name: name
          in: query
          required: true
          description: Nome del repo, per comporre il nome del file dell'archivio.
          schema:
            $ref: "#/components/schemas/RepoName"
      responses:
        "200":
          $ref: "#/components/responses/Archive"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/git/repos/{repoId}/languages:
    parameters:
      - $ref: "#/components/parameters/GitRepoIdParam"
    get:
      operationId: gitGetLanguages
      tags: [git-internal]
      summary: "Lingue del repo (per core)"
      description: >
        Corrispondente interno di `getRepositoryLanguages`: parla solo per
        repoId e non conosce utenti ne' permessi. `ref` e' sempre esplicito
        (lo risolve core). Gli autori non portano `user`: lo aggiunge core.
        Byte per linguaggio al branch principale o a `ref`, con la percentuale sul totale, in ordine decrescente (pannello About, mockup 07). Un repo vuoto risponde lista vuota.
      security:
        - serviceAuth: []
      parameters:
        - $ref: "#/components/parameters/GitRefParam"
      responses:
        "200":
          description: Lingue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Languages"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/git/repos/{repoId}/readme:
    parameters:
      - $ref: "#/components/parameters/GitRepoIdParam"
    get:
      operationId: gitGetReadme
      tags: [git-internal]
      summary: "README di una cartella (per core)"
      description: >
        Corrispondente interno di `getRepositoryReadme`: parla solo per
        repoId e non conosce utenti ne' permessi. `ref` e' sempre esplicito
        (lo risolve core). Gli autori non portano `user`: lo aggiunge core.
        Il README della cartella `path` (radice se assente), cercato come `README.md`, `README`, `README.txt` (senza distinguere maiuscole), con le stesse regole B1 di `contents`. 404 se non c'e'.
      security:
        - serviceAuth: []
      parameters:
        - $ref: "#/components/parameters/GitRefParam"
        - $ref: "#/components/parameters/PathParam"
      responses:
        "200":
          description: Il README.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/git/repos/{repoId}/files:
    parameters:
      - $ref: "#/components/parameters/GitRepoIdParam"
    get:
      operationId: gitListFiles
      tags: [git-internal]
      summary: "Percorsi di tutti i file di un ref (per core)"
      description: >
        Corrispondente interno di `listRepositoryFiles`: parla solo per
        repoId e non conosce utenti ne' permessi. `ref` e' sempre esplicito
        (lo risolve core). Stesse regole B5 (al massimo 50 000 percorsi, `truncated`).
      security:
        - serviceAuth: []
      parameters:
        - $ref: "#/components/parameters/GitRefParam"
      responses:
        "200":
          description: Percorsi dei file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/git/repos/{repoId}/search:
    parameters:
      - $ref: "#/components/parameters/GitRepoIdParam"
    get:
      operationId: gitSearchCode
      tags: [git-internal]
      summary: "Cerca un testo nel codice di un ref (per core)"
      description: >
        Corrispondente interno di `searchRepositoryCode`: parla solo per
        repoId e non conosce utenti ne' permessi. `ref` e' sempre esplicito
        (lo risolve core). Stesse regole B5 (100 risultati, 10 secondi, senza indice).
      security:
        - serviceAuth: []
      parameters:
        - $ref: "#/components/parameters/CodeSearchQueryParam"
        - $ref: "#/components/parameters/GitRefParam"
      responses:
        "200":
          description: Risultati.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeSearchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
      description: >
        Token personale `gst_...` verificato dal `gateway` tramite identity.
        Stesso schema per CLI `gs`, skills e agenti. Ogni operazione di
        identity indica gli scope richiesti in `x-required-scopes`; le
        sessioni web (cookie) non hanno scope.
    sessionCookie:
      type: apiKey
      in: cookie
      name: gst_session
      description: >
        Sessione web creata da `POST /auth/login` o dal login OIDC. Valore
        opaco; identity ne conserva solo l'hash.
    serviceAuth:
      type: http
      scheme: bearer
      description: >
        Solo interfaccia interna: segreto condiviso di servizio fra gateway,
        core, git e identity. Non e' un token utente.

  parameters:
    ResourceIdParam:
      name: resourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Identificatore della risorsa.
    RepoOwnerFilter:
      name: owner
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Name"
      description: Filtra per nome dell'utente o dell'organizzazione proprietaria.
    RepoOwnerParam:
      name: owner
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Name"
      description: Nome dell'utente o dell'organizzazione proprietaria (R1).
    RepoNameParam:
      name: repo
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/RepoName"
      description: Nome del repo.
    GitRepoIdParam:
      name: repoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Id del repo (la risorsa `type=repo` in core).
    ResourceTypeFilter:
      name: type
      in: query
      required: false
      schema:
        type: string
        minLength: 1
      description: Filtra per tipo di risorsa (es. `repo`).
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPageParam:
      name: perPage
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UsernameParam:
      name: username
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Name"
    OrgParam:
      name: org
      in: path
      required: true
      description: Nome (slug) dell'organizzazione.
      schema:
        $ref: "#/components/schemas/Name"
    TeamParam:
      name: team
      in: path
      required: true
      description: Nome (slug) del team, unico dentro l'organizzazione.
      schema:
        $ref: "#/components/schemas/Name"
    TokenIdParam:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SshKeyIdParam:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GrantIdParam:
      name: grantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OidcProviderParam:
      name: provider
      in: path
      required: true
      description: Slug del provider OIDC.
      schema:
        $ref: "#/components/schemas/Name"
    RefParam:
      name: ref
      in: query
      required: false
      description: >
        Branch, tag o sha (completo o prefisso di almeno 7 caratteri). Se
        manca vale il branch principale del repo (R4). Un nome non valido
        (vuoto, con `..`, spazi, caratteri di controllo o oltre 255
        caratteri) risponde 400 `invalid_ref`; uno valido ma inesistente 404
        `ref_not_found`. Se un nome e' sia branch sia tag vince il branch.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    GitRefParam:
      name: ref
      in: query
      required: true
      description: >
        Branch, tag o sha, sempre esplicito: core sostituisce il branch
        principale prima di chiamare il servizio git. Stesse regole di
        `RefParam` per 400 `invalid_ref` e 404 `ref_not_found`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    PathParam:
      name: path
      in: query
      required: false
      description: >
        Percorso relativo alla radice del repo, con `/` come separatore, senza
        `/` iniziale e senza segmenti `.` o `..` (400 `invalid_path`). Assente
        o vuoto: la radice.
      schema:
        type: string
        maxLength: 4096
    FilePathParam:
      name: path
      in: query
      required: true
      description: Percorso del file (stesse regole di `PathParam`, non vuoto).
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    CommitAuthorFilter:
      name: author
      in: query
      required: false
      description: Solo i commit il cui autore ha questo nome o email (senza distinguere maiuscole).
      schema:
        type: string
        minLength: 1
        maxLength: 255
    CommitPageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    CommitPerPageParam:
      name: perPage
      in: query
      required: false
      description: Commit per pagina (default 30, massimo 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    ArchiveFormatParam:
      name: format
      in: query
      required: false
      description: Formato dell'archivio (default `zip`).
      schema:
        type: string
        enum: [zip, tar.gz]
        default: zip
    PatchFormatParam:
      name: format
      in: query
      required: false
      description: >
        `patch` (default): formato mbox di `git format-patch` con autore,
        data e messaggio, scaricato come `.patch`; `diff`: solo il diff
        unificato, scaricato come `.diff`.
      schema:
        type: string
        enum: [diff, patch]
        default: patch
    IgnoreWhitespaceParam:
      name: ignoreWhitespace
      in: query
      required: false
      description: "B6, «ignora spazi»: diff calcolato con `git diff -w`. Default false."
      schema:
        type: boolean
        default: false
    DiffFilePathParam:
      name: path
      in: query
      required: false
      description: >
        Se presente, `files` porta solo questo file (core filtra la risposta
        del servizio git). Con `listOnly` il patch non c'e': per il diff
        intero si usa `getRepositoryCommitPatch`. 404 se il file non e' nel
        commit.
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    RefAndPathParam:
      name: refAndPath
      in: path
      required: true
      description: >
        Coda del percorso: `<ref>/<percorso del file>`, su piu' segmenti.
        Un ref puo' contenere `/`: core prende il prefisso piu' lungo che e'
        il nome di un branch, altrimenti di un tag, altrimenti interpreta il
        primo segmento come sha (completo o prefisso di almeno 7 caratteri);
        il resto e' il percorso (stesse regole di `PathParam`, non vuoto).
        Se un nome e' sia branch sia tag vince il branch.
      schema:
        type: string
        minLength: 3
        maxLength: 4352
    CodeSearchQueryParam:
      name: q
      in: query
      required: true
      description: Testo da cercare (sottostringa letterale, senza distinguere maiuscole), da 2 a 256 caratteri.
      schema:
        type: string
        minLength: 2
        maxLength: 256
    CommitShaParam:
      name: sha
      in: path
      required: true
      description: Sha del commit, completo o prefisso univoco di almeno 7 caratteri esadecimali.
      schema:
        type: string
        pattern: "^[0-9a-f]{7,64}$"
        minLength: 7
        maxLength: 64
    IssueNumberParam:
      name: number
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      description: Numero `#n` della issue nel repo (I1).
    IssueCommentIdParam:
      name: commentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Id del commento.
    IssueAttachmentIdParam:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Id dell'allegato.
    LabelNameParam:
      name: name
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 50
      description: >
        Nome dell'etichetta, codificato come componente di percorso (puo'
        contenere spazi, es. `good first issue`).
    MilestoneNumberParam:
      name: milestoneNumber
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      description: Numero della milestone nel repo (indipendente da quello delle issues).
    IssueQueryParam:
      name: q
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
      description: >
        Ricerca con la sintassi di I10: `is:open|closed`, `reason:completed|not_planned|duplicate`,
        `label:"nome"`, `assignee:utente|@me|@agents`, `author:`, `milestone:`, `no:label|assignee|milestone`,
        `repo:owner/nome`, `org:`, piu' testo libero.
    IssueStateFilter:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum: [open, closed, all]
        default: open
    IssueReasonFilter:
      name: reason
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/IssueCloseReason"
    IssueLabelsFilter:
      name: labels
      in: query
      required: false
      schema:
        type: string
      description: Nomi di etichette separati da virgola; la issue le ha tutte.
    IssueAssigneeFilter:
      name: assignee
      in: query
      required: false
      schema:
        type: string
      description: Nome utente, `@me`, `@agents` (assegnata a un agente) o `none`.
    IssueAuthorFilter:
      name: author
      in: query
      required: false
      schema:
        type: string
    IssueMilestoneFilter:
      name: milestone
      in: query
      required: false
      schema:
        type: string
      description: Numero della milestone, o `none`.
    IssueSortParam:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [created, updated, comments, relevance]
        default: created
      description: >
        Ordinamento decrescente; `relevance` solo con testo libero in `q`
        (altrimenti 422).
    MilestoneStateFilter:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum: [open, closed, all]
        default: open

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          description: Versione del contratto API in esecuzione (`info.version`).

    Resource:
      type: object
      description: >
        Risorsa generica (D15): oggi usata dalla prova end-to-end, in futuro
        anche per repository, applicazioni e database, senza cambiare forma.
      additionalProperties: false
      required: [id, type, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        type:
          type: string
          minLength: 1
          example: repo
          description: "Tipo di risorsa, aperto: non un enum fisso (D15)."
        name:
          type: string
          minLength: 1
          maxLength: 255
        attributes:
          type: object
          description: Attributi specifici del tipo di risorsa, a forma libera.
          additionalProperties: true
          default: {}
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    CreateResourceInput:
      type: object
      additionalProperties: false
      required: [type, name]
      properties:
        type:
          type: string
          minLength: 1
          example: repo
        name:
          type: string
          minLength: 1
          maxLength: 255
        attributes:
          type: object
          additionalProperties: true

    UpdateResourceInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        attributes:
          type: object
          additionalProperties: true

    ResourceList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Resource"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    Error:
      type: object
      description: >
        Formato unico degli errori per tutta l'API pubblica. Codici comuni per
        stato: 400 `bad_request`; 401 `unauthenticated`, `invalid_credentials`;
        403 `forbidden`, `insufficient_scope`, `password_change_required`; 429 `too_many_attempts`; 404 `not_found`; 409 `conflict`
        e varianti specifiche (`already_exists`, `last_admin`, `last_owner`,
        `ssh_key_in_use`, `oidc_identity_unlinked`); 422 `validation_failed`
        (`details.fields`). Le risposte 401 non distinguono mai "utente
        inesistente" da "password errata".
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: Codice stabile leggibile da macchina (es. `not_found`).
              example: not_found
            message:
              type: string
              description: Messaggio leggibile da persone, non contrattuale.
            details:
              type: object
              additionalProperties: true
              description: Dettagli opzionali specifici dell'errore.
    Name:
      type: string
      description: >
        Nome breve in minuscolo (username, organizzazione, team, provider):
        lettere minuscole, cifre e trattini, 1-39 caratteri, inizia e finisce
        con un carattere alfanumerico.
      pattern: "^[a-z0-9]([a-z0-9-]{0,37}[a-z0-9])?$"
      minLength: 1
      maxLength: 39
      example: alice

    TokenScope:
      type: string
      description: >
        Catalogo degli scope dei token personali (unico, condiviso da tutti i
        servizi). Le sessioni web non hanno scope: valgono i permessi
        dell'utente. `write:*` include `read:*` dello stesso ambito;
        `admin:org` include `write:org`.
      enum:
        - read:user
        - write:user
        - read:org
        - write:org
        - admin:org
        - read:resource
        - write:resource

    ResourceRole:
      type: string
      description: Ruolo su una risorsa, in ordine crescente di potere.
      enum: [read, write, admin]

    LoginInput:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 254
          description: Username oppure email.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
          writeOnly: true

    User:
      type: object
      description: >
        Profilo utente. `email`, `isAdmin`, `isActive`, `createdAt` sono
        presenti solo per l'utente stesso e per gli amministratori.
      additionalProperties: false
      required: [id, username, kind, displayName]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          $ref: "#/components/schemas/Name"
        kind:
          type: string
          enum: [human, agent]
        displayName:
          type: string
          maxLength: 128
        bio:
          type: string
          maxLength: 1024
        avatarUrl:
          type: string
          format: uri
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        isAdmin:
          type: boolean
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
          readOnly: true

    CreateUserInput:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username:
          $ref: "#/components/schemas/Name"
        kind:
          type: string
          enum: [human, agent]
          default: human
        email:
          type: string
          format: email
        displayName:
          type: string
          maxLength: 128
        password:
          type: string
          minLength: 12
          maxLength: 1024
          format: password
          writeOnly: true
          description: Assente per gli agenti (accedono solo con token) e per chi entra solo via OIDC.
        isAdmin:
          type: boolean
          default: false

    UpdateUserInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          maxLength: 128
        bio:
          type: string
          maxLength: 1024
        avatarUrl:
          type: string
          format: uri
          nullable: true
        email:
          type: string
          format: email
        isAdmin:
          type: boolean
          description: Solo amministratori.
        isActive:
          type: boolean
          description: Solo amministratori. Disattivare revoca le sessioni e i token.

    UserList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    ChangePasswordInput:
      type: object
      additionalProperties: false
      required: [newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          writeOnly: true
          maxLength: 1024
        newPassword:
          type: string
          minLength: 12
          maxLength: 1024
          format: password
          writeOnly: true

    CurrentSession:
      type: object
      additionalProperties: false
      required: [user, authMethod, mustChangePassword]
      properties:
        user:
          $ref: "#/components/schemas/User"
        authMethod:
          type: string
          enum: [password, oidc, token]
          description: Come e' stato autenticato il chiamante.
        mustChangePassword:
          type: boolean
          description: >
            Vero per l'amministratore creato al primo avvio finche' non cambia
            la password iniziale. Finche' e' vero ogni chiamata autenticata
            risponde 403 `password_change_required`, tranne `GET
            /auth/session`, `POST /auth/logout` e `PUT
            /users/{username}/password` (solo sulla propria utenza).
        scopes:
          type: array
          description: Solo per `authMethod` = `token`.
          items:
            $ref: "#/components/schemas/TokenScope"
        expiresAt:
          type: string
          format: date-time
          nullable: true

    OidcProvider:
      type: object
      additionalProperties: false
      required: [slug, displayName]
      properties:
        slug:
          $ref: "#/components/schemas/Name"
        displayName:
          type: string

    OidcProviderList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OidcProvider"

    Token:
      type: object
      description: Token personale, senza il valore (che non e' recuperabile).
      additionalProperties: false
      required: [id, name, scopes, hint, createdAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 64
        scopes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TokenScope"
        hint:
          type: string
          minLength: 4
          maxLength: 4
          description: Ultimi 4 caratteri del token, per riconoscerlo.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true

    CreateTokenInput:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TokenScope"
        expiresAt:
          type: string
          format: date-time
          description: >
            Obbligatoria: la scadenza deve essere nel futuro e non oltre il
            massimo configurato dall'installazione (default 365 giorni), altrimenti 422.

    CreatedToken:
      description: Il token appena creato; `token` compare solo in questa risposta.
      allOf:
        - $ref: "#/components/schemas/Token"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              pattern: "^gst_[A-Za-z0-9_-]{32,}$"
              description: Valore in chiaro, formato `gst_<casuale>`. Non viene salvato.

    TokenList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Token"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    SshKey:
      type: object
      additionalProperties: false
      required: [id, title, keyType, fingerprint, createdAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          minLength: 1
          maxLength: 64
        keyType:
          type: string
          example: ssh-ed25519
        fingerprint:
          type: string
          pattern: "^SHA256:[A-Za-z0-9+/]{43}$"
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true

    AddSshKeyInput:
      type: object
