  /repos/{owner}/{repo}/pulls/{number}/merge:
    parameters:
      - $ref: "#/components/parameters/RepoOwnerParam"
      - $ref: "#/components/parameters/RepoNameParam"
      - $ref: "#/components/parameters/PullNumberParam"
    post:
      operationId: mergePullRequest
      tags: [pulls]
      x-required-scopes: ["write:resource"]
      x-mcp:
        expose: true
        name: pr_merge
        destructive: true
      summary: Unisce la Pull Request nel branch di destinazione
      description: >
        Serve `write`, agenti compresi (PR3), nel rispetto di PR4 e PR9. `method` e' `merge` (merge commit) o
        `squash`, fra quelli ammessi dal repo; il rebase non esiste. Rifiuta con 409: `draft`, `not_open`,
        `conflicts` (PR7), `approvals_required` e `changes_requested` (PR4: contano solo le approvazioni di persone
        con `write` date sull'ultimo commit), `status_required` (PR9), `method_not_allowed`, `head_changed` (se
        `expectedHeadSha` non e' piu' la punta). `getPullRequestMergeability` anticipa tutti questi motivi. Dopo il
        merge sul branch principale le issues collegate dalle parole chiave si chiudono come *completate* (PR8),
        con qualunque metodo. `deleteBranch` elimina il branch di origine subito dopo (PR3), come
        `deletePullRequestBranch`. L'unione e' definitiva. Un repo archiviato rifiuta ogni modifica con 409 `archived` (R10).
