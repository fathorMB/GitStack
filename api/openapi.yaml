  # ---------------------------------------------------------------------
  # Pull Request, review, stati dei commit e impostazioni «Branches & merge»
  # (v1.1, regole PR1-PR12; GIT-258). Servite da core. Il contratto fissa le
  # forme, l'implementazione arriva con gli item a valle (501 nel frattempo).
  # Estensione `x-mcp` su ogni operazione: vedi api/README.md (M2, M3).
  # ---------------------------------------------------------------------
  /repos/{owner}/{repo}/pulls:
    parameters:
      - $ref: "#/components/parameters/RepoOwnerParam"
      - $ref: "#/components/parameters/RepoNameParam"
    get:
      operationId: listPullRequests
      tags: [pulls]
      x-required-scopes: ["read:resource"]
      x-mcp:
        expose: true
        name: pr_list
        destructive: false
      summary: Elenca e cerca le Pull Request del repo
      description: >
        Chi puo' leggere il repo legge le sue PR. Il numero `#n` e' quello condiviso con le issues (I1).
        `q` usa la sintassi di I10 estesa da PR12: `is:open|closed|merged|draft`,
        `review:required|approved|changes-requested`, `author:` e `assignee:` (utente, `@me`, `@agents`; per una PR
        l'assegnatario e' un revisore richiesto), `no:assignee`, piu' testo libero; `is:pr` e' implicito.
        Non servono `repo:` e `org:` (il repo e' questo; per cercare altrove `searchPullRequests`). I filtri espliciti si sommano a quelli di `q`. Paginazione come
        `GET /repos`. Un repo che l'utente non puo' leggere, eliminato o inesistente risponde 404 (non 403), per non rivelarne l'esistenza.
      parameters:
        - $ref: "#/components/parameters/PullQueryParam"
        - $ref: "#/components/parameters/PullStateFilter"
        - $ref: "#/components/parameters/PullHeadFilter"
        - $ref: "#/components/parameters/PullBaseFilter"
        - $ref: "#/components/parameters/PullSortParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
      responses:
        "200":
          description: Pagina di Pull Request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullRequestList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/UnexpectedError"
    post:
      operationId: createPullRequest
      tags: [pulls]
      x-required-scopes: ["write:resource"]
      x-mcp:
        expose: true
        name: pr_create
        destructive: false
      summary: Apre una Pull Request fra due branch del repo
      description: >
        Serve `write` sul repo (PR1); chi ha solo `read` propone con una issue (403). Origine e destinazione
        sono due branch dello stesso repo (niente fork): branch uguali, inesistenti o senza commit di differenza
        rispondono 422 (`details.fields`). La destinazione, se manca, e' il branch principale. Esiste gia' una PR
        aperta con la stessa coppia di branch: 409 `already_exists`. `draft` apre la PR in bozza (PR6).
        I `reviewers` richiesti hanno almeno `read` (PR12, 422 altrimenti) e sono ignorati per una bozza. Il numero
        viene dal contatore del repo condiviso con le issues (I1). Le parole chiave di C2 nel testo (`fixes #n`)
        chiudono la issue al merge (PR8). Un repo archiviato rifiuta ogni modifica con 409 `archived` (R10); un
        repo in mirror in pull (sola lettura) risponde 409 `read_only_mirror`. Testo oltre il limite: 413
        (`body_too_large`). Un repo che l'utente non puo' leggere, eliminato o inesistente risponde 404 (non 403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePullRequestInput"
      responses:
        "201":
          description: Pull Request creata.
          headers:
            Location:
              description: URL della risorsa creata.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /repos/{owner}/{repo}/pulls/{number}:
    parameters:
      - $ref: "#/components/parameters/RepoOwnerParam"
      - $ref: "#/components/parameters/RepoNameParam"
      - $ref: "#/components/parameters/PullNumberParam"
    get:
      operationId: getPullRequest
      tags: [pulls]
      x-required-scopes: ["read:resource"]
      x-mcp:
        expose: true
        name: pr_view
        destructive: false
      summary: Legge una Pull Request per numero
      description: >
        Chi puo' leggere il repo legge la PR. Un numero che non e' una PR (per esempio una issue) risponde 404.
        Porta lo stato (`open`, `closed`, `merged`, PR6), la bozza, i revisori richiesti, la decisione di review,
        le approvazioni valide contro quelle richieste (PR2, PR4) e lo stato dei commit sull'ultimo commit del
        branch di origine (PR9). Per i conflitti e i blocchi al merge c'e' `getPullRequestMergeability`.
        Un repo che l'utente non puo' leggere, eliminato o inesistente risponde 404 (non 403), per non rivelarne l'esistenza.
      responses:
