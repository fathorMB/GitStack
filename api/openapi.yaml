      properties:
        title:
          type: string
          minLength: 1
          maxLength: 64
        publicKey:
          type: string
          maxLength: 8192
          example: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... alice@laptop"
          description: Riga in formato `authorized_keys` (tipo, base64, commento facoltativo).

    SshKeyList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SshKey"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    SshKeyLookup:
      type: object
      additionalProperties: false
      required: [key, user]
      properties:
        key:
          $ref: "#/components/schemas/SshKey"
        user:
          $ref: "#/components/schemas/User"

    Organization:
      type: object
      additionalProperties: false
