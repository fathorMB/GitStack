      description: >
        Solo l'amministratore dell'installazione (H9, H11): lo scope da solo non basta, gli altri ricevono
        403 `forbidden`. Toglie la quota propria dell'owner: valgono i default dell'istanza.
      responses:
        "204": {description: Quota riportata al default.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /admin/apps/settings:
    get:
      operationId: getAdminAppsSettings
      tags: [apps]
      x-required-scopes: ["write:resource"]
      x-mcp:
        expose: false
        name: admin_apps_settings_view
        destructive: false
      summary: "Legge le impostazioni d'istanza delle app (solo amministratore)"
      description: >
        Solo l'amministratore dell'installazione (H9, H11): lo scope da solo non basta, gli altri ricevono
        403 `forbidden`. Dominio delle app (scelto all'installazione, H2), app pubbliche si/no (H1), solo
        immagini firmate (H10), regola restricted (H9), massimo per app e conservazione dei log (H11, H12).
      responses:
        "200": {description: "Impostazioni.", content: {application/json: {schema: {$ref: "#/components/schemas/AppsInstanceSettings"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    put:
      operationId: updateAdminAppsSettings
      tags: [apps]
      x-required-scopes: ["write:resource"]
      x-mcp:
        expose: false
        name: admin_apps_settings_update
        destructive: true
      summary: "Modifica le impostazioni d'istanza delle app (solo amministratore)"
      description: >
        Solo l'amministratore dell'installazione (H9, H11): lo scope da solo non basta, gli altri ricevono
        403 `forbidden`. Sostituisce tutti i valori modificabili. Il dominio delle app non si cambia da qui
        (installazione). Non ferma e non riavvia le app gia' in esecuzione: `restricted` e
        `signedImagesOnly` valgono dal deploy successivo; le app che non li rispettano compaiono in `GET
        /admin/apps`. 422 se un massimo e' sotto quanto un'app usa gia'.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AppsInstanceSettingsInput"}}}}
      responses:
        "200": {description: "Impostazioni aggiornate.", content: {application/json: {schema: {$ref: "#/components/schemas/AppsInstanceSettings"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
  /admin/apps/egress:
    get:
      operationId: getAdminAppsEgress
      tags: [apps]
      x-required-scopes: ["write:resource"]
      x-mcp:
        expose: false
        name: admin_apps_egress_view
        destructive: false
      summary: "Legge le destinazioni private aperte all'uscita delle app (solo amministratore)"
      description: >
        Solo l'amministratore dell'installazione (H16): lo scope da solo non basta, gli altri ricevono
        403 `forbidden`. Internet e' aperto alle app; la rete privata (RFC 1918, ULA, CGNAT) e' chiusa e si
        apre solo per destinazioni precise (`db.azienda.lan:5432`), con le stesse regole di webhook e mirror
        (pkg/egress, C8). Loopback, link-local, indirizzi del cluster e del nodo e porte di Kubernetes non
        si aprono mai.
      responses:
        "200": {description: "Destinazioni aperte.", content: {application/json: {schema: {$ref: "#/components/schemas/AppsEgressSettings"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    put:
      operationId: updateAdminAppsEgress
      tags: [apps]
      x-required-scopes: ["write:resource"]
      x-mcp:
        expose: false
        name: admin_apps_egress_update
        destructive: true
      summary: "Modifica le destinazioni private aperte all'uscita delle app (solo amministratore)"
      description: >
        Solo l'amministratore dell'installazione (H16): lo scope da solo non basta, gli altri ricevono
        403 `forbidden`. Sostituisce l'elenco intero. Ogni voce e' `host` (IP o nome DNS) e `port`; il nome
        si risolve ora e ogni indirizzo deve passare le regole di fondo, altrimenti 422 `destination_blocked`
        (o `destination_unresolved` se il nome non si risolve). La policy di rete delle app in esecuzione
        si riapplica subito. Un nome si risolve a ogni applicazione della policy (deploy o modifica), non
        di continuo. Una voce tolta non vale piu' nemmeno per le app con una restrizione propria.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AppsEgressSettingsInput"}}}}
      responses:
        "200": {description: "Destinazioni aggiornate.", content: {application/json: {schema: {$ref: "#/components/schemas/AppsEgressSettings"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
  /admin/apps/trusted-keys:
    get:
      operationId: listAdminAppTrustedKeys
      tags: [apps]
      x-required-scopes: ["write:resource"]
      x-mcp:
        expose: false
        name: admin_app_trusted_key_list
        destructive: false
      summary: "Elenca le chiavi cosign fidate (solo amministratore)"
      description: >
        Solo l'amministratore dell'installazione (H9, H11): lo scope da solo non basta, gli altri ricevono
        403 `forbidden`. La chiave della CI dell'istanza c'e' sempre e non si toglie (H10); le altre sono
        aggiunte dall'amministratore. Servono con la regola «solo immagini firmate».
      responses:
        "200": {description: "Chiavi fidate.", content: {application/json: {schema: {$ref: "#/components/schemas/AppTrustedKeyList"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: addAdminAppTrustedKey
      tags: [apps]
      x-required-scopes: ["write:resource"]
      x-mcp:
        expose: false
        name: admin_app_trusted_key_add
        destructive: true
      summary: "Aggiunge una chiave cosign fidata (solo amministratore)"
      description: >
        Solo l'amministratore dell'installazione (H9, H11): lo scope da solo non basta, gli altri ricevono
        403 `forbidden`. 422 `invalid_key` se non e' una chiave pubblica cosign valida; 409 se c'e' gia'
        (stessa impronta).
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AppTrustedKeyInput"}}}}
      responses:
        "201": {description: Chiave aggiunta., content: {application/json: {schema: {$ref: "#/components/schemas/AppTrustedKey"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/UnprocessableEntity"}
  /admin/apps/trusted-keys/{keyId}:
    parameters: [{$ref: "#/components/parameters/AppTrustedKeyIdParam"}]
    delete:
      operationId: deleteAdminAppTrustedKey
      tags: [apps]
      x-required-scopes: ["write:resource"]
      x-mcp:
        expose: false
        name: admin_app_trusted_key_delete
        destructive: true
      summary: "Toglie una chiave cosign fidata (solo amministratore)"
      description: >
        Solo l'amministratore dell'installazione (H9, H11): lo scope da solo non basta, gli altri ricevono
        403 `forbidden`. 409 `instance_key` per la chiave della CI dell'istanza. Le app gia' in esecuzione
        con immagini firmate da quella chiave non si fermano; i deploy successivi la rifiutano.
      responses:
        "204": {description: Chiave tolta.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
      description: >
        Token personale `gst_...` verificato dal `gateway` tramite identity.
        Stesso schema per CLI `gs`, skills e agenti. Ogni operazione di
        identity indica gli scope richiesti in `x-required-scopes`; le
        sessioni web (cookie) non hanno scope.
    sessionCookie:
      type: apiKey
      in: cookie
      name: gst_session
      description: >
        Sessione web creata da `POST /auth/login` o dal login OIDC. Valore
        opaco; identity ne conserva solo l'hash. In HTTPS il cookie si chiama
        `__Host-gst_session` (V3.4.4); il nome senza prefisso resta valido per
        le sessioni gia' aperte e su HTTP. Una richiesta con metodo non sicuro
        autenticata dal cookie e con `Origin` o `Sec-Fetch-Site` estranei
        risponde 403 `cross_site_request` (V4.2.2); con un token Bearer
        non si applica.
    serviceAuth:
      type: http
      scheme: bearer
      description: >
        Solo interfaccia interna: segreto condiviso di servizio fra gateway,
        core, git e identity. Non e' un token utente.

  parameters:
    ResourceIdParam:
      name: resourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Identificatore della risorsa.
    RepoOwnerFilter:
      name: owner
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Name"
      description: Filtra per nome dell'utente o dell'organizzazione proprietaria.
    RepoOwnerParam:
      name: owner
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Name"
      description: Nome dell'utente o dell'organizzazione proprietaria (R1).
    RepoNameParam:
      name: repo
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/RepoName"
      description: Nome del repo.
    GitRepoIdParam:
      name: repoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Id del repo (la risorsa `type=repo` in core).
    ResourceTypeFilter:
      name: type
      in: query
      required: false
      schema:
        type: string
        minLength: 1
      description: Filtra per tipo di risorsa (es. `repo`).
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPageParam:
      name: perPage
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UsernameParam:
      name: username
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Name"
    OrgParam:
      name: org
      in: path
      required: true
      description: Nome (slug) dell'organizzazione.
      schema:
        $ref: "#/components/schemas/Name"
    TeamParam:
      name: team
      in: path
      required: true
      description: Nome (slug) del team, unico dentro l'organizzazione.
      schema:
        $ref: "#/components/schemas/Name"
    TokenIdParam:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionIdParam:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SshKeyIdParam:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GrantIdParam:
      name: grantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OidcProviderParam:
      name: provider
      in: path
      required: true
      description: Slug del provider OIDC.
      schema:
        $ref: "#/components/schemas/Name"
    RefParam:
      name: ref
      in: query
      required: false
      description: >
        Branch, tag o sha (completo o prefisso di almeno 7 caratteri). Se
        manca vale il branch principale del repo (R4). Un nome non valido
        (vuoto, con `..`, spazi, caratteri di controllo o oltre 255
        caratteri) risponde 400 `invalid_ref`; uno valido ma inesistente 404
        `ref_not_found`. Se un nome e' sia branch sia tag vince il branch.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    GitRefParam:
      name: ref
      in: query
      required: true
      description: >
        Branch, tag o sha, sempre esplicito: core sostituisce il branch
        principale prima di chiamare il servizio git. Stesse regole di
        `RefParam` per 400 `invalid_ref` e 404 `ref_not_found`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    PathParam:
      name: path
      in: query
      required: false
      description: >
        Percorso relativo alla radice del repo, con `/` come separatore, senza
        `/` iniziale e senza segmenti `.` o `..` (400 `invalid_path`). Assente
        o vuoto: la radice.
      schema:
        type: string
        maxLength: 4096
    FilePathParam:
      name: path
      in: query
      required: true
      description: Percorso del file (stesse regole di `PathParam`, non vuoto).
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    CommitAuthorFilter:
      name: author
      in: query
      required: false
      description: Solo i commit il cui autore ha questo nome o email (senza distinguere maiuscole).
      schema:
        type: string
        minLength: 1
        maxLength: 255
    CommitPageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    CommitPerPageParam:
      name: perPage
      in: query
      required: false
      description: Commit per pagina (default 30, massimo 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    ArchiveFormatParam:
      name: format
      in: query
      required: false
      description: Formato dell'archivio (default `zip`).
      schema:
        type: string
        enum: [zip, tar.gz]
        default: zip
    PatchFormatParam:
      name: format
      in: query
      required: false
      description: >
        `patch` (default): formato mbox di `git format-patch` con autore,
        data e messaggio, scaricato come `.patch`; `diff`: solo il diff
        unificato, scaricato come `.diff`.
      schema:
        type: string
        enum: [diff, patch]
        default: patch
    IgnoreWhitespaceParam:
      name: ignoreWhitespace
      in: query
      required: false
      description: "B6, «ignora spazi»: diff calcolato con `git diff -w`. Default false."
      schema:
        type: boolean
        default: false
    DiffFilePathParam:
      name: path
      in: query
      required: false
      description: >
        Se presente, `files` porta solo questo file (core filtra la risposta
        del servizio git). Con `listOnly` il patch non c'e': per il diff
        intero si usa `getRepositoryCommitPatch`. 404 se il file non e' nel
        commit.
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    RefAndPathParam:
      name: refAndPath
      in: path
      required: true
      description: >
        Coda del percorso: `<ref>/<percorso del file>`, su piu' segmenti.
        Un ref puo' contenere `/`: core prende il prefisso piu' lungo che e'
        il nome di un branch, altrimenti di un tag, altrimenti interpreta il
        primo segmento come sha (completo o prefisso di almeno 7 caratteri);
        il resto e' il percorso (stesse regole di `PathParam`, non vuoto).
        Se un nome e' sia branch sia tag vince il branch.
      schema:
        type: string
        minLength: 3
        maxLength: 4352
    CodeSearchQueryParam:
      name: q
      in: query
      required: true
      description: Testo da cercare (sottostringa letterale, senza distinguere maiuscole), da 2 a 256 caratteri.
      schema:
        type: string
        minLength: 2
        maxLength: 256
    CommitShaParam:
      name: sha
      in: path
      required: true
      description: Sha del commit, completo o prefisso univoco di almeno 7 caratteri esadecimali.
      schema:
        type: string
        pattern: "^[0-9a-f]{7,64}$"
        minLength: 7
        maxLength: 64
    IssueNumberParam:
      name: number
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      description: Numero `#n` della issue nel repo (I1).
    IssueCommentIdParam:
      name: commentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Id del commento.
    IssueAttachmentIdParam:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Id dell'allegato.
    LabelNameParam:
      name: name
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 50
      description: >
        Nome dell'etichetta, codificato come componente di percorso (puo'
        contenere spazi, es. `good first issue`).
    MilestoneNumberParam:
      name: milestoneNumber
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      description: Numero della milestone nel repo (indipendente da quello delle issues).
    IssueQueryParam:
      name: q
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
      description: >
        Ricerca con la sintassi di I10: `is:open|closed`, `reason:completed|not_planned|duplicate`,
        `label:"nome"`, `assignee:utente|@me|@agents`, `author:`, `milestone:`, `no:label|assignee|milestone`,
        `repo:owner/nome`, `org:`, piu' testo libero.
    IssueStateFilter:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum: [open, closed, all]
        default: open
    IssueReasonFilter:
      name: reason
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/IssueCloseReason"
    IssueLabelsFilter:
      name: labels
      in: query
      required: false
      schema:
        type: string
      description: Nomi di etichette separati da virgola; la issue le ha tutte.
    IssueAssigneeFilter:
      name: assignee
      in: query
      required: false
      schema:
        type: string
      description: Nome utente, `@me`, `@agents` (assegnata a un agente) o `none`.
    IssueAuthorFilter:
      name: author
      in: query
      required: false
      schema:
        type: string
    IssueMilestoneFilter:
      name: milestone
      in: query
      required: false
      schema:
        type: string
      description: Numero della milestone, o `none`.
    IssueSortParam:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [created, updated, comments, relevance]
        default: created
      description: >
        Ordinamento decrescente; `relevance` solo con testo libero in `q`
        (altrimenti 422).
    MilestoneStateFilter:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum: [open, closed, all]
        default: open
    NotificationIdParam:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationReasonFilter:
      name: reason
      in: query
      required: false
      description: >
        Uno o piu' motivi (`NotificationReason`) separati da virgola, es. `assigned,mentioned`. Un motivo
        sconosciuto: 400.
      schema:
        type: string
        example: assigned,mentioned
    NotificationStateFilter:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum: [unread, read, archived, all]
        default: unread
    NotificationRepoFilter:
      name: repo
      in: query
      required: false
      description: "Solo le notifiche di un repo, `owner/repo`."
      schema:
        type: string
    MirrorIdParam:
      name: mirrorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebhookIdParam:
      name: hookId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebhookDeliveryIdParam:
      name: deliveryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PullNumberParam:
      name: number
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      description: Numero `#n` della Pull Request nel repo, condiviso con le issues (I1).
    PullCommentIdParam:
      name: commentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Id del commento della Pull Request.
    PullThreadIdParam:
      name: threadId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Id della conversazione sulle righe (e' l'id del suo primo commento).
    PullQueryParam:
      name: q
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
      description: >
        Ricerca con la sintassi di I10 estesa da PR12: `is:open|closed|merged`, `is:draft`,
        `review:required|approved|changes-requested`, `author:` e `assignee:` con utente, `@me` o `@agents`,
        `no:assignee`, piu' testo libero (titolo e testo).
    PullStateFilter:
      name: state
      in: query
      required: false
      schema:
        type: string
        enum: [open, closed, merged, all]
        default: open
      description: Stato (PR6). `closed` sono le PR chiuse senza merge, `merged` le unite.
    PullHeadFilter:
      name: head
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 255
      description: Filtra per branch di origine.
    PullBaseFilter:
      name: base
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 255
      description: Filtra per branch di destinazione.
    PullSortParam:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [created, updated, comments]
        default: created
      description: Ordine decrescente per data di apertura, ultimo aggiornamento o numero di commenti.
    ThreadResolvedFilter:
      name: resolved
      in: query
      required: false
      schema:
        type: boolean
      description: "`true` solo le conversazioni risolte, `false` solo quelle aperte; senza il parametro tutte."

    WorkflowParam:
      name: workflow
      in: path
      required: true
      schema: {type: string}
    RunIdParam:
      name: runId
      in: path
      required: true
      schema: {type: string, format: uuid}
    JobIdParam:
      name: jobId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ArtifactIdParam:
      name: artifactId
      in: path
      required: true
      schema: {type: string, format: uuid}
    CacheIdParam:
      name: cacheId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ActionsNameParam:
      name: name
      in: path
      required: true
      schema: {type: string, pattern: '^[A-Z_][A-Z0-9_]*$', maxLength: 100}
    AppDomainParam:
      name: domain
      in: path
      required: true
      schema: {$ref: "#/components/schemas/AppDomainName"}
      description: "Dominio proprio dell'app, in minuscolo."
    AppParam:
      name: app
      in: path
      required: true
      schema: {$ref: "#/components/schemas/AppName"}
      description: Nome dell'app dentro il repo (H5).
    AppVersionParam:
      name: version
      in: path
      required: true
      schema: {type: integer, minimum: 1}
      description: Numero della versione dell'app.
    AppEnvNameParam:
      name: name
      in: path
      required: true
      schema: {$ref: "#/components/schemas/AppEnvName"}
    AppVolumeParam:
      name: volume
      in: path
      required: true
      schema: {$ref: "#/components/schemas/AppVolumeName"}
      description: Nome del volume dell'app (H3).
    AppTrustedKeyIdParam:
      name: keyId
      in: path
      required: true
      schema: {type: string, format: uuid}
    RunnerIdParam:
      name: runnerId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ReleaseIdParam:
      name: releaseId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AssetIdParam:
      name: assetId
      in: path
      required: true
      schema: {type: string, format: uuid}

  schemas:
    WorkflowList:
      type: object
      additionalProperties: false
      required: [items]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/Workflow"}}}
    Workflow:
      type: object
      additionalProperties: false
      required: [id, path, name, state]
      properties:
        id: {type: string}
        path: {type: string, description: Percorso sotto `.gitstack/workflows/` o `.github/workflows/`.}
        name: {type: string}
        state: {type: string, enum: [active, disabled]}
    WorkflowDispatchInput:
      type: object
      additionalProperties: false
      required: [ref]
      properties:
        ref: {type: string}
        inputs: {type: object, additionalProperties: {type: string}}
    WorkflowRunList:
      type: object
      additionalProperties: false
      required: [items]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/WorkflowRun"}}}
    WorkflowRun:
      type: object
      additionalProperties: false
      required: [id, workflowId, status, event, ref, sha, createdAt, jobs]
      properties:
        id: {type: string, format: uuid}
        workflowId: {type: string}
        status: {type: string, description: "queued, in_progress, completed o cancelled"}
        conclusion: {type: string, nullable: true, description: "success, failure, cancelled, skipped o timed_out quando conclusa"}
        event: {type: string, enum: [push, pull_request, workflow_dispatch, schedule]}
        ref: {type: string}
        sha: {type: string}
        createdAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time, nullable: true}
        completedAt: {type: string, format: date-time, nullable: true}
        jobs: {type: array, items: {$ref: "#/components/schemas/WorkflowJob"}}
    WorkflowJob:
      type: object
      additionalProperties: false
      required: [id, name, status, runnerType, permissions]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        status: {type: string, description: "queued, in_progress, completed o cancelled"}
        conclusion: {type: string, nullable: true, description: "success, failure, cancelled, skipped o timed_out quando concluso"}
        runnerType: {type: string, enum: [internal_pod, external]}
        runnerName: {type: string, nullable: true}
        permissions: {$ref: "#/components/schemas/JobTokenPermissions"}
        startedAt: {type: string, format: date-time, nullable: true}
        completedAt: {type: string, format: date-time, nullable: true}
    ActionsCache:
      type: object
      additionalProperties: false
      required: [id, key, ref, sizeBytes, createdAt, lastUsedAt]
      properties:
        id: {type: string, format: uuid}
        key: {type: string}
        ref: {type: string}
        sizeBytes: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        lastUsedAt: {type: string, format: date-time}
    ActionsCacheList:
      type: object
      additionalProperties: false
      required: [items, usedBytes, quotaBytes]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/ActionsCache"}}
        usedBytes: {type: integer, format: int64}
        quotaBytes: {type: integer, format: int64, example: 10737418240, description: "Quota per repository: 10 GB (CI5)."}
    JobTokenPermissions:
      type: object
      additionalProperties: false
      description: >
        Permessi effettivi del token effimero del job (CI4). Ogni livello e' il minimo fra tre limiti: quello
        richiesto dal workflow (`permissions:`), quello consentito dal repository e quello di chi avvia
        l'esecuzione (l'attore di push, pull_request, workflow_dispatch o Riesegui). Un attore con soli permessi di
        lettura non ottiene mai `write` nel token, qualunque cosa chieda il workflow; per `schedule`, che non ha un
        attore, vale il limite del repository. Senza `permissions:` il default e' `read`. Il token non puo' mai
        eccedere l'attore e scade con il job.
      required: [contents, packages, actions]
      properties:
        cappedByActor: {type: boolean, description: "true se almeno un livello e' stato ridotto perche' l'attore ha meno permessi di quelli richiesti."}
        contents: {type: string, enum: [none, read, write]}
        packages: {type: string, enum: [none, read, write]}
        actions: {type: string, enum: [none, read, write]}
    ArtifactList:
      type: object
      additionalProperties: false
      required: [items]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/Artifact"}}}
    Artifact:
      type: object
      additionalProperties: false
      required: [id, name, sizeBytes, expiresAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        sizeBytes: {type: integer, format: int64}
        expiresAt: {type: string, format: date-time}
    ActionsVariableList:
      type: object
      additionalProperties: false
      required: [items]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/ActionsVariable"}}}
    ActionsVariable:
      type: object
      additionalProperties: false
      required: [name, value, updatedAt]
      properties: {name: {type: string, pattern: '^[A-Z_][A-Z0-9_]*$'}, value: {type: string}, updatedAt: {type: string, format: date-time}}
    ActionsVariableInput:
      type: object
      additionalProperties: false
      required: [name, value]
      properties: {name: {type: string, pattern: '^[A-Z_][A-Z0-9_]*$'}, value: {type: string}}
    ActionsJobTokenDefaults:
      type: object
      additionalProperties: false
      description: Permessi di default (tetto) del token del job di un repository (CI4). Mai oltre chi avvia l'esecuzione.
      required: [contents, packages, actions]
      properties:
        contents: {type: string, enum: [none, read, write]}
        packages: {type: string, enum: [none, read, write]}
        actions: {type: string, enum: [none, read, write]}
    ActionsPullMirrorSettings:
      type: object
      additionalProperties: false
      description: Impostazione CI3 di un repository in mirror in pull.
      required: [pullMirror, runOnPullMirror]
      properties:
        pullMirror: {type: boolean, description: "Il repo e' un mirror in pull attivo: solo allora l'impostazione ha effetto."}
        runOnPullMirror: {type: boolean, description: "I workflow girano sulle sincronizzazioni del mirror."}
        enabledBy: {type: string, nullable: true, description: "Nome utente di chi ha acceso la CI (autore delle esecuzioni); null se spenta."}
    ActionsPullMirrorSettingsInput:
      type: object
      additionalProperties: false
      required: [runOnPullMirror]
      properties:
        runOnPullMirror: {type: boolean}
    ActionsSecretList:
      type: object
      additionalProperties: false
      required: [items]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/ActionsSecret"}}}
    ActionsSecret:
      type: object
      additionalProperties: false
      required: [name, updatedAt]
      properties: {name: {type: string, pattern: '^[A-Z_][A-Z0-9_]*$'}, updatedAt: {type: string, format: date-time}}
    ActionsSecretInput:
      type: object
      additionalProperties: false
      required: [name, value]
      properties: {name: {type: string, pattern: '^[A-Z_][A-Z0-9_]*$'}, value: {type: string, writeOnly: true}}
    CiRunnerList:
      type: object
      additionalProperties: false
      required: [items]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/CiRunner"}}}
    CiRunner:
      type: object
      additionalProperties: false
      required: [id, name, labels, status]
      properties: {id: {type: string, format: uuid}, name: {type: string}, labels: {type: array, items: {type: string}}, status: {type: string, enum: [online, offline, busy]}}
    CiRunnerRegistrationToken:
      type: object
      additionalProperties: false
      required: [token, expiresAt]
      description: Restituito solo dalla risposta 201 di POST /admin/ci/runners/registration-token; nessuna GET lo espone. Il token in chiaro si vede una volta sola.
      properties: {token: {type: string}, expiresAt: {type: string, format: date-time}}
    CiQueue:
      type: object
      additionalProperties: false
      required: [queuedJobs, runningJobs, maxConcurrentJobs, resourceLimits]
      properties:
        queuedJobs: {type: integer}
        runningJobs: {type: integer}
        maxConcurrentJobs: {type: integer, minimum: 1, maximum: 3}
        avgQueueWaitSeconds: {type: integer, minimum: 0, description: "Attesa media in coda, in secondi, dei job partiti nelle ultime 24 ore (0 se nessuno)."}
        logBytes: {type: integer, format: int64, minimum: 0, description: "Spazio occupato dai log dei job, in byte (somma dei file su disco)."}
        artifactBytes: {type: integer, format: int64, minimum: 0, description: "Spazio occupato dagli artefatti non scaduti, in byte."}
        cacheBytes: {type: integer, format: int64, minimum: 0, description: "Spazio occupato dalle cache, in byte."}
        resourceLimits: {type: object, additionalProperties: false, required: [cpuCores, memoryBytes, ephemeralStorageBytes, maxDurationSeconds], properties: {cpuCores: {type: integer, example: 2}, memoryBytes: {type: integer, format: int64, example: 4294967296}, ephemeralStorageBytes: {type: integer, format: int64, example: 21474836480}, maxDurationSeconds: {type: integer, example: 3600}}}
    CiStorageSettings:
      type: object
      additionalProperties: false
      required: [logRetentionDays, artifactRetentionDays, artifactMaxBytes, cacheQuotaBytes, cacheUnusedDays]
      properties:
        logRetentionDays: {type: integer, minimum: 1, maximum: 3650, default: 90, description: "Giorni di conservazione dei log dei job finiti."}
        artifactRetentionDays: {type: integer, minimum: 1, maximum: 3650, default: 30, description: "Giorni di conservazione degli artefatti."}
        artifactMaxBytes: {type: integer, format: int64, minimum: 1, default: 2147483648, description: "Dimensione massima di un artefatto, in byte."}
        cacheQuotaBytes: {type: integer, format: int64, minimum: 1, default: 10737418240, description: "Quota delle cache per repository, in byte."}
        cacheUnusedDays: {type: integer, minimum: 1, maximum: 3650, default: 7, description: "Giorni senza uso dopo i quali una cache si elimina."}
    PackageList:
      type: object
      additionalProperties: false
      required: [items]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/Package"}}}
    Package:
      type: object
      additionalProperties: false
      required: [name, tags, sizeBytes, updatedAt, signature, hasSbom]
      properties:
        name: {type: string}
        tags: {type: array, items: {type: string}}
        sizeBytes: {type: integer, format: int64}
        updatedAt: {type: string, format: date-time}
        digest: {type: string, description: "Digest del manifest (sha256:...)."}
        signature: {type: string, enum: [verified, unverified], description: "Firma cosign dell'immagine: verificata con la chiave del registry oppure no."}
        hasSbom: {type: boolean, description: "Vero se è conservato uno SBOM dell'immagine."}
        kind: {type: string, enum: [image, helm], description: "Tipo di artefatto, dal mediaType del manifest (helm = chart OCI)."}
        pushedBy: {$ref: "#/components/schemas/PackagePusher"}
        tagDetails:
          type: array
          description: "Un oggetto per tag (`tags` resta per compatibilità). Le firme e gli SBOM tecnici (sha256-….sig / .sbom) non compaiono."
          items: {$ref: "#/components/schemas/PackageTag"}
        removedTags:
          type: array
          description: "Al massimo 20 tag rimossi più recenti per immagine dalle regole di pulizia del registry (RG2)."
          items: {$ref: "#/components/schemas/RemovedPackageTag"}
    PackagePusher:
      type: object
      additionalProperties: false
      description: "Chi ha pubblicato, come autenticato dal registry al momento del push. Assente per i push anteriori alla registrazione."
      required: [kind, login]
      properties:
        kind: {type: string, enum: [user, agent, job]}
        login: {type: string, description: "Username dell'utente o dell'agente; «ci job token» per il token del job."}
    PackageTag:
      type: object
      additionalProperties: false
      required: [name, digest, sizeBytes, pushedAt, signature, hasSbom, protected]
      properties:
        name: {type: string}
        digest: {type: string, description: "Digest del manifest a cui punta il tag (sha256:...)."}
        sizeBytes: {type: integer, format: int64}
        pushedAt: {type: string, format: date-time, description: "Data dell'ultimo push del tag."}
        signature: {type: string, enum: [verified, unverified]}
        hasSbom: {type: boolean}
        protected: {type: boolean, description: "Il tag corrisponde a un modello di tag protetti (RG2)."}
        pushedBy: {$ref: "#/components/schemas/PackagePusher"}
    RemovedPackageTag:
      type: object
      additionalProperties: false
      required: [name, digest, rule, removedAt]
      properties:
        name: {type: string}
        digest: {type: string, description: "Digest del manifest a cui puntava il tag prima della pulizia."}
        rule: {type: string, description: "Frammento della regola di pulizia che ha eliminato il tag, per esempio `after 14 days` o `beyond last 5 tags`; la UI lo mostra come `removed {rule} by rule`."}
        removedAt: {type: string, format: date-time}
    PackageSettings:
      allOf:
        - $ref: "#/components/schemas/PackageSettingsInput"
        - type: object
          required: [deleteUntaggedAfterDays]
          properties:
            deleteUntaggedAfterDays: {type: integer, readOnly: true, default: 7, description: "Regola fissa di RG2: le immagini senza tag si eliminano dopo 7 giorni. Non è impostabile."}
    PackageSettingsInput:
      type: object
      additionalProperties: false
      required: [protectedTagPatterns, includeInBackup]
      properties:
        protectedTagPatterns: {type: array, items: {type: string}, description: Tag che non possono essere sovrascritti o eliminati.}
        includeInBackup: {type: boolean, default: false, description: "Include le immagini del repo nei backup (RG2: escluse di default)."}
        keepLastTags: {type: integer, minimum: 1, description: "Facoltativo: tiene solo gli ultimi N tag per immagine (i tag protetti restano sempre). Assente = nessun limite."}
        deleteShaTagsAfterDays: {type: integer, minimum: 1, description: "Facoltativo: elimina i tag sha-* più vecchi di X giorni (i tag protetti restano sempre). Assente = mai."}
    ReleaseList:
      type: object
      additionalProperties: false
      required: [items]
      properties: {items: {type: array, items: {$ref: "#/components/schemas/Release"}}}
    Release:
      type: object
      additionalProperties: false
      required: [id, tagName, name, body, draft, prerelease, latest, assets, createdAt]
      properties:
        id: {type: string, format: uuid}
        tagName: {type: string}
        name: {type: string}
        body: {type: string, description: Note Markdown.}
        draft: {type: boolean}
        prerelease: {type: boolean}
        latest: {type: boolean}
        assets: {type: array, items: {$ref: "#/components/schemas/ReleaseAsset"}}
        createdAt: {type: string, format: date-time}
        publishedAt: {type: string, format: date-time, nullable: true}
    CreateReleaseInput:
      type: object
      additionalProperties: false
      required: [tagName, name]
      properties: {tagName: {type: string}, name: {type: string}, body: {type: string}, draft: {type: boolean, default: false}, prerelease: {type: boolean, default: false}, generateNotes: {type: boolean, default: false}}
    UpdateReleaseInput:
      type: object
      additionalProperties: false
      properties: {name: {type: string}, body: {type: string}, draft: {type: boolean}, prerelease: {type: boolean}}
    ReleaseAsset:
      type: object
      additionalProperties: false
      required: [id, name, sizeBytes, sha256]
      properties: {id: {type: string, format: uuid}, name: {type: string}, sizeBytes: {type: integer, format: int64}, sha256: {type: string, pattern: '^[a-f0-9]{64}$'}}
    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          description: Versione del contratto API in esecuzione (`info.version`).

    Meta:
      type: object
      additionalProperties: false
      required: [server_version, api_version]
      properties:
        server_version:
          type: string
          description: Versione dell'installazione (tag dell'immagine del gateway).
        api_version:
          type: string
          description: Versione del contratto API (`info.version`).

    InstanceCa:
      type: object
      additionalProperties: false
      required: [mode, fingerprintSha256, downloadUrl]
      properties:
        mode:
          type: string
          enum: [internal, custom, none]
          description: "`internal` = CA interna di GitStack (N5); `custom` = certificato del cliente o Let's Encrypt; `none` = nessuna CA da installare."
        fingerprintSha256:
          type: string
          nullable: true
          description: Impronta SHA-256 del DER di `ca.crt` (formato `openssl x509 -fingerprint -sha256`, senza il prefisso). Null se `mode` non e' `internal`.
        downloadUrl:
          type: string
          nullable: true
          description: Indirizzo del certificato, `/downloads/ca.crt`. Null se `mode` non e' `internal`.

    AdminSystem:
      type: object
      description: >
        Stato dell'installazione per Admin · System (mockup 16). Nessun segreto.
        `published` dice se l'host ha pubblicato le sue informazioni: se no,
        le sezioni dell'host hanno `configured: false` o stati `none`.
      additionalProperties: false
      required: [published, database, backup, versions, network, access, services, node]
      properties:
        published:
          type: boolean
          description: >
            Vero se il ConfigMap `system-info` è presente. Falso: solo la
            versione del server Postgres (viva) è nota.
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Ultima pubblicazione da parte di `gitstack`.
        database:
          $ref: "#/components/schemas/AdminSystemDatabase"
        backup:
          $ref: "#/components/schemas/AdminSystemBackup"
        versions:
          $ref: "#/components/schemas/AdminSystemVersions"
        network:
          $ref: "#/components/schemas/AdminSystemNetwork"
        access:
          $ref: "#/components/schemas/AdminSystemAccess"
        services:
          $ref: "#/components/schemas/AdminSystemServices"
        node:
          $ref: "#/components/schemas/AdminSystemNode"
        supplyChainWarning:
          type: string
          description: >
            Avviso della catena di fornitura (V5): presente solo quando
            l'installazione ha `v5.allow_unsigned=true` (verifica delle
            firme disattivata per un mirror interno non firmato). Assente se
            le firme sono verificate. Lo stesso testo di
            `supply_chain_warning` in `gitstack status --json`.

    AdminSystemAccess:
      type: object
      description: Come si raggiunge GitStack. Nessun segreto.
      additionalProperties: false
      required: [host, tlsMode, sshPort]
      properties:
        host:
          type: string
        tlsMode:
          type: string
          enum: [internal, custom, letsencrypt, insecure, unknown]
          description: Modo HTTPS scelto dall'installer; `insecure` = solo HTTP.
        tlsExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Scadenza del certificato che il server presenta ora; assente se
            non è stato possibile leggerla o con HTTP.
        sshPort:
          type: integer
          description: Porta SSH del servizio git.

    AdminSystemServices:
      type: object
      description: >
        Stato dei workload della release, come `gitstack status`. È
        un'istantanea: la data di pubblicazione è `updatedAt` di AdminSystem.
      additionalProperties: false
      required: [available, items]
      properties:
        available:
          type: boolean
          description: Falso se il cluster non si è potuto interrogare.
        error:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminSystemService"

    AdminSystemService:
      type: object
      additionalProperties: false
      required: [name, kind, desired, ready, healthy]
      properties:
        name:
          type: string
        kind:
          type: string
          description: Deployment o StatefulSet.
        desired:
          type: integer
        ready:
          type: integer
        image:
          type: string
        healthy:
          type: boolean
          description: Almeno una replica desiderata e tutte pronte.

    AdminSystemMetric:
      type: object
      description: >
        Una misura dell'host confrontata con il profilo N1. Unità: core per
        la CPU, byte (GB decimali) per memoria e disco.
      additionalProperties: false
      required: [available, value, minimum, recommended, level]
      properties:
        available:
          type: boolean
        value:
          type: integer
          format: int64
        minimum:
          type: integer
          format: int64
        recommended:
          type: integer
          format: int64
        level:
          type: string
          enum: [recommended, below_recommended, below_minimum, unknown]

    AdminSystemDisk:
      type: object
      description: >
        Il filesystem che ospita i dati di k3s: dimensione (`value`) e spazio
        libero, confrontati con minimo e consigliato.
      additionalProperties: false
      required: [available, value, minimum, recommended, level, freeBytes, minFreeBytes]
      properties:
        available:
          type: boolean
        value:
          type: integer
          format: int64
          description: Dimensione del filesystem in byte.
        minimum:
          type: integer
          format: int64
        recommended:
          type: integer
          format: int64
        level:
          type: string
          enum: [recommended, below_recommended, below_minimum, unknown]
          description: "`below_minimum` anche se lo spazio libero è sotto `minFreeBytes`."
        path:
          type: string
        freeBytes:
          type: integer
          format: int64
        minFreeBytes:
          type: integer
          format: int64

    AdminSystemNode:
      type: object
      description: La macchina, confrontata con il profilo N1.
      additionalProperties: false
      required: [available, cpu, memory, disk]
      properties:
        available:
          type: boolean
          description: Falso se nessuna misura è stata possibile («non disponibile»).
        cpu:
          $ref: "#/components/schemas/AdminSystemMetric"
        memory:
          $ref: "#/components/schemas/AdminSystemMetric"
        disk:
          $ref: "#/components/schemas/AdminSystemDisk"

    AdminSystemDatabase:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [internal, external, unknown]
          description: Postgres interno (bundle), esterno (N8) o non pubblicato.
        host:
          type: string
        port:
          type: integer
        name:
          type: string
          description: Nome del database.
        sslmode:
          type: string
          description: Per esempio `require` o `verify-full`.
        serverVersion:
          type: string
          description: Versione del server (`SHOW server_version`).
        versionLive:
          type: boolean
          description: >
            Vero se `serverVersion` è stata letta ora da core sulla sua
            connessione; falso se è quella rilevata dall'installer.

    AdminSystemBackup:
      type: object
      additionalProperties: false
      required: [last, s3]
      properties:
        destination:
          type: string
          description: Cartella dei backup locali sull'host.
        retention:
          type: integer
          description: Numero di backup locali conservati.
        last:
          $ref: "#/components/schemas/AdminSystemBackupRun"
        s3:
          $ref: "#/components/schemas/AdminSystemBackupS3"

    AdminSystemBackupRun:
      type: object
      description: Esito di un backup o di un caricamento.
      additionalProperties: false
      required: [state]
      properties:
        state:
          type: string
          enum: [none, success, failed]
        at:
          type: string
          format: date-time
          nullable: true
        name:
          type: string
          description: Percorso dell'archivio locale o nome dell'oggetto su S3.
        error:
          type: string
          description: Causa, se `state` è `failed`.

    AdminSystemBackupS3:
      type: object
      additionalProperties: false
      required: [configured, upload]
      properties:
        configured:
          type: boolean
        endpoint:
          type: string
        bucket:
          type: string
        prefix:
          type: string
        retention:
          type: string
          description: Numero di archivi o `bucket` (lo decide il bucket).
        upload:
          $ref: "#/components/schemas/AdminSystemBackupRun"

    AdminSystemVersions:
      type: object
      additionalProperties: false
      required: [gitstack, k3sUpdate]
      properties:
        gitstack:
          type: string
          description: Versione di GitStack installata (tag delle immagini).
        k3s:
          type: string
          description: Versione di k3s in esecuzione; vuota se non letta.
        k3sDeclared:
          type: string
          description: Versione di k3s dichiarata (`deploy/k3s-version`).
        k3sUpdate:
          type: string
          enum: [none, patch, minor]
          description: >
            `patch`: applicata da `gitstack upgrade`; `minor`: serve
            `gitstack upgrade --k3s`.

    AdminSystemNetwork:
      type: object
      description: Rete aziendale (N9). Mai credenziali del proxy.
      additionalProperties: false
      required: [configured, corporateCA, mirrorCA, proxyHasCredentials, registryHasCredentials]
      properties:
        configured:
          type: boolean
          description: "Falso: nessun proxy né CA aziendale («non configurato»)."
        httpProxy:
          type: string
          description: URL del proxy senza credenziali.
        httpsProxy:
          type: string
        noProxy:
          type: string
        proxyHasCredentials:
          type: boolean
          description: Il proxy richiede credenziali (non mostrate).
        corporateCA:
          type: boolean
          description: Una CA aziendale è installata nei servizi.
        mirrorCA:
          type: boolean
          description: Una CA privata è usata per i mirror in push.
        registryMirror:
          type: string
          description: Mirror delle immagini (N9a), senza credenziali.
        registryHasCredentials:
          type: boolean
          description: Il mirror delle immagini richiede credenziali (non mostrate).
        downloadMirror:
          type: string
          description: Mirror dei download di k3s, Helm e binari (N9a), senza credenziali.

    Resource:
      type: object
      description: >
        Risorsa generica (D15): oggi usata dalla prova end-to-end, in futuro
        anche per repository, applicazioni e database, senza cambiare forma.
      additionalProperties: false
      required: [id, type, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        type:
          type: string
          minLength: 1
          example: repo
          description: "Tipo di risorsa, aperto: non un enum fisso (D15)."
        name:
          type: string
          minLength: 1
          maxLength: 255
        attributes:
          type: object
          description: Attributi specifici del tipo di risorsa, a forma libera.
          additionalProperties: true
          default: {}
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    CreateResourceInput:
      type: object
      additionalProperties: false
      required: [type, name]
      properties:
        type:
          type: string
          minLength: 1
          example: repo
        name:
          type: string
          minLength: 1
          maxLength: 255
        attributes:
          type: object
          additionalProperties: true

    UpdateResourceInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        attributes:
          type: object
          additionalProperties: true

    ResourceList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Resource"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    Error:
      type: object
      description: >
        Formato unico degli errori per tutta l'API pubblica. Codici comuni per
        stato: 400 `bad_request`; 401 `unauthenticated`, `invalid_credentials`;
        403 `forbidden`, `insufficient_scope`, `password_change_required`; 429 `too_many_attempts`; 404 `not_found`; 409 `conflict`
        e varianti specifiche (`already_exists`, `last_admin`, `last_owner`,
        `ssh_key_in_use`, `oidc_identity_unlinked`); 422 `validation_failed`
        (`details.fields`). Le risposte 401 non distinguono mai "utente
        inesistente" da "password errata".
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: Codice stabile leggibile da macchina (es. `not_found`).
              example: not_found
            message:
              type: string
              description: Messaggio leggibile da persone, non contrattuale.
            details:
              type: object
              additionalProperties: true
              description: Dettagli opzionali specifici dell'errore.
    Name:
      type: string
      description: >
        Nome breve in minuscolo (username, organizzazione, team, provider):
        lettere minuscole, cifre e trattini, 1-39 caratteri, inizia e finisce
        con un carattere alfanumerico.
      pattern: "^[a-z0-9]([a-z0-9-]{0,37}[a-z0-9])?$"
      minLength: 1
      maxLength: 39
      example: alice

    TokenScope:
      type: string
      description: >
        Catalogo degli scope dei token personali (unico, condiviso da tutti i
        servizi). Le sessioni web non hanno scope: valgono i permessi
        dell'utente. `write:*` include `read:*` dello stesso ambito;
        `admin:org` include `write:org`. Gli scope `*:registry` (RG1) valgono solo
        per il registry OCI: `read:registry` scarica le immagini, `write:registry`
        le pubblica (e include `read:registry`), `admin:registry` le elimina (e
        include gli altri due). Non sono implicati da `*:resource` e non lo implicano.
      enum:
        - read:user
        - write:user
        - read:org
        - write:org
        - admin:org
        - read:resource
        - write:resource
        - read:registry
        - write:registry
        - admin:registry

    ResourceRole:
      type: string
      description: Ruolo su una risorsa, in ordine crescente di potere.
      enum: [read, write, admin]

    LoginInput:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 254
          description: Username oppure email.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
          writeOnly: true
        totpCode:
          type: string
          pattern: '^[0-9]{6}$'
          writeOnly: true
          description: Codice TOTP a 6 cifre (secondo passo del login).
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 64
          writeOnly: true
          description: >
            Codice di recupero monouso, in alternativa a `totpCode`. Maiuscole,
            minuscole e trattini non contano.

    TotpStatus:
      type: object
      additionalProperties: false
      required: [enabled, available, requiredForAdmins, recoveryCodesRemaining]
      properties:
        enabled:
          type: boolean
          description: Vero se l'utente ha confermato il TOTP.
        pending:
          type: boolean
          description: Vero se c'e' un'attivazione iniziata e non ancora confermata.
        available:
          type: boolean
          description: >
            Falso se l'installazione non ha chiavi di cifratura configurate
            (`GITSTACK_IDENTITY_TOTP_KEYS`): l'attivazione risponde 503.
        requiredForAdmins:
          type: boolean
          description: Vero se l'installazione impone il TOTP agli amministratori.
        recoveryCodesRemaining:
          type: integer
          minimum: 0

    TotpEnrollment:
      type: object
      additionalProperties: false
      required: [secret, otpauthUri]
      properties:
        secret:
          type: string
          description: Segreto in base32, per l'inserimento manuale. Compare solo qui.
        otpauthUri:
          type: string
          description: URI `otpauth://totp/...` da trasformare in QR code.

    TotpCodeInput:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Codice TOTP a 6 cifre.

    TotpRecoveryCodes:
      type: object
      additionalProperties: false
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          description: >
            Codici di recupero monouso, mostrati una sola volta (nel database
            ci sono solo gli hash).
          items:
            type: string

    TotpDisableInput:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
          writeOnly: true
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Codice TOTP attuale (o in alternativa `recoveryCode`).
        recoveryCode:
          type: string
          minLength: 1
          maxLength: 64

    User:
      type: object
      description: >
        Profilo utente. `email`, `isAdmin`, `isActive`, `createdAt` sono
        presenti solo per l'utente stesso e per gli amministratori.
      additionalProperties: false
      required: [id, username, kind, displayName]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          $ref: "#/components/schemas/Name"
        kind:
          type: string
          enum: [human, agent]
        displayName:
          type: string
          maxLength: 128
        bio:
          type: string
          maxLength: 1024
        avatarUrl:
          type: string
          format: uri
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        isAdmin:
          type: boolean
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
          readOnly: true

    CreateUserInput:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username:
          $ref: "#/components/schemas/Name"
        kind:
          type: string
          enum: [human, agent]
          default: human
        email:
          type: string
          format: email
        displayName:
          type: string
          maxLength: 128
        password:
          type: string
          minLength: 12
          maxLength: 128
          format: password
          writeOnly: true
          description: >
            Da 12 a 128 caratteri e non presente nell'elenco di password comuni
            (422 `password`). Assente per gli agenti (accedono solo con token)
            e per chi entra solo via OIDC.
        isAdmin:
          type: boolean
          default: false

    UpdateUserInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          maxLength: 128
        bio:
          type: string
          maxLength: 1024
        avatarUrl:
          type: string
          format: uri
          nullable: true
        email:
          type: string
          format: email
        isAdmin:
          type: boolean
          description: Solo amministratori.
        isActive:
          type: boolean
          description: Solo amministratori. Disattivare revoca le sessioni e i token.

    UserList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    ChangePasswordInput:
      type: object
      additionalProperties: false
      required: [newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          writeOnly: true
          maxLength: 1024
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          format: password
          writeOnly: true
          description: >
            Da 12 a 128 caratteri e non presente nell'elenco di password comuni
            incorporato (422 `newPassword`). La password attuale e il login
            accettano fino a 1024 caratteri, cosi' chi ne ha una piu' lunga
            puo' ancora entrare e sostituirla.

    CurrentSession:
      type: object
      additionalProperties: false
      required: [user, authMethod, mustChangePassword]
      properties:
        user:
          $ref: "#/components/schemas/User"
        authMethod:
          type: string
          enum: [password, oidc, token]
          description: Come e' stato autenticato il chiamante.
        mustChangePassword:
          type: boolean
          description: >
            Vero per l'amministratore creato al primo avvio finche' non cambia
            la password iniziale. Finche' e' vero ogni chiamata autenticata
            risponde 403 `password_change_required`, tranne `GET
            /auth/session`, `POST /auth/logout` e `PUT
            /users/{username}/password` (solo sulla propria utenza).
        mustEnrollTotp:
          type: boolean
          description: >
            Vero per un amministratore con sessione a password quando
            l'installazione impone il TOTP e lui non l'ha ancora attivato.
            Finche' e' vero ogni chiamata autenticata risponde 403
            `totp_enrollment_required`, tranne `GET /auth/session`, `POST
            /auth/logout` e gli endpoint `/auth/totp*`. Assente equivale a falso.
        scopes:
          type: array
          description: Solo per `authMethod` = `token`.
          items:
            $ref: "#/components/schemas/TokenScope"
        expiresAt:
          type: string
          format: date-time
          nullable: true

    Session:
      type: object
      description: Sessione web attiva, senza il valore del cookie.
      additionalProperties: false
      required: [id, authMethod, createdAt, lastSeenAt, expiresAt, current]
      properties:
        id:
          type: string
          format: uuid
        authMethod:
          type: string
          enum: [password, oidc]
        userAgent:
          type: string
        ipAddress:
          type: string
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: Vero per la sessione con cui e' fatta la richiesta.

    SessionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"

    ExportedSshKey:
      type: object
      description: Chiave SSH dell'utente, con la chiave pubblica.
      additionalProperties: false
      required: [title, keyType, fingerprint, publicKey, createdAt]
      properties:
        title:
          type: string
        keyType:
          type: string
        fingerprint:
          type: string
        publicKey:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true

    OwnDataExport:
      type: object
      description: >
        Dati personali che identity conserva su un utente (V8.3.2). Senza
        password, hash, segreto TOTP e valori dei token.
      additionalProperties: false
      required: [exportedAt, user, tokens, sshKeys, sessions, totpEnabled]
      properties:
        exportedAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/Token"
        sshKeys:
          type: array
          items:
            $ref: "#/components/schemas/ExportedSshKey"
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        totpEnabled:
          type: boolean

    CredentialEvent:
      type: object
      additionalProperties: false
      required: [id, userId, kind, detail, createdAt]
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [password_changed, password_reset, token_created, token_expiring, ssh_key_added]
        detail:
          type: object
          additionalProperties: true
          description: Nome del token o della chiave, suffisso del token, scadenza. Mai segreti.
        createdAt:
          type: string
          format: date-time

    CredentialEventList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CredentialEvent"

    CredentialEventsAckInput:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: integer
            format: int64
            minimum: 1

    OidcProvider:
      type: object
      additionalProperties: false
      required: [slug, displayName]
      properties:
        slug:
          $ref: "#/components/schemas/Name"
        displayName:
          type: string

    OidcProviderList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OidcProvider"

    Token:
      type: object
      description: Token personale, senza il valore (che non e' recuperabile).
      additionalProperties: false
      required: [id, name, scopes, hint, createdAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 64
        scopes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TokenScope"
        hint:
          type: string
          minLength: 4
          maxLength: 4
          description: Ultimi 4 caratteri del token, per riconoscerlo.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true

    CreateTokenInput:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TokenScope"
        expiresAt:
          type: string
          format: date-time
          description: >
            Obbligatoria: la scadenza deve essere nel futuro e non oltre il
            massimo configurato dall'installazione (default 365 giorni), altrimenti 422.

    CreatedToken:
      description: Il token appena creato; `token` compare solo in questa risposta.
      allOf:
        - $ref: "#/components/schemas/Token"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              pattern: "^gst_[A-Za-z0-9_-]{32,}$"
              description: Valore in chiaro, formato `gst_<casuale>`. Non viene salvato.

    TokenList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Token"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    SshKey:
      type: object
      additionalProperties: false
      required: [id, title, keyType, fingerprint, createdAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          minLength: 1
          maxLength: 64
        keyType:
          type: string
          example: ssh-ed25519
        fingerprint:
          type: string
          pattern: "^SHA256:[A-Za-z0-9+/]{43}$"
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true

    AddSshKeyInput:
      type: object
      additionalProperties: false
      required: [title, publicKey]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 64
        publicKey:
          type: string
          maxLength: 8192
          example: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... alice@laptop"
          description: Riga in formato `authorized_keys` (tipo, base64, commento facoltativo).

    SshKeyList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SshKey"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    SshKeyLookup:
      type: object
      additionalProperties: false
      required: [key, user]
      properties:
        key:
          $ref: "#/components/schemas/SshKey"
        user:
          $ref: "#/components/schemas/User"

    Organization:
      type: object
      additionalProperties: false
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          $ref: "#/components/schemas/Name"
        displayName:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 1024
        createdAt:
          type: string
          format: date-time
          readOnly: true

    CreateOrganizationInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/Name"
        displayName:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 1024

    UpdateOrganizationInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 1024

    OrganizationList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Organization"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    OrgRole:
      type: string
      description: "`owner` gestisce organizzazione, team e membri; `member` no."
      enum: [owner, member]

    OrgMember:
      type: object
      additionalProperties: false
      required: [user, role, createdAt]
      properties:
        user:
          $ref: "#/components/schemas/User"
        role:
          $ref: "#/components/schemas/OrgRole"
        createdAt:
          type: string
          format: date-time

    SetOrgMemberInput:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/OrgRole"

    OrgMemberList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrgMember"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    Team:
      type: object
      additionalProperties: false
      required: [id, orgId, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        orgId:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/Name"
        description:
          type: string
          maxLength: 1024
        createdAt:
          type: string
          format: date-time
          readOnly: true

    CreateTeamInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/Name"
        description:
          type: string
          maxLength: 1024

    UpdateTeamInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: "#/components/schemas/Name"
        description:
          type: string
          maxLength: 1024

    TeamList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Team"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    TeamRole:
      type: string
      description: "`maintainer` gestisce i membri del team."
      enum: [member, maintainer]

    TeamMember:
      type: object
      additionalProperties: false
      required: [user, role, createdAt]
      properties:
        user:
          $ref: "#/components/schemas/User"
        role:
          $ref: "#/components/schemas/TeamRole"
        createdAt:
          type: string
          format: date-time

    SetTeamMemberInput:
      type: object
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/TeamRole"

    TeamMemberList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TeamMember"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    Grant:
      type: object
      description: Ruolo su una risorsa generica (D15) per un utente o un team.
      additionalProperties: false
      required: [id, resourceId, subjectType, subjectId, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        resourceId:
          type: string
          format: uuid
        subjectType:
          type: string
          enum: [user, team]
        subjectId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ResourceRole"
        createdAt:
          type: string
          format: date-time
          readOnly: true

    CreateGrantInput:
      type: object
      additionalProperties: false
      required: [subjectType, subjectId, role]
      properties:
        subjectType:
          type: string
          enum: [user, team]
        subjectId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ResourceRole"

    UpdateGrantInput:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/ResourceRole"

    GrantList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Grant"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    EffectivePermission:
      type: object
      additionalProperties: false
      required: [resourceId, role]
      properties:
        resourceId:
          type: string
          format: uuid
        role:
          type: string
          allOf:
            - $ref: "#/components/schemas/ResourceRole"
          nullable: true
          description: Ruolo effettivo; `null` = nessun accesso.

    VerifyCredentialInput:
      type: object
      additionalProperties: false
      required: [credential]
      properties:
        credential:
          type: string
          minLength: 1
          maxLength: 512
          writeOnly: true
          description: Valore grezzo della credenziale (cookie `gst_session` o token `gst_...`).
        kind:
          type: string
          enum: [session, token]
          description: Facoltativo, evita l'ambiguita' se il gateway la conosce.

    Principal:
      type: object
      description: Chi ha presentato la credenziale.
      additionalProperties: false
      required: [userId, username, kind, isAdmin, authMethod]
      properties:
        userId:
          type: string
          format: uuid
        username:
          $ref: "#/components/schemas/Name"
        kind:
          type: string
          enum: [human, agent]
        isAdmin:
          type: boolean
        authMethod:
          type: string
          enum: [password, oidc, token]
        scopes:
          type: array
          description: Solo per i token; assenti per le sessioni.
          items:
            $ref: "#/components/schemas/TokenScope"
        mustChangePassword:
          type: boolean
          description: >
            Vero per una sessione la cui password iniziale non e' ancora stata
            cambiata (vedi `CurrentSession.mustChangePassword`). `/internal/verify`
            risponde comunque `active` true: il gateway risponde 403
            `password_change_required` a ogni rotta tranne `GET /auth/session`,
            `POST /auth/logout` e `PUT /users/{username}/password` sulla propria
            utenza. Assente equivale a falso.
        mustEnrollTotp:
          type: boolean
          description: >
            Vero per una sessione a password di un amministratore che deve
            ancora attivare il TOTP (installazione che lo impone). Il gateway
            risponde 403 `totp_enrollment_required` a ogni rotta senza
            `x-totp-enroll-exempt`. Assente equivale a falso.
        credentialId:
          type: string
          format: uuid
          description: Id della sessione o del token (per audit).
        tokenName:
          type: string
          description: Nome del token; presente solo con `authMethod` token.
        expiresAt:
          type: string
          format: date-time
          nullable: true

    VerifyCredentialResult:
      type: object
      additionalProperties: false
      required: [active]
      properties:
        active:
          type: boolean
        principal:
          $ref: "#/components/schemas/Principal"
        cacheTtlSeconds:
          type: integer
          minimum: 0
          description: Per quanto tempo il gateway puo' tenere in cache l'esito.

    GrantResourceCreatorInput:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid

    CheckPermissionInput:
      type: object
      additionalProperties: false
      required: [userId, resourceId, role]
      properties:
        userId:
          type: string
          format: uuid
        resourceId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ResourceRole"

    CheckPermissionResult:
      type: object
      additionalProperties: false
      required: [allowed]
      properties:
        allowed:
          type: boolean
        effectiveRole:
          type: string
          allOf:
            - $ref: "#/components/schemas/ResourceRole"
          nullable: true

    ReadableResourcesInput:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid

    ReadableResourcesResult:
      type: object
      additionalProperties: false
      required: [all, resourceIds]
      properties:
        all:
          type: boolean
        resourceIds:
          type: array
          items:
            type: string
            format: uuid

    AccessSource:
      type: object
      additionalProperties: false
      required: [kind, role]
      description: >
        Una fonte del ruolo su un repo. `direct`: grant all'utente; `team`:
        grant al team `organization`/`team` (di cui e' membro o la cui
        organizzazione possiede); `owner`: owner dell'organizzazione
        proprietaria (`organization`) o proprietario del repo personale
        (P1, P6), sempre `admin`; `internal`: visibilita' interna (P3),
        `read`; `installation_admin`: amministratore dell'installazione,
        `admin`.
      properties:
        kind:
          type: string
          enum: [direct, team, owner, internal, installation_admin]
        role:
          $ref: "#/components/schemas/ResourceRole"
        organization:
          type: string
          description: Solo per `team` e per `owner` di un'organizzazione.
        team:
          type: string
          description: Solo per `team`.

    UserAccessSourcesItem:
      type: object
      additionalProperties: false
      required: [resourceId, role, sources]
      properties:
        resourceId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ResourceRole"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/AccessSource"

    UserAccessSources:
      type: object
      additionalProperties: false
      required: [admin, items]
      properties:
        admin:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserAccessSourcesItem"

    UserAccessItem:
      type: object
      additionalProperties: false
      required: [repositoryId, owner, name, fullName, role, sources]
      properties:
        repositoryId:
          type: string
          format: uuid
        owner:
          $ref: "#/components/schemas/RepoOwner"
        name:
          type: string
        fullName:
          type: string
          example: acme/api
        visibility:
          $ref: "#/components/schemas/RepoVisibility"
        role:
          $ref: "#/components/schemas/ResourceRole"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/AccessSource"

    UserAccessList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserAccessItem"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    RepoName:
      type: string
      description: >
        Nome di un repo (R11): lettere maiuscole e minuscole, cifre, `-`,
        `_`, `.`; 1-100 caratteri; non inizia con `.`; non finisce con
        `.git` (regola applicata dal servizio, non esprimibile nel pattern).
        Le maiuscole sono conservate come scritte; l'unicita' per owner e il
        lookup non distinguono maiuscole e minuscole (`GitStack` e
        `gitstack` sono lo stesso repo).
      pattern: "^[A-Za-z0-9_-][A-Za-z0-9._-]{0,99}$"
      minLength: 1
      maxLength: 100
      example: my-app

    RepoVisibility:
      type: string
      description: >
        Visibilita' (P7): `private` (solo chi ha un grant) o `internal`
        (tutti gli utenti dell'installazione). Nessun accesso anonimo.
      enum: [private, internal]
      default: private

    GitignoreTemplate:
      type: string
      description: Modello di `.gitignore` per il contenuto iniziale (R5).
      enum: [go, node, python, java, dotnet, rust, cpp, terraform, ruby, php]

    LicenseTemplate:
      type: string
      description: Modello di licenza per il contenuto iniziale (R5).
      enum:
        - mit
        - apache-2.0
        - gpl-3.0
        - agpl-3.0
        - lgpl-3.0
        - mpl-2.0
        - bsd-2-clause
        - bsd-3-clause
        - unlicense

    OwnerType:
      type: string
      enum: [user, organization]

    RepoOwner:
      type: object
      additionalProperties: false
      required: [type, name]
      properties:
        type:
          $ref: "#/components/schemas/OwnerType"
        name:
          $ref: "#/components/schemas/Name"

    RepoCloneUrls:
      type: object
      description: >
        Indirizzi di clone dell'installazione (R1, R7). L'indirizzo SSH e'
        sempre quello completo `ssh://git@<host>:<porta>/<owner>/<repo>.git`.
      additionalProperties: false
      required: [https]
      properties:
        https:
          type: string
          example: https://git.example.com/alice/my-app.git
        ssh:
          type: string
          description: >
            Assente quando il server SSH dell'installazione e' spento.
          example: ssh://git@git.example.com:2222/alice/my-app.git
        sshShort:
          type: string
          description: >
            Forma corta `git@<host>:<owner>/<repo>.git` (R7): presente solo
            quando la porta SSH dell'installazione e' 22.
          example: git@git.example.com:alice/my-app.git

    Repository:
      type: object
      additionalProperties: false
      required:
        - id
        - owner
        - name
        - fullName
        - description
        - visibility
        - defaultBranch
        - protectDefaultBranch
        - archived
        - empty
        - cloneUrls
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Id della risorsa (`type=repo`) in core.
        owner:
          $ref: "#/components/schemas/RepoOwner"
        name:
          $ref: "#/components/schemas/RepoName"
        fullName:
          type: string
          description: "`owner/name`."
          example: alice/my-app
        description:
          type: string
          maxLength: 1024
        visibility:
          $ref: "#/components/schemas/RepoVisibility"
        defaultBranch:
          type: string
          example: main
        protectDefaultBranch:
          type: boolean
          description: Force-push ed eliminazione del branch principale rifiutati (R9).
        requirePullRequest:
          type: boolean
          description: >
            «Richiedi una Pull Request» e' accesa sul branch principale (PR4): nessun push diretto, `admin` compresi.
            La modifica e' in `updateBranchSettings`. Assente se spenta.
        archived:
          type: boolean
        archivedAt:
          type: string
          format: date-time
          nullable: true
        empty:
          type: boolean
          description: Il repo non ha ancora nessun commit.
        cloneUrls:
          $ref: "#/components/schemas/RepoCloneUrls"
        mirror:
          allOf:
            - $ref: "#/components/schemas/RepositoryMirror"
          nullable: true
          type: object
          description: >
            Presente solo se il repo e' un mirror in pull attivo (anche in pausa, MP2, MP7): il codice e' in
            sola lettura. `null` o assente in un repo normale. Il dettaglio e' in `getRepoPullMirror`.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    RepositoryMirror:
      type: object
      additionalProperties: false
      required: [origin]
      properties:
        origin:
          type: string
          format: uri
          description: Origine del mirror in pull, `https://` senza credenziali.
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
          description: Ultimo aggiornamento riuscito; `null` finche' la prima copia non e' finita.
      example:
        origin: https://github.com/example/gitstack.git
        lastSyncedAt: "2026-10-12T09:40:00Z"

    CreateRepositoryInput:
      type: object
      additionalProperties: false
      required: [owner, name]
      properties:
        owner:
          $ref: "#/components/schemas/Name"
        name:
          $ref: "#/components/schemas/RepoName"
        description:
          type: string
          maxLength: 1024
        visibility:
          $ref: "#/components/schemas/RepoVisibility"
        readme:
          type: boolean
          default: false
          description: Crea un `README.md` iniziale (R5).
        gitignoreTemplate:
          $ref: "#/components/schemas/GitignoreTemplate"
        defaultLabels:
          type: boolean
          default: true
          description: >
            Crea le etichette predefinite (I5): `bug`, `enhancement`, `documentation`,
            `question`, `duplicate`, `good first issue`, `agent-ready`, `needs-human`.
            Attiva di default; `false` crea il repo senza etichette.
        licenseTemplate:
          $ref: "#/components/schemas/LicenseTemplate"

    UpdateRepositoryInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        description:
          type: string
          maxLength: 1024
        visibility:
          $ref: "#/components/schemas/RepoVisibility"
        defaultBranch:
          type: string
          minLength: 1
          maxLength: 255
        protectDefaultBranch:
          type: boolean
        archived:
          type: boolean

    RepositoryList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Repository"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    DeletedRepository:
      type: object
      additionalProperties: false
      required: [id, owner, name, deletedAt, purgeAt]
      properties:
        id:
          type: string
          format: uuid
        owner:
          $ref: "#/components/schemas/RepoOwner"
        name:
          $ref: "#/components/schemas/RepoName"
        deletedAt:
          type: string
          format: date-time
        purgeAt:
          type: string
          format: date-time
          description: Dopo questo istante il repo e' cancellato definitivamente (7 giorni, R2).

    DeletedRepositoryList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DeletedRepository"

    RepoNameConflictError:
      type: object
      description: >
        Come `Error`, per il 409 di creazione e import di un repo: `details` e' presente solo con
        `code: name_in_trash`.
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: "`conflict` o `name_in_trash`."
              example: name_in_trash
            message:
              type: string
            details:
              $ref: "#/components/schemas/NameInTrashDetails"

    NameInTrashDetails:
      type: object
      description: >
        `error.details` del 409 `name_in_trash` di `createRepository` e `importRepository`: il nome e' tenuto da
        un repo eliminato (R2). Il nome si libera solo alla cancellazione definitiva (`purgeAt`); un admin del
        repo puo' ripristinarlo prima. Un repo attivo con quel nome resta il 409 `conflict`.
      additionalProperties: false
      required: [purgeAt, owner]
      properties:
        purgeAt:
          type: string
          format: date-time
          description: Istante dopo il quale il repo nel cestino e' cancellato definitivamente e il nome si libera.
        owner:
          type: string
          description: Nome dell'owner del repo nel cestino, per il link al cestino giusto.
        repoId:
          type: string
          format: uuid
          description: Id del repo nel cestino, presente solo se il chiamante e' admin su di esso (per ripristinarlo).

    ResourceAttributesInput:
      type: object
      additionalProperties: false
      required: [ownerType, ownerId, visibility]
      properties:
        ownerType:
          $ref: "#/components/schemas/OwnerType"
        ownerId:
          type: string
          format: uuid
        visibility:
          $ref: "#/components/schemas/RepoVisibility"

    OwnerRef:
      type: object
      additionalProperties: false
      required: [type, id, name]
      properties:
        type:
          $ref: "#/components/schemas/OwnerType"
        id:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/Name"

    OrgOwnersResult:
      type: object
      additionalProperties: false
      required: [owners]
      properties:
        owners:
          type: array
          items:
            type: string
            format: uuid

    ResourceMembersResult:
      type: object
      additionalProperties: false
      required: [userIds]
      properties:
        userIds:
          type: array
          items:
            type: string
            format: uuid

    GitCreateRepoInput:
      type: object
      additionalProperties: false
      required: [repoId, name, author]
      properties:
        repoId:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/RepoName"
        description:
          type: string
          maxLength: 1024
        defaultBranch:
          type: string
          default: main
        readme:
          type: boolean
          default: false
        gitignoreTemplate:
          $ref: "#/components/schemas/GitignoreTemplate"
        licenseTemplate:
          $ref: "#/components/schemas/LicenseTemplate"
        licenseHolder:
          type: string
          maxLength: 255
        author:
          type: object
          additionalProperties: false
          required: [name, email]
          properties:
            name:
              type: string
            email:
              type: string

    GitRepoCreated:
      type: object
      additionalProperties: false
      required: [repoId, empty]
      properties:
        repoId:
          type: string
          format: uuid
        empty:
          type: boolean

    GitRepoState:
      type: object
      additionalProperties: false
      required: [repoId, trashed, empty]
      properties:
        repoId:
          type: string
          format: uuid
        trashed:
          type: boolean
        empty:
          type: boolean
        branches:
          type: array
          description: Branch esistenti (`refs/heads`), in ordine alfabetico (R4).
          items:
            type: string

    CodeUser:
      type: object
      description: >
        Utente GitStack che corrisponde all'email di un commit (confronto
        senza distinguere maiuscole con l'email di identity). `kind` da' il
        badge umano/agente.
      additionalProperties: false
      required: [id, username, kind, avatarUrl]
      properties:
        id:
          type: string
          format: uuid
        username:
          $ref: "#/components/schemas/Name"
        kind:
          type: string
          enum: [human, agent]
        avatarUrl:
          type: string
          format: uri
          nullable: true

    CommitPerson:
      type: object
      description: >
        Autore o committer dichiarato nel commit. Non e' una prova d'identita':
        chiunque puo' scrivere un nome e un'email qualsiasi in un commit. `user`
        e' null se nessun utente GitStack ha quell'email (e sempre assente
        nelle risposte del servizio git, che non conosce gli utenti).
      additionalProperties: false
      required: [name, email, date]
      properties:
        name:
          type: string
        email:
          type: string
        date:
          type: string
          format: date-time
        user:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CodeUser"

    CommitSummary:
      type: object
      additionalProperties: false
      required: [sha, subject, author, committer, parents]
      properties:
        sha:
          type: string
          pattern: "^[0-9a-f]{40,64}$"
        subject:
          type: string
          description: Prima riga del messaggio.
        message:
          type: string
          description: Messaggio completo (omesso nell'ultimo commit di una voce d'albero).
        author:
          $ref: "#/components/schemas/CommitPerson"
        committer:
          $ref: "#/components/schemas/CommitPerson"
        parents:
          type: array
          items:
            type: string

    TreeEntry:
      type: object
      additionalProperties: false
      required: [name, path, type, mode, lastCommit]
      properties:
        name:
          type: string
        path:
          type: string
        type:
          type: string
          enum: [file, dir, symlink, submodule]
        mode:
          type: string
          description: Modo Git in ottale, es. `100644`.
        size:
          type: integer
          format: int64
          description: Byte, solo per i file.
        lastCommit:
          $ref: "#/components/schemas/CommitSummary"

    Tree:
      type: object
      additionalProperties: false
      required: [ref, commitSha, path, entries, truncated]
      properties:
        ref:
          type: string
          description: Il `ref` risolto (il branch principale se non indicato).
        commitSha:
          type: string
        path:
          type: string
        entries:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/TreeEntry"
        truncated:
          type: boolean
          description: True se la cartella ha piu' di 1 000 voci e queste sono le prime 1 000.

    FileContent:
      type: object
      additionalProperties: false
      required: [ref, path, name, sha, size, binary, kind, display, truncated, lastCommit]
      properties:
        ref:
          type: string
        path:
          type: string
        name:
          type: string
        sha:
          type: string
          description: Sha del blob.
        size:
          type: integer
          format: int64
          description: Dimensione reale in byte, sempre, anche se `content` manca.
        binary:
          type: boolean
          description: True per tutto cio' che non e' testo (anche le immagini, SVG compreso).
        kind:
          type: string
          enum: [text, image, binary]
          description: >
            `text`; `image` per PNG, JPEG, GIF, WebP e SVG (riconosciuti dal
            contenuto, non dall'estensione; SVG solo come immagine, mai come
            pagina); `binary` per ogni altro file non di testo.
        mimeType:
          type: string
          description: Solo per `kind` `image`, es. `image/png`, `image/svg+xml`.
        display:
          type: string
          enum: [highlight, plain, image, download]
          description: >
            Regola B1, sempre presente. `highlight`: testo fino a 1 MB
            (1 048 576 byte, `fileHighlightMaxBytes`), `content` intero, da
            evidenziare. `plain`: testo da 1 MB a 5 MB (5 242 880 byte,
            `filePlainMaxBytes`), `content` intero, senza evidenziazione.
            `image`: immagine fino a 1 MB (`imageInlineMaxBytes`),
            `content` in base64. `download`: nessun `content` (testo oltre
            5 MB, immagine oltre 1 MB, altri binari): si scarica con `raw`.
        truncated:
          type: boolean
          description: >
            True se `content` non porta tutto il file per il limite di
            dimensione: un testo oltre 5 MB (`display` `download`, nessun
            contenuto). Mai true per binari e immagini, che per natura non
            hanno `content` testuale; mai true per `highlight`, `plain` e
            `image`, il cui `content` e' sempre intero.
        encoding:
          type: string
          enum: [utf-8, base64]
          description: Codifica di `content`; assente se `content` manca. `base64` solo per le immagini.
        content:
          type: string
          description: >
            Testo UTF-8 (`display` `highlight` o `plain`) o immagine in
            base64 (`display` `image`); assente con `display` `download`.
        lastCommit:
          $ref: "#/components/schemas/CommitSummary"

    Branch:
      type: object
      additionalProperties: false
      required: [name, isDefault, protected, commit]
      properties:
        name:
          type: string
        isDefault:
          type: boolean
        protected:
          type: boolean
          description: Protezione del branch principale (R9). Per il servizio git e' sempre false, la imposta core.
        commit:
          $ref: "#/components/schemas/CommitSummary"

    BranchList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Branch"
        total:
          type: integer
          minimum: 0

    Tag:
      type: object
      additionalProperties: false
      required: [name, commit, annotated, taggedAt]
      properties:
        name:
          type: string
        annotated:
          type: boolean
        message:
          type: string
          description: Messaggio del tag; solo se `annotated`.
        taggedAt:
          type: string
          format: date-time
          description: Data del tag; per un tag leggero quella del commit (regola B7).
        commit:
          $ref: "#/components/schemas/CommitSummary"
        zipUrl:
          type: string
          description: >
            Indirizzo di scaricamento ZIP (`getRepositoryArchive` con
            `ref` il nome del tag, relativo a `/v1`). Lo aggiunge core: il
            servizio git non conosce owner e nome, quindi nella sua risposta
            manca; sempre presente in quella pubblica.
        tarGzUrl:
          type: string
          description: Come `zipUrl`, per il tar.gz.

    TagList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        total:
          type: integer
          minimum: 0

    CommitList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, hasMore]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/CommitSummary"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
          maximum: 100
        hasMore:
          type: boolean
          description: Non c'e' un totale, contarlo costa un giro completo della storia.

    FileDiff:
      type: object
      additionalProperties: false
      required: [path, status, additions, deletions, binary, truncated]
      properties:
        path:
          type: string
        oldPath:
          type: string
          description: Percorso precedente, per rinomine e copie.
        status:
          type: string
          enum: [added, modified, deleted, renamed, copied]
        additions:
          type: integer
          minimum: 0
        deletions:
          type: integer
          minimum: 0
        binary:
          type: boolean
        truncated:
          type: boolean
          description: True se il patch supera 1 MB o il limite totale di 20 000 righe e' gia' esaurito; `patch` e' parziale o assente.
        collapsed:
          type: boolean
          description: >
            B6: il file e' «chiuso di default» nella UI. Il patch c'e' comunque,
            se non e' stato omesso per i limiti.
        collapseReason:
          type: string
          enum: [large, lock, generated]
          description: >
            Perche' e' chiuso: `large` (piu' di 500 righe cambiate, aggiunte
            piu' tolte), `lock` (file di lock: package-lock.json, pnpm-lock.yaml,
            yarn.lock, go.sum, Cargo.lock, ...) o `generated` (file generato o
            minificato: *.min.js, *.min.css, *.pb.go, ...). Elenco completo nel
            README del servizio git; lock e generated vincono su large.
        patch:
          type: string
          description: Diff unificato (hunk), assente per i binari.

    CommitDetail:
      type: object
      additionalProperties: false
      required: [commit, files, filesChanged, additions, deletions, truncated]
      properties:
        commit:
          $ref: "#/components/schemas/CommitSummary"
        files:
          type: array
          maxItems: 300
          items:
            $ref: "#/components/schemas/FileDiff"
        filesChanged:
          type: integer
          minimum: 0
          description: Numero reale di file toccati, anche oltre i 300 elencati.
        additions:
          type: integer
          minimum: 0
        deletions:
          type: integer
          minimum: 0
        truncated:
          type: boolean
          description: True se i file sono oltre 300 o le righe di diff oltre 20 000 in totale.
        listOnly:
          type: boolean
          description: >
            B6: oltre 300 file o 20 000 righe cambiate la risposta porta solo
            l'elenco dei file con righe aggiunte e tolte, senza `patch`.
        ignoreWhitespace:
          type: boolean
          description: Il diff e' stato calcolato ignorando gli spazi (`git diff -w`); i file che cambiano solo negli spazi non compaiono.
        tags:
          type: array
          items:
            type: string
          description: Tag che puntano al commit (anche annotati), in ordine alfabetico.

    BlameRange:
      type: object
      additionalProperties: false
      required: [startLine, endLine, commit]
      properties:
        startLine:
          type: integer
          minimum: 1
        endLine:
          type: integer
          minimum: 1
        commit:
          $ref: "#/components/schemas/CommitSummary"

    Blame:
      type: object
      additionalProperties: false
      required: [ref, path, ranges]
      properties:
        ref:
          type: string
        path:
          type: string
        ranges:
          type: array
          items:
            $ref: "#/components/schemas/BlameRange"

    LanguageShare:
      type: object
      additionalProperties: false
      required: [name, bytes, percent]
      properties:
        name:
          type: string
        bytes:
          type: integer
          format: int64
          minimum: 0
        percent:
          type: number
          minimum: 0
          maximum: 100

    Languages:
      type: object
      additionalProperties: false
      required: [languages, totalBytes]
      properties:
        languages:
          type: array
          items:
            $ref: "#/components/schemas/LanguageShare"
        totalBytes:
          type: integer
          format: int64
          minimum: 0

    FileList:
      type: object
      additionalProperties: false
      required: [ref, commitSha, paths, truncated]
      description: >
        Percorsi di tutti i file del ref per "Go to file" (regola B5): la
        corrispondenza approssimata la fa il client sull'elenco.
      properties:
        ref:
          type: string
          description: Il `ref` risolto (il branch principale se non indicato).
        commitSha:
          type: string
        paths:
          type: array
          maxItems: 50000
          description: Percorsi dei file (non delle cartelle), in ordine alfabetico, al massimo 50 000 (`fileListMaxPaths`).
          items:
            type: string
        truncated:
          type: boolean
          description: True se il repo ha piu' di 50 000 file e questi sono i primi 50 000.

    CodeSearchHit:
      type: object
      additionalProperties: false
      required: [path, line, fragment]
      properties:
        path:
          type: string
        line:
          type: integer
          minimum: 1
          description: Numero di riga (da 1) della corrispondenza.
        fragment:
          type: string
          maxLength: 300
          description: La riga della corrispondenza, tagliata a 300 caratteri (`searchFragmentMaxChars`) attorno al testo cercato.

    CodeSearchResult:
      type: object
      additionalProperties: false
      required: [ref, query, results, limitReached, timedOut]
      description: >
        Risultato di "Search code" (regola B5): ricerca testuale senza indice
        sul ref scelto, in un solo repo.
      properties:
        ref:
          type: string
        query:
          type: string
        results:
          type: array
          maxItems: 100
          description: Al massimo 100 risultati (`searchMaxResults`), per percorso e riga. Si cerca solo nei file di testo fino a 1 MB (`searchFileMaxBytes`).
          items:
            $ref: "#/components/schemas/CodeSearchHit"
        limitReached:
          type: boolean
          description: True se ci sono altri risultati oltre i 100 restituiti.
        timedOut:
          type: boolean
          description: "True se la ricerca e' stata interrotta dopo 10 secondi (`searchTimeoutSeconds`); i risultati sono parziali."

    LookupEmailsInput:
      type: object
      additionalProperties: false
      required: [emails]
      properties:
        emails:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            maxLength: 320

    LookupEmailsResult:
      type: object
      additionalProperties: false
      required: [users]
      properties:
        users:
          type: array
          description: Solo le email che corrispondono a un utente; le altre mancano.
          items:
            type: object
            additionalProperties: false
            required: [email, id, username, kind, avatarUrl]
            properties:
              email:
                type: string
              id:
                type: string
                format: uuid
              username:
                $ref: "#/components/schemas/Name"
              kind:
                type: string
                enum: [human, agent]
              avatarUrl:
                type: string
                format: uri
                nullable: true
    LookupIdsInput:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid

    LookupIdsResult:
      type: object
      additionalProperties: false
      required: [users]
      properties:
        users:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, username, kind]
            properties:
              id:
                type: string
                format: uuid
              username:
                $ref: "#/components/schemas/Name"
              kind:
                type: string
                enum: [human, agent]
              email:
                type: string
                description: >
                  Email dell'utente, se ne ha una (M-06/F, C5: core la usa per le
                  notifiche email, mai per gli agenti). Assente senza email.
    UserProfileInput:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
    UserProfileResult:
      type: object
      additionalProperties: false
      required: [id, username, kind, active, teams]
      properties:
        id:
          type: string
          format: uuid
        username:
          $ref: "#/components/schemas/Name"
        kind:
          type: string
          enum: [human, agent]
        active:
          type: boolean
        email:
          type: string
          description: Email dell'utente, se ne ha una. Assente senza email.
        teams:
          type: array
          items:
            type: string
            description: "`organizzazione/team`."
    ResolveMentionsInput:
      type: object
      additionalProperties: false
      required: [names]
      properties:
        names:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 80
            description: "`utente` oppure `org/team`, senza la chiocciola."
    ResolveMentionsResult:
      type: object
      additionalProperties: false
      required: [users, teams]
      properties:
        users:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, id, username, kind]
            properties:
              name:
                type: string
                description: Il nome cosi' come e' stato chiesto.
              id:
                type: string
                format: uuid
              username:
                $ref: "#/components/schemas/Name"
              kind:
                type: string
                enum: [human, agent]
        teams:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, members]
            properties:
              name:
                type: string
                description: Il nome `org/team` cosi' come e' stato chiesto.
              members:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [id, username, kind]
                  properties:
                    id:
                      type: string
                      format: uuid
                    username:
                      $ref: "#/components/schemas/Name"
                    kind:
                      type: string
                      enum: [human, agent]
    IssueState:
      type: string
      enum: [open, closed]
    IssueCloseReason:
      type: string
      enum: [completed, not_planned, duplicate]
      description: Motivo di chiusura (I2). `completed` e' anche quello di `fixes #n`.
    IssueUser:
      type: object
      additionalProperties: false
      required: [id, username, kind]
      properties:
        id:
          type: string
          format: uuid
        username:
          $ref: "#/components/schemas/Name"
        kind:
          type: string
          enum: [human, agent]
        displayName:
          type: string
    IssueViaToken:
      type: object
      additionalProperties: false
      required: [id, name]
      description: Token personale con cui e' stata creata la risorsa (mockup 13, "via token").
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    IssueLabelRef:
      type: object
      additionalProperties: false
      required: [id, name, color]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          $ref: "#/components/schemas/LabelColor"
    IssueMilestoneRef:
      type: object
      additionalProperties: false
      required: [number, title, state]
      properties:
        number:
          type: integer
          format: int64
        title:
          type: string
        state:
          type: string
          enum: [open, closed]
    LabelColor:
      type: string
      pattern: '^[0-9a-fA-F]{6}$'
      description: Colore esadecimale a sei cifre, senza `#`.
      example: d73a4a
    Issue:
      type: object
      additionalProperties: false
      required:
        - id
        - number
        - title
        - body
        - state
        - author
        - labels
        - assignees
        - locked
        - hidden
        - edited
        - commentCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          format: int64
          description: >
            `#n`, dal contatore del repo condiviso con le PR (I1); non si riusa mai.
        title:
          type: string
          minLength: 1
          maxLength: 256
        body:
          type: string
          maxLength: 65536
          description: Markdown (D10).
        state:
          $ref: "#/components/schemas/IssueState"
        closeReason:
          allOf:
            - $ref: "#/components/schemas/IssueCloseReason"
          nullable: true
          type: object
          description: Presente solo se `state` e' `closed`; azzerato dalla riapertura (I2).
        duplicateOf:
          type: integer
          format: int64
          nullable: true
          description: Numero della issue di cui questa e' un duplicato (solo con `closeReason=duplicate`).
        author:
          $ref: "#/components/schemas/IssueUser"
        viaToken:
          $ref: "#/components/schemas/IssueViaToken"
        labels:
          type: array
          items:
            $ref: "#/components/schemas/IssueLabelRef"
        assignees:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/IssueUser"
        milestone:
          allOf:
            - $ref: "#/components/schemas/IssueMilestoneRef"
          nullable: true
          type: object
        locked:
          type: boolean
          description: Discussione bloccata (I11).
        hidden:
          type: boolean
          description: "Nascosta (I4). Chi non e' `admin` non la riceve mai: e' 404."
        edited:
          type: boolean
          description: Il testo e' stato modificato (I4); le versioni precedenti sono per `admin`.
        commentCount:
          type: integer
          minimum: 0
          description: Commenti non eliminati.
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/IssueAttachment"
        closedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IssueSummary:
      type: object
      description: "Issue negli elenchi: senza testo."
      additionalProperties: false
      required: [number, title, state, author, labels, assignees, commentCount, linkedCommitCount, createdAt, updatedAt]
      properties:
        number:
          type: integer
          format: int64
        title:
          type: string
        state:
          $ref: "#/components/schemas/IssueState"
        closeReason:
          allOf:
            - $ref: "#/components/schemas/IssueCloseReason"
          nullable: true
          type: object
        author:
          $ref: "#/components/schemas/IssueUser"
        labels:
          type: array
          items:
            $ref: "#/components/schemas/IssueLabelRef"
        assignees:
          type: array
          items:
            $ref: "#/components/schemas/IssueUser"
        milestone:
          allOf:
            - $ref: "#/components/schemas/IssueMilestoneRef"
          nullable: true
          type: object
        locked:
          type: boolean
        commentCount:
          type: integer
          minimum: 0
        linkedCommitCount:
          type: integer
          minimum: 0
          description: "Commit distinti collegati (commit_linked, closed_by_commit) che il chiamante può vedere."
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IssueList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IssueSummary"
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
    IssueSearchResult:
      type: object
      additionalProperties: false
      required: [repo, issue]
      properties:
        repo:
          type: string
          description: "`owner/nome` del repo."
        issue:
          $ref: "#/components/schemas/IssueSummary"
    IssueSearchResultList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IssueSearchResult"
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
    CreateIssueInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 256
        body:
          type: string
          maxLength: 65536
          default: ""
        labels:
          type: array
          description: Nomi di etichette del repo. Richiede `write`.
          items:
            type: string
        assignees:
          type: array
          maxItems: 10
          description: Nomi utente con `write`. Richiede `write`.
          items:
            $ref: "#/components/schemas/Name"
        milestone:
          type: integer
          format: int64
          description: Numero di una milestone del repo. Richiede `write`.
        attachmentIds:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
    UpdateIssueInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 256
        body:
          type: string
          maxLength: 65536
        attachmentIds:
          type: array
          maxItems: 20
          description: Allegati gia' caricati dall'autore, da collegare alla issue (I9). Anche da soli, senza `title` o `body`.
          items:
            type: string
            format: uuid
    CloseIssueInput:
      type: object
      additionalProperties: false
      properties:
        reason:
          allOf:
            - $ref: "#/components/schemas/IssueCloseReason"
          default: completed
          type: object
        duplicateOf:
          type: integer
          format: int64
          minimum: 1
          description: Obbligatorio con `reason=duplicate`, vietato altrimenti.
    SetIssueHiddenInput:
      type: object
      additionalProperties: false
      required: [hidden]
      properties:
        hidden:
          type: boolean
    LockIssueInput:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 256
          description: Motivo facoltativo, mostrato nella cronologia.
    SetIssueAssigneesInput:
      type: object
      additionalProperties: false
      required: [assignees]
      properties:
        assignees:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/Name"
    SetIssueLabelsInput:
      type: object
      additionalProperties: false
      required: [labels]
      properties:
        labels:
          type: array
          maxItems: 100
          items:
            type: string
    SetIssueMilestoneInput:
      type: object
      additionalProperties: false
      required: [milestone]
      properties:
        milestone:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          description: Numero della milestone, o `null` per toglierla.
    IssueComment:
      type: object
      additionalProperties: false
      required: [id, issueNumber, body, author, edited, deleted, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        issueNumber:
          type: integer
          format: int64
        body:
          type: string
          maxLength: 65536
          description: Markdown; vuoto se `deleted`.
        author:
          $ref: "#/components/schemas/IssueUser"
        viaToken:
          $ref: "#/components/schemas/IssueViaToken"
        edited:
          type: boolean
        deleted:
          type: boolean
          description: "Eliminato (comment deleted, I4): resta la traccia, senza testo."
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/IssueAttachment"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IssueCommentList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IssueComment"
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
    CreateIssueCommentInput:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 65536
        attachmentIds:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
    UpdateIssueCommentInput:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 65536
    TextVersion:
      type: object
      additionalProperties: false
      required: [version, body, editor, createdAt]
      properties:
        version:
          type: integer
          minimum: 1
          description: 1 e' il testo originale.
        title:
          type: string
          description: Solo per le versioni della issue.
        body:
          type: string
        editor:
          $ref: "#/components/schemas/IssueUser"
        createdAt:
          type: string
          format: date-time
          description: Quando questa versione e' stata sostituita.
    TextVersionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TextVersion"
    IssueEventType:
      type: string
      enum:
        - opened
        - closed
        - reopened
        - renamed
        - edited
        - labeled
        - unlabeled
        - assigned
        - unassigned
        - milestoned
        - demilestoned
        - locked
        - unlocked
        - hidden
        - unhidden
        - comment_deleted
        - referenced
        - referenced_from
        - commit_linked
        - closed_by_commit
    IssueEvent:
      type: object
      additionalProperties: false
      required: [id, type, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/IssueEventType"
        actor:
          allOf:
            - $ref: "#/components/schemas/IssueUser"
          nullable: true
          type: object
          description: Assente per gli eventi di sistema (es. chiusura da `fixes #n`).
        data:
          type: object
          additionalProperties: true
          description: >
            Dettagli dell'evento: `closed` ha `reason` e `duplicateOf`; `labeled` e `unlabeled` ha `label`;
            `assigned` e `unassigned` ha `assignee`; `milestoned` ha `milestone`; `renamed` ha `from` e `to`;
            `referenced` (non piu' scritto, sostituito da `commit_linked`) ha `commit`; `comment_deleted` ha `commentId`.
            Eventi di M-06: `referenced_from` (C1, "referenced from owner/repo#n") ha `source`
            (`kind` issue|pull_request, `repository` `owner/repo`, `number`, `title`, `commentId` se cita un commento) e compare solo a chi vede entrambi i repo; `commit_linked` (C2, "linked
            commit") ha `commit`
            (`sha`, `repository` `owner/repo`, `subject`, `ref`, `authorName`); `closed_by_commit` (C2, "closed by commit <sha>") ha
            `commit` e `reason` `completed`, senza `actor`, ed e' l'unico evento scritto per una chiusura
            da `fixes #n` (non c'e' anche un `closed`).
        createdAt:
          type: string
          format: date-time
    IssueEventList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IssueEvent"
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
    UploadIssueAttachmentInput:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
    IssueAttachment:
