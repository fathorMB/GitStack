        id:
          type: string
          format: uuid
          readOnly: true
          description: Id della risorsa (`type=repo`) in core.
        owner:
          $ref: "#/components/schemas/RepoOwner"
        name:
          $ref: "#/components/schemas/RepoName"
        fullName:
          type: string
          description: "`owner/name`."
          example: alice/my-app
        description:
          type: string
          maxLength: 1024
        visibility:
          $ref: "#/components/schemas/RepoVisibility"
        defaultBranch:
          type: string
          example: main
        protectDefaultBranch:
          type: boolean
          description: Force-push ed eliminazione del branch principale rifiutati (R9).
        archived:
          type: boolean
        archivedAt:
          type: string
          format: date-time
          nullable: true
        empty:
          type: boolean
          description: Il repo non ha ancora nessun commit.
        cloneUrls:
          $ref: "#/components/schemas/RepoCloneUrls"
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    CreateRepositoryInput:
      type: object
      additionalProperties: false
      required: [owner, name]
      properties:
        owner:
          $ref: "#/components/schemas/Name"
        name:
          $ref: "#/components/schemas/RepoName"
        description:
          type: string
          maxLength: 1024
        visibility:
          $ref: "#/components/schemas/RepoVisibility"
        readme:
