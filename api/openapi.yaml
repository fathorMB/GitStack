        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /repos/deleted/{repoId}/restore:
    parameters:
      - name: repoId
        in: path
        required: true
        description: Identificatore del repo eliminato (`DeletedRepository.id`).
        schema:
          type: string
          format: uuid
    post:
      operationId: restoreRepository
      tags: [repos]
      x-required-scopes: ["write:resource"]
      summary: Ripristina un repo eliminato
      description: >
        Serve il ruolo `admin` sul repo (R12). Risponde 404 se il repo non
        esiste, non e' eliminato o il periodo di 7 giorni e' scaduto.
      responses:
        "200":
          description: Repo ripristinato.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /repos/{owner}/{repo}:
    parameters:
      - $ref: "#/components/parameters/RepoOwnerParam"
      - $ref: "#/components/parameters/RepoNameParam"
    get:
      operationId: getRepository
      tags: [repos]
      x-required-scopes: ["read:resource"]
      summary: Legge un repo per owner/nome
      description: >
        Un repo che l'utente non puo' leggere risponde 404, non 403, per non
        rivelarne l'esistenza.
      responses:
        "200":
          description: Il repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"
    patch:
      operationId: updateRepository
      tags: [repos]
      x-required-scopes: ["write:resource"]
      summary: Modifica le impostazioni di un repo
      description: >
        Serve il ruolo `admin` (403 se l'utente legge ma non ha il ruolo).
        Il branch principale (R4) deve essere un branch esistente;
        `protectDefaultBranch` e' R9; `archived` archivia o riattiva (R10).
        Owner e nome non cambiano mai (R3). Un repo archiviato rifiuta ogni
        modifica con 409, tranne `archived: false` da solo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRepositoryInput"
      responses:
        "200":
          description: Repo aggiornato.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"
    delete:
      operationId: deleteRepository
      tags: [repos]
      x-required-scopes: ["write:resource"]
      summary: Elimina un repo (recuperabile per 7 giorni)
      description: >
        Serve il ruolo `admin` (R12). Il repo sparisce subito per tutti e
        resta ripristinabile per 7 giorni (R2); il nome resta occupato.
      responses:
        "204":
          description: Repo eliminato.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/verify:
    post:
      operationId: verifyCredential
      tags: [internal]
      summary: Verifica una credenziale (per il gateway)
      description: >
        Il gateway invia il valore grezzo della credenziale (cookie di
        sessione oppure token `gst_...`) e riceve il principal. Non c'e'
        distinzione fra "sconosciuta", "scaduta" e "revocata": `active` false.
        Aggiorna `last_used_at` (al piu' una volta al minuto per credenziale).
      security:
        - serviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyCredentialInput"
      responses:
        "200":
          description: Esito della verifica.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyCredentialResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/permissions/check:
    post:
      operationId: checkPermission
      tags: [internal]
      summary: Verifica un permesso su una risorsa
      description: >
        Usata da core e git per applicare i permessi: `allowed` e' vero se
        l'utente ha almeno il ruolo richiesto sulla risorsa (grant diretto,
        via team, amministratore; owner dell'organizzazione e proprietario
        del repo personale sono admin, una risorsa interna e' leggibile da
        ogni utente attivo: P1, P6, P3).
      security:
        - serviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckPermissionInput"
      responses:
        "200":
          description: Esito.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckPermissionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/permissions/readable-resources:
    post:
      operationId: listReadableResources
      tags: [internal]
      summary: Risorse leggibili da un utente
      description: >
        Usata da core per filtrare l'elenco delle risorse: `resourceIds` sono
        le risorse su cui l'utente ha almeno read (grant diretto, via team o
        via owner dell'organizzazione, owner della risorsa o visibilita'
        interna: stesse regole di `checkPermission`). `all` e' vero solo per
        l'amministratore di sistema, e in quel caso `resourceIds` e' vuoto.
        Un utente inesistente o disattivato riceve `all` falso e nessuna
        risorsa.
      security:
        - serviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadableResourcesInput"
      responses:
        "200":
          description: Risorse leggibili.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadableResourcesResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/resources/{resourceId}/grants/creator:
    parameters:
      - name: resourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: grantResourceCreator
      tags: [internal]
      summary: Assegna il ruolo admin al creatore di una risorsa
      description: >
        Usata da core dopo la creazione di una risorsa: l'utente indicato
        riceve il grant admin (granted_by = lo stesso utente). Idempotente:
        se l'utente ha gia' un grant sulla risorsa lo porta ad admin e
        risponde 200.
      security:
        - serviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantResourceCreatorInput"
      responses:
        "200":
          description: Il grant dell'utente esisteva gia' ed e' ora admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Grant"
        "201":
          description: Grant creato.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Grant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/ssh-keys/{fingerprint}:
    parameters:
      - name: fingerprint
        in: path
        required: true
        description: Fingerprint `SHA256:...` (URL-encoded).
        schema:
          type: string
          pattern: "^SHA256:[A-Za-z0-9+/]{43}$"
    get:
      operationId: lookupSshKey
      tags: [internal]
      summary: Risolve un utente dal fingerprint di una chiave SSH
      description: Usata dal servizio git all'accesso SSH. Aggiorna `lastUsedAt`.
      security:
        - serviceAuth: []
      responses:
        "200":
          description: Chiave e utente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SshKeyLookup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/resources/{resourceId}/attributes:
    parameters:
      - name: resourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: setResourceAttributes
      tags: [internal]
      summary: Imposta owner e visibilita' di una risorsa (per core)
      description: >
        Servita da identity (D-C, M-03). Core la chiama alla creazione di un
        repo, prima di `grantResourceCreator`, e a ogni cambio di
        visibilita'. L'owner non cambia mai (R3). Idempotente. Una risorsa
        senza attributi si comporta come prima di M-03. Con attributi valgono
        P1 (owner dell'organizzazione: admin), P6 (proprietario del repo
        personale: admin) e P3 (interno: read a ogni utente attivo), sia in
        `checkPermission` sia in `listReadableResources`. 404 se l'owner non
        esiste, 409 se la risorsa ha gia' un altro owner.
      security:
        - serviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceAttributesInput"
      responses:
        "204":
          description: Attributi impostati.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/owners/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 39
    get:
      operationId: resolveOwner
      tags: [internal]
      summary: Risolve il nome di un utente o di un'organizzazione
      description: >
        Spazio di nomi unico (R1): restituisce tipo e id di chi si chiama
        cosi', 404 se il nome non esiste.
      security:
        - serviceAuth: []
      responses:
        "200":
          description: Owner trovato.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerRef"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/git/repos:
    post:
      operationId: gitCreateRepo
      tags: [git-internal]
      summary: Crea il repo su disco (per core)
      description: >
        Implementata a mano dal servizio git (non generata). Crea il bare
        repo e, se richiesto (R5), il primo commit su `defaultBranch`.
      security:
        - serviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitCreateRepoInput"
      responses:
        "201":
          description: Repo creato.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitRepoCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/git/repos/{repoId}:
    parameters:
      - $ref: "#/components/parameters/GitRepoIdParam"
    get:
      operationId: gitGetRepo
      tags: [git-internal]
      summary: Stato di un repo su disco
      security:
        - serviceAuth: []
      responses:
        "200":
          description: Stato del repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitRepoState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
    delete:
      operationId: gitDeleteRepo
      tags: [git-internal]
      summary: Cancella definitivamente un repo (solo dal cestino)
      description: Risponde 409 se il repo non e' nel cestino.
      security:
        - serviceAuth: []
      responses:
        "204":
          description: Repo cancellato.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/git/repos/{repoId}/trash:
    parameters:
      - $ref: "#/components/parameters/GitRepoIdParam"
    post:
      operationId: gitTrashRepo
      tags: [git-internal]
      summary: Sposta un repo nel cestino (R2)
      security:
        - serviceAuth: []
      responses:
        "204":
          description: Repo nel cestino.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /internal/git/repos/{repoId}/restore:
    parameters:
      - $ref: "#/components/parameters/GitRepoIdParam"
    post:
      operationId: gitRestoreRepo
      tags: [git-internal]
      summary: Ripristina un repo dal cestino (R2)
      security:
        - serviceAuth: []
      responses:
        "204":
          description: Repo ripristinato.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
      description: >
        Token personale `gst_...` verificato dal `gateway` tramite identity.
        Stesso schema per CLI `gs`, skills e agenti. Ogni operazione di
        identity indica gli scope richiesti in `x-required-scopes`; le
        sessioni web (cookie) non hanno scope.
    sessionCookie:
      type: apiKey
      in: cookie
      name: gst_session
      description: >
        Sessione web creata da `POST /auth/login` o dal login OIDC. Valore
        opaco; identity ne conserva solo l'hash.
    serviceAuth:
      type: http
      scheme: bearer
      description: >
        Solo interfaccia interna: segreto condiviso di servizio fra gateway,
        core, git e identity. Non e' un token utente.

  parameters:
    ResourceIdParam:
      name: resourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Identificatore della risorsa.
    RepoOwnerFilter:
      name: owner
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Name"
      description: Filtra per nome dell'utente o dell'organizzazione proprietaria.
    RepoOwnerParam:
      name: owner
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Name"
      description: Nome dell'utente o dell'organizzazione proprietaria (R1).
    RepoNameParam:
      name: repo
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/RepoName"
      description: Nome del repo.
    GitRepoIdParam:
      name: repoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Id del repo (la risorsa `type=repo` in core).
    ResourceTypeFilter:
      name: type
      in: query
      required: false
      schema:
        type: string
        minLength: 1
      description: Filtra per tipo di risorsa (es. `repo`).
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPageParam:
      name: perPage
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UsernameParam:
      name: username
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Name"
    OrgParam:
      name: org
      in: path
      required: true
      description: Nome (slug) dell'organizzazione.
      schema:
        $ref: "#/components/schemas/Name"
    TeamParam:
      name: team
      in: path
      required: true
      description: Nome (slug) del team, unico dentro l'organizzazione.
      schema:
        $ref: "#/components/schemas/Name"
    TokenIdParam:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SshKeyIdParam:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GrantIdParam:
      name: grantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OidcProviderParam:
      name: provider
      in: path
      required: true
      description: Slug del provider OIDC.
      schema:
        $ref: "#/components/schemas/Name"

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          description: Versione del contratto API in esecuzione (`info.version`).

    Resource:
      type: object
      description: >
        Risorsa generica (D15): oggi usata dalla prova end-to-end, in futuro
        anche per repository, applicazioni e database, senza cambiare forma.
      additionalProperties: false
      required: [id, type, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        type:
          type: string
          minLength: 1
          example: repo
          description: "Tipo di risorsa, aperto: non un enum fisso (D15)."
        name:
          type: string
          minLength: 1
          maxLength: 255
        attributes:
          type: object
          description: Attributi specifici del tipo di risorsa, a forma libera.
          additionalProperties: true
          default: {}
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    CreateResourceInput:
      type: object
      additionalProperties: false
      required: [type, name]
      properties:
        type:
          type: string
          minLength: 1
          example: repo
        name:
          type: string
          minLength: 1
          maxLength: 255
        attributes:
          type: object
          additionalProperties: true

    UpdateResourceInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        attributes:
          type: object
          additionalProperties: true

    ResourceList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Resource"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    Error:
      type: object
      description: >
        Formato unico degli errori per tutta l'API pubblica. Codici comuni per
        stato: 400 `bad_request`; 401 `unauthenticated`, `invalid_credentials`;
        403 `forbidden`, `insufficient_scope`, `password_change_required`; 429 `too_many_attempts`; 404 `not_found`; 409 `conflict`
        e varianti specifiche (`already_exists`, `last_admin`, `last_owner`,
        `ssh_key_in_use`, `oidc_identity_unlinked`); 422 `validation_failed`
        (`details.fields`). Le risposte 401 non distinguono mai "utente
        inesistente" da "password errata".
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: Codice stabile leggibile da macchina (es. `not_found`).
              example: not_found
            message:
              type: string
              description: Messaggio leggibile da persone, non contrattuale.
            details:
              type: object
              additionalProperties: true
              description: Dettagli opzionali specifici dell'errore.
    Name:
      type: string
      description: >
        Nome breve in minuscolo (username, organizzazione, team, provider):
        lettere minuscole, cifre e trattini, 1-39 caratteri, inizia e finisce
        con un carattere alfanumerico.
      pattern: "^[a-z0-9]([a-z0-9-]{0,37}[a-z0-9])?$"
      minLength: 1
      maxLength: 39
      example: alice

    TokenScope:
      type: string
      description: >
        Catalogo degli scope dei token personali (unico, condiviso da tutti i
        servizi). Le sessioni web non hanno scope: valgono i permessi
        dell'utente. `write:*` include `read:*` dello stesso ambito;
        `admin:org` include `write:org`.
      enum:
        - read:user
        - write:user
        - read:org
        - write:org
        - admin:org
        - read:resource
        - write:resource

    ResourceRole:
      type: string
      description: Ruolo su una risorsa, in ordine crescente di potere.
      enum: [read, write, admin]

    LoginInput:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 254
          description: Username oppure email.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
          writeOnly: true

    User:
      type: object
      description: >
        Profilo utente. `email`, `isAdmin`, `isActive`, `createdAt` sono
        presenti solo per l'utente stesso e per gli amministratori.
      additionalProperties: false
      required: [id, username, kind, displayName]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          $ref: "#/components/schemas/Name"
        kind:
          type: string
          enum: [human, agent]
        displayName:
          type: string
          maxLength: 128
        bio:
          type: string
          maxLength: 1024
        avatarUrl:
          type: string
          format: uri
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        isAdmin:
          type: boolean
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
          readOnly: true

    CreateUserInput:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username:
          $ref: "#/components/schemas/Name"
        kind:
          type: string
          enum: [human, agent]
          default: human
        email:
          type: string
          format: email
        displayName:
          type: string
          maxLength: 128
        password:
          type: string
          minLength: 12
          maxLength: 1024
          format: password
          writeOnly: true
          description: Assente per gli agenti (accedono solo con token) e per chi entra solo via OIDC.
        isAdmin:
          type: boolean
          default: false

    UpdateUserInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          maxLength: 128
        bio:
          type: string
          maxLength: 1024
        avatarUrl:
          type: string
          format: uri
          nullable: true
        email:
          type: string
          format: email
        isAdmin:
          type: boolean
          description: Solo amministratori.
        isActive:
          type: boolean
          description: Solo amministratori. Disattivare revoca le sessioni e i token.

    UserList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    ChangePasswordInput:
      type: object
      additionalProperties: false
      required: [newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          writeOnly: true
          maxLength: 1024
        newPassword:
          type: string
          minLength: 12
          maxLength: 1024
          format: password
          writeOnly: true

    CurrentSession:
      type: object
      additionalProperties: false
      required: [user, authMethod, mustChangePassword]
      properties:
        user:
          $ref: "#/components/schemas/User"
        authMethod:
          type: string
          enum: [password, oidc, token]
          description: Come e' stato autenticato il chiamante.
        mustChangePassword:
          type: boolean
          description: >
            Vero per l'amministratore creato al primo avvio finche' non cambia
            la password iniziale. Finche' e' vero ogni chiamata autenticata
            risponde 403 `password_change_required`, tranne `GET
            /auth/session`, `POST /auth/logout` e `PUT
            /users/{username}/password` (solo sulla propria utenza).
        scopes:
          type: array
          description: Solo per `authMethod` = `token`.
          items:
            $ref: "#/components/schemas/TokenScope"
        expiresAt:
          type: string
          format: date-time
          nullable: true

    OidcProvider:
      type: object
      additionalProperties: false
      required: [slug, displayName]
      properties:
        slug:
          $ref: "#/components/schemas/Name"
        displayName:
          type: string

    OidcProviderList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OidcProvider"

    Token:
      type: object
      description: Token personale, senza il valore (che non e' recuperabile).
      additionalProperties: false
      required: [id, name, scopes, hint, createdAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 64
        scopes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TokenScope"
        hint:
          type: string
          minLength: 4
          maxLength: 4
          description: Ultimi 4 caratteri del token, per riconoscerlo.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true

    CreateTokenInput:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TokenScope"
        expiresAt:
          type: string
          format: date-time
          description: >
            Obbligatoria: la scadenza deve essere nel futuro e non oltre il
            massimo configurato dall'installazione (default 365 giorni), altrimenti 422.

    CreatedToken:
      description: Il token appena creato; `token` compare solo in questa risposta.
      allOf:
        - $ref: "#/components/schemas/Token"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              pattern: "^gst_[A-Za-z0-9_-]{32,}$"
              description: Valore in chiaro, formato `gst_<casuale>`. Non viene salvato.

    TokenList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Token"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    SshKey:
      type: object
      additionalProperties: false
      required: [id, title, keyType, fingerprint, createdAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          minLength: 1
          maxLength: 64
        keyType:
          type: string
          example: ssh-ed25519
        fingerprint:
          type: string
          pattern: "^SHA256:[A-Za-z0-9+/]{43}$"
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true

    AddSshKeyInput:
      type: object
      additionalProperties: false
      required: [title, publicKey]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 64
        publicKey:
          type: string
          maxLength: 8192
          example: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... alice@laptop"
          description: Riga in formato `authorized_keys` (tipo, base64, commento facoltativo).

    SshKeyList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SshKey"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    SshKeyLookup:
      type: object
      additionalProperties: false
      required: [key, user]
      properties:
        key:
          $ref: "#/components/schemas/SshKey"
        user:
          $ref: "#/components/schemas/User"

    Organization:
      type: object
      additionalProperties: false
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          $ref: "#/components/schemas/Name"
        displayName:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 1024
        createdAt:
          type: string
          format: date-time
          readOnly: true

    CreateOrganizationInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/Name"
        displayName:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 1024

    UpdateOrganizationInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 1024

    OrganizationList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Organization"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    OrgRole:
      type: string
      description: "`owner` gestisce organizzazione, team e membri; `member` no."
      enum: [owner, member]

    OrgMember:
      type: object
      additionalProperties: false
      required: [user, role, createdAt]
      properties:
        user:
          $ref: "#/components/schemas/User"
        role:
          $ref: "#/components/schemas/OrgRole"
        createdAt:
          type: string
          format: date-time

    SetOrgMemberInput:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/OrgRole"

    OrgMemberList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrgMember"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    Team:
      type: object
      additionalProperties: false
      required: [id, orgId, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        orgId:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/Name"
        description:
          type: string
          maxLength: 1024
        createdAt:
          type: string
          format: date-time
          readOnly: true

    CreateTeamInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/Name"
        description:
          type: string
          maxLength: 1024

    UpdateTeamInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: "#/components/schemas/Name"
        description:
          type: string
          maxLength: 1024

    TeamList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Team"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    TeamRole:
      type: string
      description: "`maintainer` gestisce i membri del team."
      enum: [member, maintainer]

    TeamMember:
      type: object
      additionalProperties: false
      required: [user, role, createdAt]
      properties:
        user:
          $ref: "#/components/schemas/User"
        role:
          $ref: "#/components/schemas/TeamRole"
        createdAt:
          type: string
          format: date-time

    SetTeamMemberInput:
      type: object
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/TeamRole"

    TeamMemberList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TeamMember"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    Grant:
      type: object
      description: Ruolo su una risorsa generica (D15) per un utente o un team.
      additionalProperties: false
      required: [id, resourceId, subjectType, subjectId, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        resourceId:
          type: string
          format: uuid
        subjectType:
          type: string
          enum: [user, team]
        subjectId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ResourceRole"
        createdAt:
          type: string
          format: date-time
          readOnly: true

    CreateGrantInput:
      type: object
      additionalProperties: false
      required: [subjectType, subjectId, role]
      properties:
        subjectType:
          type: string
          enum: [user, team]
        subjectId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ResourceRole"

    UpdateGrantInput:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/ResourceRole"

    GrantList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Grant"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    EffectivePermission:
      type: object
      additionalProperties: false
      required: [resourceId, role]
      properties:
        resourceId:
          type: string
          format: uuid
        role:
          type: string
          allOf:
            - $ref: "#/components/schemas/ResourceRole"
          nullable: true
          description: Ruolo effettivo; `null` = nessun accesso.

    VerifyCredentialInput:
      type: object
      additionalProperties: false
      required: [credential]
      properties:
        credential:
          type: string
          minLength: 1
          maxLength: 512
          writeOnly: true
          description: Valore grezzo della credenziale (cookie `gst_session` o token `gst_...`).
        kind:
          type: string
          enum: [session, token]
          description: Facoltativo, evita l'ambiguita' se il gateway la conosce.

    Principal:
      type: object
      description: Chi ha presentato la credenziale.
      additionalProperties: false
      required: [userId, username, kind, isAdmin, authMethod]
      properties:
        userId:
          type: string
          format: uuid
        username:
          $ref: "#/components/schemas/Name"
        kind:
          type: string
          enum: [human, agent]
        isAdmin:
          type: boolean
        authMethod:
          type: string
          enum: [password, oidc, token]
        scopes:
          type: array
          description: Solo per i token; assenti per le sessioni.
          items:
            $ref: "#/components/schemas/TokenScope"
        mustChangePassword:
          type: boolean
          description: >
            Vero per una sessione la cui password iniziale non e' ancora stata
            cambiata (vedi `CurrentSession.mustChangePassword`). `/internal/verify`
            risponde comunque `active` true: il gateway risponde 403
            `password_change_required` a ogni rotta tranne `GET /auth/session`,
            `POST /auth/logout` e `PUT /users/{username}/password` sulla propria
            utenza. Assente equivale a falso.
        credentialId:
          type: string
          format: uuid
          description: Id della sessione o del token (per audit).
        expiresAt:
          type: string
          format: date-time
          nullable: true

    VerifyCredentialResult:
      type: object
      additionalProperties: false
      required: [active]
      properties:
        active:
          type: boolean
        principal:
          $ref: "#/components/schemas/Principal"
        cacheTtlSeconds:
          type: integer
          minimum: 0
          description: Per quanto tempo il gateway puo' tenere in cache l'esito.

    GrantResourceCreatorInput:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid

    CheckPermissionInput:
      type: object
      additionalProperties: false
      required: [userId, resourceId, role]
      properties:
        userId:
          type: string
          format: uuid
        resourceId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ResourceRole"

    CheckPermissionResult:
      type: object
      additionalProperties: false
      required: [allowed]
      properties:
        allowed:
          type: boolean
        effectiveRole:
          type: string
          allOf:
            - $ref: "#/components/schemas/ResourceRole"
          nullable: true

    ReadableResourcesInput:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid

    ReadableResourcesResult:
      type: object
      additionalProperties: false
      required: [all, resourceIds]
      properties:
        all:
          type: boolean
        resourceIds:
          type: array
          items:
            type: string
            format: uuid

    RepoName:
      type: string
      description: >
        Nome di un repo (R11): minuscole, cifre, `-`, `_`, `.`; 1-100
        caratteri; non inizia con `.`; non finisce con `.git` (regola
        applicata dal servizio, non esprimibile nel pattern). Le maiuscole
        sono rifiutate. Unico per owner.
      pattern: "^[a-z0-9_-][a-z0-9._-]{0,99}$"
      minLength: 1
      maxLength: 100
      example: my-app

    RepoVisibility:
      type: string
      description: >
        Visibilita' (P7): `private` (solo chi ha un grant) o `internal`
        (tutti gli utenti dell'installazione). Nessun accesso anonimo.
      enum: [private, internal]
      default: private

    GitignoreTemplate:
      type: string
      description: Modello di `.gitignore` per il contenuto iniziale (R5).
      enum: [go, node, python, java, dotnet, rust, cpp, terraform, ruby, php]

    LicenseTemplate:
      type: string
      description: Modello di licenza per il contenuto iniziale (R5).
      enum:
        - mit
        - apache-2.0
        - gpl-3.0
        - agpl-3.0
        - lgpl-3.0
        - mpl-2.0
        - bsd-2-clause
        - bsd-3-clause
        - unlicense

    OwnerType:
      type: string
      enum: [user, organization]

    RepoOwner:
      type: object
      additionalProperties: false
      required: [type, name]
      properties:
        type:
          $ref: "#/components/schemas/OwnerType"
        name:
          $ref: "#/components/schemas/Name"

    RepoCloneUrls:
      type: object
      description: >
        Indirizzi di clone dell'installazione (R1, R7). L'indirizzo SSH e'
        sempre quello completo `ssh://git@<host>:<porta>/<owner>/<repo>.git`.
      additionalProperties: false
      required: [https, ssh]
      properties:
        https:
          type: string
          example: https://git.example.com/alice/my-app.git
        ssh:
          type: string
          example: ssh://git@git.example.com:2222/alice/my-app.git
        sshShort:
          type: string
          description: >
            Forma corta `git@<host>:<owner>/<repo>.git` (R7): presente solo
            quando la porta SSH dell'installazione e' 22.
          example: git@git.example.com:alice/my-app.git

    Repository:
      type: object
      additionalProperties: false
      required:
        - id
        - owner
        - name
        - fullName
        - description
        - visibility
        - defaultBranch
        - protectDefaultBranch
        - archived
        - empty
        - cloneUrls
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Id della risorsa (`type=repo`) in core.
        owner:
          $ref: "#/components/schemas/RepoOwner"
        name:
          $ref: "#/components/schemas/RepoName"
        fullName:
          type: string
          description: "`owner/name`."
          example: alice/my-app
        description:
          type: string
          maxLength: 1024
        visibility:
          $ref: "#/components/schemas/RepoVisibility"
        defaultBranch:
          type: string
          example: main
        protectDefaultBranch:
          type: boolean
          description: Force-push ed eliminazione del branch principale rifiutati (R9).
        archived:
          type: boolean
        archivedAt:
          type: string
          format: date-time
          nullable: true
        empty:
          type: boolean
          description: Il repo non ha ancora nessun commit.
        cloneUrls:
          $ref: "#/components/schemas/RepoCloneUrls"
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    CreateRepositoryInput:
      type: object
      additionalProperties: false
      required: [owner, name]
      properties:
        owner:
          $ref: "#/components/schemas/Name"
        name:
          $ref: "#/components/schemas/RepoName"
        description:
          type: string
          maxLength: 1024
        visibility:
          $ref: "#/components/schemas/RepoVisibility"
        readme:
          type: boolean
          default: false
          description: Crea un `README.md` iniziale (R5).
        gitignoreTemplate:
          $ref: "#/components/schemas/GitignoreTemplate"
        licenseTemplate:
          $ref: "#/components/schemas/LicenseTemplate"

    UpdateRepositoryInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        description:
          type: string
          maxLength: 1024
        visibility:
          $ref: "#/components/schemas/RepoVisibility"
        defaultBranch:
          type: string
          minLength: 1
          maxLength: 255
        protectDefaultBranch:
          type: boolean
        archived:
          type: boolean

    RepositoryList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Repository"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    DeletedRepository:
      type: object
      additionalProperties: false
      required: [id, owner, name, deletedAt, purgeAt]
      properties:
        id:
          type: string
          format: uuid
        owner:
          $ref: "#/components/schemas/RepoOwner"
        name:
          $ref: "#/components/schemas/RepoName"
        deletedAt:
          type: string
          format: date-time
        purgeAt:
          type: string
          format: date-time
          description: Dopo questo istante il repo e' cancellato definitivamente (7 giorni, R2).

    DeletedRepositoryList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DeletedRepository"

    ResourceAttributesInput:
      type: object
      additionalProperties: false
      required: [ownerType, ownerId, visibility]
      properties:
        ownerType:
          $ref: "#/components/schemas/OwnerType"
        ownerId:
          type: string
          format: uuid
        visibility:
          $ref: "#/components/schemas/RepoVisibility"

    OwnerRef:
      type: object
      additionalProperties: false
      required: [type, id, name]
      properties:
        type:
          $ref: "#/components/schemas/OwnerType"
        id:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/Name"

    GitCreateRepoInput:
      type: object
      additionalProperties: false
      required: [repoId, name, author]
      properties:
        repoId:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/RepoName"
        description:
          type: string
          maxLength: 1024
        defaultBranch:
          type: string
          default: main
        readme:
          type: boolean
          default: false
        gitignoreTemplate:
          $ref: "#/components/schemas/GitignoreTemplate"
        licenseTemplate:
          $ref: "#/components/schemas/LicenseTemplate"
        licenseHolder:
          type: string
          maxLength: 255
        author:
          type: object
          additionalProperties: false
          required: [name, email]
          properties:
            name:
              type: string
            email:
              type: string

    GitRepoCreated:
      type: object
      additionalProperties: false
      required: [repoId, empty]
      properties:
        repoId:
          type: string
          format: uuid
        empty:
          type: boolean

    GitRepoState:
      type: object
      additionalProperties: false
      required: [repoId, trashed, empty]
      properties:
        repoId:
          type: string
          format: uuid
        trashed:
          type: boolean
        empty:
          type: boolean
        branches:
          type: array
          description: Branch esistenti (`refs/heads`), in ordine alfabetico (R4).
          items:
            type: string

  responses:
    TooManyRequests:
      description: >
        Troppi tentativi (`too_many_attempts`): riprovare dopo il numero di
        secondi indicato in `Retry-After`.
      headers:
        Retry-After:
          description: Secondi da attendere prima di riprovare.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Richiesta non valida.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Token mancante o non valido.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Risorsa non trovata.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflitto con lo stato attuale della risorsa.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnexpectedError:
      description: Errore imprevisto.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >
        Autenticato ma non autorizzato: scope del token insufficiente
        (`insufficient_scope`, con `details.required`) o permesso mancante
        (`forbidden`), oppure password iniziale ancora da cambiare
        (`password_change_required`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: >
        Richiesta ben formata ma non valida semanticamente (`validation_failed`,
        con `details.fields` = mappa campo -> motivo).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

security:
  - bearerAuth: []
  - sessionCookie: []
