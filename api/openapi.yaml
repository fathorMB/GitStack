      summary: Invia lo stato di un commit da un sistema esterno
      description: >
        Serve `write` (PR9). Lo stato e' `pending`, `success`, `failure` o `error`, per un `context` (default
        `default`); un nuovo stato dello stesso contesto sostituisce il precedente (aggiorna stato, descrizione e link). Il commit deve esistere nel repo (404). Gli stati compaiono nella PR, nella vista del commit,
        nell'API e in `gs`, e quelli dei contesti obbligatori (PR4) bloccano il merge. La CI di v2 usera' la
        stessa operazione. Un repo archiviato rifiuta ogni modifica con 409 `archived` (R10).
      requestBody:
