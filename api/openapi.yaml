          $ref: "#/components/schemas/Name"
        description:
          type: string
          maxLength: 1024

    UpdateTeamInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: "#/components/schemas/Name"
        description:
          type: string
          maxLength: 1024

    TeamList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Team"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    TeamRole:
      type: string
      description: "`maintainer` gestisce i membri del team."
      enum: [member, maintainer]

    TeamMember:
      type: object
      additionalProperties: false
