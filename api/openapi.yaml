            $ref: "#/components/schemas/Organization"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    OrgRole:
      type: string
      description: "`owner` gestisce organizzazione, team e membri; `member` no."
      enum: [owner, member]

    OrgMember:
      type: object
      additionalProperties: false
      required: [user, role, createdAt]
      properties:
        user:
          $ref: "#/components/schemas/User"
        role:
          $ref: "#/components/schemas/OrgRole"
        createdAt:
          type: string
          format: date-time

    SetOrgMemberInput:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/OrgRole"

    OrgMemberList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrgMember"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    Team:
      type: object
      additionalProperties: false
      required: [id, orgId, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        orgId:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/Name"
        description:
          type: string
          maxLength: 1024
        createdAt:
          type: string
          format: date-time
