      summary: Legge le impostazioni «Branches & merge» del repo
      description: >
        Metodi di merge ammessi, eliminazione automatica del branch (PR3) e protezione «Richiedi una Pull
        Request» del branch principale (PR4). Le legge chi puo' leggere il repo (servono per proporre il metodo
        di merge); le modifica solo `admin`. Un repo che l'utente non puo' leggere risponde 404.
