  # ---------------------------------------------------------------------
  # Notifiche, iscrizioni, Watch e preferenze email (M-06, regole C3-C5, C9).
  # Servite da core. La casella e' dell'utente corrente (persona o agente,
  # C4): nessun percorso con lo username, nessun accesso alla casella altrui.
  # ---------------------------------------------------------------------
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      x-required-scopes: ["read:resource"]
      x-mcp:
        expose: true
        name: notification_list
        destructive: false
      summary: Casella delle notifiche
      description: >
        Notifiche dell'utente corrente, dalla piu' recente (`createdAt` decrescente, poi `id`). Filtri: `reason`
        (uno o piu' motivi separati da virgola), `state` (`unread` default, `read`, `archived`, `all`; le archiviate
        compaiono solo con `archived` o `all`) e `repo` (`owner/repo`). Stessa casella e stesse regole per persone e
        agenti (C4); `gs notification list --json` usa questa operazione. Le notifiche di un repo che l'utente non
        legge piu' non compaiono e vengono eliminate (C9). `unreadCount` conta le non lette non archiviate
        dell'utente, con i soli filtri `reason` e `repo`.
      parameters:
        - $ref: "#/components/parameters/NotificationReasonFilter"
        - $ref: "#/components/parameters/NotificationStateFilter"
        - $ref: "#/components/parameters/NotificationRepoFilter"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
      responses:
        "200":
          description: Pagina di notifiche.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/UnexpectedError"
    delete:
      operationId: deleteNotifications
      tags: [notifications]
      x-required-scopes: ["write:resource"]
      x-mcp:
        expose: false
        name: notifications_delete
        destructive: true
      summary: Elimina in blocco le notifiche
      description: >
        Elimina le notifiche dell'utente corrente nello stato indicato (`read` o `archived`; le non lette non si
        eliminano in blocco), con gli stessi filtri `reason` e `repo` dell'elenco (C9). Risponde 200 con il numero
        di notifiche eliminate.
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
            enum: [read, archived]
        - $ref: "#/components/parameters/NotificationReasonFilter"
        - $ref: "#/components/parameters/NotificationRepoFilter"
      responses:
        "200":
          description: Notifiche eliminate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedNotifications"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/UnexpectedError"

