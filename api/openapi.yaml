      tags: [auth]
      x-mcp:
        expose: false
        name: oidc_login_finish
        destructive: false
      summary: Completa il login OIDC
      description: >
        Callback del provider. Se l'identita' (provider, subject) e' gia'
        collegata a un utente crea la sessione (cookie `gst_session`) e fa
        redirect (302) a `redirectTo`. Altrimenti decide la configurazione
        del provider: con `linkByVerifiedEmail` (default false) e un'email
        che il provider dichiara verificata (`email_verified`) collega
        l'identita' all'utente locale con quella email; con
        `autoCreateUsers` (default false) crea un nuovo utente (senza
        password) e lo collega; un'email non verificata non si collega mai a
        un utente esistente. In tutti gli altri casi (compreso il default, con
        entrambe le opzioni a false) risponde 409 `oidc_identity_unlinked`.
