      tags: [mirrors]
      x-required-scopes: ["read:resource"]
      x-mcp:
        expose: false
        name: repo_mirrors_list
        destructive: false
      summary: Elenca i mirror in push di un repo
      description: >
        Serve `admin` sul repo (V8); un repo che non si legge risponde 404, uno senza `admin` 403. Il token non
        torna mai: `hasToken` dice solo che c'e'. Ogni mirror porta lo stato dell'ultimo tentativo (`state`,
        `lastAttemptAt`, `lastError`, `lastPushed`). Paginazione come `GET /repos`.
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
      responses:
        "200":
          description: Pagina di mirror.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoMirrorList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
    post:
      operationId: createRepoMirror
      tags: [mirrors]
      x-required-scopes: ["write:resource"]
      x-mcp:
        expose: false
        name: repo_mirror_create
        destructive: false
      summary: Crea un mirror in push di un repo
      description: >
        Serve `admin` sul repo (V8). Il mirror spinge il branch principale e i tag del repo su un altro server Git
        in HTTPS, a ogni push su quei ref e su richiesta (`sync`), SEMPRE senza push forzato: se la destinazione ha
        una storia diversa il mirror si ferma (`state: diverged`) e non sovrascrive mai. `url` e' `https://` senza
        credenziali nell'indirizzo; sempre bloccati loopback, indirizzi interni del cluster e link-local anche dopo
        la risoluzione DNS, e le destinazioni vietate dall'amministratore (C8): 422 `url_not_allowed`
        (`details.fields.url`). `username` e `token` sono la credenziale per la destinazione (per GitHub: utente
        e token personale con permesso di scrittura): il token e' cifrato (AES-256-GCM, come i segreti dei
