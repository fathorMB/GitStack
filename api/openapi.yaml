openapi: 3.0.3
info:
  title: GitStack API
  version: "0.1.0"
  description: >
    API pubblica di GitStack (fonte unica del contratto, decisione D8
    [c_f68d7615da93197a]). Unico punto d'ingresso: il servizio `gateway`.
    UI web, CLI `gs`, skills per agenti e in futuro server MCP usano tutti
    questa stessa API (principio API-first, decisione D7 [c_3780bc749c6ed28d]).

    Il modello dati usa risorse generiche (decisione D15
    [c_4ef209e79c5b2ddb]): oggi la sola risorsa di prova dello scheletro
    end-to-end, domani repository, applicazioni, database e altro senza
    cambiare forma dell'API.

    Ogni versione dell'API vive sotto un prefisso di percorso esplicito
    (`/v1`); `info.version` segue in aggiunta il contratto stesso (SemVer).
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
externalDocs:
  description: Architettura e decisioni di GitStack
  url: https://github.com/fathorMB/GitStack/tree/main/.lmbrain-lite/knowledge
x-code-read-limits:
  description: >
    Costanti delle letture del codice (M-04, regole B1, B5, B6; GIT-91). Sono
    la fonte unica: schemi, descrizioni e docs/repos.md le riportano, e i
    servizi le definiscono una volta sola come costanti con questi nomi.
  fileHighlightMaxBytes: 1048576
  filePlainMaxBytes: 5242880
  imageInlineMaxBytes: 1048576
  blameMaxBytes: 1048576
  treeMaxEntries: 1000
  commitsPerPageMax: 100
  diffCollapseLines: 500
  diffMaxFiles: 300
  diffMaxLines: 20000
  diffFileMaxBytes: 1048576
  fileListMaxPaths: 50000
  searchMaxResults: 100
  searchTimeoutSeconds: 10
  searchFragmentMaxChars: 300
  searchFileMaxBytes: 1048576
servers:
  - url: /v1
    description: Gateway pubblico di GitStack (dietro Traefik)

tags:
  - name: system
    description: Stato del sistema.
  - name: resources
    description: >
      Risorsa di prova generica, usata dal flusso end-to-end (UI → gateway →
      core → Postgres) e come base del modello a risorse generiche (D15).
  - name: auth
    description: Login, logout, sessione corrente, login OIDC esterno (M-02, D5).
  - name: users
    description: Utenti (persone e agenti) e profilo.
  - name: tokens
    description: Token personali con scope dell'utente corrente.
  - name: ssh-keys
    description: Chiavi SSH pubbliche dell'utente corrente.
  - name: organizations
    description: Organizzazioni e loro membri.
  - name: teams
    description: Team di un'organizzazione e loro membri.
  - name: permissions
    description: Grant e permessi effettivi su risorse generiche (D15).
  - name: internal
    description: >
      Interfaccia interna fra servizi (verifica credenziali, permessi, chiavi
      SSH). Non esposta dal gateway.
  - name: repos
    description: >
      Repository Git (M-03): creazione, impostazioni, eliminazione e
      ripristino; letture del codice (M-04): albero, file, branch, tag,
      commit, diff, blame, archivio, lingue, README. Un repo e' una risorsa generica `type=repo` (D15); servita
      da core.
  - name: issues
    description: >
      Issues di un repo (M-05): commenti, cronologia, etichette, milestone,
      assegnatari, allegati, modelli e ricerca. Regole I1-I11. Servite da core.
  - name: git-internal
    description: >
      Interfaccia interna del servizio git verso core (creazione su disco,
      cestino, cancellazione). Non esposta dal gateway, implementata a mano.

paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Stato del servizio
      description: >
        Controllo di salute, senza autenticazione: usato da orchestratore
        (k3s) e dai probe di deploy.
      security: []
      responses:
        "200":
          description: Il servizio è operativo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                version: "0.1.0"

  /resources:
    get:
      operationId: listResources
      tags: [resources]
      x-required-scopes: ["read:resource"]
      summary: Elenca le risorse
      description: >
        Elenco paginato delle risorse, con filtro opzionale per tipo (es.
        `repo`). Il tipo non è vincolato a un insieme fisso: nuove milestone
        aggiungono nuovi tipi senza cambiare l'endpoint (D15).
      parameters:
        - $ref: "#/components/parameters/ResourceTypeFilter"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
      responses:
        "200":
          description: Pagina di risorse.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"
    post:
      operationId: createResource
      tags: [resources]
      x-required-scopes: ["write:resource"]
      summary: Crea una risorsa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResourceInput"
      responses:
        "201":
          description: Risorsa creata.
          headers:
            Location:
              description: URL della risorsa creata.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /resources/{resourceId}:
    parameters:
      - $ref: "#/components/parameters/ResourceIdParam"
    get:
      operationId: getResource
      tags: [resources]
      x-required-scopes: ["read:resource"]
      x-required-permission: read
      summary: Legge una risorsa
      responses:
        "200":
          description: Risorsa trovata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
    patch:
      operationId: updateResource
      tags: [resources]
      x-required-scopes: ["write:resource"]
      x-required-permission: write
      summary: Aggiorna una risorsa
      description: "Aggiornamento parziale: solo i campi presenti nel corpo cambiano."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateResourceInput"
      responses:
        "200":
          description: Risorsa aggiornata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
    delete:
      operationId: deleteResource
      tags: [resources]
      x-required-scopes: ["write:resource"]
      x-required-permission: admin
      summary: Elimina una risorsa
      responses:
        "204":
          description: Risorsa eliminata.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
  # ---------------------------------------------------------------------
  # Identity (M-02): autenticazione, utenti, token, chiavi SSH,
  # organizzazioni, team, permessi. Servite dal servizio `identity` dietro il
  # gateway (services/identity/README.md).
  # ---------------------------------------------------------------------

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Accede con username e password
      description: >
        Crea una sessione. La risposta imposta il cookie `gst_session`
        (HttpOnly, Secure, SameSite=Lax); il valore non e' nel corpo. Le
        credenziali sbagliate e l'utente disattivato rispondono entrambi 401
        con `invalid_credentials`, senza distinguere i casi. Dopo troppi
        tentativi falliti (per utente o per indirizzo IP) risponde 429
        `too_many_attempts` con l'header `Retry-After` in secondi.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Sessione creata.
          headers:
            Set-Cookie:
              description: Cookie di sessione `gst_session`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      x-password-change-exempt: always
      summary: Termina la sessione corrente
      description: Revoca la sessione del cookie `gst_session` e lo cancella.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Sessione terminata.
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /auth/session:
    get:
      operationId: getCurrentSession
      tags: [auth]
      x-password-change-exempt: always
      summary: Sessione corrente
      description: >
        Chi e' il chiamante e con quale credenziale (sessione o token
        personale, con i suoi scope). Non richiede scope: basta essere
        autenticati.
      responses:
        "200":
          description: Chiamante autenticato.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /auth/oidc/providers:
    get:
      operationId: listOidcProviders
      tags: [auth]
      summary: Provider OIDC abilitati
      description: Elenco pubblico per la pagina di login. Nessun segreto.
      security: []
      responses:
        "200":
          description: Provider abilitati.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcProviderList"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /auth/oidc/{provider}/start:
    parameters:
      - $ref: "#/components/parameters/OidcProviderParam"
    get:
      operationId: startOidcLogin
      tags: [auth]
      summary: Avvia il login OIDC
      description: >
        Redirect (302) all'authorization endpoint del provider (authorization
        code + PKCE). `redirectTo` e' un percorso relativo dove tornare dopo
        il login.
      security: []
      parameters:
        - name: redirectTo
          in: query
          required: false
          schema:
            type: string
            maxLength: 512
            pattern: "^/[^/\\\\].*$|^/$"
      responses:
        "302":
          description: Redirect al provider.
          headers:
            Location:
              schema:
                type: string
                format: uri
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /auth/oidc/{provider}/callback:
    parameters:
      - $ref: "#/components/parameters/OidcProviderParam"
    get:
      operationId: finishOidcLogin
      tags: [auth]
      summary: Completa il login OIDC
      description: >
        Callback del provider. Se l'identita' (provider, subject) e' gia'
        collegata a un utente crea la sessione (cookie `gst_session`) e fa
        redirect (302) a `redirectTo`. Altrimenti decide la configurazione
        del provider: con `linkByVerifiedEmail` (default false) e un'email
        che il provider dichiara verificata (`email_verified`) collega
        l'identita' all'utente locale con quella email; con
        `autoCreateUsers` (default false) crea un nuovo utente (senza
        password) e lo collega; un'email non verificata non si collega mai a
        un utente esistente. In tutti gli altri casi (compreso il default, con
        entrambe le opzioni a false) risponde 409 `oidc_identity_unlinked`.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Sessione creata, redirect all'applicazione.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Elenca gli utenti
      description: Richiede lo scope `read:user`. Il profilo pubblico non include l'email.
      x-required-scopes: ["read:user"]
      parameters:
        - name: q
          in: query
          required: false
          description: Prefisso di username o nome visualizzato.
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
      responses:
        "200":
          description: Pagina di utenti.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/UnexpectedError"
    post:
      operationId: createUser
      tags: [users]
      summary: Crea un utente
      description: >
        Solo amministratori, scope `write:user`. Serve a creare utenti umani
        e agenti; non c'e' auto-registrazione.
      x-required-scopes: ["write:user"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "201":
          description: Utente creato.
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /users/{username}:
    parameters:
      - $ref: "#/components/parameters/UsernameParam"
    get:
      operationId: getUser
      tags: [users]
      summary: Legge il profilo di un utente
      description: >
        Scope `read:user`. L'email e i campi amministrativi compaiono solo
        per l'utente stesso e per gli amministratori.
      x-required-scopes: ["read:user"]
      responses:
        "200":
          description: Utente trovato.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Aggiorna il profilo
      description: >
        Scope `write:user`. Solo l'utente stesso (profilo) o un
        amministratore (anche `isAdmin`, `isActive`).
      x-required-scopes: ["write:user"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: Utente aggiornato.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/UnexpectedError"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Elimina un utente
      description: >
        Solo amministratori, scope `write:user`. Elimina a cascata sessioni,
        token, chiavi SSH e membership. Non si puo' eliminare l'ultimo
        amministratore (409 `last_admin`).
      x-required-scopes: ["write:user"]
      responses:
        "204":
          description: Utente eliminato.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /users/{username}/tokens:
    parameters:
      - $ref: "#/components/parameters/UsernameParam"
    get:
      operationId: listUserTokens
      tags: [users]
      summary: Elenca i token di un utente agent
      description: >
        Solo amministratori, scope `write:user` (regola P5). Solo per utenti
        di tipo `agent`: sui token di una persona decide solo lei (409
        `not_an_agent`). Mai il valore del token, solo `hint`.
      x-required-scopes: ["write:user"]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
      responses:
        "200":
          description: Pagina di token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"
    post:
      operationId: createUserToken
      tags: [users]
      summary: Crea un token per un utente agent
      description: >
        Solo amministratori, scope `write:user` (regola P5). Solo per utenti
        di tipo `agent` (409 `not_an_agent` altrimenti). Stesse regole dei
        token personali: scope dal catalogo, scadenza obbligatoria con lo
        stesso massimo, valore (`gst_...`) mostrato una sola volta, nel
        database solo lo SHA-256.
      x-required-scopes: ["write:user"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenInput"
      responses:
        "201":
          description: Token creato.
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /users/{username}/tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/UsernameParam"
      - $ref: "#/components/parameters/TokenIdParam"
    delete:
      operationId: revokeUserToken
      tags: [users]
      summary: Revoca un token di un utente agent
      description: >
        Solo amministratori, scope `write:user` (regola P5). Un token che non
        appartiene a quell'agent e' 404. Utente umano: 409 `not_an_agent`.
      x-required-scopes: ["write:user"]
      responses:
        "204":
          description: Token revocato.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /users/{username}/password:
    parameters:
      - $ref: "#/components/parameters/UsernameParam"
    put:
      operationId: changePassword
      tags: [users]
      x-password-change-exempt: self
      summary: Cambia la password
      description: >
        Scope `write:user`. L'utente stesso deve fornire `currentPassword`;
        un amministratore no. Con `currentPassword` sbagliata risponde 403
        `forbidden` (il chiamante e' gia' autenticato: un 401 farebbe uscire
        il client). Revoca le altre sessioni dell'utente.
      x-required-scopes: ["write:user"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "204":
          description: Password cambiata.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/UnexpectedError"

  /user/tokens:
    get:
      operationId: listTokens
      tags: [tokens]
      summary: Elenca i token personali dell'utente corrente
      description: Scope `read:user`. Mai il valore del token, solo `hint`.
      x-required-scopes: ["read:user"]
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
      responses:
        "200":
          description: Pagina di token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/UnexpectedError"
    post:
      operationId: createToken
      tags: [tokens]
      summary: Crea un token personale
      description: >
        Scope `write:user`. Il valore (`gst_...`) e' nella risposta una volta
        sola: il servizio conserva solo l'hash. Un token non puo' avere scope
        che il suo creatore non ha.
      x-required-scopes: ["write:user"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenInput"
      responses:
        "201":
          description: Token creato.
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
