        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/UnexpectedError"
    patch:
      operationId: updatePullRequest
      tags: [pulls]
      x-required-scopes: ["write:resource"]
      x-mcp:
        expose: true
        name: pr_update
        destructive: false
      summary: Modifica titolo, testo e branch di destinazione
      description: >
        Possono modificare l'autore e chi ha `write`. Solo una PR aperta si modifica (409 `not_open` altrimenti).
        Cambiare `targetBranch` e' possibile se il branch esiste e non e' quello di origine (422); le parole chiave
        di C2 nel testo vengono rilette (PR8). Un repo archiviato rifiuta ogni modifica con 409 `archived` (R10).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePullRequestInput"
      responses:
        "200":
          description: Pull Request aggiornata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        default:
          $ref: "#/components/responses/UnexpectedError"

