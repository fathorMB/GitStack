        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    Grant:
      type: object
      description: Ruolo su una risorsa generica (D15) per un utente o un team.
      additionalProperties: false
      required: [id, resourceId, subjectType, subjectId, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        resourceId:
          type: string
          format: uuid
        subjectType:
          type: string
          enum: [user, team]
        subjectId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ResourceRole"
        createdAt:
          type: string
          format: date-time
          readOnly: true

    CreateGrantInput:
      type: object
      additionalProperties: false
      required: [subjectType, subjectId, role]
      properties:
        subjectType:
          type: string
          enum: [user, team]
        subjectId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ResourceRole"

    UpdateGrantInput:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/ResourceRole"

    GrantList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Grant"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    EffectivePermission:
      type: object
      additionalProperties: false
      required: [resourceId, role]
      properties:
        resourceId:
          type: string
          format: uuid
        role:
          type: string
          allOf:
            - $ref: "#/components/schemas/ResourceRole"
          nullable: true
          description: Ruolo effettivo; `null` = nessun accesso.

    VerifyCredentialInput:
      type: object
      additionalProperties: false
      required: [credential]
      properties:
        credential:
          type: string
          minLength: 1
          maxLength: 512
          writeOnly: true
          description: Valore grezzo della credenziale (cookie `gst_session` o token `gst_...`).
        kind:
          type: string
          enum: [session, token]
          description: Facoltativo, evita l'ambiguita' se il gateway la conosce.

    Principal:
      type: object
      description: Chi ha presentato la credenziale.
      additionalProperties: false
      required: [userId, username, kind, isAdmin, authMethod]
      properties:
        userId:
          type: string
          format: uuid
        username:
          $ref: "#/components/schemas/Name"
        kind:
          type: string
          enum: [human, agent]
        isAdmin:
          type: boolean
        authMethod:
          type: string
          enum: [password, oidc, token]
        scopes:
          type: array
          description: Solo per i token; assenti per le sessioni.
          items:
            $ref: "#/components/schemas/TokenScope"
        mustChangePassword:
          type: boolean
          description: >
            Vero per una sessione la cui password iniziale non e' ancora stata
            cambiata (vedi `CurrentSession.mustChangePassword`). `/internal/verify`
            risponde comunque `active` true: il gateway risponde 403
            `password_change_required` a ogni rotta tranne `GET /auth/session`,
            `POST /auth/logout` e `PUT /users/{username}/password` sulla propria
            utenza. Assente equivale a falso.
        credentialId:
          type: string
          format: uuid
          description: Id della sessione o del token (per audit).
        expiresAt:
          type: string
          format: date-time
          nullable: true

    VerifyCredentialResult:
      type: object
      additionalProperties: false
      required: [active]
      properties:
        active:
          type: boolean
        principal:
          $ref: "#/components/schemas/Principal"
        cacheTtlSeconds:
          type: integer
          minimum: 0
          description: Per quanto tempo il gateway puo' tenere in cache l'esito.

    GrantResourceCreatorInput:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid

    CheckPermissionInput:
      type: object
      additionalProperties: false
      required: [userId, resourceId, role]
      properties:
        userId:
          type: string
          format: uuid
        resourceId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ResourceRole"

    CheckPermissionResult:
      type: object
      additionalProperties: false
      required: [allowed]
      properties:
        allowed:
          type: boolean
        effectiveRole:
          type: string
          allOf:
            - $ref: "#/components/schemas/ResourceRole"
          nullable: true

    ReadableResourcesInput:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid

    ReadableResourcesResult:
      type: object
      additionalProperties: false
      required: [all, resourceIds]
      properties:
        all:
          type: boolean
        resourceIds:
          type: array
          items:
            type: string
            format: uuid

    AccessSource:
      type: object
      additionalProperties: false
      required: [kind, role]
      description: >
        Una fonte del ruolo su un repo. `direct`: grant all'utente; `team`:
        grant al team `organization`/`team` (di cui e' membro o la cui
        organizzazione possiede); `owner`: owner dell'organizzazione
        proprietaria (`organization`) o proprietario del repo personale
        (P1, P6), sempre `admin`; `internal`: visibilita' interna (P3),
        `read`; `installation_admin`: amministratore dell'installazione,
        `admin`.
      properties:
        kind:
          type: string
          enum: [direct, team, owner, internal, installation_admin]
        role:
          $ref: "#/components/schemas/ResourceRole"
        organization:
          type: string
          description: Solo per `team` e per `owner` di un'organizzazione.
        team:
          type: string
          description: Solo per `team`.

    UserAccessSourcesItem:
      type: object
      additionalProperties: false
      required: [resourceId, role, sources]
      properties:
        resourceId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ResourceRole"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/AccessSource"

    UserAccessSources:
      type: object
      additionalProperties: false
      required: [admin, items]
      properties:
        admin:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserAccessSourcesItem"

    UserAccessItem:
      type: object
      additionalProperties: false
      required: [repositoryId, owner, name, fullName, role, sources]
      properties:
        repositoryId:
          type: string
          format: uuid
        owner:
          $ref: "#/components/schemas/RepoOwner"
        name:
          type: string
        fullName:
          type: string
          example: acme/api
        visibility:
          $ref: "#/components/schemas/RepoVisibility"
        role:
          $ref: "#/components/schemas/ResourceRole"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/AccessSource"

    UserAccessList:
      type: object
      additionalProperties: false
      required: [items, page, perPage, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserAccessItem"
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    RepoName:
      type: string
      description: >
        Nome di un repo (R11): minuscole, cifre, `-`, `_`, `.`; 1-100
        caratteri; non inizia con `.`; non finisce con `.git` (regola
        applicata dal servizio, non esprimibile nel pattern). Le maiuscole
        sono rifiutate. Unico per owner.
      pattern: "^[a-z0-9_-][a-z0-9._-]{0,99}$"
      minLength: 1
      maxLength: 100
      example: my-app

    RepoVisibility:
      type: string
      description: >
        Visibilita' (P7): `private` (solo chi ha un grant) o `internal`
        (tutti gli utenti dell'installazione). Nessun accesso anonimo.
      enum: [private, internal]
      default: private

    GitignoreTemplate:
      type: string
      description: Modello di `.gitignore` per il contenuto iniziale (R5).
      enum: [go, node, python, java, dotnet, rust, cpp, terraform, ruby, php]

    LicenseTemplate:
      type: string
      description: Modello di licenza per il contenuto iniziale (R5).
      enum:
        - mit
        - apache-2.0
        - gpl-3.0
        - agpl-3.0
        - lgpl-3.0
        - mpl-2.0
        - bsd-2-clause
        - bsd-3-clause
        - unlicense

    OwnerType:
      type: string
      enum: [user, organization]

    RepoOwner:
      type: object
      additionalProperties: false
      required: [type, name]
      properties:
        type:
          $ref: "#/components/schemas/OwnerType"
        name:
          $ref: "#/components/schemas/Name"

    RepoCloneUrls:
      type: object
      description: >
        Indirizzi di clone dell'installazione (R1, R7). L'indirizzo SSH e'
        sempre quello completo `ssh://git@<host>:<porta>/<owner>/<repo>.git`.
      additionalProperties: false
      required: [https]
      properties:
        https:
          type: string
          example: https://git.example.com/alice/my-app.git
        ssh:
          type: string
          description: >
            Assente quando il server SSH dell'installazione e' spento.
          example: ssh://git@git.example.com:2222/alice/my-app.git
        sshShort:
          type: string
          description: >
            Forma corta `git@<host>:<owner>/<repo>.git` (R7): presente solo
            quando la porta SSH dell'installazione e' 22.
          example: git@git.example.com:alice/my-app.git

    Repository:
      type: object
      additionalProperties: false
      required:
        - id
        - owner
        - name
        - fullName
        - description
        - visibility
        - defaultBranch
        - protectDefaultBranch
        - archived
        - empty
        - cloneUrls
        - createdAt
        - updatedAt
