        stato dello stesso contesto sostituisce il precedente, non resta uno storico). La sintesi e' in `getCombinedCommitStatus`. `sha` completo o
        prefisso univoco di almeno 7 caratteri (400 se non e' esadecimale, 404 se non esiste). Un repo che
