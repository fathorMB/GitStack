# Interruttore LAN di UN database (ADR 0003, DB9): Service LoadBalancer (k3s ServiceLB) sulla porta
# assegnata al database e ingresso dalle sorgenti fuori dal CIDR dei pod. Spegnere l'interruttore
# cancella entrambe le risorse.
apiVersion: v1
kind: Service
metadata:
  name: pg-lan
  namespace: gitstack-db-poc
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: pg
  ports:
    - name: pg
      port: 15432
      targetPort: pg
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-lan
  namespace: gitstack-db-poc
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16
      ports:
        - protocol: TCP
          port: 5432
