apiVersion: v1
kind: Namespace
metadata:
  name: gitstack-app-poc
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: forward-auth-nginx
  namespace: gitstack-app-poc
data:
  default.conf: |
    server {
      listen 8080;
      location = /allow {
        add_header X-GitStack-User alice always;
        add_header X-GitStack-Email alice@example.test always;
        return 204;
      }
      location = /deny { return 401; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forward-auth
  namespace: gitstack-app-poc
spec:
  replicas: 1
  selector: {matchLabels: {app: forward-auth}}
  template:
    metadata: {labels: {app: forward-auth}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 8080}]
          volumeMounts: [{name: config, mountPath: /etc/nginx/conf.d}]
      volumes:
        - name: config
          configMap: {name: forward-auth-nginx}
---
apiVersion: v1
kind: Service
metadata:
  name: forward-auth
  namespace: gitstack-app-poc
spec:
  selector: {app: forward-auth}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: gitstack-app-poc
spec:
  replicas: 1
  selector: {matchLabels: {app: app}}
  template:
    metadata: {labels: {app: app}}
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10
          ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: gitstack-app-poc
spec:
  selector: {app: app}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: app-forward-auth
  namespace: gitstack-app-poc
spec:
  forwardAuth:
    address: http://forward-auth.gitstack-app-poc.svc.cluster.local:8080/allow
    authResponseHeaders: [X-GitStack-User, X-GitStack-Email]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: app-forward-auth-deny
  namespace: gitstack-app-poc
spec:
  forwardAuth:
    address: http://forward-auth.gitstack-app-poc.svc.cluster.local:8080/deny
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app
  namespace: gitstack-app-poc
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`app.apps.test`)
      kind: Rule
      middlewares: [{name: app-forward-auth}]
      services: [{name: app, port: 80}]
  tls: {secretName: app-wildcard-tls}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app-deny
  namespace: gitstack-app-poc
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`deny.apps.test`)
      kind: Rule
      middlewares: [{name: app-forward-auth-deny}]
      services: [{name: app, port: 80}]
  tls: {secretName: app-wildcard-tls}
