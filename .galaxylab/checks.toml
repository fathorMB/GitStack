# Controlli automatici letti dal motore GalaxyLab.
#
# Schema confermato dal board (mail di Atlas del 2026-09-28 15:57, punti g-h-i,
# vedi nota del CTO su GIT-13):
# - il motore legge questo file sempre dal ramo principale (main), mai dal
#   ramo dell'item;
# - `[integration] layer = N` e' facoltativo (default 99 se assente); qui c'e'
#   un solo repo quindi e' omesso;
# - una tabella `[[check]]` per ogni comando, con:
#     name       obbligatorio
#     run        obbligatorio, lanciato dalla shell dell'host
#     cwd        facoltativo, relativo alla radice del repo (niente percorsi
#                assoluti ne' "..")
#     timeout_s  facoltativo, default 600, massimo 3600
#
# Prerequisiti dell'host:
# - Go nel PATH (check go-*);
# - Node (verificato v24.11.1) e corepack (verificato 0.34.2) nel PATH
#   (check web-*). pnpm arriva da corepack, alla versione fissata da
#   "packageManager" in web/package.json (pnpm@11.28.1): i check web
#   invocano `corepack pnpm ...` e NON usano lo shim `pnpm` del PATH
#   (pnpm.ps1, versione diversa).
# Non lanciare `corepack use` in web/: riscrive package.json.
# - golangci-lint >= v2.14.0 nel PATH (check go-lint-*; sull'host di sviluppo
#   c'e' v2.14.0 in C:\Users\moren\go\bin). Deve essere costruito con Go >= quello
#   dei go.mod; la configurazione e' .golangci.yml in radice.
# Nessun altro strumento (bash) e' richiesto da questo
# file: la shell e il PATH del motore non sono noti, quindi nessun comando usa
# $(...), pipe o `&&`. Verificato che il comando gira invariato in PowerShell,
# cmd.exe e Git Bash sull'host di sviluppo (vedi riepilogo di consegna GIT-13).
# Anche i comandi web sono stati verificati in PowerShell, cmd.exe e Git Bash
# (vedi riepilogo di consegna GIT-45).

[[check]]
name = "go-build"
# Il repo e' un Go workspace (go.work in radice, nessun go.mod in radice):
# "go build ./..." lanciato dalla radice fallisce con
# "pattern ./...: directory prefix . does not contain modules listed in
# go.work or their selected dependencies". Servono quindi i pattern espliciti
# di ogni modulo elencato in go.work (verificati con `go work edit -json`).
# Quando si aggiunge un modulo a go.work, aggiungere qui il suo pattern
# "<path>/..." (e nel check go-test o go-test-git qui sotto, secondo il
# modulo); un modulo nuovo richiede anche il suo go-lint-<modulo>
# (una tabella per modulo, vedi in fondo). Un controllo successivo, in un item separato, sostituira'
# questo elenco con uno script (es. scripts/go-each.sh) quando sapremo come
# il motore lancia la shell.
run = "go build ./admin/... ./api/... ./cli/... ./client/go/... ./pkg/egress/... ./pkg/events/... ./pkg/issuequery/... ./pkg/names/... ./pkg/scopes/... ./services/core/... ./services/gateway/... ./services/git/... ./services/identity/..."
timeout_s = 600
# Solo se cambia Go o la configurazione dei moduli (GIT-408): un item di sola
# documentazione o web non ricompila. La CI di main fa girare tutto.
paths = ["**/*.go", "**/go.mod", "**/go.sum", "go.work", "go.work.sum"]

[[check]]
name = "go-test"
# Tutti i moduli di go-build tranne services/git, che ha un budget dedicato
# nel check successivo. -timeout e' per pacchetto: deve restare minore del
# timeout del check, cosi' un blocco stampa lo stack e il test in corso.
# I paths includono le radici di ogni modulo qui testato, piu' i file non-Go
# letti dai test: deploy/ (admin), docs/ (pkg/events), skills/ (cli) e
# scripts/release-readiness.go (admin/releasegate).
run = "go test -timeout 750s ./admin/... ./api/... ./cli/... ./client/go/... ./pkg/egress/... ./pkg/events/... ./pkg/issuequery/... ./pkg/names/... ./pkg/scopes/... ./services/core/... ./services/gateway/... ./services/identity/..."
timeout_s = 900
paths = ["admin/**", "api/**", "cli/**", "client/go/**", "pkg/**", "services/core/**", "services/gateway/**", "services/identity/**", "deploy/**", "docs/**", "skills/**", "scripts/release-readiness.go", "go.work", "go.work.sum"]

[[check]]
name = "go-test-git"
# go list -deps -test ./services/git/... mostra moduli interni solo in
# services/git e pkg/{events,scopes}; i due pkg sono coperti da pkg/**.
# Il budget per pacchetto lascia margine ai test che invocano git molte volte
# sotto carico, ma resta inferiore al timeout complessivo del check.
run = "go test -timeout 1500s ./services/git/..."
timeout_s = 1800
paths = ["services/git/**", "pkg/**", "go.work", "go.work.sum"]

[[check]]
name = "web-install"
# Primo dei check web: gli altri dipendono da node_modules. Il link
# @gitstack/api-client (link:../client/ts) non richiede passi manuali.
run = "corepack pnpm install --frozen-lockfile"
cwd = "web"
timeout_s = 900
# I check web girano solo se cambia web/ o il client TS generato dal contratto,
# che sta in client/ts (GIT-408).
paths = ["web/**", "client/ts/**"]

[[check]]
name = "web-lint"
run = "corepack pnpm run lint"
cwd = "web"
timeout_s = 600
paths = ["web/**", "client/ts/**"]

[[check]]
name = "web-typecheck"
run = "corepack pnpm run typecheck"
cwd = "web"
timeout_s = 600
paths = ["web/**", "client/ts/**"]

[[check]]
name = "web-test"
run = "corepack pnpm run test"
cwd = "web"
timeout_s = 900
paths = ["web/**", "client/ts/**"]

[[check]]
name = "web-check-tokens"
# Rigenera src/styles/tokens.css e fallisce (git diff --exit-code) se differisce.
run = "corepack pnpm run check-tokens"
cwd = "web"
timeout_s = 300
paths = ["web/**", "client/ts/**"]

[[check]]
name = "go-test-core-migrate"
# Le migrazioni di core: sul ramo integrato si accorge di due item che aggiungono
# ognuno una migrazione, con i migrate.Down fuori allineamento (GIT-370, MR-313).
# Usa Docker (testcontainers, Ryuk attivo dopo GIT-399).
run = "go test -tags integration -count=1 ./internal/migrate/"
cwd = "services/core"
timeout_s = 900
paths = ["services/core/internal/migrate/**"]

[[check]]
name = "go-work-sync"
# Equivalente Go di scripts/check-go-work-sync.sh: confronta con
# `git diff --ignore-cr-at-eol`, perche' su Windows git status segna sporchi
# go.work e services/git/go.sum solo per il CRLF (GIT-408, dopo GIT-406).
run = "go run scripts/check-go-work-sync.go"
timeout_s = 300
paths = ["**/go.mod", "**/go.sum", "go.work*"]

[[check]]
name = "check-api-generated"
# Rigenera il codice dal contratto (generate-api.sh: bash, Node e pnpm) e
# fallisce se i file generati differiscono dai committati (CRLF ignorato).
run = "go run scripts/check-api-generated.go"
timeout_s = 900
paths = ["api/openapi.yaml", "client/**"]

# Lint per modulo (golangci-lint, config .golangci.yml in radice). Uno per
# ogni modulo di go.work: aggiornare insieme a go-build/go-test.
# --allow-serial-runners: golangci-lint 2.14 prende un lock unico per tutto
# l'host e senza il flag fallisce se un altro lint lo tiene (GIT-408).

[[check]]
name = "go-lint-cli"
run = "golangci-lint run ./... --timeout=5m --allow-serial-runners"
cwd = "cli"
timeout_s = 600
paths = ["cli/**", ".golangci.yml", "go.work", "go.work.sum"]

[[check]]
name = "go-lint-client-go"
run = "golangci-lint run ./... --timeout=5m --allow-serial-runners"
cwd = "client/go"
timeout_s = 600
paths = ["client/go/**", ".golangci.yml", "go.work", "go.work.sum"]

[[check]]
name = "go-lint-pkg-events"
run = "golangci-lint run ./... --timeout=5m --allow-serial-runners"
cwd = "pkg/events"
timeout_s = 600
paths = ["pkg/events/**", ".golangci.yml", "go.work", "go.work.sum"]

[[check]]
name = "go-lint-pkg-issuequery"
run = "golangci-lint run ./... --timeout=5m --allow-serial-runners"
cwd = "pkg/issuequery"
timeout_s = 600
paths = ["pkg/issuequery/**", ".golangci.yml", "go.work", "go.work.sum"]

[[check]]
name = "go-lint-admin"
run = "golangci-lint run ./... --timeout=5m --allow-serial-runners"
cwd = "admin"
timeout_s = 600
paths = ["admin/**", ".golangci.yml", "go.work", "go.work.sum"]

[[check]]
name = "go-lint-pkg-egress"
run = "golangci-lint run ./... --timeout=5m --allow-serial-runners"
cwd = "pkg/egress"
timeout_s = 600
paths = ["pkg/egress/**", ".golangci.yml", "go.work", "go.work.sum"]

[[check]]
name = "go-lint-pkg-names"
run = "golangci-lint run ./... --timeout=5m --allow-serial-runners"
cwd = "pkg/names"
timeout_s = 600
paths = ["pkg/names/**", ".golangci.yml", "go.work", "go.work.sum"]

[[check]]
name = "go-lint-core"
run = "golangci-lint run ./... --timeout=5m --allow-serial-runners"
cwd = "services/core"
timeout_s = 600
paths = ["services/core/**", ".golangci.yml", "go.work", "go.work.sum"]

[[check]]
name = "go-lint-gateway"
run = "golangci-lint run ./... --timeout=5m --allow-serial-runners"
cwd = "services/gateway"
timeout_s = 600
paths = ["services/gateway/**", ".golangci.yml", "go.work", "go.work.sum"]

[[check]]
name = "go-lint-git"
run = "golangci-lint run ./... --timeout=5m --allow-serial-runners"
cwd = "services/git"
timeout_s = 600
paths = ["services/git/**", ".golangci.yml", "go.work", "go.work.sum"]

[[check]]
name = "go-lint-identity"
run = "golangci-lint run ./... --timeout=5m --allow-serial-runners"
cwd = "services/identity"
timeout_s = 600
paths = ["services/identity/**", ".golangci.yml", "go.work", "go.work.sum"]

[[check]]
name = "go-lint-api"
run = "golangci-lint run ./... --timeout=5m --allow-serial-runners"
cwd = "api"
timeout_s = 600
paths = ["api/**", ".golangci.yml", "go.work", "go.work.sum"]

[[check]]
name = "check-security-md"
# Verifica che SECURITY.md esista e abbia le sezioni obbligatorie (V4).
run = "go run scripts/check-security-md.go"
timeout_s = 30
paths = ["SECURITY.md", "scripts/check-security-md.go"]

[[check]]
name = "rules-coverage"
run = "go run scripts/check-rules-coverage.go"
timeout_s = 120
paths = ["docs/rules-coverage.md", "scripts/check-rules-coverage.go", "admin/**", "cli/**", "pkg/**", "scripts/**", "services/**", "web/**"]

[[check]]
name = "go-gofmt"
# gofmt sui blob committati (HEAD, LF), non sul worktree CRLF di Windows:
# golangci-lint dei check go-lint-* non controlla il formato (GIT-119).
run = "go run scripts/check-gofmt.go"
timeout_s = 600
paths = ["**/*.go", "scripts/check-gofmt.go"]

[[check]]
name = "go-standalone-build"
# Build dei servizi come nel Dockerfile (sorgenti locali dei pkg/*, GOWORK=off, -mod=readonly):
# un go.sum incompleto nel workspace non si vede, nel Dockerfile sì (GIT-123).
run = "go run scripts/check-standalone-build.go"
timeout_s = 600
paths = ["services/*/go.mod", "services/*/go.sum", "services/**/*.go", "services/*/Dockerfile", "pkg/**", "scripts/docker-local-replace.sh", "go.work", "go.work.sum", "scripts/check-standalone-build.go"]

[[check]]
name = "go-internal-versions"
# I Dockerfile dei servizi (services/*) e i workflow devono costruire con contesto
# la radice e con le sorgenti locali dei moduli interni (pkg/*): cosi' un cambio a
# un pkg/* e' un commit solo (GIT-184, dopo GIT-182). cli e admin sono saltati.
run = "go run scripts/check-internal-versions.go"
timeout_s = 300
paths = ["**/go.mod", "services/*/Dockerfile", ".github/workflows/*.yml", "Makefile", "scripts/docker-local-replace.sh", "go.work", "scripts/check-internal-versions.go"]
