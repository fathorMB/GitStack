name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Un solo run per ramo/PR alla volta: un push nuovo cancella quello vecchio.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.14.0

jobs:
  go:
    name: Go — build, lint, test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work
          cache-dependency-path: |
            **/go.sum

      # Ordine e comandi identici a quelli documentati nel README di radice
      # (sezione "Avviare lo sviluppo"): go work sync, poi la build.
      - name: go work sync
        run: go work sync

      - name: go build (dalla radice, come da README)
        run: bash scripts/go-each.sh go build ./...

      - name: Installa golangci-lint ${{ env.GOLANGCI_LINT_VERSION }}
        run: |
          set -euo pipefail
          version="${GOLANGCI_LINT_VERSION#v}"
          curl -sSL -o /tmp/golangci-lint.tar.gz \
            "https://github.com/golangci/golangci-lint/releases/download/${GOLANGCI_LINT_VERSION}/golangci-lint-${version}-linux-amd64.tar.gz"
          tar -xzf /tmp/golangci-lint.tar.gz -C /tmp
          install -Dm755 "/tmp/golangci-lint-${version}-linux-amd64/golangci-lint" "$(go env GOPATH)/bin/golangci-lint"
          golangci-lint version

      - name: golangci-lint (per modulo)
        run: bash scripts/go-each.sh golangci-lint run ./... --timeout=5m

      # GIT-239 (F19, V1.1.2): ogni uses: e' fissato a uno sha di commit.
      - name: actions fissate per sha
        run: node --test scripts/check-actions-pinned.mjs

      # golangci-lint non controlla gofmt (GIT-119).
      - name: gofmt (file .go committati)
        run: go run scripts/check-gofmt.go

      # Le immagini dei servizi si costruiscono con contesto la radice e con le
      # sorgenti locali dei moduli interni (pkg/*): un Dockerfile o un workflow che
      # non lo fa e' rosso (GIT-184). cli e admin si costruiscono nel workspace.
      - name: immagini con le sorgenti locali dei moduli interni
        run: go run scripts/check-internal-versions.go

      - name: go test -race (per modulo)
        run: bash scripts/go-each.sh go test ./... -race

      # gs auth setup-git con git vero (GIT-164): clone HTTPS con il binario gs
      # come credential helper, senza Docker né Postgres.
      - name: go test -tags=integration -race (cli)
        working-directory: cli
        run: go test -tags=integration -race -count=1 ./internal/cmd/auth/

      # Postgres esterno (N8, GIT-205): preflight (versione 14 rifiutata,
      # permessi, TLS e CA), backup e restore degli schemi con le migrazioni
      # reali, contro PostgreSQL 15 e 17 in container (CLI docker). Con
      # GITSTACK_REQUIRE_DOCKER=1 senza Docker il test fallisce, non salta.
      - name: go test -tags=integration -race (admin, Postgres 15 e 17 esterni)
        working-directory: admin
        env:
          GITSTACK_REQUIRE_DOCKER: "1"
        run: go test -tags=integration -race -count=1 -timeout 20m ./internal/pgcheck/ ./internal/backup/

      # Backup su S3 (N7, GIT-204) contro un MinIO vero avviato col CLI di
      # Docker (il modulo admin non porta testcontainers): archivio cifrato,
      # conservazione su S3 e restore su un ambiente pulito.
      - name: go test -tags=integration (admin, MinIO via Docker)
        working-directory: admin
        run: go test -tags=integration -run S3MinIO -v -count=1 -timeout 15m ./internal/backup/

      # Test d'integrazione di core contro un Postgres reale (criterio di
      # accettazione di GIT-5), con testcontainers-go: il tag "integration"
      # li tiene fuori dallo step precedente (go test ./... -race, che deve
      # restare veloce e non richiedere Docker). ubuntu-24.04 ha già un
      # demone Docker raggiungibile, che testcontainers usa per avviare
      # Postgres. Solo services/core: è l'unico modulo con test così
      # taggati.
      # Test e2e del browser del codice (GIT-89, TestBrowserCodice in
      # services/core/internal/stackitest): il sottotest ui_smoke lancia
      # Vitest (web/src/smoke) contro lo stack vero, quindi servono node e le
      # dipendenze di web/. GITSTACK_REQUIRE_UI_SMOKE=1 fa fallire il test, invece
      # di saltarlo, se mancano.
      - name: Setup Node (smoke UI del browser del codice)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Dipendenze di web/ (smoke UI del browser del codice)
        working-directory: web
        run: corepack pnpm install --frozen-lockfile

      - name: go test -tags=integration -race (services/core, Postgres reale via testcontainers)
        working-directory: services/core
        env:
          GITSTACK_REQUIRE_UI_SMOKE: "1"
        run: go test -tags=integration ./... -race

      # Tabella regole→test (GIT-115): ogni test citato in docs/rules-coverage.md
      # deve esistere ancora nel codice.
      - name: Copertura regole di prodotto (docs/rules-coverage.md)
        run: go run scripts/check-rules-coverage.go

  # Login esterno OIDC di identity (GIT-39, M-02/K): test d'integrazione contro
  # un Keycloak vero (realm importato da testdata) e un Postgres di servizio.
  # Il test Keycloak si salta senza GITSTACK_TEST_KEYCLOAK_URL; qui la
  # variabile c'è, quindi gira davvero. Job separato da "go" perché serve
  # Docker per Keycloak e non deve rallentare né dipendere dal resto.
  # Immagine Keycloak a versione esatta, per riproducibilità.
  identity-oidc:
    name: Identity — login OIDC (Keycloak, Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KEYCLOAK_IMAGE: quay.io/keycloak/keycloak:26.0.7
      GITSTACK_TEST_DATABASE_URL: postgres://postgres:pw@localhost:5432/gitstack?sslmode=disable
      GITSTACK_TEST_KEYCLOAK_URL: http://localhost:8080
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: gitstack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work
          cache-dependency-path: |
            **/go.sum

      - name: Avvia Keycloak (realm importato)
        run: |
          docker run -d --name keycloak -p 8080:8080             -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin             -v "${GITHUB_WORKSPACE}/services/identity/internal/httpapi/testdata/keycloak-realm.json:/opt/keycloak/data/import/gitstack-realm.json:ro"             "${KEYCLOAK_IMAGE}" start-dev --import-realm

      - name: Attendi il realm gitstack
        run: |
          url="${GITSTACK_TEST_KEYCLOAK_URL}/realms/gitstack/.well-known/openid-configuration"
          for i in $(seq 1 90); do
            if curl -fsS "${url}" > /dev/null 2>&1; then
              echo "Keycloak pronto dopo ${i} tentativi"
              exit 0
            fi
            sleep 2
          done
          echo "FALLITO: ${url} non risponde entro 180s" >&2
          docker logs keycloak >&2
          exit 1

      - name: go test -tags=integration -race (services/identity)
        working-directory: services/identity
        run: go test -tags=integration -race -count=1 ./...

      - name: Log di Keycloak (solo se fallisce)
        if: failure()
        run: docker logs keycloak

  ts:
    name: Web — lint, typecheck, test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: web/package.json

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # I token CSS (src/styles/tokens.css) sono generati dalla styleguide
      # (.lmbrain-lite/design/styleguide/index.html) con
      # web/scripts/sync-tokens.mjs, non ricopiati a mano: stesso principio
      # del check "api-contract" per il client generato. Nessuna dipendenza
      # npm, gira prima di "pnpm install".
      - name: Verifica che i token CSS siano generati dalla styleguide
        run: pnpm run check-tokens

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: pnpm lint
        run: pnpm run lint

      - name: pnpm typecheck
        run: pnpm run typecheck

      - name: pnpm test
        run: pnpm run test

  # shellcheck su tutti gli script di shell del repository, incluso
  # l'installer (deploy/install.sh, M-01/T-09, criterio "Script con
  # shellcheck in CI" di GIT-9). shellcheck è già preinstallato sui runner
  # ubuntu-24.04 di GitHub Actions: nessuna action/tool aggiuntivo da
  # pinnare o aggiornare (le versioni delle action le aggiorna GIT-18).
  # Indipendente da go/ts: non compila né esegue codice, gira anche se
  # quelli falliscono.
  shellcheck:
    name: Shellcheck — script di shell
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: shellcheck
        run: shellcheck deploy/install.sh deploy/gitstack-tls.sh deploy/tests/preflight_test.sh deploy/tests/v5_verify_test.sh deploy/tests/release_changelog_test.sh deploy/tests/network_test.sh deploy/tests/k3s_script_test.sh deploy/tests/chart_hardening_test.sh deploy/test-network/run.sh deploy/test-vm/e2e/remote.sh deploy/ci/install-e2e.sh web/deploy/install-gs.sh web/deploy/30-gs-index.sh deploy/tests/install_gs_test.sh scripts/*.sh scripts/ci/retry.sh

      # Preflight di install.sh (GIT-144): profili minimo e consigliato di N1,
      # sistema non supportato, verifica del nome host. Senza root né VM.
      - name: test del preflight
        run: ./deploy/tests/preflight_test.sh

      # GIT-206 (N4, N9a): opzioni di rete, registries.yaml, drop-in di proxy
      # per k3s, valori Helm e preflight di rete. Senza root né rete.
      - name: test della rete aziendale
        run: ./deploy/tests/network_test.sh

      # GIT-239 (F19): lo script di k3s si esegue solo con lo sha256 fissato.
      - name: test del checksum dello script di k3s
        run: ./deploy/tests/k3s_script_test.sh

      # GIT-171: install-gs.sh e install-gs.ps1 verificano lo SHA-256 e
      # falliscono se non coincide (server finto locale, nessuna istanza).
      - name: test di install-gs.sh (checksum)
        run: ./deploy/tests/install_gs_test.sh

      # GIT-209 (V5b): install.sh rifiuta binario, chart e immagini senza
      # firma, firmati da un'altra identità o alterati; l'eccezione N9 è
      # esplicita. Cosign finto (nessuna rete, nessun root).
      # GIT-234 (F8): NetworkPolicy, securityContext e credenziali NATS del
      # chart, verificati sul rendering di helm template (nessun cluster).
      - name: Installa Helm (test dell'hardening del chart)
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.16.3

      - name: test dell'hardening del chart (F8)
        run: ./deploy/tests/chart_hardening_test.sh

      - name: test della verifica delle firme di install.sh (V5)
        run: ./deploy/tests/v5_verify_test.sh

      # GIT-222 (V5c): changelog di una release dai commit fra due tag
      # (repository temporaneo, nessuna rete).
      - name: test del changelog di rilascio
        run: ./deploy/tests/release_changelog_test.sh

      - name: test di install-gs.ps1 (parser e checksum)
        shell: pwsh
        run: ./deploy/tests/install-gs.Tests.ps1

  # Installazione reale su Ubuntu 22.04 (criterio 2 di GIT-202): lancia
  # install.sh sul runner ubuntu-22.04 con --skip-preflight (il runner ha
  # ~14 GB liberi, non basta per il preflight hardware) e --image-tag
  # (il binario gitstack è nei releases del commit). Il preflight hardware
  # è già coperto da preflight_test.sh. Il job attende il rollout di
  # deployment e statefulset, poi fa uno smoke su https e sul comando
  # gitstack. Dipende da registry (immagini) e admin-binary (binario
  # gitstack): senza questi job le immagini e il binario non esistono
  # ancora. Dipende anche da sign (V5, GIT-209): install.sh verifica le firme
  # cosign di immagini e binario, quindi l'installazione di prova gira sugli
  # artefatti firmati: è la prova «installazione normale con verifica
  # attiva» a ogni push su main. Lo stesso `if` di registry e admin-binary: gira SOLO su push
  # a main o tag, mai su PR.
  install-ubuntu-22:
    name: Installazione reale su Ubuntu 22.04 (GIT-202, criterio 2)
    needs: [registry, admin-binary, sign]
    if: >-
      !cancelled() && needs.registry.result == 'success' && needs.admin-binary.result == 'success'
      && needs.sign.result == 'success'
      && vars.IMAGE_NAMESPACE == ''
      && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      # sudo azzera l'ambiente (env_reset): le opzioni vanno passate per linea
      # di comando, non via variabili d'ambiente. --skip-preflight perché il
      # runner ha ~14 GB liberi (il preflight si ferma), e --image-tag perché
      # install.sh scarica il binario gitstack dai releases del commit (riga 913
      # di install.sh). Il preflight hardware è già coperto da preflight_test.sh.
      - name: Installazione GitStack
        run: sudo ./deploy/install.sh --skip-preflight --image-tag "sha-${GITHUB_SHA}"

      # gitstack si installa nel namespace default (GITSTACK_NAMESPACE,
      # riga 62 di install.sh). rollout status lavora su una risorsa alla
      # volta: si aspetta sul rollout di ogni deployment e statefulset.
      # deploy/gitstack/templates: 5 deployment (gateway, identity, core,
      # git, web) e 2 statefulset (postgres, nats), nessuno disattivato.
      - name: Attesa rollout di deployment e statefulset
        run: |
          set -euo pipefail
          for r in deployment/gitstack-gateway deployment/gitstack-identity deployment/gitstack-core deployment/gitstack-git deployment/gitstack-web statefulset/gitstack-postgres statefulset/gitstack-nats; do
            sudo k3s kubectl -n default rollout status "$r" --timeout=300s || { sudo k3s kubectl get pods -A; exit 1; }
          done

      - name: Smoke test HTTPS
        run: |
          set -euo pipefail
          ok=""
          for _ in $(seq 1 30); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/api/healthz || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then echo "FALLITO: https://localhost/api/healthz non ha risposto 200" >&2; exit 1; fi
          echo "OK: GET https://localhost/api/healthz -> 200"

      - name: Smoke test gitstack status
        run: sudo gitstack status

  # GIT-211 (W1/W2): verifica statica di install-wsl.ps1 (parser PowerShell,
  # ASCII puro, struttura). I runner Windows di GitHub non hanno
  # virtualizzazione annidata per WSL2, quindi non è possibile un test di
  # installazione reale: il board verifica su un PC Windows 11.
  pwsh:
    name: PowerShell — install-wsl.ps1 (W1/W2)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test PowerShell install-wsl.ps1
        shell: pwsh
        run: ./deploy/windows/tests/install-wsl.Tests.ps1

  # Scansioni di sicurezza bloccanti (GIT-114, V2): solo sui tag di release
  # (v*, comprese le -rc.N), richiamando security.yml in modalità release.
  # Sulle pull request e ogni notte su main (schedule) security.yml parte da
  # sé e segnala senza bloccare; non gira più a ogni push su main.
  # "registry" dipende da questo job: un tag con un CRITICAL/HIGH
  # senza eccezione valida non pubblica immagini.
  security:
    name: Sicurezza — scansioni bloccanti (release)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/security.yml
    with:
      release: true

  # Costruisce e pubblica le immagini dei servizi su un registry parametrico
  # (ghcr.io di default). Richiede che build/lint/test (go, ts) siano verdi
  # (needs), altrimenti un push rosso pubblicherebbe comunque un'immagine.
  # Solo su push a main o su tag, mai sulle PR (anche da fork): l'evento
  # "pull_request" non è tra i trigger di questo job.
  # Un servizio senza Dockerfile viene saltato (arriva con GIT-4/GIT-5):
  # il job resta pronto, senza fallire la pipeline.
  registry:
    name: Registry — build & push immagini
    needs: [go, ts, security]
    # "security" è saltato fuori dai tag (vedi sopra): con un `if:` che usa una
    # funzione di stato GitHub non antepone più il controllo di successo sui
    # needs, e un need saltato farebbe saltare anche questo job. Quindi
    # i risultati si controllano a mano: go e ts devono essere riusciti,
    # security riuscito oppure saltato (mai fallito o cancellato).
    if: >-
      !cancelled() && needs.go.result == 'success' && needs.ts.result == 'success'
      && (needs.security.result == 'success' || needs.security.result == 'skipped')
      && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    # Il push di main e quello del tag sullo stesso commit avviano due run che pubblicano nella stessa release sha-<commit>: i job si mettono in fila (GIT-247, «ReleaseAsset.name already exists»).
    concurrency:
      group: publish-registry-${{ matrix.service }}-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # `include` invece di un elenco semplice perché web/ non è un modulo
      # Go sotto services/: dipende in locale da client/ts (link:, non
      # pubblicato su un registry npm — vedi web/Dockerfile), quindi il suo
      # contesto di build è la radice del monorepo, non web/ da sola.
      matrix:
        include:
          - service: gateway
            context: .
            dockerfile: services/gateway/Dockerfile
          - service: identity
            context: .
            dockerfile: services/identity/Dockerfile
          - service: git
            context: .
            dockerfile: services/git/Dockerfile
          - service: core
            context: .
            dockerfile: services/core/Dockerfile
          - service: web
            context: .
            dockerfile: web/Dockerfile
            # GIT-171: versione di gs = tag immagine; solo web costruisce gs.
            build_args: VERSION=sha-${{ github.sha }}
    env:
      # Parametro, non hard-coded nei Dockerfile: così il chart di GIT-8
      # potrà puntare a un mirror (vedi M-08, air-gapped).
      REGISTRY: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verifica Dockerfile
        id: dockerfile
        run: |
          path="${{ matrix.dockerfile }}"
          if [ -f "${path}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${path} non esiste ancora (arriva con GIT-4/GIT-5): job registry saltato per ${{ matrix.service }}."
          fi

      - name: Log in a ${{ env.REGISTRY }}
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadati immagine
        if: steps.dockerfile.outputs.exists == 'true'
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ vars.IMAGE_NAMESPACE || github.repository_owner }}/gitstack-${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=semver,pattern={{version}}

      # GIT-8 (chart Helm, criterio 6): il tag `type=ref,event=tag` sopra
      # ripubblica il nome esatto del tag Git (es. "v0.1.0", con il
      # prefisso "v"). Il chart in deploy/gitstack usa per default
      # Chart.AppVersion come tag immagine quando non specificato
      # altrimenti, e AppVersion segue la convenzione Helm (SemVer senza
      # "v", es. "0.1.0"): senza questa riga, dopo un rilascio "v0.1.0" un
      # `helm install` con i valori di default cercherebbe
      # "gitstack-gateway:0.1.0", che non esisterebbe (solo ":v0.1.0").
      # `type=semver,pattern={{version}}` pubblica in più il tag senza "v",
      # allineato ad AppVersion. Richiede che il tag Git sia un SemVer
      # valido preceduto da "v" (coerente con `on.push.tags: ['v*']` in
      # cima a questo file); per un push su main (nessun tag) non produce
      # nulla, come gli altri tag basati su "ref"/"semver".

      # Lo stesso commit può arrivare da due run (push su main e push del
      # tag): se sha-<commit> esiste già non si ricostruisce, perché una
      # seconda build ha un digest diverso (label con l'ora) e il tag di
      # versione non punterebbe più all'immagine firmata (GIT-247, v0.0.0-test.4).
      # Si aggiungono solo i tag mancanti sullo stesso digest.
      - name: Immagine già pubblicata per questo commit
        if: steps.dockerfile.outputs.exists == 'true'
        id: existing
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SHA_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          sha_ref=""
          while IFS= read -r t; do
            case "${t}" in *":${SHA_TAG}") sha_ref="${t}" ;; esac
          done <<< "${TAGS}"
          if [ -n "${sha_ref}" ] && docker buildx imagetools inspect "${sha_ref}" >/dev/null 2>&1; then
            # skopeo copia i manifest byte per byte (--preserve-digests):
            # `docker buildx imagetools create` rigenera l'indice e cambia il
            # digest (visto su GHCR in v0.0.0-test.6). Immagine fissata per digest.
            want="$(docker buildx imagetools inspect "${sha_ref}" --format '{{json .Manifest}}' | jq -er '.digest')"
            while IFS= read -r t; do
              if [ -n "${t}" ] && [ "${t}" != "${sha_ref}" ]; then
                docker run --rm -v "${HOME}/.docker/config.json:/auth.json:ro" \
                  quay.io/skopeo/stable@sha256:be15097a3e99a1fe72838b3d626d1c283db38626536fff5e04ab6bbb814baeca \
                  copy --all --preserve-digests --authfile /auth.json "docker://${sha_ref}" "docker://${t}"
                got="$(docker buildx imagetools inspect "${t}" --format '{{json .Manifest}}' | jq -er '.digest')"
                if [ "${got}" != "${want}" ]; then
                  echo "ERRORE: ${t} (${got}) non ha il digest di ${sha_ref} (${want})" >&2
                  exit 1
                fi
              fi
            done <<< "${TAGS}"
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${sha_ref} esiste già: nessuna nuova build, tag aggiunti sullo stesso digest."
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push
        if: steps.dockerfile.outputs.exists == 'true' && steps.existing.outputs.reuse != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Comando di amministrazione `gitstack` (admin/, GIT-142): costruisce il
  # binario Linux e lo pubblica come asset della release GitHub
  # "sha-<sha completo>", lo STESSO tag delle immagini (IMAGE_TAG): deploy/
  # install.sh costruisce l'URL del binario da image_tag
  # (.../releases/download/<image_tag>/gitstack-linux-amd64) e il suo
  # .sha256, che prepare_admin legge (primo campo) per il checksum SHA-256 (V5).
  # Così `curl | sudo bash` installa il comando alla stessa versione del
  # server. Stesse condizioni del job "registry": gira SOLO dopo il merge
  # (push su main o tag, mai sulle PR) e solo con go, ts e security a posto.
  # La prerelease è idempotente: se esiste già (rerun) si ricaricano gli asset
  # con --clobber.
  admin-binary:
    name: Admin — build e pubblicazione di gitstack
    needs: [go, ts, security]
    if: >-
      !cancelled() && needs.go.result == 'success' && needs.ts.result == 'success'
      && (needs.security.result == 'success' || needs.security.result == 'skipped')
      && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    # Il push di main e quello del tag sullo stesso commit avviano due run che pubblicano nella stessa release sha-<commit>: i job si mettono in fila (GIT-247, «ReleaseAsset.name already exists»).
    concurrency:
      group: publish-admin-binary-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      IMAGE_TAG: sha-${{ github.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work

      - name: Build gitstack-linux-amd64
        working-directory: admin
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=sha-${GITHUB_SHA}" \
            -o gitstack-linux-amd64 ./cmd/gitstack
          sha256sum gitstack-linux-amd64 > gitstack-linux-amd64.sha256
          cat gitstack-linux-amd64.sha256

      - name: Pubblica gli asset nella release sha-<commit>
        working-directory: admin
        run: |
          if gh release view "${IMAGE_TAG}" >/dev/null 2>&1; then
            gh release upload "${IMAGE_TAG}" gitstack-linux-amd64 gitstack-linux-amd64.sha256 --clobber
          else
            gh release create "${IMAGE_TAG}" gitstack-linux-amd64 gitstack-linux-amd64.sha256 \
              --prerelease --target "${GITHUB_SHA}" \
              --title "${IMAGE_TAG}" \
              --notes "Build del commit ${GITHUB_SHA}: comando gitstack per install.sh (non è una release di prodotto)."
          fi

  # CLI gs (cli/, GIT-171, G6): i 6 binari (linux, darwin, windows x amd64,
  # arm64) con versione sha-<commit>, SHA256SUMS e gs-skills.zip come asset
  # della release sha-<commit>, la STESSA delle immagini e di admin-binary
  # (copia pubblica, G6). Gli stessi byte stanno nell'immagine web, costruita
  # con lo stesso scripts/build-gs-dist.sh e servita su /downloads. Stesse
  # condizioni e needs di admin-binary: gira SOLO dopo il merge.
  gs-binaries:
    name: gs — build e pubblicazione dei binari
    needs: [go, ts, security]
    if: >-
      !cancelled() && needs.go.result == 'success' && needs.ts.result == 'success'
      && (needs.security.result == 'success' || needs.security.result == 'skipped')
      && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    # Il push di main e quello del tag sullo stesso commit avviano due run che pubblicano nella stessa release sha-<commit>: i job si mettono in fila (GIT-247, «ReleaseAsset.name already exists»).
    concurrency:
      group: publish-gs-binaries-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      IMAGE_TAG: sha-${{ github.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work

      - name: Build dei 6 binari, SHA256SUMS e skills
        run: ./scripts/build-gs-dist.sh dist-gs "${IMAGE_TAG}"

      - name: Pubblica gli asset nella release sha-<commit>
        working-directory: dist-gs
        run: |
          assets=(gs_* SHA256SUMS gs-skills.zip)
          if gh release view "${IMAGE_TAG}" >/dev/null 2>&1; then
            gh release upload "${IMAGE_TAG}" "${assets[@]}" --clobber
          else
            gh release create "${IMAGE_TAG}" "${assets[@]}" \
              --prerelease --target "${GITHUB_SHA}" \
              --title "${IMAGE_TAG}" \
              --notes "Build del commit ${GITHUB_SHA}: CLI gs e skills (non è una release di prodotto)."
          fi
  # V5 (GIT-208): firma keyless con Sigstore/cosign (OIDC) di immagini,
  # chart e binari; SBOM con syft allegato alla release e attestazione delle
  # immagini. I passi girano SOLO su main e tag; serve id-token: write
  # (OIDC keyless), packages: write (attestazioni), contents: write (upload release).
  sign:
    name: Sign — cosign (immagini, chart, binari) + SBOM (syft)
    needs: [registry, admin-binary, gs-binaries]
    if: >-
      !cancelled() && needs.registry.result == 'success'
      && needs.admin-binary.result == 'success'
      && needs.gs-binaries.result == 'success'
      && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    # Il push di main e quello del tag sullo stesso commit avviano due run che pubblicano nella stessa release sha-<commit>: i job si mettono in fila (GIT-247, «ReleaseAsset.name already exists»).
    concurrency:
      group: publish-sign-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      id-token: write   # OIDC per firma keyless con Sigstore
      packages: write   # Attestazioni delle immagini
      contents: write   # Caricare firme e SBOM nella release
    env:
      REGISTRY: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}
      REPO_OWNER: ${{ vars.IMAGE_NAMESPACE || github.repository_owner }}
      IMAGE_TAG: sha-${{ github.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work

      # Supply chain: tool ufficiali pinnati
      - name: Installa cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1
        with:
          cosign-release: v2.4.0

      - name: Installa syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Installa Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.16.3

      - name: Login a ${{ env.REGISTRY }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Identità OIDC per il workflow: URL del workflow + ref
      # Per tag: si usa --certificate-identity-regexp
      - name: Imposta identità workflow
        id: wf-id
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "identity=https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main" >> "$GITHUB_OUTPUT"
            echo "regexp=" >> "$GITHUB_OUTPUT"
          else
            echo "identity=" >> "$GITHUB_OUTPUT"
            echo "regexp=^https://github.com/${{ github.repository }}/\.github/workflows/ci\.yml@refs/tags/v.*$" >> "$GITHUB_OUTPUT"
          fi
          echo "Issuer OIDC: https://token.actions.githubusercontent.com"

      # --- Lista immagini (registry include web/) ---
      - name: Elenco immagini da firmare
        id: images
        run: |
          set -euo pipefail
          # I riferimenti Docker vogliono il nome in minuscolo (come docker/metadata-action)
          owner="${REPO_OWNER,,}"
          for svc in gateway identity git core web; do
            img="${{ env.REGISTRY }}/${owner}/gitstack-${svc}:sha-${{ github.sha }}"
            # Si risolve il digest del manifest (index multi-arch incluso): firma,
            # attestazione, SBOM e verifica usano solo img@sha256:..., non il tag.
            if ! manifest=$(docker buildx imagetools inspect "${img}" --format '{{json .Manifest}}' 2>&1); then
              echo "ERRORE: immagine ${svc} non trovata su ghcr.io: ${img}" >&2
              echo "docker buildx imagetools inspect: ${manifest}" >&2
              exit 1
            fi
            digest=$(printf '%s' "${manifest}" | jq -er '.digest')
            if ! printf '%s' "${digest}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "ERRORE: digest non valido per ${svc}: '${digest}'" >&2
              exit 1
            fi
            ref="${img%:*}@${digest}"
            echo "${svc}=${img}" >> "$GITHUB_OUTPUT"
            echo "IMAGE_${svc}=${img}" >> "$GITHUB_ENV"
            echo "IMAGEREF_${svc}=${ref}" >> "$GITHUB_ENV"
            echo "OK: immagine trovata ${svc}: ${ref}"
          done

      # --- SBOM delle immagini su file (riusato per attestazione, artifact, release) ---
      # syft gira come comando normale, senza process substitution: un errore
      # ferma il passo col suo messaggio. Scope esplicito "squashed" (default per
      # le immagini; l'altro valore valido e' "all-layers").
      - name: Genera SBOM immagini
        run: |
          set -euo pipefail
          mkdir -p sbom
          for svc in gateway identity git core web; do
            ref_var="IMAGEREF_${svc}"
            ref="${!ref_var}"
            out="sbom/gitstack-${svc}-sbom.spdx.json"
            echo "SBOM per ${svc} (${ref})..."
            syft scan "${ref}" --scope squashed -o "spdx-json=${out}"
            if [ ! -s "${out}" ]; then
              echo "ERRORE: SBOM vuoto o mancante per ${svc}: ${out}" >&2
              exit 1
            fi
            if ! jq empty "${out}"; then
              echo "ERRORE: SBOM non e' JSON valido per ${svc}: ${out}" >&2
              exit 1
            fi
          done
          echo "OK: SBOM immagini generati in sbom/"

      # --- Firma delle immagini con attestazione SBOM (per digest) ---
      - name: Firma keyless immagini (cosign) con SBOM attestato
        run: |
          set -euo pipefail
          source scripts/ci/retry.sh

          for svc in gateway identity git core web; do
            ref_var="IMAGEREF_${svc}"
            ref="${!ref_var}"
            sbom="sbom/gitstack-${svc}-sbom.spdx.json"
            echo "=== Attestazione + firma immagine: ${ref} ==="

            if [ ! -s "${sbom}" ]; then
              echo "ERRORE: SBOM mancante o vuoto: ${sbom}" >&2
              exit 1
            fi

            # 1. Attestazione SBOM (sigstore in-toto), predicate da file
            cosign attest --yes \
              --type spdxjson \
              --predicate "${sbom}" \
              "${ref}"

            # 2. Firma keyless (OIDC)
            # cosign sign NON accetta --certificate-identity (flag di verifica):
            # l'identità del certificato è determinata automaticamente dall'OIDC token.
            echo "Firma keyless per ${ref}..."
            retry 4 cosign sign --yes --recursive "${ref}"
            echo "OK: immagine firmata e attestata ${ref}"
          done

      # --- Firma del chart Helm ---
      - name: Firma chart Helm
        run: |
          set -euo pipefail
          source scripts/ci/retry.sh
          issuer="https://token.actions.githubusercontent.com"
          identity="${{ steps.wf-id.outputs.identity }}"
          identity_regexp="${{ steps.wf-id.outputs.regexp }}"

          chart_dir="deploy/gitstack"
          chart_name="gitstack"

          # Versione dal chart (helm show chart, senza yq)
          chart_version=$(helm show chart "${chart_dir}" | awk '/^version:/{print $2}')
          app_version=$(helm show chart "${chart_dir}" | awk '/^appVersion:/{print $2; exit}')

          # Pack del chart
          echo "Packaging chart..."
          helm package "${chart_dir}" --version "${chart_version}" --app-version "${app_version}" --destination /tmp

          chart_file="/tmp/${chart_name}-${chart_version}.tgz"
          if [ ! -f "${chart_file}" ]; then
            echo "ERRORE: chart non trovato: ${chart_file}" >&2
            exit 1
          fi

          # SBOM del chart (template e metadati)
          mkdir -p sign sbom
          out="sbom/gitstack-chart-sbom.spdx.json"
          syft scan dir:"${chart_dir}" -o "spdx-json=${out}"
          test -s "${out}" || { echo "ERRORE: SBOM chart vuoto: ${out}" >&2; exit 1; }
          jq empty "${out}"

          # Firma del file chart come blob (bundle sigstore)
          echo "Firma chart Helm..."
          retry 4 cosign sign-blob --yes --bundle "${chart_file}.sigstore.json" \
            "${chart_file}"

          # Copia il chart e il suo bundle nella cartella di upload (sign/)
          cp "${chart_file}" "sign/${chart_name}-${chart_version}.tgz"
          cp "${chart_file}.sigstore.json" "sign/${chart_name}-${chart_version}.tgz.sigstore.json"

          echo "OK: chart Helm firmato ${chart_file}"

      # --- Firma dei binari ---
      - name: Firma binari
        run: |
          set -euo pipefail
          source scripts/ci/retry.sh
          issuer="https://token.actions.githubusercontent.com"
          identity="${{ steps.wf-id.outputs.identity }}"
          identity_regexp="${{ steps.wf-id.outputs.regexp }}"
          mkdir -p sign sbom

          # Scarica la release (asset già pubblicati da admin-binary e gs-binaries)
          echo "Scaricamento asset della release..."
          gh release download "${IMAGE_TAG}" --dir sign --clobber

          # Verifica che gli asset esistano
          if [ ! -f sign/gitstack-linux-amd64 ]; then
            echo "ERRORE: gitstack-linux-amd64 non trovato nella release" >&2
            exit 1
          fi

          # Firma di gitstack + checksum
          echo "Firma binario gitstack..."
          retry 4 cosign sign-blob --yes --bundle sign/gitstack-linux-amd64.sigstore.json \
            sign/gitstack-linux-amd64

          if [ -f sign/gitstack-linux-amd64.sha256 ]; then
            echo "Firma checksum gitstack..."
            retry 4 cosign sign-blob --yes --bundle sign/gitstack-linux-amd64.sha256.sigstore.json \
              sign/gitstack-linux-amd64.sha256
          fi

          # SBOM del binario
          out="sbom/gitstack-binary-sbom.spdx.json"
          syft scan file:sign/gitstack-linux-amd64 -o "spdx-json=${out}"
          test -s "${out}" || { echo "ERRORE: SBOM binario vuoto: ${out}" >&2; exit 1; }
          jq empty "${out}"
          echo "OK: binario gitstack firmato"

          # Firma dei binari gs (tutte le piattaforme)
          for bin in sign/gs_linux_amd64 sign/gs_linux_arm64 sign/gs_darwin_amd64 sign/gs_darwin_arm64 sign/gs_windows_amd64 sign/gs_windows_arm64 sign/gs_windows_amd64.exe; do
            if [ -f "${bin}" ]; then
              echo "Firma ${bin}..."
              sig_name="${bin}.sigstore.json"
              retry 4 cosign sign-blob --yes --bundle "${sig_name}" "${bin}"
            fi
          done

          # SBOM del binario gs_linux_amd64 (rappresentativo)
          out="sbom/gs-binary-sbom.spdx.json"
          syft scan file:sign/gs_linux_amd64 -o "spdx-json=${out}"
          test -s "${out}" || { echo "ERRORE: SBOM gs vuoto: ${out}" >&2; exit 1; }
          jq empty "${out}"

          # Firma del file SHA256SUMS
          if [ -f sign/SHA256SUMS ]; then
            echo "Firma SHA256SUMS..."
            retry 4 cosign sign-blob --yes --bundle sign/SHA256SUMS.sigstore.json \
              sign/SHA256SUMS
          fi

          # Upload firme, SBOM e chart alla release
          echo "Upload firme, SBOM e chart alla release..."
          upload_files=()
          for f in sign/*.sigstore.json sign/*.tgz sbom/*.spdx.json; do
            if [ -f "${f}" ]; then
              upload_files+=("${f}")
            fi
          done

          if [ ${#upload_files[@]} -gt 0 ]; then
            gh release upload "${IMAGE_TAG}" "${upload_files[@]}" --clobber
            echo "OK: ${#upload_files[@]} file caricati nella release"
          else
            echo "ERRORE: nessun file da caricare" >&2
            exit 1
          fi

      # --- Verifica delle firme (non mascherata da || true) ---
      - name: Verifica firma immagine gateway
        run: |
          set -euo pipefail
          issuer="https://token.actions.githubusercontent.com"
          identity="${{ steps.wf-id.outputs.identity }}"
          identity_regexp="${{ steps.wf-id.outputs.regexp }}"
          img="${IMAGEREF_gateway}"
          echo "Verifica firma immagine (per digest): ${img}"
          if [ -n "${identity}" ]; then
            cosign verify \
              --certificate-identity "${identity}" \
              --certificate-oidc-issuer "${issuer}" \
              "${img}"
          else
            cosign verify \
              --certificate-identity-regexp "${identity_regexp}" \
              --certificate-oidc-issuer "${issuer}" \
              "${img}"
          fi
          echo "OK: firma immagine verificata"

      - name: Verifica firma chart Helm
        run: |
          set -euo pipefail
          issuer="https://token.actions.githubusercontent.com"
          identity="${{ steps.wf-id.outputs.identity }}"
          identity_regexp="${{ steps.wf-id.outputs.regexp }}"
          chart_file="/tmp/gitstack-$(helm show chart deploy/gitstack | awk '/^version:/{print $2}').tgz"

          echo "Verifica firma chart: ${chart_file}"
          if [ -n "${identity}" ]; then
            cosign verify-blob \
              --certificate-identity "${identity}" \
              --certificate-oidc-issuer "${issuer}" \
              --bundle "${chart_file}.sigstore.json" \
              "${chart_file}"
          else
            cosign verify-blob \
              --certificate-identity-regexp "${identity_regexp}" \
              --certificate-oidc-issuer "${issuer}" \
              --bundle "${chart_file}.sigstore.json" \
              "${chart_file}"
          fi
          echo "OK: firma chart verificata"

      - name: Verifica firma binario gitstack
        run: |
          set -euo pipefail
          issuer="https://token.actions.githubusercontent.com"
          identity="${{ steps.wf-id.outputs.identity }}"
          identity_regexp="${{ steps.wf-id.outputs.regexp }}"

          echo "Verifica firma binario gitstack"
          if [ -n "${identity}" ]; then
            cosign verify-blob \
              --certificate-identity "${identity}" \
              --certificate-oidc-issuer "${issuer}" \
              --bundle sign/gitstack-linux-amd64.sigstore.json \
              sign/gitstack-linux-amd64
          else
            cosign verify-blob \
              --certificate-identity-regexp "${identity_regexp}" \
              --certificate-oidc-issuer "${issuer}" \
              --bundle sign/gitstack-linux-amd64.sigstore.json \
              sign/gitstack-linux-amd64
          fi
          echo "OK: firma binario verificata"

      - name: Verifica checksum firmato (SHA256SUMS)
        run: |
          set -euo pipefail
          issuer="https://token.actions.githubusercontent.com"
          identity="${{ steps.wf-id.outputs.identity }}"
          identity_regexp="${{ steps.wf-id.outputs.regexp }}"

          echo "Verifica checksum SHA256SUMS..."
          if [ -n "${identity}" ]; then
            cosign verify-blob \
              --certificate-identity "${identity}" \
              --certificate-oidc-issuer "${issuer}" \
              --bundle sign/SHA256SUMS.sigstore.json \
              sign/SHA256SUMS
          else
            cosign verify-blob \
              --certificate-identity-regexp "${identity_regexp}" \
              --certificate-oidc-issuer "${issuer}" \
              --bundle sign/SHA256SUMS.sigstore.json \
              sign/SHA256SUMS
          fi
          echo "OK: checksum verificato"

      # --- Upload artifact del workflow ---
      - name: Upload SBOM e certificati come artifact del workflow
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: signing-artifacts
          path: |
            sbom/
            sign/*.sigstore.json
            sign/*.tgz
          if-no-files-found: ignore
          retention-days: 30

  # Rilascio con versione (GIT-222, V5c). Su un tag vX.Y.Z o vX.Y.Z-rc.N, DOPO
  # il job "sign" (che ha già firmato le immagini per digest, sha-<commit> e
  # tag di versione condividono lo stesso digest), pubblica la GitHub Release
  # con il nome della versione: binari gitstack e gs costruiti con la versione
  # nel binario, chart con version e appVersion = X.Y.Z, bundle cosign, SBOM,
  # SHA256SUMS firmato e changelog. Sta in questo workflow (ci.yml) perché
  # l'identità del certificato è quella verificata da install.sh e da
  # `gitstack upgrade` (ci.yml@refs/tags/v*). Mai su main né sulle PR.
  release:
    name: Release — GitHub Release firmata della versione
    needs: [sign]
    if: >-
      !cancelled() && needs.sign.result == 'success'
      && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      id-token: write       # firma keyless
      packages: read        # verifica delle immagini
      contents: write       # Release e asset
      pull-requests: write  # PR che aggiunge il changelog a CHANGELOG.md
    env:
      REGISTRY: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}
      REPO_OWNER: ${{ vars.IMAGE_NAMESPACE || github.repository_owner }}
      VERSION: ${{ github.ref_name }}
      SHA_TAG: sha-${{ github.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      # Solo SemVer con prefisso "v": vX.Y.Z, con prerelease (-rc.N, -test.N).
      - name: Valida il tag di versione
        id: ver
        run: |
          set -euo pipefail
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! printf '%s' "${VERSION}" | grep -Eq "${re}"; then
            echo "ERRORE: il tag ${VERSION} non è SemVer vX.Y.Z[-prerelease]: nessun rilascio." >&2
            exit 1
          fi
          echo "plain=${VERSION#v}" >> "$GITHUB_OUTPUT"
          if [[ "${VERSION}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work

      - name: Installa cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1
        with:
          cosign-release: v2.4.0

      - name: Installa syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Installa Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.16.3

      - name: Login a ${{ env.REGISTRY }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Le immagini della versione sono quelle di sha-<commit> (stesso digest,
      # già firmate dal job sign): il tag vX.Y.Z e X.Y.Z devono esistere e
      # puntare allo STESSO digest, e la firma si verifica per digest.
      - name: Immagini della versione (stesso digest di sha-<commit>, firmate)
        run: |
          set -euo pipefail
          owner="${REPO_OWNER,,}"
          identity_re="^https://github.com/${{ github.repository }}/\.github/workflows/ci\.yml@refs/tags/v.+$"
          digest_of() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -er '.digest'
          }
          for svc in gateway identity git core web; do
            base="${REGISTRY}/${owner}/gitstack-${svc}"
            want="$(digest_of "${base}:${SHA_TAG}")"
            for t in "${VERSION}" "${{ steps.ver.outputs.plain }}"; do
              got="$(digest_of "${base}:${t}")" \
                || { echo "ERRORE: ${base}:${t} non esiste: il job registry non ha pubblicato il tag di versione." >&2; exit 1; }
              if [ "${got}" != "${want}" ]; then
                echo "ERRORE: ${base}:${t} (${got}) non è lo stesso digest di ${SHA_TAG} (${want})." >&2
                exit 1
              fi
            done
            cosign verify \
              --certificate-identity-regexp "${identity_re}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${base}@${want}" > /dev/null
            echo "OK: ${svc} ${VERSION} -> ${want} (firma verificata)"
          done

      # Binari con la versione nel binario (gitstack version, gs --version).
      - name: Build dei binari con la versione
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd admin && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o ../dist/gitstack-linux-amd64 ./cmd/gitstack)
          (cd dist && sha256sum gitstack-linux-amd64 > gitstack-linux-amd64.sha256)
          ./scripts/build-gs-dist.sh dist-gs "${VERSION}"
          cp dist-gs/gs_* dist-gs/gs-skills.zip dist/

      # Chart: version e appVersion = X.Y.Z, quindi il tag immagine di default
      # (appVersion) è X.Y.Z, pubblicato dal job registry.
      - name: Pacchetto del chart con la versione
        run: |
          set -euo pipefail
          helm package deploy/gitstack \
            --version "${{ steps.ver.outputs.plain }}" \
            --app-version "${{ steps.ver.outputs.plain }}" \
            --destination dist
          test -s "dist/gitstack-${{ steps.ver.outputs.plain }}.tgz"

      # SBOM: delle immagini quelli già generati dal job sign (stessi digest),
      # di binari e chart quelli nuovi.
      - name: SBOM
        run: |
          set -euo pipefail
          mkdir -p dist/sbom
          gh release download "${SHA_TAG}" --pattern 'gitstack-*-sbom.spdx.json' --dir dist/sbom
          syft scan file:dist/gitstack-linux-amd64 -o "spdx-json=dist/sbom/gitstack-binary-sbom.spdx.json"
          syft scan file:dist/gs_linux_amd64 -o "spdx-json=dist/sbom/gs-binary-sbom.spdx.json"
          syft scan dir:deploy/gitstack -o "spdx-json=dist/sbom/gitstack-chart-sbom.spdx.json"
          for f in dist/sbom/*.spdx.json; do
            if [ ! -s "${f}" ] || ! jq empty "${f}"; then
              echo "ERRORE: SBOM non valido: ${f}" >&2
              exit 1
            fi
          done
          for svc in gateway identity git core web; do
            test -s "dist/sbom/gitstack-${svc}-sbom.spdx.json" \
              || { echo "ERRORE: manca l'SBOM dell'immagine ${svc} nella release ${SHA_TAG}" >&2; exit 1; }
          done
          ls -l dist/sbom

      # SHA256SUMS unico di tutti gli asset della versione, poi firma di ogni
      # artefatto (bundle accanto: <file>.sigstore.json, come per sha-<commit>).
      - name: Checksum e firma keyless
        run: |
          set -euo pipefail
          source scripts/ci/retry.sh
          cd dist
          sha256sum gitstack-linux-amd64 gs_* gs-skills.zip "gitstack-${{ steps.ver.outputs.plain }}.tgz" sbom/*.spdx.json > SHA256SUMS
          cat SHA256SUMS
          for f in gitstack-linux-amd64 gitstack-linux-amd64.sha256 gs_* gs-skills.zip \
                   "gitstack-${{ steps.ver.outputs.plain }}.tgz" SHA256SUMS; do
            case "${f}" in *.sigstore.json) continue ;; esac
            retry 4 cosign sign-blob --yes --bundle "${f}.sigstore.json" "${f}"
          done
          ls -l

      # Changelog: commit fra questo tag e il precedente (scripts/
      # release-changelog.sh). La sezione va nelle note e nell'asset
      # CHANGELOG.md, aggiornato con la sezione nuova.
      - name: Changelog
        run: |
          set -euo pipefail
          ./scripts/release-changelog.sh "${VERSION}" --risks docs/security/asvs-l2.md --out dist/CHANGELOG-"${VERSION}".md
          cp dist/CHANGELOG-"${VERSION}".md release-notes.md
          # CHANGELOG.md aggiornato: dal ramo principale (se c'è già) più la sezione.
          git show origin/main:CHANGELOG.md > CHANGELOG.md 2>/dev/null || rm -f CHANGELOG.md
          ./scripts/release-changelog.sh "${VERSION}" --risks docs/security/asvs-l2.md --prepend CHANGELOG.md
          cp CHANGELOG.md dist/CHANGELOG.md
          cat dist/CHANGELOG-"${VERSION}".md

      # Verifica finale come la fa un utente: ogni artefatto col suo bundle,
      # identità del workflow su tag e issuer OIDC di GitHub.
      - name: Verifica delle firme degli asset
        run: |
          set -euo pipefail
          cd dist
          identity_re="^https://github.com/${{ github.repository }}/\.github/workflows/ci\.yml@refs/tags/v.+$"
          n=0
          for b in *.sigstore.json; do
            f="${b%.sigstore.json}"
            cosign verify-blob \
              --certificate-identity-regexp "${identity_re}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --bundle "${b}" "${f}"
            n=$((n + 1))
          done
          [ "${n}" -ge 10 ] || { echo "ERRORE: solo ${n} bundle verificati, ne attesi di più" >&2; exit 1; }
          sha256sum -c SHA256SUMS
          echo "OK: ${n} firme e SHA256SUMS verificati"

      - name: Pubblica la GitHub Release
        run: |
          set -euo pipefail
          files=(dist/gitstack-linux-amd64 dist/gitstack-linux-amd64.sha256 dist/gs_* dist/gs-skills.zip \
                 "dist/gitstack-${{ steps.ver.outputs.plain }}.tgz" dist/SHA256SUMS dist/*.sigstore.json \
                 dist/sbom/*.spdx.json dist/CHANGELOG.md "dist/CHANGELOG-${VERSION}.md")
          # dist/gs_* include già i bundle gs_*.sigstore.json, che torna anche in
          # dist/*.sigstore.json: un nome doppio fa fallire il caricamento con
          # «ReleaseAsset.name already exists» (v0.0.0-test.8). Un nome una volta sola.
          mapfile -t files < <(printf '%s\n' "${files[@]}" | sort -u)
          printf '%s\n' "${files[@]}"
          flags=()
          if [ "${{ steps.ver.outputs.prerelease }}" = "true" ]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" "${files[@]}" --clobber
            gh release edit "${VERSION}" --notes-file release-notes.md "${flags[@]}"
          else
            gh release create "${VERSION}" "${files[@]}" \
              --verify-tag --title "${VERSION}" --notes-file release-notes.md "${flags[@]}"
          fi
          gh release view "${VERSION}" --json url,isPrerelease,assets \
            --jq '"\(.url) prerelease=\(.isPrerelease) asset=\(.assets | length)"'

      # La PR con CHANGELOG.md aggiornato: un ramo e una PR, mai un push su
      # main (lo decide il board). Non blocca il rilascio se la creazione
      # automatica di PR non è consentita nel repository.
      - name: PR con CHANGELOG.md
        continue-on-error: true
        run: |
          set -euo pipefail
          branch="changelog/${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -f -B "${branch}" origin/main
          cp dist/CHANGELOG.md CHANGELOG.md
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md già aggiornato."
            exit 0
          fi
          git commit -m "chore: changelog ${VERSION}"
          git push --force origin "${branch}"
          gh pr create --base main --head "${branch}" \
            --title "chore: changelog ${VERSION}" \
            --body "Sezione ${VERSION} generata da scripts/release-changelog.sh dal job release." \
            || echo "::notice::PR non creata (già aperta o non consentita): il ramo ${branch} è pubblicato."

  # Chart Helm interno (GIT-8, deploy/gitstack): helm lint più
  # un'installazione di prova su un cluster effimero k3d (un k3s vero in
  # Docker: Traefik e le sue CRD, incluso il Middleware usato dall'Ingress
  # del chart, sono già presenti di default, a differenza di kind).
  # Indipendente dal job "registry": costruisce le immagini di gateway e
  # core localmente e le importa nel cluster (stesso tag "sha-<sha commit
  # completo>" che pubblicherebbe "registry"), così questo job gira anche
  # sulle pull request (dove "registry" non pubblica nulla, vedi il suo
  # `if:`) e non dipende da credenziali verso ghcr.io.
  chart:
    name: Chart — helm lint & installazione di prova (k3d)
    needs: [go, ts]
    runs-on: ubuntu-24.04
    env:
      IMAGE_TAG: sha-${{ github.sha }}
      # k3d pinnato (GIT-23): senza una versione fissa l'installer prende
      # l'ultima disponibile, non riproducibile da un run all'altro. Stessa
      # versione usata in locale da `make dev-up` (Makefile, K3D_VERSION,
      # GIT-10): aggiornare insieme se cambia una delle due. L'installer di
      # k3d non pubblica un checksum separato da verificare (a differenza di
      # golangci-lint sopra, che non lo fa nemmeno lui): scaricato via HTTPS
      # da github.com, come già per k3d-io/k3d/main/install.sh prima di
      # questo item.
      K3D_VERSION: v5.9.0
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.16.3

      - name: helm lint
        run: helm lint deploy/gitstack

      # HTTPS (N5, GIT-143): l'installazione di prova resta in HTTP (valori di
      # default), ma i tre modi di accendere TLS devono almeno renderizzare, e
      # senza Secret né resolver il chart deve fermarsi con un errore.
      - name: helm template — HTTPS (CA interna, Let's Encrypt, valori incompleti)
        run: |
          set -euo pipefail
          helm template gitstack deploy/gitstack --set ingress.tls.enabled=true --set ingress.tls.secretName=gitstack-tls --set ingress.tls.caConfigMap=gitstack-ca > /tmp/tls-internal.yaml
          grep -q 'redirectScheme' /tmp/tls-internal.yaml
          grep -q 'router.entrypoints: websecure' /tmp/tls-internal.yaml
          grep -q 'Path(`/downloads/ca.crt`)' /tmp/tls-internal.yaml
          # TLSStore di default: il certificato dell'installer vale anche per chi si collega per IP (senza SNI).
          grep -q 'kind: TLSStore' /tmp/tls-internal.yaml
          awk '/kind: TLSStore/{f=1} f&&/name: default/{n=1} f&&/secretName: gitstack-tls/{s=1} END{exit !(n&&s)}' /tmp/tls-internal.yaml
          helm template gitstack deploy/gitstack --set ingress.tls.enabled=true --set ingress.tls.certResolver=letsencrypt > /tmp/tls-le.yaml
          grep -q 'certResolver: "letsencrypt"' /tmp/tls-le.yaml
          if grep -q 'kind: TLSStore' /tmp/tls-le.yaml; then echo "con certResolver il TLSStore non va creato" >&2; exit 1; fi
          if helm template gitstack deploy/gitstack --set ingress.tls.enabled=true >/dev/null 2>&1; then
            echo "tls.enabled senza secretName né certResolver doveva fallire" >&2
            exit 1
          fi
          helm template gitstack deploy/gitstack > /tmp/tls-default.yaml
          if grep -q 'redirectScheme' /tmp/tls-default.yaml || grep -q 'kind: TLSStore' /tmp/tls-default.yaml; then
            echo "il default del chart deve restare HTTP, senza redirect né TLSStore" >&2
            exit 1
          fi

      # Le due copie del bootstrap SQL di identity (una nel servizio, una nel
      # chart: Helm non legge file fuori dal chart) devono restare identiche.
      - name: Le copie del bootstrap SQL di identity coincidono
        run: diff services/identity/migrations/bootstrap-role.sql deploy/gitstack/files/identity-bootstrap-role.sql

      - name: Owner dell'immagine in minuscolo (richiesto da Docker/OCI)
        id: owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Costruisci le immagini di gateway, identity, core e git (stesso tag che pubblica il job "registry")
        run: |
          set -euo pipefail
          docker build -f services/gateway/Dockerfile \
            -t "ghcr.io/${{ steps.owner.outputs.owner }}/gitstack-gateway:${IMAGE_TAG}" \
            .
          docker build -f services/identity/Dockerfile \
            -t "ghcr.io/${{ steps.owner.outputs.owner }}/gitstack-identity:${IMAGE_TAG}" \
            .
          docker build -f services/core/Dockerfile \
            -t "ghcr.io/${{ steps.owner.outputs.owner }}/gitstack-core:${IMAGE_TAG}" \
            .
          docker build -f services/git/Dockerfile \
            -t "ghcr.io/${{ steps.owner.outputs.owner }}/gitstack-git:${IMAGE_TAG}" \
            .
          # GIT-152: anche la UI, per lo smoke del browser attraverso l'Ingress
          # (contesto: radice del monorepo, vedi web/Dockerfile).
          docker build -f web/Dockerfile \
            --build-arg "VERSION=${IMAGE_TAG}" \
            -t "ghcr.io/${{ steps.owner.outputs.owner }}/gitstack-web:${IMAGE_TAG}" \
            .

      - name: Crea il cluster k3d
        run: |
          set -euo pipefail
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG="${K3D_VERSION}" bash
          # Immagine k3s del cluster k3d: la STESSA versione dichiarata in
          # deploy/k3s-version (N10, GIT-210), quella che installa deploy/install.sh,
          # invece di lasciarla risolvere al canale "latest" di k3d. Il tag
          # dell'immagine usa '-' al posto del '+' della versione.
          K3S_IMAGE="rancher/k3s:$(tr -d '[:space:]' < deploy/k3s-version | tr '+' '-')"
          k3d cluster create gitstack-ci --image "${K3S_IMAGE}" --port "8080:80@loadbalancer" --port "2222:2222@loadbalancer" --wait --timeout 120s

      # GIT-21: "k3d cluster create --wait" sopra attende solo che il nodo
      # k3s riporti Ready, non che l'API server accetti già in modo stabile
      # tutte le richieste: su un runner GitHub Actions il cluster appena
      # creato può restare intermittentemente "Kubernetes cluster
      # unreachable" (osservato dopo MR-14, run 36442771214) per qualche
      # secondo in più. Attesa esplicita con timeout, separata da quella
      # della CRD Traefik sotto, per capire subito quale delle due è la causa
      # se il job fallisce di nuovo.
      - name: Attendi che l'API server del cluster sia pronto
        run: |
          set -euo pipefail
          timeout=90
          elapsed=0
          echo "Attendo che l'API server risponda (GET /readyz)..."
          until kubectl get --raw=/readyz >/dev/null 2>&1; do
            if [ "${elapsed}" -ge "${timeout}" ]; then
              echo "FALLITO: l'API server del cluster k3d non ha risposto a /readyz entro ${timeout}s" >&2
              exit 1
            fi
            sleep 3
            elapsed=$((elapsed + 3))
          done
          echo "OK: API server pronto dopo ${elapsed}s"
          if ! kubectl wait --for=condition=Ready node --all --timeout=60s; then
            echo "FALLITO: i nodi del cluster k3d non sono diventati Ready in tempo" >&2
            exit 1
          fi

      # GIT-21: su un cluster k3d appena creato, Traefik e le sue CRD
      # (incluso il Middleware usato dall'Ingress del chart, vedi
      # deploy/gitstack/templates/ingress.yaml) vengono installate in modo
      # asincrono dall'helm-controller di k3s (job helm-install-traefik-crd).
      # "helm install" del chart più sotto può partire prima che la CRD
      # esista ("no matches for kind Middleware in version
      # traefik.io/v1alpha1", run 36437112985): attendiamo esplicitamente,
      # con timeout, che la CRD sia presente e poi Established.
      - name: Attendi che la CRD middlewares.traefik.io (Traefik) sia Established
        run: |
          set -euo pipefail
          timeout=120
          elapsed=0
          echo "Attendo che la CRD middlewares.traefik.io esista..."
          until kubectl get crd middlewares.traefik.io >/dev/null 2>&1; do
            if [ "${elapsed}" -ge "${timeout}" ]; then
              echo "FALLITO: la CRD middlewares.traefik.io non è comparsa entro ${timeout}s (Traefik/helm-install-traefik-crd non ancora completato?)" >&2
              kubectl get pods -A || true
              exit 1
            fi
            sleep 3
            elapsed=$((elapsed + 3))
          done
          echo "OK: CRD middlewares.traefik.io presente dopo ${elapsed}s, attendo Established..."
          # Polling su jsonpath invece di "kubectl wait": su una CRD appena
          # creata status.conditions puo' non esistere ancora e kubectl wait
          # esce subito con "accessor error" (GIT-50).
          est_timeout=60
          est_elapsed=0
          until [ "$(kubectl get crd middlewares.traefik.io -o jsonpath='{.status.conditions[?(@.type=="Established")].status}' 2>/dev/null || true)" = "True" ]; do
            if [ "${est_elapsed}" -ge "${est_timeout}" ]; then
              echo "FALLITO: la CRD middlewares.traefik.io non è diventata Established entro ${est_timeout}s" >&2
              kubectl get crd middlewares.traefik.io -o yaml || true
              exit 1
            fi
            sleep 2
            est_elapsed=$((est_elapsed + 2))
          done
          echo "OK: CRD middlewares.traefik.io Established"

      - name: Importa le immagini nel cluster (nessun push su un registry per questo job)
        run: |
          k3d image import \
            "ghcr.io/${{ steps.owner.outputs.owner }}/gitstack-gateway:${IMAGE_TAG}" \
            "ghcr.io/${{ steps.owner.outputs.owner }}/gitstack-identity:${IMAGE_TAG}" \
            "ghcr.io/${{ steps.owner.outputs.owner }}/gitstack-core:${IMAGE_TAG}" \
            "ghcr.io/${{ steps.owner.outputs.owner }}/gitstack-git:${IMAGE_TAG}" \
            "ghcr.io/${{ steps.owner.outputs.owner }}/gitstack-web:${IMAGE_TAG}" \
            -c gitstack-ci

      # GIT-152: web attivo (default del chart), con l'immagine costruita sopra:
      # lo smoke del browser passa dall'Ingress e serve la UI vera.
      # imagePullPolicy: IfNotPresent nel chart evita che i pod ritentino un
      # pull remoto per un tag mai pubblicato su un registry.
      - name: helm install
        run: |
          helm install gitstack deploy/gitstack \
            --set global.image.tag="${IMAGE_TAG}" \
            --wait --timeout 3m

      - name: Attendi che gateway, identity, core, git e web siano Ready
        run: |
          kubectl get pods -o wide
          kubectl rollout status deployment/gitstack-gateway --timeout=120s
          kubectl rollout status deployment/gitstack-identity --timeout=120s
          kubectl rollout status deployment/gitstack-core --timeout=120s
          kubectl rollout status deployment/gitstack-git --timeout=120s
          kubectl rollout status deployment/gitstack-web --timeout=120s

      # GIT-234 (F8): k3s applica le NetworkPolicy. Un pod qualunque non
      # raggiunge NATS né Postgres; un pod con le label di core raggiunge la
      # porta di NATS, che dichiara auth_required (nessuna connessione senza
      # credenziali). Il risultato si legge da `kubectl logs` dopo Succeeded
      # o Failed, non con attach.
      - name: NetworkPolicy attive e NATS con credenziali
        run: |
          set -euo pipefail
          probe() { # nome, labels, comando...
            local name="$1" labels="$2"; shift 2
            kubectl run "${name}" --restart=Never --image=docker.io/busybox:1.36 \
              --labels="${labels}" --command -- "$@" >/dev/null
            local phase="" _i
            for _i in $(seq 1 60); do
              phase=$(kubectl get pod "${name}" -o jsonpath='{.status.phase}')
              if [ "${phase}" = Succeeded ] || [ "${phase}" = Failed ]; then break; fi
              sleep 2
            done
            echo "${phase}" >"/tmp/${name}.phase"
            kubectl logs "${name}" >"/tmp/${name}.log" 2>&1 || true
            kubectl delete pod "${name}" --wait=false >/dev/null
          }
          probe np-any-nats "app=np-probe" sh -c 'nc -z -w3 gitstack-nats 4222'
          probe np-any-pg "app=np-probe" sh -c 'nc -z -w3 gitstack-postgres 5432'
          probe np-core-nats "app.kubernetes.io/name=core,app.kubernetes.io/instance=gitstack,app.kubernetes.io/part-of=gitstack" \
            sh -c 'sleep 1 | nc -w3 gitstack-nats 4222; true'
          fail=0
          for n in np-any-nats np-any-pg; do
            if [ "$(cat /tmp/${n}.phase)" = Succeeded ]; then
              echo "FALLITO: un pod qualunque ha raggiunto ${n} (NetworkPolicy non applicate)" >&2; fail=1
            fi
          done
          if [ "$(cat /tmp/np-core-nats.phase)" != Succeeded ] || ! grep -q '"auth_required":true' /tmp/np-core-nats.log; then
            echo "FALLITO: NATS non dichiara auth_required (fase $(cat /tmp/np-core-nats.phase)):" >&2
            cat /tmp/np-core-nats.log >&2; fail=1
          fi
          exit "${fail}"

      # GIT-171: /downloads attraversa l'Ingress (web è già Ready): gs
      # scaricato dall'istanza, checksum da SHA256SUMS e `gs version` col tag
      # dell'immagine. Pubblico, senza token.
      - name: Scarica gs da /downloads, verifica il checksum e lancia gs version
        run: |
          set -euo pipefail
          base=http://localhost:8080/downloads
          d="$(mktemp -d)"
          curl -fsS "${base}/SHA256SUMS" -o "${d}/SHA256SUMS"
          curl -fsS "${base}/gs_linux_amd64" -o "${d}/gs_linux_amd64"
          (cd "${d}" && grep ' gs_linux_amd64$' SHA256SUMS | sha256sum -c -)
          chmod +x "${d}/gs_linux_amd64"
          "${d}/gs_linux_amd64" version | tee "${d}/version.txt"
          grep -F "${IMAGE_TAG}" "${d}/version.txt"
          # Indice, skills e CA: senza CA interna ca_cert è null e ca.crt dà 404.
          curl -fsS "${base}/index.json" | grep -F "\"version\":\"${IMAGE_TAG}\"" | grep -F '"ca_cert":null'
          curl -fsS "${base}/gs-skills.zip" -o "${d}/gs-skills.zip"
          (cd "${d}" && grep ' gs-skills.zip$' SHA256SUMS | sha256sum -c -)
          code=$(curl -s -o /dev/null -w '%{http_code}' "${base}/ca.crt")
          [ "${code}" = 404 ] || { echo "ca.crt: atteso 404, ricevuto ${code}"; exit 1; }
          # install-gs.sh servito con l'indirizzo dell'istanza, e installa gs.
          curl -fsS http://localhost:8080/install-gs.sh -o "${d}/install-gs.sh"
          grep -F 'http://localhost:8080' "${d}/install-gs.sh"
          if grep -F '__GS_BASE_URL__' "${d}/install-gs.sh"; then exit 1; fi
          GS_INSTALL_DIR="${d}/bin" sh "${d}/install-gs.sh"
          "${d}/bin/gs" version | grep -F "${IMAGE_TAG}"

      # GIT-99: l'helm install usa il default di git.ssh.enabled (true, R7):
      # il Service <release>-git-ssh (LoadBalancer, ServiceLB) apre la 2222 sul
      # nodo qualche secondo dopo il Ready, quindi polling con timeout.
      - name: Verifica che il server SSH di git risponda sulla porta 2222 (ssh-keyscan)
        run: |
          set -euo pipefail
          ok=""
          for _ in $(seq 1 30); do
            if ssh-keyscan -T 5 -p 2222 -t ed25519 localhost 2>/dev/null | grep -q 'ssh-ed25519'; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "FALLITO: ssh-keyscan -p 2222 non ha restituito una chiave host ed25519 in tempo" >&2
            kubectl get svc -o wide
            kubectl logs deployment/gitstack-git --tail=100 || true
            exit 1
          fi
          echo "OK: il server SSH di git risponde sulla porta 2222"

      - name: Verifica /healthz tramite l'Ingress Traefik (/api)
        run: |
          set -euo pipefail
          ok=""
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/healthz || true)
            if [ "$code" = "200" ]; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "FALLITO: GET /api/healthz (tramite Ingress) non ha risposto 200 in tempo" >&2
            kubectl get pods -o wide
            kubectl get ingress -o yaml
            kubectl logs deployment/gitstack-gateway --tail=100 || true
            exit 1
          fi
          echo "OK: GET /api/healthz -> 200 (via Ingress Traefik)"

      # identity dietro il gateway: senza cookie la sessione è 401
      # "unauthenticated" (risposta di identity, non del gateway) e /internal
      # non è esposto.
      - name: Verifica identity tramite l'Ingress (/api/v1/auth/session)
        run: |
          set -euo pipefail
          ok=""
          body=""
          for _ in $(seq 1 30); do
            body=$(curl -s -w ' HTTP=%{http_code}' http://localhost:8080/api/v1/auth/session || true)
            case "$body" in
              *unauthenticated*"HTTP=401") ok=1; break ;;
            esac
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "FALLITO: GET /api/v1/auth/session non ha risposto 401 unauthenticated (ultimo: $body)" >&2
            kubectl logs deployment/gitstack-identity --tail=100 || true
            kubectl logs deployment/gitstack-gateway --tail=100 || true
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' http://localhost:8080/api/v1/internal/verify)
          if [ "$code" != "404" ]; then
            echo "FALLITO: /api/v1/internal/verify risponde $code, atteso 404 (non esposto)" >&2
            exit 1
          fi
          echo "OK: identity raggiungibile via gateway, /internal non esposto"

      # GIT-151: il percorso che usa la UI. Il prefisso si legge da
      # web/src/lib/http.ts (API_BASE_URL), non si ricopia: con '/api' (senza
      # /v1) l'Ingress toglie /api e il gateway riceve /auth/session -> 404
      # text/plain, e questo passo fallisce. La password iniziale dell'admin
      # viene dal Secret (come il passo e3 di deploy/test-vm/e2e.ps1) e non
      # viene mai stampata.
      - name: Verifica il prefisso API della UI tramite l'Ingress (sessione, login admin, sessione col cookie)
        run: |
          set -euo pipefail
          prefix=$(sed -n "s/^export const API_BASE_URL = '\([^']*\)';.*$/\1/p" web/src/lib/http.ts)
          if [ -z "$prefix" ]; then
            echo "FALLITO: API_BASE_URL non trovato in web/src/lib/http.ts" >&2
            exit 1
          fi
          echo "Prefisso della UI (API_BASE_URL): $prefix"
          base="http://localhost:8080${prefix}"
          jar=$(mktemp)
          trap 'rm -f "$jar"' EXIT

          # 1. senza cookie: 401 JSON unauthenticated (con il prefisso sbagliato: 404 text/plain)
          out=$(curl -s -o /tmp/ui-session.body -w '%{http_code} %{content_type}' "${base}/auth/session" || true)
          if [ "${out%% *}" != "401" ] || ! grep -q 'unauthenticated' /tmp/ui-session.body; then
            echo "FALLITO: GET ${prefix}/auth/session senza cookie: atteso 401 JSON unauthenticated, ricevuto '${out}' corpo '$(head -c 200 /tmp/ui-session.body)'" >&2
            kubectl logs deployment/gitstack-gateway --tail=50 || true
            exit 1
          fi
          case "${out#* }" in
            application/json*) ;;
            *) echo "FALLITO: GET ${prefix}/auth/session: content-type '${out#* }', atteso application/json" >&2; exit 1 ;;
          esac

          # 2. login dell'admin con la password iniziale del Secret
          pw=$(kubectl get secret gitstack-identity-admin -o jsonpath='{.data.password}' | base64 -d)
          if [ -z "$pw" ]; then
            echo "FALLITO: password iniziale vuota nel Secret gitstack-identity-admin" >&2
            exit 1
          fi
          code=$(jq -n --arg p "$pw" '{username: "admin", password: $p}' \
            | curl -s -o /tmp/ui-login.body -w '%{http_code}' -c "$jar" -X POST -H 'content-type: application/json' -d @- "${base}/auth/login" || true)
          if [ "$code" != "200" ] || ! grep -q '"mustChangePassword"' /tmp/ui-login.body; then
            echo "FALLITO: POST ${prefix}/auth/login: status ${code} (atteso 200 con mustChangePassword), corpo '$(head -c 200 /tmp/ui-login.body)'" >&2
            kubectl logs deployment/gitstack-gateway --tail=50 || true
            kubectl logs deployment/gitstack-identity --tail=50 || true
            exit 1
          fi

          # 3. sessione col cookie: 200 (GET /auth/session è esente dal 403 password_change_required)
          code=$(curl -s -o /tmp/ui-session2.body -w '%{http_code}' -b "$jar" "${base}/auth/session" || true)
          if [ "$code" != "200" ] || ! grep -q '"username"' /tmp/ui-session2.body; then
            echo "FALLITO: GET ${prefix}/auth/session col cookie: status ${code} (atteso 200), corpo '$(head -c 200 /tmp/ui-session2.body)'" >&2
            exit 1
          fi
          echo "OK: ${prefix}/auth/session 401 -> login admin 200 -> sessione 200 (via Ingress)"

      # GIT-153: come un browser. curl rimanda anche un cookie Secure ricevuto
      # su http; un cookie jar vero lo scarta (tranne che su localhost). Il
      # programma usa http://gitstack.test:8080 (non loopback) e si collega a
      # 127.0.0.1:8080: con gst_session sempre Secure il login dà 200 ma la
      # sessione successiva 401 e il passo fallisce.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work

      - name: Login come un browser su HTTP (cookie jar che rispetta Secure)
        run: |
          set -euo pipefail
          prefix=$(sed -n "s/^export const API_BASE_URL = '\([^']*\)';.*$/\1/p" web/src/lib/http.ts)
          if [ -z "$prefix" ]; then
            echo "FALLITO: API_BASE_URL non trovato in web/src/lib/http.ts" >&2
            exit 1
          fi
          GITSTACK_PROBE_PASSWORD=$(kubectl get secret gitstack-identity-admin -o jsonpath='{.data.password}' | base64 -d)
          export GITSTACK_PROBE_PASSWORD
          go run scripts/check-browser-login.go -addr 127.0.0.1:8080 -host gitstack.test:8080 -prefix "$prefix" || {
            kubectl logs deployment/gitstack-gateway --tail=50 || true
            kubectl logs deployment/gitstack-identity --tail=50 || true
            exit 1
          }

      # GIT-182: smoke sull'immagine vera di core. Un repo con maiuscole
      # (`GitStack`) deve nascere con 201 e name conservato (R11, GIT-178): se
      # le immagini costruite fuori dal workspace usano un pkg/names vecchio,
      # core risponde 4xx "repository name may only contain lowercase...".
      # L'admin deve cambiare la password prima di ogni altra chiamata: la
      # cambia, crea il repo e rimette quella iniziale del Secret, così i passi
      # successivi (smoke UI) trovano lo stato di prima.
      - name: Smoke - crea un repo con maiuscole tramite l'Ingress (GIT-182)
        run: |
          set -euo pipefail
          prefix=$(sed -n "s/^export const API_BASE_URL = '\([^']*\)';.*$/\1/p" web/src/lib/http.ts)
          base="http://localhost:8080${prefix}"
          jar=$(mktemp)
          trap 'rm -f "$jar"' EXIT
          pw=$(kubectl get secret gitstack-identity-admin -o jsonpath='{.data.password}' | base64 -d)
          tmp="smoke-$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)"
          code=$(jq -n --arg p "$pw" '{username: "admin", password: $p}' \
            | curl -s -o /tmp/smoke-login.body -w '%{http_code}' -c "$jar" -X POST -H 'content-type: application/json' -d @- "${base}/auth/login" || true)
          if [ "$code" != "200" ]; then
            echo "FALLITO: login admin: status ${code}, corpo '$(head -c 200 /tmp/smoke-login.body)'" >&2
            exit 1
          fi
          change() {
            local code
            code=$(jq -n --arg c "$1" --arg n "$2" '{currentPassword: $c, newPassword: $n}' \
              | curl -s -o /tmp/smoke-pw.body -w '%{http_code}' -b "$jar" -c "$jar" -X PUT -H 'content-type: application/json' -d @- "${base}/users/admin/password" || true)
            if [ "$code" != "204" ]; then
              echo "FALLITO: cambio password: status ${code}, corpo '$(head -c 200 /tmp/smoke-pw.body)'" >&2
              exit 1
            fi
          }
          change "$pw" "$tmp"
          code=$(curl -s -o /tmp/smoke-repo.body -w '%{http_code}' -b "$jar" -X POST -H 'content-type: application/json' \
            -d '{"owner":"admin","name":"GitStack"}' "${base}/repos" || true)
          change "$tmp" "$pw"
          if [ "$code" != "201" ] || ! jq -e '.name == "GitStack"' /tmp/smoke-repo.body >/dev/null; then
            echo "FALLITO: POST ${prefix}/repos name=GitStack: status ${code} (atteso 201, name GitStack), corpo '$(head -c 300 /tmp/smoke-repo.body)'" >&2
            kubectl logs deployment/gitstack-core --tail=50 || true
            exit 1
          fi
          echo "OK: repo GitStack creato (201) con le maiuscole conservate"

      # GIT-152: smoke della UI nel browser (Chromium headless) attraverso
      # l'Ingress: /login, login admin con la password iniziale del Secret (la
      # UI impone il cambio: E2E_ADMIN_NEW_PASSWORD), pagina principale, lista
      # dei repo, nessuna risposta /api 4xx/5xx. Test in web/e2e/, fuori da
      # vitest. Le password restano in variabili d'ambiente, mai stampate.
      - name: Setup pnpm (smoke UI)
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: web/package.json

      - name: Setup Node (smoke UI)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Dipendenze di web/ e Chromium per Playwright
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Smoke UI nel browser attraverso l'Ingress (pnpm e2e)
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost:8080
        run: |
          set -euo pipefail
          E2E_ADMIN_PASSWORD=$(kubectl get secret gitstack-identity-admin -o jsonpath='{.data.password}' | base64 -d)
          if [ -z "$E2E_ADMIN_PASSWORD" ]; then
            echo "FALLITO: password iniziale vuota nel Secret gitstack-identity-admin" >&2
            exit 1
          fi
          E2E_ADMIN_NEW_PASSWORD="e2e-$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 20)"
          export E2E_ADMIN_PASSWORD E2E_ADMIN_NEW_PASSWORD
          pnpm e2e

      - name: Trace e screenshot dello smoke UI (solo se fallisce)
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: e2e-ui-trace
          path: web/e2e-results/
          if-no-files-found: ignore
          retention-days: 7

      # GIT-21: ogni comando ha "|| true" perché questo step deve restare
      # utile anche quando l'API server del cluster è irraggiungibile (il
      # guasto intermittente osservato dopo MR-14, run 36442771214): in quel
      # caso i comandi kubectl falliscono, ma docker/k3d restano la sola
      # fonte di diagnostica disponibile.
      - name: Diagnostica in caso di fallimento
        if: failure()
        run: |
          echo "--- docker ps -a ---"
          docker ps -a || true
          echo "--- k3d cluster list ---"
          k3d cluster list || true
          echo "--- log del container server k3d ---"
          docker logs k3d-gitstack-ci-server-0 --tail=200 || true
          echo "--- kubectl get all ---"
          kubectl get all || true
          echo "--- kubectl get crd middlewares.traefik.io ---"
          kubectl get crd middlewares.traefik.io || true
          echo "--- kubectl describe ingress ---"
          kubectl describe ingress gitstack || true
          echo "--- log gateway/core ---"
          kubectl logs deployment/gitstack-gateway --tail=200 || true
          kubectl logs deployment/gitstack-identity --tail=200 || true
          kubectl logs deployment/gitstack-identity -c bootstrap-db --tail=100 || true
          kubectl logs deployment/gitstack-core --tail=200 || true
