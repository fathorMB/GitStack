name: api-contract

# Contratto OpenAPI (M-01/T-03, M-01/T-04, M-01/T-05): fallisce se il client
# generato (client/go, client/ts) o l'interfaccia server di gateway e core
# (services/gateway, services/core) non sono allineati ad api/openapi.yaml.
# La CI generale di build/lint/test di Go e TypeScript arriva con M-01/T-02;
# questo workflow copre solo il criterio di accettazione specifico del
# contratto API.
#
# Due job distinti apposta (GIT-20), niente `paths:` a limitare i trigger:
# entrambi girano su ogni push a main e ogni pull request, qualunque file
# cambi.
# - check-generated: confronta solo il codice generato dal contratto
#   OpenAPI. Non lancia `go work sync`: i moduli coinvolti si generano dal
#   proprio go.mod/go.sum già committato, e mischiare `go work sync` in
#   questo job aveva reso il check rosso (messaggio "non allineato al
#   contratto") per go.mod/go.sum di moduli che l'item non aveva toccato
#   (successo due volte, GIT-16 e GIT-19), che è un problema distinto:
#   workspace-sync se ne occupa.
# - workspace-sync: lancia `go work sync` e verifica che non sporchi
#   go.mod/go.sum/go.work.sum di nessun modulo del workspace.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-generated:
    name: Codice generato allineato al contratto OpenAPI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.2"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.28.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: client/ts/pnpm-lock.yaml

      - name: Verifica che client/go e client/ts siano allineati ad api/openapi.yaml
        run: ./scripts/check-api-generated.sh

  workspace-sync:
    name: Workspace Go sincronizzato
    runs-on: ubuntu-24.04
    steps:
      # Stesse versioni di check-generated (GIT-242): checkout@v5 e
      # setup-go@v6 (Node 24). Prima il job usava v4/v5 e il run su ae4e78d
      # e' risultato rosso senza che i go.mod fossero cambiati; lo script ora
      # stampa diff e `go env` se il drift si ripresenta.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.2"

      - name: Verifica che `go work sync` non modifichi go.mod/go.sum
        run: ./scripts/check-go-work-sync.sh
