{{- if .Values.web.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gitstack.fullname" . }}-web
  labels:
    {{- include "gitstack.componentLabels" (dict "root" $ "component" "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "gitstack.componentSelectorLabels" (dict "root" $ "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gitstack.componentLabels" (dict "root" $ "component" "web") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "gitstack.image" (dict "root" $ "component" .Values.web) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.containerPort }}
          env:
            # Il container nginx dell'immagine (GIT-7) usa questa variabile
            # per sapere dove proxare /api/*: senza, resterebbe sul default
            # dell'immagine ("http://gateway:8080"), che non esiste nel
            # cluster (il Service del gateway si chiama
            # "<release>-gateway"). Vedi web/deploy/nginx.conf.template.
            - name: GATEWAY_UPSTREAM
              value: {{ include "gitstack.gateway.url" . | quote }}
          {{- if .Values.web.probes.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.web.probes.path }}
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ .Values.web.probes.path }}
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          {{- end }}
          {{- if .Values.ingress.tls.caConfigMap }}
          volumeMounts:
            # Certificato della CA interna, scaricabile da /downloads/ca.crt
            # (N5). Montato come cartella intera, non con subPath: un rinnovo
            # del ConfigMap arriva al pod senza riavvio.
            - name: ca
              mountPath: /usr/share/nginx/html/downloads
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
      {{- if .Values.ingress.tls.caConfigMap }}
      volumes:
        - name: ca
          configMap:
            name: {{ .Values.ingress.tls.caConfigMap }}
            # Il ConfigMap lo crea l'installer (gitstack-tls): se manca il pod
            # parte lo stesso e /downloads/ca.crt risponde 404.
            optional: true
      {{- end }}
{{- end }}
