{{- if .Values.gateway.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gitstack.fullname" . }}-gateway
  labels:
    {{- include "gitstack.componentLabels" (dict "root" $ "component" "gateway") | nindent 4 }}
spec:
  selector:
    {{- include "gitstack.componentSelectorLabels" (dict "root" $ "component" "gateway") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
    {{- if include "gitstack.apps.gatewayInternalPort" . }}
    # Porta interna per le app ospitate (GIT-442): solo /v1, aperta dalla NetworkPolicy ai loro namespace.
    - name: internal
      port: {{ include "gitstack.apps.gatewayInternalPort" . }}
      targetPort: internal
    {{- end }}
{{- end }}
