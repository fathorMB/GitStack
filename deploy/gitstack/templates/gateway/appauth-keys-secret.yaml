{{- /* Chiavi con cui il gateway firma le intestazioni X-GitStack-* verso le app
       (login davanti alle app, GIT-347): semi Ed25519, 32 byte in base64. Generate
       una sola volta e rilette con lookup a ogni upgrade: cambiarle invalida le
       firme già emesse (le app rileggono l'elenco delle chiavi pubbliche). */ -}}
{{- if and .Values.apps.enabled .Values.gateway.enabled (not .Values.apps.signingKeys.existingSecret) -}}
{{- $name := include "gitstack.apps.signingKeysSecret" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $keys := "" -}}
{{- if and $existing $existing.data (hasKey $existing.data "signing-keys") -}}
  {{- $keys = index $existing.data "signing-keys" | b64dec -}}
{{- else -}}
  {{- /* randBytes: 32 byte casuali già in base64. */ -}}
  {{- $keys = randBytes 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "gitstack.componentLabels" (dict "root" $ "component" "gateway") | nindent 4 }}
  annotations:
    # Sopravvive a `helm uninstall`: un reinstall non cambia la chiave di firma.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  signing-keys: {{ $keys | quote }}
{{- end }}
