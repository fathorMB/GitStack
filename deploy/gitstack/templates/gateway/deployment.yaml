{{- if .Values.gateway.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gitstack.fullname" . }}-gateway
  labels:
    {{- include "gitstack.componentLabels" (dict "root" $ "component" "gateway") | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "gitstack.componentSelectorLabels" (dict "root" $ "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gitstack.componentLabels" (dict "root" $ "component" "gateway") | nindent 8 }}
    spec:
      priorityClassName: gitstack-services
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "gitstack.podSecurityContext" (dict "runAsUser" 65532) | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.global.shutdown.terminationGracePeriodSeconds | int }}
      containers:
        - name: gateway
          image: {{ include "gitstack.image" (dict "root" $ "component" .Values.gateway) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          securityContext:
            {{- include "gitstack.containerSecurityContext" (dict "readOnly" true) | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.containerPort }}
            {{- if include "gitstack.apps.gatewayInternalPort" . }}
            - name: internal
              containerPort: {{ include "gitstack.apps.gatewayInternalPort" . }}
            {{- end }}
          env:
            - name: GITSTACK_VERSION
              value: {{ include "gitstack.imageTag" (dict "root" $ "component" .Values.gateway) | quote }}
            - name: GITSTACK_GATEWAY_ADDR
              value: {{ printf ":%d" (.Values.gateway.containerPort | int) | quote }}
            {{- if include "gitstack.apps.gatewayInternalPort" . }}
            # Porta interna per le app (GIT-442): solo /v1, X-Forwarded-For ignorato.
            - name: GITSTACK_GATEWAY_INTERNAL_ADDR
              value: {{ printf ":%s" (include "gitstack.apps.gatewayInternalPort" .) | quote }}
            {{- end }}
            - name: GITSTACK_CORE_URL
              value: {{ include "gitstack.core.url" . | quote }}
            {{- if and .Values.git.enabled .Values.git.registry.enabled }}
            # Registry OCI (GIT-286): /v2/ è instradato al servizio git.
            - name: GITSTACK_REGISTRY_URL
              value: {{ include "gitstack.git.url" . | quote }}
            {{- end }}
            {{- if .Values.identity.enabled }}
            - name: GITSTACK_IDENTITY_URL
              value: {{ include "gitstack.identity.url" . | quote }}
            - name: GITSTACK_IDENTITY_TIMEOUT
              value: {{ .Values.gateway.env.identityTimeout | quote }}
            {{- end }}
            # Segreto di servizio del gateway (F9): Bearer verso /internal/verify
            # di identity e firma dell'identità inoltrata a core. Solo da Secret.
            {{- include "gitstack.serviceSecret.env" (dict "root" . "caller" "gateway") | nindent 12 }}
            {{- if .Values.apps.enabled }}
            # Login davanti alle app (GIT-347): chiavi di firma delle intestazioni, indirizzo pubblico
            # e dominio delle app. Senza le chiavi /_appauth/verify risponde 503.
            - name: GITSTACK_GATEWAY_APPAUTH_SIGNING_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ include "gitstack.apps.signingKeysSecret" . }}
                  key: signing-keys
            - name: GITSTACK_GATEWAY_APPS_DOMAIN
              value: {{ .Values.apps.domain | quote }}
            {{- with .Values.core.env.publicUrl }}
            - name: GITSTACK_GATEWAY_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            - name: GITSTACK_GATEWAY_AUTH_CACHE_TTL
              value: {{ .Values.gateway.env.authCacheTTL | quote }}
            - name: GITSTACK_GATEWAY_AUTH_CACHE_NEGATIVE_TTL
              value: {{ .Values.gateway.env.authCacheNegativeTTL | quote }}
            - name: GITSTACK_GATEWAY_RATE_LIMIT_CREDENTIAL_RPS
              value: {{ .Values.gateway.env.rateLimit.credentialRps | quote }}
            - name: GITSTACK_GATEWAY_RATE_LIMIT_CREDENTIAL_BURST
              value: {{ .Values.gateway.env.rateLimit.credentialBurst | quote }}
            - name: GITSTACK_GATEWAY_RATE_LIMIT_IP_RPS
              value: {{ .Values.gateway.env.rateLimit.ipRps | quote }}
            - name: GITSTACK_GATEWAY_RATE_LIMIT_IP_BURST
              value: {{ .Values.gateway.env.rateLimit.ipBurst | quote }}
            - name: GITSTACK_CORE_TIMEOUT
              value: {{ .Values.gateway.env.coreTimeout | quote }}
            # Tetto al corpo di un upload di allegato: lo stesso valore di core
            # (core.attachments.maxBytes), così i due non possono divergere. Il
            # resto dei corpi è tenuto a 1 MiB (GITSTACK_GATEWAY_MAX_BODY_BYTES).
            - name: GITSTACK_GATEWAY_ATTACHMENTS_MAX_BYTES
              value: {{ .Values.core.attachments.maxBytes | int64 | quote }}
            {{- if .Values.gateway.env.trustedProxies }}
            - name: GITSTACK_GATEWAY_TRUSTED_PROXIES
              value: {{ .Values.gateway.env.trustedProxies | quote }}
            {{- end }}
            - name: GITSTACK_LOG_LEVEL
              value: {{ .Values.gateway.env.logLevel | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          {{- include "gitstack.preStop" . | nindent 10 }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
