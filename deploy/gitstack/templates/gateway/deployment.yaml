{{- if .Values.gateway.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gitstack.fullname" . }}-gateway
  labels:
    {{- include "gitstack.componentLabels" (dict "root" $ "component" "gateway") | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "gitstack.componentSelectorLabels" (dict "root" $ "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gitstack.componentLabels" (dict "root" $ "component" "gateway") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ include "gitstack.image" (dict "root" $ "component" .Values.gateway) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.containerPort }}
          env:
            - name: GITSTACK_VERSION
              value: {{ include "gitstack.imageTag" (dict "root" $ "component" .Values.gateway) | quote }}
            - name: GITSTACK_GATEWAY_ADDR
              value: {{ printf ":%d" (.Values.gateway.containerPort | int) | quote }}
            - name: GITSTACK_CORE_URL
              value: {{ include "gitstack.core.url" . | quote }}
            {{- if .Values.identity.enabled }}
            - name: GITSTACK_IDENTITY_URL
              value: {{ include "gitstack.identity.url" . | quote }}
            - name: GITSTACK_IDENTITY_TIMEOUT
              value: {{ .Values.gateway.env.identityTimeout | quote }}
            {{- end }}
            # Segreto di servizio: Bearer verso /internal/verify di identity e
            # firma dell'identità inoltrata a core. Solo da Secret.
            - name: GITSTACK_IDENTITY_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "gitstack.serviceSecret.name" . }}
                  key: secret
            - name: GITSTACK_GATEWAY_AUTH_CACHE_TTL
              value: {{ .Values.gateway.env.authCacheTTL | quote }}
            - name: GITSTACK_GATEWAY_AUTH_CACHE_NEGATIVE_TTL
              value: {{ .Values.gateway.env.authCacheNegativeTTL | quote }}
            - name: GITSTACK_CORE_TIMEOUT
              value: {{ .Values.gateway.env.coreTimeout | quote }}
            {{- if .Values.gateway.env.trustedProxies }}
            - name: GITSTACK_GATEWAY_TRUSTED_PROXIES
              value: {{ .Values.gateway.env.trustedProxies | quote }}
            {{- end }}
            - name: GITSTACK_LOG_LEVEL
              value: {{ .Values.gateway.env.logLevel | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
{{- end }}
