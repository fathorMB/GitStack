{{- if .Values.nats.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gitstack.fullname" . }}-nats
  labels:
    {{- include "gitstack.componentLabels" (dict "root" $ "component" "nats") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "gitstack.componentSelectorLabels" (dict "root" $ "component" "nats") | nindent 4 }}
  ports:
    - name: client
      port: {{ .Values.nats.service.clientPort }}
      targetPort: client
    - name: monitor
      port: 8222
      targetPort: monitor
{{- end }}
