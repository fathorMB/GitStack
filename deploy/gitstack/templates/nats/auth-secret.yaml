{{- if and .Values.nats.enabled (not .Values.nats.auth.existingSecret) -}}
{{- $name := printf "%s-nats-auth" (include "gitstack.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $user := "gitstack" -}}
{{- $password := "" -}}
{{- if and $existing $existing.data (hasKey $existing.data "password") -}}
  {{- $password = index $existing.data "password" | b64dec -}}
  {{- if hasKey $existing.data "user" -}}
    {{- $user = index $existing.data "user" | b64dec -}}
  {{- end -}}
{{- else -}}
  {{- /* Generata una sola volta: `helm upgrade` la ritrova con lookup e non la
         cambia (come la password di Postgres). */ -}}
  {{- $password = randAlphaNum 40 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "gitstack.componentLabels" (dict "root" $ "component" "nats") | nindent 4 }}
  annotations:
    # F8 (ASVS V1.2.2): utente e password con cui i servizi (core, git) si
    # autenticano su NATS. Sopravvive a `helm uninstall` come i dati di
    # JetStream: un reinstall non cambia la password.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  user: {{ $user | quote }}
  password: {{ $password | quote }}
{{- end }}
