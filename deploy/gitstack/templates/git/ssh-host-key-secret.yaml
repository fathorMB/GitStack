{{- if and .Values.git.enabled .Values.git.ssh.enabled (not .Values.git.ssh.hostKey.existingSecret) -}}
{{- $name := include "gitstack.git.sshHostKeySecret" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $key := "" -}}
{{- if and $existing $existing.data (hasKey $existing.data "ssh_host_ed25519_key") -}}
  {{- $key = index $existing.data "ssh_host_ed25519_key" | b64dec -}}
{{- else -}}
  {{- /* Generata una sola volta: un upgrade la ritrova con lookup. Cambiarla
         farebbe comparire ai client l'avviso "host key changed". */ -}}
  {{- $key = genPrivateKey "ed25519" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "gitstack.componentLabels" (dict "root" $ "component" "git") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  ssh_host_ed25519_key: {{ $key | quote }}
{{- end }}
