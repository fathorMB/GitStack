{{- if and .Values.git.enabled .Values.git.registry.enabled (not .Values.git.registry.signing.existingSecret) -}}
{{- $name := include "gitstack.git.registrySigningKeySecret" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $key := "" -}}
{{- if and $existing $existing.data (hasKey $existing.data "cosign.key") -}}
  {{- $key = index $existing.data "cosign.key" | b64dec -}}
{{- else -}}
  {{- /* Una chiave per istanza: gli upgrade la ritrovano con lookup. */ -}}
  {{- $key = genPrivateKey "ecdsa" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "gitstack.componentLabels" (dict "root" $ "component" "git") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  cosign.key: {{ $key | quote }}
{{- end }}
