{{- if .Values.core.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gitstack.fullname" . }}-core
  labels:
    {{- include "gitstack.componentLabels" (dict "root" $ "component" "core") | nindent 4 }}
spec:
  selector:
    {{- include "gitstack.componentSelectorLabels" (dict "root" $ "component" "core") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.core.service.port }}
      targetPort: http
    {{- if .Values.ci.enabled }}
    - name: ci-gateway
      port: {{ .Values.ci.gateway.port }}
      targetPort: ci-gateway
    {{- end }}
    {{- if and .Values.ci.enabled .Values.ci.externalGateway.enabled }}
    - name: ci-external
      port: {{ .Values.ci.externalGateway.port }}
      targetPort: ci-external
    {{- end }}
{{- end }}
