{{- if and .Values.core.enabled (include "gitstack.smtp.enabled" .) (not .Values.smtp.existingSecret) -}}
{{- if not .Values.smtp.from -}}
{{- fail "smtp.host è impostato: compila anche smtp.from (mittente delle email, es. \"GitStack <noreply@example.com>\") oppure usa smtp.existingSecret." -}}
{{- end -}}
{{- if not (has .Values.smtp.security (list "starttls" "tls" "none")) -}}
{{- fail "smtp.security deve essere starttls, tls o none." -}}
{{- end -}}
{{- /* Le email sono facoltative (M-06/F, C5): questo Secret esiste solo se
       smtp.host è valorizzato. Contiene anche la password, quindi non sta in
       un ConfigMap. Core ne legge le chiavi come GITSTACK_CORE_SMTP_*. */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gitstack.smtp.secretName" . }}
  labels:
    {{- include "gitstack.componentLabels" (dict "root" $ "component" "core") | nindent 4 }}
type: Opaque
stringData:
  host: {{ .Values.smtp.host | quote }}
  port: {{ ternary "" (.Values.smtp.port | int | toString) (eq (.Values.smtp.port | int) 0) | quote }}
  security: {{ .Values.smtp.security | quote }}
  username: {{ .Values.smtp.username | quote }}
  password: {{ .Values.smtp.password | quote }}
  from: {{ .Values.smtp.from | quote }}
{{- end }}
