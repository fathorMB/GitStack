{{- if .Values.core.enabled -}}
{{- if and .Values.core.attachments.enabled (gt (.Values.core.replicaCount | int) 1) -}}
{{- fail "core.attachments.enabled=true richiede core.replicaCount=1: il volume degli allegati è ReadWriteOnce (core gira a una replica con strategia Recreate)." -}}
{{- end -}}
{{- if not .Values.postgres.enabled -}}
{{- if or (not .Values.postgres.external.host) (not .Values.postgres.external.database) (not .Values.postgres.external.username) (not .Values.postgres.external.existingSecret) -}}
{{- fail "postgres.enabled=false (Postgres esterno del cliente, D6): compila postgres.external.host, .database, .username e .existingSecret (Secret con chiave 'password')." -}}
{{- end -}}
{{- end -}}
{{- $pgHost := printf "%s-postgres" (include "gitstack.fullname" .) -}}
{{- $pgPort := 5432 -}}
{{- if not .Values.postgres.enabled -}}
{{- $pgHost = .Values.postgres.external.host -}}
{{- $pgPort = .Values.postgres.external.port | int -}}
{{- end -}}
{{- $natsHost := printf "%s-nats" (include "gitstack.fullname" .) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gitstack.fullname" . }}-core
  labels:
    {{- include "gitstack.componentLabels" (dict "root" $ "component" "core") | nindent 4 }}
spec:
  replicas: {{ .Values.core.replicaCount }}
  {{- if .Values.core.attachments.enabled }}
  # Il PVC degli allegati è ReadWriteOnce: il nuovo pod non può montarlo finché
  # il vecchio non è fermo, quindi niente RollingUpdate (limite noto, README).
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "gitstack.componentSelectorLabels" (dict "root" $ "component" "core") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gitstack.componentLabels" (dict "root" $ "component" "core") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # core non ritenta la connessione a Postgres/NATS: esce subito se non
      # li trova raggiungibili (vedi values.yaml, core.waitFor). Questi
      # initContainer attendono la porta TCP prima di avviare "core",
      # invece di affidarsi al CrashLoopBackOff (più lento).
      {{- if .Values.core.attachments.enabled }}
      securityContext:
        # L'immagine gira come nonroot (uid 65532): il volume deve essere scrivibile.
        fsGroup: 65532
      {{- end }}
      initContainers:
        - name: wait-for-postgres
          image: {{ include "gitstack.image" (dict "root" $ "component" .Values.core.waitFor) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          command:
            - sh
            - -c
            - until nc -z -w2 {{ $pgHost }} {{ $pgPort }}; do echo "in attesa di postgres ({{ $pgHost }}:{{ $pgPort }})..."; sleep 2; done
        - name: wait-for-nats
          image: {{ include "gitstack.image" (dict "root" $ "component" .Values.core.waitFor) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          command:
            - sh
            - -c
            - until nc -z -w2 {{ $natsHost }} {{ .Values.nats.service.clientPort }}; do echo "in attesa di nats ({{ $natsHost }}:{{ .Values.nats.service.clientPort }})..."; sleep 2; done
      containers:
        - name: core
          image: {{ include "gitstack.image" (dict "root" $ "component" .Values.core) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.core.containerPort }}
          env:
            - name: GITSTACK_CORE_ADDR
              value: {{ printf ":%d" (.Values.core.containerPort | int) | quote }}
            # POSTGRES_PASSWORD deve precedere GITSTACK_CORE_DB_URL: la
            # sintassi "$(VAR)" nei valori di env di un container k8s si
            # espande solo con variabili già definite prima nella lista.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gitstack.postgres.secretName" . }}
                  key: password
            - name: GITSTACK_CORE_DB_URL
              value: {{ include "gitstack.postgres.dsnTemplate" . | quote }}
            - name: GITSTACK_CORE_DB_MAX_CONNS
              value: {{ .Values.core.env.dbMaxConns | quote }}
            - name: GITSTACK_CORE_MIGRATIONS_TIMEOUT
              value: {{ .Values.core.env.migrationsTimeout | quote }}
            - name: GITSTACK_CORE_NATS_URL
              value: {{ include "gitstack.nats.url" . | quote }}
            # Segreto di servizio: core accetta l'identità solo se firmata dal
            # gateway con questo segreto. Solo da Secret.
            - name: GITSTACK_IDENTITY_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "gitstack.serviceSecret.name" . }}
                  key: secret
            {{- if .Values.identity.enabled }}
            # identity: core vi assegna il grant admin a chi crea una risorsa
            # (POST /internal/resources/{id}/grants/creator). Senza identity,
            # POST /resources risponde 503.
            - name: GITSTACK_IDENTITY_URL
              value: {{ include "gitstack.identity.url" . | quote }}
            {{- end }}
            {{- if .Values.git.enabled }}
            - name: GITSTACK_GIT_URL
              value: {{ include "gitstack.git.url" . | quote }}
            {{- end }}
            {{- with .Values.core.env.publicUrl }}
            - name: GITSTACK_CORE_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.core.env.sshHost }}
            - name: GITSTACK_CORE_SSH_HOST
              value: {{ . | quote }}
            {{- end }}
            - name: GITSTACK_CORE_SSH_PORT
              value: {{ if .Values.git.ssh.enabled }}{{ .Values.git.ssh.port | quote }}{{ else }}"off"{{ end }}
            {{- if .Values.core.attachments.enabled }}
            - name: GITSTACK_CORE_ATTACHMENTS_DIR
              value: {{ .Values.core.attachments.mountPath | quote }}
            - name: GITSTACK_CORE_ATTACHMENTS_MAX_BYTES
              value: {{ .Values.core.attachments.maxBytes | int64 | quote }}
            - name: GITSTACK_CORE_ATTACHMENTS_ORPHAN_TTL
              value: {{ .Values.core.attachments.orphanTtl | quote }}
            {{- end }}
            - name: GITSTACK_CORE_LOG_LEVEL
              value: {{ .Values.core.env.logLevel | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- if .Values.core.attachments.enabled }}
          volumeMounts:
            - name: attachments
              mountPath: {{ .Values.core.attachments.mountPath | quote }}
          {{- end }}
          resources:
            {{- toYaml .Values.core.resources | nindent 12 }}
      {{- if .Values.core.attachments.enabled }}
      volumes:
        - name: attachments
          persistentVolumeClaim:
            claimName: {{ include "gitstack.fullname" . }}-attachments-data
      {{- end }}
{{- end }}
