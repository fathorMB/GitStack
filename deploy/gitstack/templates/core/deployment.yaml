{{- if .Values.core.enabled -}}
{{- if and (or .Values.core.attachments.enabled .Values.ci.enabled) (gt (.Values.core.replicaCount | int) 1) -}}
{{- fail "core.attachments.enabled=true o ci.enabled=true richiedono core.replicaCount=1: i volumi degli allegati e dei log CI sono ReadWriteOnce (core gira a una replica con strategia Recreate)." -}}
{{- end -}}
{{- if not .Values.postgres.enabled -}}
{{- if or (not .Values.postgres.external.host) (not .Values.postgres.external.database) (not .Values.postgres.external.username) (not .Values.postgres.external.existingSecret) -}}
{{- fail "postgres.enabled=false (Postgres esterno del cliente, D6): compila postgres.external.host, .database, .username e .existingSecret (Secret con chiave 'password')." -}}
{{- end -}}
{{- end -}}
{{- $pgHost := printf "%s-postgres" (include "gitstack.fullname" .) -}}
{{- $pgPort := 5432 -}}
{{- if not .Values.postgres.enabled -}}
{{- $pgHost = .Values.postgres.external.host -}}
{{- $pgPort = .Values.postgres.external.port | int -}}
{{- end -}}
{{- $natsHost := printf "%s-nats" (include "gitstack.fullname" .) -}}
{{- $pgCA := and (not .Values.postgres.enabled) .Values.postgres.external.caSecret -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gitstack.fullname" . }}-core
  labels:
    {{- include "gitstack.componentLabels" (dict "root" $ "component" "core") | nindent 4 }}
spec:
  replicas: {{ .Values.core.replicaCount }}
  {{- if or .Values.core.attachments.enabled .Values.ci.enabled }}
  # Il PVC degli allegati è ReadWriteOnce: il nuovo pod non può montarlo finché
  # il vecchio non è fermo, quindi niente RollingUpdate (limite noto, README).
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "gitstack.componentSelectorLabels" (dict "root" $ "component" "core") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gitstack.componentLabels" (dict "root" $ "component" "core") | nindent 8 }}
      {{- if and (include "gitstack.smtp.enabled" .) (not .Values.smtp.existingSecret) }}
      annotations:
        # Un cambio di smtp.* riavvia core: legge SMTP solo all'avvio.
        checksum/smtp: {{ toJson .Values.smtp | sha256sum }}
      {{- end }}
    spec:
      priorityClassName: gitstack-services
      {{- with include "gitstack.core.serviceAccountName" . }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # core non ritenta la connessione a Postgres/NATS: esce subito se non
      # li trova raggiungibili (vedi values.yaml, core.waitFor). Questi
      # initContainer attendono la porta TCP prima di avviare "core",
      # invece di affidarsi al CrashLoopBackOff (più lento).
      securityContext:
        # L'immagine gira come nonroot (uid 65532): il volume degli allegati
        # deve essere scrivibile.
        {{- include "gitstack.podSecurityContext" (dict "runAsUser" 65532 "fsGroup" (ternary 65532 0 (or .Values.core.attachments.enabled .Values.ci.enabled))) | nindent 8 }}
      initContainers:
        - name: wait-for-postgres
          image: {{ include "gitstack.image" (dict "root" $ "component" .Values.core.waitFor) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          securityContext:
            {{- include "gitstack.containerSecurityContext" (dict "readOnly" true) | nindent 12 }}
          command:
            - sh
            - -c
            - until nc -z -w2 {{ $pgHost }} {{ $pgPort }}; do echo "in attesa di postgres ({{ $pgHost }}:{{ $pgPort }})..."; sleep 2; done
        - name: wait-for-nats
          image: {{ include "gitstack.image" (dict "root" $ "component" .Values.core.waitFor) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          securityContext:
            {{- include "gitstack.containerSecurityContext" (dict "readOnly" true) | nindent 12 }}
          command:
            - sh
            - -c
            - until nc -z -w2 {{ $natsHost }} {{ .Values.nats.service.clientPort }}; do echo "in attesa di nats ({{ $natsHost }}:{{ .Values.nats.service.clientPort }})..."; sleep 2; done
      containers:
        - name: core
          image: {{ include "gitstack.image" (dict "root" $ "component" .Values.core) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          securityContext:
            {{- include "gitstack.containerSecurityContext" (dict "readOnly" true) | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.core.containerPort }}
            {{- if or .Values.ci.enabled (include "gitstack.ci.appPullOnly" .) }}
            - name: ci-gateway
              containerPort: {{ .Values.ci.gateway.port }}
            {{- end }}
            {{- if and .Values.ci.enabled .Values.ci.externalGateway.enabled }}
            - name: ci-external
              containerPort: {{ .Values.ci.externalGateway.port }}
            {{- end }}
          env:
            {{- include "gitstack.proxy.env" . | nindent 12 }}
            {{- include "gitstack.nats.authEnv" . | nindent 12 }}
            - name: GITSTACK_CORE_ADDR
              value: {{ printf ":%d" (.Values.core.containerPort | int) | quote }}
            {{- if .Values.apps.domain }}
            - name: GITSTACK_CORE_APPS_DOMAIN
              value: {{ .Values.apps.domain | quote }}
            {{- end }}
            {{- if .Values.apps.enabled }}
            - name: GITSTACK_CORE_APPS_ENABLED
              value: "true"
            - name: GITSTACK_CORE_APPS_CONTROLLER_SA
              value: {{ printf "%s/%s" .Release.Namespace (include "gitstack.core.serviceAccountName" .) | quote }}
            - name: GITSTACK_CORE_APPS_WORKLOAD_ROLE
              value: {{ include "gitstack.apps.workloadRoleName" . | quote }}
            - name: GITSTACK_CORE_APPS_AUTH_URL
              value: {{ include "gitstack.apps.authUrl" . | quote }}
            {{- if include "gitstack.apps.gatewayInternalPort" . }}
            # Le app raggiungono l'API di GitStack dal gateway nel cluster (GIT-442, H16): core apre
            # alle app solo i pod del gateway su questa porta e passa GITSTACK_API_URL.
            - name: GITSTACK_CORE_APPS_GATEWAY_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: GITSTACK_CORE_APPS_GATEWAY_SERVICE
              value: {{ printf "%s-gateway" (include "gitstack.fullname" .) | quote }}
            - name: GITSTACK_CORE_APPS_GATEWAY_POD_LABELS
              value: {{ printf "app.kubernetes.io/name=gateway,app.kubernetes.io/instance=%s" .Release.Name | quote }}
            - name: GITSTACK_CORE_APPS_GATEWAY_INTERNAL_PORT
              value: {{ include "gitstack.apps.gatewayInternalPort" . | quote }}
            {{- end }}
            - name: GITSTACK_CORE_APPS_TRAEFIK_METRICS_URL
              value: {{ include "gitstack.apps.traefikMetricsUrl" . | quote }}
            # Cancello fail-closed dei pod delle app (GIT-418): init container con l'immagine di core (`core apps-gate`).
            - name: GITSTACK_CORE_APPS_GATE_IMAGE
              value: {{ include "gitstack.image" (dict "root" $ "component" .Values.core) | quote }}
            {{- end }}
            {{- if include "gitstack.ci.appPullOnly" . }}
            # CI spenta, app e registry accesi (GIT-449): porta del ci-gateway solo per il token di pull
            # delle app (registry-access). Niente CI_ENABLED: i token dei job restano rifiutati.
            - name: GITSTACK_CORE_CI_GATEWAY_ADDR
              value: {{ printf ":%d" (.Values.ci.gateway.port | int) | quote }}
            {{- end }}
            {{- if .Values.ci.enabled }}
            - name: GITSTACK_CORE_CI_ENABLED
              value: "true"
            - name: GITSTACK_CORE_CI_NAMESPACE
              value: {{ .Values.ci.namespace | quote }}
            - name: GITSTACK_CORE_CI_IMAGE
              value: {{ include "gitstack.ci.runnerImage" . | quote }}
            {{- if .Values.ci.build.enabled }}
            # Job gitstack-build (GIT-371): namespace di build, BuildKit rootless e registry nel cluster.
            - name: GITSTACK_CORE_CI_BUILD_NAMESPACE
              value: {{ .Values.ci.build.namespace | quote }}
            - name: GITSTACK_CORE_CI_BUILD_IMAGE
              value: {{ .Values.ci.build.image | quote }}
            - name: GITSTACK_CORE_CI_REGISTRY_ADDR
              value: {{ printf "%s-gateway.%s.svc:%d" (include "gitstack.fullname" .) .Release.Namespace (.Values.gateway.service.port | int) | quote }}
            {{- end }}
            {{- if .Values.corporateCA.configMap }}
            # Proxy (stesse variabili di core) e CA aziendale passano ai pod dei job (N4, N9):
            # la CA e' copiata da ci-runner.yaml nel namespace dei job con questo nome.
            - name: GITSTACK_CORE_CI_CA_CONFIGMAP
              value: "corporate-ca"
            {{- end }}
            - name: GITSTACK_CORE_CI_ACTION_MIRROR
              value: {{ .Values.ci.runner.actionMirror | quote }}
            - name: GITSTACK_CORE_CI_CAPACITY
              value: {{ .Values.ci.capacity | quote }}
            - name: GITSTACK_CORE_CI_GATEWAY_ADDR
              value: {{ printf ":%d" (.Values.ci.gateway.port | int) | quote }}
            {{- if .Values.ci.externalGateway.enabled }}
            # Gateway per i runner esterni (GIT-329): solo token di runner registrati.
            - name: GITSTACK_CORE_CI_EXTERNAL_ADDR
              value: {{ printf ":%d" (.Values.ci.externalGateway.port | int) | quote }}
            - name: GITSTACK_CORE_CI_EXTERNAL_URL
              value: {{ printf "https://%s" .Values.ci.externalGateway.host | quote }}
            {{- end }}
            # I pod dei job stanno in ci.namespace: i nomi vanno qualificati
            # col namespace del rilascio (GIT-332), altrimenti non si risolvono.
            - name: GITSTACK_CORE_CI_GATEWAY_URL
              value: {{ printf "http://%s-core.%s.svc:%d" (include "gitstack.fullname" .) .Release.Namespace (.Values.ci.gateway.port | int) | quote }}
            - name: GITSTACK_CORE_CI_GATE_INTERNAL_ADDR
              value: {{ printf "%s-core.%s.svc:%d" (include "gitstack.fullname" .) .Release.Namespace (.Values.core.containerPort | int) | quote }}
            # Log (nel backup) e artefatti/cache (fuori dal backup) stanno nel
            # volume ci-data: <mountPath>/logs e <mountPath>/data (CI5).
            - name: GITSTACK_CORE_CI_LOGS_DIR
              value: {{ printf "%s/logs" .Values.ci.storage.mountPath | quote }}
            - name: GITSTACK_CORE_CI_ARTIFACTS_DIR
              value: {{ printf "%s/data" .Values.ci.storage.mountPath | quote }}
            {{- if .Values.ci.storage.s3.bucket }}
            - name: GITSTACK_CORE_CI_S3_ENDPOINT
              value: {{ .Values.ci.storage.s3.endpoint | quote }}
            - name: GITSTACK_CORE_CI_S3_BUCKET
              value: {{ .Values.ci.storage.s3.bucket | quote }}
            - name: GITSTACK_CORE_CI_S3_REGION
              value: {{ .Values.ci.storage.s3.region | quote }}
            - name: GITSTACK_CORE_CI_S3_PREFIX
              value: {{ .Values.ci.storage.s3.prefix | quote }}
            - name: GITSTACK_CORE_CI_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "ci.storage.s3.existingSecret è obbligatorio con ci.storage.s3.bucket (chiavi accessKey e secretKey)" .Values.ci.storage.s3.existingSecret }}
                  key: accessKey
            - name: GITSTACK_CORE_CI_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ci.storage.s3.existingSecret }}
                  key: secretKey
            {{- end }}
            {{- end }}
            # POSTGRES_PASSWORD deve precedere GITSTACK_CORE_DB_URL: la
            # sintassi "$(VAR)" nei valori di env di un container k8s si
            # espande solo con variabili già definite prima nella lista.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gitstack.postgres.secretName" . }}
                  key: password
            - name: GITSTACK_CORE_DB_URL
              value: {{ include "gitstack.postgres.dsnTemplate" . | quote }}
            - name: GITSTACK_CORE_DB_MAX_CONNS
              value: {{ .Values.core.env.dbMaxConns | quote }}
            - name: GITSTACK_CORE_MIGRATIONS_TIMEOUT
              value: {{ .Values.core.env.migrationsTimeout | quote }}
            - name: GITSTACK_CORE_NATS_URL
              value: {{ include "gitstack.nats.url" . | quote }}
            # Segreti di servizio (F9, un segreto per chiamante): core firma con
            # il proprio (Bearer verso identity, identità verso git), accetta
            # l'identità firmata dal gateway e da git solo la risoluzione di
            # owner/repo. Solo da Secret.
            {{- include "gitstack.serviceSecret.env" (dict "root" . "caller" "core") | nindent 12 }}
            {{- include "gitstack.serviceSecret.env" (dict "root" . "caller" "gateway") | nindent 12 }}
            {{- include "gitstack.serviceSecret.env" (dict "root" . "caller" "git") | nindent 12 }}
            {{- if .Values.identity.enabled }}
            # identity: core vi assegna il grant admin a chi crea una risorsa
            # (POST /internal/resources/{id}/grants/creator). Senza identity,
            # POST /resources risponde 503.
            - name: GITSTACK_IDENTITY_URL
              value: {{ include "gitstack.identity.url" . | quote }}
            {{- end }}
            {{- if .Values.core.releaseAssets.enabled }}
            - name: GITSTACK_CORE_RELEASE_ASSETS_DIR
              value: {{ .Values.core.releaseAssets.mountPath | quote }}
            {{- end }}
            {{- if .Values.ingress.tls.caConfigMap }}
            # CA interna (N5): core ne calcola l'impronta SHA-256 per GET /instance/ca
            # (guida CA dei tester). Cartella intera, come in web.
            - name: GITSTACK_CORE_CA_DIR
              value: /etc/gitstack/ca
            {{- else }}
            - name: GITSTACK_CORE_CA_MODE
              value: {{ if .Values.ingress.tls.enabled }}custom{{ else }}none{{ end }}
            {{- end }}
            {{- if .Values.git.enabled }}
            - name: GITSTACK_GIT_URL
              value: {{ include "gitstack.git.url" . | quote }}
            {{- end }}
            {{- with .Values.core.env.publicUrl }}
            - name: GITSTACK_CORE_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.core.env.sshHost }}
            - name: GITSTACK_CORE_SSH_HOST
              value: {{ . | quote }}
            {{- end }}
            - name: GITSTACK_CORE_SSH_PORT
              value: {{ if .Values.git.ssh.enabled }}{{ .Values.git.ssh.port | quote }}{{ else }}"off"{{ end }}
            {{- if .Values.core.attachments.enabled }}
            - name: GITSTACK_CORE_ATTACHMENTS_DIR
              value: {{ .Values.core.attachments.mountPath | quote }}
            - name: GITSTACK_CORE_ATTACHMENTS_MAX_BYTES
              value: {{ .Values.core.attachments.maxBytes | int64 | quote }}
            - name: GITSTACK_CORE_ATTACHMENTS_REPO_QUOTA_BYTES
              value: {{ .Values.core.attachments.repoQuotaBytes | int64 | quote }}
            - name: GITSTACK_CORE_ATTACHMENTS_USER_QUOTA_BYTES
              value: {{ .Values.core.attachments.userQuotaBytes | int64 | quote }}
            - name: GITSTACK_CORE_ATTACHMENTS_ORPHAN_TTL
              value: {{ .Values.core.attachments.orphanTtl | quote }}
            {{- end }}
            # Webhook (M-06/G): chiave di cifratura dei segreti (id per la
            # rotazione; le chiavi precedenti, `id:chiave,...`, sono la chiave
            # facoltativa `oldKeys` dello stesso Secret).
            - name: GITSTACK_WEBHOOK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.core.webhookSecret.existingSecret | default (printf "%s-core-webhook-key" (include "gitstack.fullname" .)) }}
                  key: key
            - name: GITSTACK_WEBHOOK_SECRET_KEY_ID
              value: {{ .Values.core.webhookSecret.keyId | quote }}
            - name: GITSTACK_WEBHOOK_SECRET_OLD_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.core.webhookSecret.existingSecret | default (printf "%s-core-webhook-key" (include "gitstack.fullname" .)) }}
                  key: oldKeys
                  optional: true
            # Informazioni dell'host per Admin · System (GIT-213): il ConfigMap
            # <release>-system-info, scritto da `gitstack system-info publish`,
            # montato come file. Core non interroga l'host né l'API di Kubernetes.
            - name: GITSTACK_SYSTEM_INFO_FILE
              value: /etc/gitstack/system-info/system.json
            # Protezione SSRF delle chiamate in uscita dei webhook (C8,
            # pkg/egress): values `egress.*`.
            {{- with .Values.egress.allow }}
            - name: GITSTACK_EGRESS_ALLOW
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.egress.deny }}
            - name: GITSTACK_EGRESS_DENY
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.egress.clusterCIDRs }}
            - name: GITSTACK_EGRESS_CLUSTER_CIDRS
              value: {{ join "," . | quote }}
            {{- end }}
            # Indirizzi del nodo, sempre bloccati (F7): quello del pod host
            # dal downward API, più egress.nodeAddresses.
            - name: GITSTACK_NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            {{- with .Values.egress.nodeAddresses }}
            - name: GITSTACK_EGRESS_NODE_ADDRESSES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if include "gitstack.smtp.enabled" . }}
            # SMTP facoltativo (M-06/F, C5): senza smtp.host (o existingSecret)
            # queste variabili non esistono e core manda solo notifiche in-app.
            - name: GITSTACK_CORE_SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ include "gitstack.smtp.secretName" . }}
                  key: host
            - name: GITSTACK_CORE_SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ include "gitstack.smtp.secretName" . }}
                  key: port
                  optional: true
            - name: GITSTACK_CORE_SMTP_SECURITY
              valueFrom:
                secretKeyRef:
                  name: {{ include "gitstack.smtp.secretName" . }}
                  key: security
                  optional: true
            - name: GITSTACK_CORE_SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "gitstack.smtp.secretName" . }}
                  key: username
                  optional: true
            - name: GITSTACK_CORE_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gitstack.smtp.secretName" . }}
                  key: password
                  optional: true
            - name: GITSTACK_CORE_SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: {{ include "gitstack.smtp.secretName" . }}
                  key: from
            {{- end }}
            - name: GITSTACK_CORE_LOG_LEVEL
              value: {{ .Values.core.env.logLevel | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: system-info
              mountPath: /etc/gitstack/system-info
              readOnly: true
            {{- if .Values.core.attachments.enabled }}
            - name: attachments
              mountPath: {{ .Values.core.attachments.mountPath | quote }}
            {{- end }}
            {{- if .Values.ci.enabled }}
            - name: ci-data
              mountPath: {{ .Values.ci.storage.mountPath | quote }}
            {{- end }}
            {{- if .Values.core.releaseAssets.enabled }}
            - name: release-assets
              mountPath: {{ .Values.core.releaseAssets.mountPath | quote }}
            {{- end }}
            {{- if .Values.ingress.tls.caConfigMap }}
            - name: ca
              mountPath: /etc/gitstack/ca
              readOnly: true
            {{- end }}
            {{- if $pgCA }}
            - name: postgres-ca
              mountPath: {{ include "gitstack.postgres.caMountPath" . }}
              readOnly: true
            {{- end }}
            {{- if .Values.corporateCA.configMap }}
            {{- include "gitstack.corporateCA.volumeMount" . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.core.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        # Opzionale: prima della prima pubblicazione il ConfigMap non esiste e
        # core parte lo stesso (Admin · System mostra «non pubblicato»).
        - name: system-info
          configMap:
            name: {{ include "gitstack.fullname" . }}-system-info
            optional: true
        {{- if .Values.core.attachments.enabled }}
        - name: attachments
          persistentVolumeClaim:
            claimName: {{ include "gitstack.fullname" . }}-attachments-data
        {{- end }}
        {{- if .Values.ci.enabled }}
        - name: ci-data
          persistentVolumeClaim:
            claimName: {{ include "gitstack.fullname" . }}-ci-data
        {{- end }}
        {{- if .Values.core.releaseAssets.enabled }}
        - name: release-assets
          persistentVolumeClaim:
            claimName: {{ include "gitstack.fullname" . }}-release-assets-data
        {{- end }}
        {{- if .Values.ingress.tls.caConfigMap }}
        # Come in web: cartella intera (un rinnovo arriva senza riavvio) e optional,
        # perché il ConfigMap lo crea l'installer e core parte anche senza.
        - name: ca
          configMap:
            name: {{ .Values.ingress.tls.caConfigMap }}
            optional: true
        {{- end }}
        {{- if $pgCA }}
        - name: postgres-ca
          secret:
            secretName: {{ $pgCA }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        {{- if .Values.corporateCA.configMap }}
        {{- include "gitstack.corporateCA.volume" . | nindent 8 }}
        {{- end }}
{{- end }}
