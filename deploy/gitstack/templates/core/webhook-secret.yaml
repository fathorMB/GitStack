{{- /* Chiave con cui core cifra i segreti dei webhook (AES-256-GCM,
       GITSTACK_WEBHOOK_SECRET_KEY, M-06/G). Generata una sola volta: se si
       perde, i segreti già salvati non si leggono più e i webhook firmati
       vanno reimpostati. */ -}}
{{- if and .Values.core.enabled (not .Values.core.webhookSecret.existingSecret) -}}
{{- $name := printf "%s-core-webhook-key" (include "gitstack.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $key := "" -}}
{{- if and $existing $existing.data (hasKey $existing.data "key") -}}
  {{- $key = index $existing.data "key" | b64dec -}}
{{- else -}}
  {{- /* 32 byte in esadecimale (sha256 di un valore casuale). */ -}}
  {{- $key = randAlphaNum 64 | sha256sum -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "gitstack.componentLabels" (dict "root" $ "component" "core") | nindent 4 }}
  annotations:
    # Sopravvive a `helm uninstall`, così un reinstall non cambia la chiave e
    # non rende illeggibili i segreti già cifrati nel database.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  key: {{ $key | quote }}
{{- end }}
