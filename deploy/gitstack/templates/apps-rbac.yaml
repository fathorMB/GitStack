{{- if .Values.apps.enabled }}
{{- if not .Values.apps.domain }}{{ fail "apps.enabled richiede apps.domain (il dominio delle app, es. apps.azienda.it): usa install.sh --apps-domain o gitstack config set apps-domain" }}{{- end }}
{{- if not .Values.core.enabled }}{{ fail "apps.enabled richiede core.enabled: il controller delle app vive in core" }}{{- end }}
{{- $sa := include "gitstack.core.serviceAccountName" . }}
{{- $workload := include "gitstack.apps.workloadRoleName" . }}
{{- $controller := printf "%s-apps-controller" (include "gitstack.fullname" .) | trunc 63 | trimSuffix "-" }}
# Hosting delle app (ADR 0002): RBAC minimo di core.
#  - Niente ClusterRole con permessi sulle app e niente ClusterRoleBinding verso di esso.
#  - ClusterRole del controller: solo i verbi che servono a creare, osservare e togliere i
#    namespace delle app e a legarli al ruolo modello. `update` sui namespace serve ad
#    allineare la label Pod Security di un namespace già creato (ensureNamespace): è una
#    deviazione dall'ADR, ammessa solo dietro la ValidatingAdmissionPolicy in fondo.
#    Anche create dei rolebindings e bind valgono cluster-wide per RBAC: li chiude la stessa policy.
#  - ClusterRole modello (<release>-app-workload): i permessi sull'app. Nessun binding
#    cluster-wide: il controller crea un RoleBinding in ogni namespace gitstack-app-<id>, e può
#    farlo solo verso questo ruolo (`bind` con resourceNames).
{{- if not .Values.ci.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  labels:
    {{- include "gitstack.componentLabels" (dict "root" $ "component" "core") | nindent 4 }}
automountServiceAccountToken: true
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $controller }}
  labels:
    {{- include "gitstack.componentLabels" (dict "root" $ "component" "core") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "list", "watch", "update", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["create", "get"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
    resourceNames: [{{ $workload | quote }}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $controller }}
  labels:
    {{- include "gitstack.componentLabels" (dict "root" $ "component" "core") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $controller }}
---
# Certificati del cliente per i domini propri (GIT-460, ADR 0002): il Secret TLS sta SOLO nel namespace del
# TLSStore default letto da Traefik (include "gitstack.tlsStoreNamespace"): quello del release con la CA
# interna (il chart vi crea il TLSStore, e in tutto il cluster ne esiste uno solo), quello di Traefik
# altrimenti; mai nei namespace delle app. Role (non ClusterRole) in quel namespace: Secret senza list (RBAC
# non filtra una list per nome: core non deve poter elencare i Secret del namespace) e il TLSStore default
# che li elenca. Il nome dei Secret e' gitstack-domain-<id dominio>; core toglie solo quelli che il TLSStore cita.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $controller }}-certs
  namespace: {{ include "gitstack.tlsStoreNamespace" . }}
  labels:
    {{- include "gitstack.componentLabels" (dict "root" $ "component" "core") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "update", "delete"]
  - apiGroups: ["traefik.io"]
    resources: ["tlsstores"]
    verbs: ["create", "get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $controller }}-certs
  namespace: {{ include "gitstack.tlsStoreNamespace" . }}
  labels:
    {{- include "gitstack.componentLabels" (dict "root" $ "component" "core") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $controller }}-certs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $workload }}
  labels:
    {{- include "gitstack.componentLabels" (dict "root" $ "component" "core") | nindent 4 }}
    gitstack.io/role-template: "true"
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "update"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "update", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    # delete: l'apply toglie app-secrets quando l'app non ha segreti (deleteAppSecret); RBAC
    # rifiuta la richiesta prima di sapere se il Secret esiste (GIT-424).
    verbs: ["create", "get", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Uso di CPU e memoria dei pod (metrics-server): readPodMetrics (services/core/internal/apps/
  # metrics.go) fa List su metrics.k8s.io/v1beta1 pods nel namespace dell'app. Solo lettura, legata per namespace dal RoleBinding (GIT-427).
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  # Volumi persistenti delle app (v3-b, H3): i PVC si creano prima del Deployment e si eliminano
  # quando il volume viene tolto dall'app; la dimensione non cambia mai (niente update).
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "delete"]
  # Rotta e Middleware del login (strip e forward-auth, GIT-347) che il controller crea per app.
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes", "middlewares"]
    verbs: ["create", "get", "update", "delete"]
---
# Perimetro del controller (ADR 0002): i verbi del ClusterRole del controller valgono su TUTTO il
# cluster (RBAC non filtra per nome), quindi senza questa policy core potrebbe legare il ruolo
# modello in kube-system o cambiare le label di un namespace di sistema. La policy restringe SOLO
# il ServiceAccount di core (matchCondition) ai namespace delle app: nome gitstack-app-* e label
# gitstack.io/managed-app=true (sull'oggetto in CREATE/UPDATE, sul vecchio oggetto in UPDATE/DELETE).
# I RoleBinding ammessi: solo nei namespace delle app, solo verso il ruolo modello, solo per il
# ServiceAccount di core. Richiede Kubernetes >= 1.30 (ValidatingAdmissionPolicy GA, come ci-build).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $controller }}-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["namespaces"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["rolebindings"]
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["networkpolicies"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services"]
  matchConditions:
    - name: solo-il-serviceaccount-di-core
      expression: >-
        request.userInfo.username == {{ printf "system:serviceaccount:%s:%s" .Release.Namespace $sa | quote }}
  validations:
    - expression: >-
        request.resource.resource != 'namespaces' || request.operation == 'DELETE' ||
        (object.metadata.name.startsWith('gitstack-app-') && has(object.metadata.labels) &&
         'gitstack.io/managed-app' in object.metadata.labels && object.metadata.labels['gitstack.io/managed-app'] == 'true')
      message: "core può creare e modificare solo namespace gitstack-app-* con la label gitstack.io/managed-app=true"
    - expression: >-
        request.resource.resource != 'namespaces' || request.operation == 'CREATE' ||
        (oldObject.metadata.name.startsWith('gitstack-app-') && has(oldObject.metadata.labels) &&
         'gitstack.io/managed-app' in oldObject.metadata.labels && oldObject.metadata.labels['gitstack.io/managed-app'] == 'true')
      message: "core può modificare ed eliminare solo namespace gitstack-app-* già marcati gitstack.io/managed-app=true"
    - expression: >-
        request.resource.resource != 'rolebindings' ||
        (request.namespace.startsWith('gitstack-app-') && has(namespaceObject.metadata.labels) &&
         'gitstack.io/managed-app' in namespaceObject.metadata.labels && namespaceObject.metadata.labels['gitstack.io/managed-app'] == 'true')
      message: "core può creare RoleBinding solo nei namespace gitstack-app-* marcati gitstack.io/managed-app=true"
    - expression: >-
        request.resource.resource != 'networkpolicies' ||
        (request.namespace.startsWith('gitstack-app-') && has(namespaceObject.metadata.labels) &&
         'gitstack.io/managed-app' in namespaceObject.metadata.labels && namespaceObject.metadata.labels['gitstack.io/managed-app'] == 'true')
      message: "core può creare NetworkPolicy solo nei namespace gitstack-app-* marcati gitstack.io/managed-app=true"
    - expression: >-
        request.resource.resource != 'services' ||
        (request.namespace.startsWith('gitstack-app-') && has(namespaceObject.metadata.labels) &&
         'gitstack.io/managed-app' in namespaceObject.metadata.labels && namespaceObject.metadata.labels['gitstack.io/managed-app'] == 'true')
      message: "core può creare Service solo nei namespace gitstack-app-* marcati gitstack.io/managed-app=true"
    # H15: l'unico ExternalName ammesso è l'alias di un'app sorella, cioè il Service `app` di un altro
    # namespace gitstack-app-* e non un nome esterno (niente uscita verso host a scelta via DNS).
    - expression: >-
        request.resource.resource != 'services' || object.spec.type != 'ExternalName' ||
        (has(object.spec.externalName) && object.spec.externalName.matches('^app[.]gitstack-app-[0-9a-f-]{36}[.]svc[.]cluster[.]local$'))
      message: "un Service ExternalName può puntare solo al Service app di un altro namespace gitstack-app-* (H15)"
    - expression: >-
        request.resource.resource != 'rolebindings' ||
        (object.roleRef.kind == 'ClusterRole' && object.roleRef.name == {{ $workload | quote }})
      message: "core può legare solo il ClusterRole modello delle app"
    - expression: >-
        request.resource.resource != 'rolebindings' ||
        (has(object.subjects) && object.subjects.all(s, s.kind == 'ServiceAccount' &&
         s.name == {{ $sa | quote }} && s.namespace == {{ .Release.Namespace | quote }}))
      message: "il RoleBinding delle app può avere come soggetto solo il ServiceAccount di core"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $controller }}-scope
spec:
  policyName: {{ $controller }}-scope
  validationActions: ["Deny"]
{{- end }}
