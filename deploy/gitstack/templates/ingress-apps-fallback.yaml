{{- if and .Values.ingress.enabled .Values.apps.enabled .Values.web.enabled -}}
{{- $fullname := include "gitstack.fullname" . -}}
{{- if lt (len .Values.apps.domain) 6 }}{{ fail "apps.domain deve contenere almeno 6 caratteri per la route di riserva" }}{{ end -}}
{{- $appsDomainRegex := replace "." "\\." .Values.apps.domain -}}
# PathPrefix(`/`) e PathPrefix(`/api`) dell'Ingress UI hanno priorità 15 e 18;
# questa regola ha priorità 19. Le route app hanno priorità
# len("Host(`<label>.<dominio>`)") >= 14+len(dominio), quindi almeno 20 con
# dominio di 6 caratteri.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullname }}-apps-unavailable
  labels:
    {{- include "gitstack.labels" . | nindent 4 }}
spec:
  replacePath:
    path: /__gitstack-app-unavailable
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $fullname }}-apps-fallback
  labels:
    {{- include "gitstack.labels" . | nindent 4 }}
spec:
  {{- if .Values.ingress.tls.enabled }}
  entryPoints:
    - websecure
  {{- end }}
  routes:
    - kind: Rule
      priority: 19
      match: HostRegexp(`^.+\.{{ $appsDomainRegex }}$`)
      middlewares:
        - name: {{ $fullname }}-apps-unavailable
      services:
        - name: {{ $fullname }}-web
          port: {{ .Values.web.service.port }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    options:
      name: {{ $fullname }}-tls
  {{- end }}
{{- end }}
