{{- if .Values.identity.enabled -}}
{{- if not .Values.postgres.enabled -}}
{{- if or (not .Values.postgres.external.host) (not .Values.postgres.external.database) (not .Values.postgres.external.username) (not .Values.postgres.external.existingSecret) -}}
{{- fail "postgres.enabled=false (Postgres esterno del cliente, D6): compila postgres.external.host, .database, .username e .existingSecret (Secret con chiave 'password')." -}}
{{- end -}}
{{- end -}}
{{- $pgHost := printf "%s-postgres" (include "gitstack.fullname" .) -}}
{{- $pgPort := 5432 -}}
{{- $pgDatabase := .Values.postgres.auth.database -}}
{{- $pgAdmin := .Values.postgres.auth.username -}}
{{- $pgSSL := "disable" -}}
{{- if not .Values.postgres.enabled -}}
{{- $pgHost = .Values.postgres.external.host -}}
{{- $pgPort = .Values.postgres.external.port | int -}}
{{- $pgDatabase = .Values.postgres.external.database -}}
{{- $pgAdmin = .Values.postgres.external.username -}}
{{- $pgSSL = .Values.postgres.external.sslMode -}}
{{- end -}}
{{- $pgCA := and (not .Values.postgres.enabled) .Values.postgres.external.caSecret -}}
{{- $pgSSLQuery := printf "sslmode=%s" $pgSSL -}}
{{- if $pgCA -}}
{{- $pgSSLQuery = printf "%s&sslrootcert=%s/ca.crt" $pgSSLQuery (include "gitstack.postgres.caMountPath" .) -}}
{{- end -}}
{{- $pgClientImage := include "gitstack.image" (dict "root" $ "component" .Values.postgres) -}}
{{- if not .Values.postgres.enabled -}}
{{- $pgClientImage = include "gitstack.image" (dict "root" $ "component" .Values.postgres.external.client) -}}
{{- end -}}
{{- $dbSecret := .Values.identity.db.existingSecret | default (printf "%s-identity-db" (include "gitstack.fullname" .)) -}}
{{- $adminSecret := .Values.identity.admin.existingSecret | default (printf "%s-identity-admin" (include "gitstack.fullname" .)) -}}
{{- $oidc := and .Values.identity.oidc.enabled -}}
{{- $oidcSecret := .Values.identity.oidc.existingSecret | default (printf "%s-identity-oidc" (include "gitstack.fullname" .)) -}}
{{- $oidcKeySecret := .Values.identity.oidc.encKey.existingSecret | default (printf "%s-identity-oidc-key" (include "gitstack.fullname" .)) -}}
{{- $totpKeySecret := .Values.identity.totp.keys.existingSecret | default (printf "%s-identity-totp-key" (include "gitstack.fullname" .)) -}}
{{- if and $oidc (not .Values.identity.oidc.publicUrl) -}}
{{- fail "identity.oidc.enabled=true: compila identity.oidc.publicUrl (URL pubblico di GitStack, es. https://git.example.com)." -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gitstack.fullname" . }}-identity
  labels:
    {{- include "gitstack.componentLabels" (dict "root" $ "component" "identity") | nindent 4 }}
spec:
  replicas: {{ .Values.identity.replicaCount }}
  selector:
    matchLabels:
      {{- include "gitstack.componentSelectorLabels" (dict "root" $ "component" "identity") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gitstack.componentLabels" (dict "root" $ "component" "identity") | nindent 8 }}
      annotations:
        # Un cambio del bootstrap SQL rilancia il pod (e l'initContainer).
        checksum/bootstrap: {{ .Files.Get "files/identity-bootstrap-role.sql" | sha256sum }}
        {{- if and $oidc (not .Values.identity.oidc.existingSecret) }}
        # Un cambio dei provider OIDC rilancia il pod (il file si legge all'avvio).
        checksum/oidc: {{ .Values.identity.oidc.providers | toJson | sha256sum }}
        {{- end }}
    spec:
      priorityClassName: gitstack-services
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Ruolo e schema dedicati (D6): l'initContainer attende Postgres e
      # applica files/identity-bootstrap-role.sql con le credenziali
      # amministrative di Postgres. È idempotente (CREATE ROLE protetto da un
      # controllo su pg_roles), quindi gira a ogni avvio del pod senza errori.
      # Le credenziali amministrative non arrivano mai al container di
      # identity, che si connette solo come identity_app.
      securityContext:
        {{- include "gitstack.podSecurityContext" (dict "runAsUser" 65532) | nindent 8 }}
      initContainers:
        - name: bootstrap-db
          image: {{ $pgClientImage }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          securityContext:
            {{- include "gitstack.containerSecurityContext" (dict "readOnly" true) | nindent 12 }}
          env:
            - name: PGHOST
              value: {{ $pgHost | quote }}
            - name: PGPORT
              value: {{ $pgPort | quote }}
            - name: PGDATABASE
              value: {{ $pgDatabase | quote }}
            - name: PGUSER
              value: {{ $pgAdmin | quote }}
            - name: PGSSLMODE
              value: {{ $pgSSL | quote }}
            {{- if $pgCA }}
            - name: PGSSLROOTCERT
              value: {{ printf "%s/ca.crt" (include "gitstack.postgres.caMountPath" .) | quote }}
            {{- end }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gitstack.postgres.secretName" . }}
                  key: password
            - name: IDENTITY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $dbSecret }}
                  key: password
          command:
            - sh
            - -c
            - |
              set -eu
              until pg_isready -q; do echo "in attesa di postgres ($PGHOST:$PGPORT)..."; sleep 2; done
              psql -v ON_ERROR_STOP=1 -v identity_password="$IDENTITY_DB_PASSWORD" -f /bootstrap/bootstrap-role.sql
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            {{- if $pgCA }}
            - name: postgres-ca
              mountPath: {{ include "gitstack.postgres.caMountPath" . }}
              readOnly: true
            {{- end }}
      containers:
        - name: identity
          securityContext:
            {{- include "gitstack.containerSecurityContext" (dict "readOnly" true) | nindent 12 }}
          image: {{ include "gitstack.image" (dict "root" $ "component" .Values.identity) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.identity.containerPort }}
          env:
            {{- include "gitstack.proxy.env" . | nindent 12 }}
            - name: GITSTACK_IDENTITY_ADDR
              value: {{ printf ":%d" (.Values.identity.containerPort | int) | quote }}
            # IDENTITY_DB_PASSWORD deve precedere GITSTACK_IDENTITY_DB_URL
            # (espansione "$(VAR)" solo su variabili già definite).
            - name: IDENTITY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $dbSecret }}
                  key: password
            - name: GITSTACK_IDENTITY_DB_URL
              value: {{ printf "postgres://identity_app:$(IDENTITY_DB_PASSWORD)@%s:%d/%s?%s" $pgHost ($pgPort | int) $pgDatabase $pgSSLQuery | quote }}
            - name: GITSTACK_IDENTITY_DB_MAX_CONNS
              value: {{ .Values.identity.env.dbMaxConns | quote }}
            - name: GITSTACK_IDENTITY_MIGRATIONS_TIMEOUT
              value: {{ .Values.identity.env.migrationsTimeout | quote }}
            - name: GITSTACK_IDENTITY_LOG_LEVEL
              value: {{ .Values.identity.env.logLevel | quote }}
            - name: GITSTACK_IDENTITY_SESSION_TTL
              value: {{ .Values.identity.env.sessionTTL | quote }}
            - name: GITSTACK_IDENTITY_SESSION_IDLE_TIMEOUT
              value: {{ .Values.identity.env.sessionIdleTimeout | quote }}
            # Segreti di servizio per /internal/* (F9): uno per chiamante, solo
            # da Secret, mai in chiaro. Identity li verifica, non firma.
            {{- include "gitstack.serviceSecret.env" (dict "root" . "caller" "gateway") | nindent 12 }}
            {{- include "gitstack.serviceSecret.env" (dict "root" . "caller" "core") | nindent 12 }}
            {{- include "gitstack.serviceSecret.env" (dict "root" . "caller" "git") | nindent 12 }}
            # Admin del primo avvio: la password iniziale arriva solo dal Secret
            # (mai da values, mai nei log). identity crea l'admin solo se il
            # database non ne ha nessuno.
            - name: GITSTACK_IDENTITY_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $adminSecret }}
                  key: username
            - name: GITSTACK_IDENTITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $adminSecret }}
                  key: password
            {{- if $oidc }}
            # Login OIDC: file dei provider da Secret montato, chiave da Secret.
            - name: GITSTACK_IDENTITY_OIDC_CONFIG_FILE
              value: /etc/gitstack/oidc/oidc.json
            - name: GITSTACK_IDENTITY_OIDC_ENC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $oidcKeySecret }}
                  key: key
            - name: GITSTACK_IDENTITY_OIDC_ENC_KEY_ID
              value: {{ .Values.identity.oidc.encKey.keyId | quote }}
            - name: GITSTACK_IDENTITY_PUBLIC_URL
              value: {{ .Values.identity.oidc.publicUrl | quote }}
            {{- end }}
            # Secondo fattore TOTP (F11): keyring dei segreti da Secret.
            - name: GITSTACK_IDENTITY_TOTP_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ $totpKeySecret }}
                  key: keys
            {{- if .Values.identity.totp.requiredForAdmins }}
            - name: GITSTACK_IDENTITY_TOTP_REQUIRED_FOR_ADMINS
              value: "true"
            {{- end }}
            {{- if .Values.identity.env.tokenMaxLifetime }}
            - name: GITSTACK_IDENTITY_TOKEN_MAX_LIFETIME
              value: {{ .Values.identity.env.tokenMaxLifetime | quote }}
            {{- end }}
            {{- if .Values.identity.env.trustedProxies }}
            - name: GITSTACK_IDENTITY_TRUSTED_PROXIES
              value: {{ .Values.identity.env.trustedProxies | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.identity.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $oidc }}
            - name: oidc
              mountPath: /etc/gitstack/oidc
              readOnly: true
            {{- end }}
            {{- if $pgCA }}
            - name: postgres-ca
              mountPath: {{ include "gitstack.postgres.caMountPath" . }}
              readOnly: true
            {{- end }}
            {{- if .Values.corporateCA.configMap }}
            {{- include "gitstack.corporateCA.volumeMount" . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: bootstrap
          configMap:
            name: {{ include "gitstack.fullname" . }}-identity-bootstrap
        {{- if $pgCA }}
        - name: postgres-ca
          secret:
            secretName: {{ $pgCA }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        {{- if $oidc }}
        - name: oidc
          secret:
            secretName: {{ $oidcSecret }}
            items:
              - key: oidc.json
                path: oidc.json
        {{- end }}
        {{- if .Values.corporateCA.configMap }}
        {{- include "gitstack.corporateCA.volume" . | nindent 8 }}
        {{- end }}
{{- end }}
