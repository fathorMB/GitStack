{{- if and .Values.identity.enabled (not .Values.identity.totp.keys.existingSecret) -}}
{{- $name := printf "%s-identity-totp-key" (include "gitstack.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $keys := "" -}}
{{- if and $existing $existing.data (hasKey $existing.data "keys") -}}
  {{- $keys = index $existing.data "keys" | b64dec -}}
{{- else -}}
  {{- /* Generato una sola volta (come identity-oidc-key): `helm upgrade` lo
         ritrova con lookup e non lo cambia. 32 caratteri casuali in base64 =
         32 byte per AES-256; il formato è "<id>:<base64>" (rotazione:
         "nuova,vecchia", vedi docs/operations.md). */ -}}
  {{- $keys = printf "%s:%s" .Values.identity.totp.keys.keyId (randAlphaNum 32 | b64enc) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "gitstack.componentLabels" (dict "root" $ "component" "identity") | nindent 4 }}
  annotations:
    # Cifra i segreti TOTP degli utenti nel database (F11): se sparisce, il
    # secondo fattore degli utenti che lo hanno attivato non si verifica più e
    # va azzerato da un amministratore. Sopravvive a `helm uninstall`.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  keys: {{ $keys | quote }}
{{- end }}
