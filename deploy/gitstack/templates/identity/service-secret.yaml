{{- /* Generato anche con identity.enabled=false: core lo richiede per
       verificare l'identità firmata dal gateway. */ -}}
{{- if not .Values.identity.serviceSecret.existingSecret -}}
{{- $name := printf "%s-identity-service" (include "gitstack.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $key := "" -}}
{{- if and $existing $existing.data (hasKey $existing.data "secret") -}}
  {{- $key = index $existing.data "secret" | b64dec -}}
{{- else -}}
  {{- /* Generato una sola volta: `helm upgrade` lo ritrova con lookup e non
         lo cambia (stessa logica di identity-db). */ -}}
  {{- $key = randAlphaNum 40 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "gitstack.componentLabels" (dict "root" $ "component" "identity") | nindent 4 }}
  annotations:
    # Segreto condiviso gateway/identity/core (/internal/* e identità firmata
    # dal gateway verso core): sopravvive a
    # `helm uninstall`, così un reinstall non lo cambia.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  secret: {{ $key | quote }}
{{- end }}
