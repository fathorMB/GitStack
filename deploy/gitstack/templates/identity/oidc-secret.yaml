{{- if and .Values.identity.enabled .Values.identity.oidc.enabled (not .Values.identity.oidc.existingSecret) -}}
{{- if not .Values.identity.oidc.providers -}}
{{- fail "identity.oidc.enabled=true: compila identity.oidc.providers oppure identity.oidc.existingSecret (Secret con chiave 'oidc.json')." -}}
{{- end -}}
{{- /* File di configurazione dei provider (services/identity/internal/oidc):
       contiene i client secret, quindi sta in un Secret e non in un ConfigMap. */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gitstack.fullname" . }}-identity-oidc
  labels:
    {{- include "gitstack.componentLabels" (dict "root" $ "component" "identity") | nindent 4 }}
type: Opaque
stringData:
  oidc.json: |
    {{- dict "providers" .Values.identity.oidc.providers | toPrettyJson | nindent 4 }}
{{- end }}
