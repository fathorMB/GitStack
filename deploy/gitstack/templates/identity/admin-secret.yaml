{{- if and .Values.identity.enabled (not .Values.identity.admin.existingSecret) -}}
{{- $name := printf "%s-identity-admin" (include "gitstack.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := "" -}}
{{- if and $existing $existing.data (hasKey $existing.data "password") -}}
  {{- $password = index $existing.data "password" | b64dec -}}
{{- else -}}
  {{- /* Generata una sola volta: `helm upgrade` la ritrova con lookup e non
         la cambia (stessa logica di identity-db). Non si legge mai da values
         e install.sh non la stampa: solo il comando per leggerla. */ -}}
  {{- $password = randAlphaNum 24 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "gitstack.componentLabels" (dict "root" $ "component" "identity") | nindent 4 }}
  annotations:
    # Password iniziale dell'admin: sopravvive a `helm uninstall`, così un
    # reinstall sul volume di Postgres superstite (admin già creato, magari con
    # la password già cambiata) non genera un valore che non combacia con niente.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  username: {{ .Values.identity.admin.username | quote }}
  password: {{ $password | quote }}
{{- end }}
