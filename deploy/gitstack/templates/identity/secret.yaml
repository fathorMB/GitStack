{{- if and .Values.identity.enabled (not .Values.identity.db.existingSecret) -}}
{{- $name := printf "%s-identity-db" (include "gitstack.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := .Values.identity.db.password -}}
{{- if not $password -}}
  {{- if $existing -}}
    {{- $password = index $existing.data "password" | b64dec -}}
  {{- else -}}
    {{- /* Generata una sola volta (vedi templates/postgres/secret.yaml):
           `helm upgrade` la ritrova con lookup e non la cambia. */ -}}
    {{- $password = randAlphaNum 24 -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "gitstack.componentLabels" (dict "root" $ "component" "identity") | nindent 4 }}
  annotations:
    # Come il Secret di postgres: sopravvive a `helm uninstall`, così un
    # reinstall combacia col ruolo identity_app già presente nel volume di
    # Postgres superstite. Va rimosso a mano solo insieme al volume.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ $password | quote }}
{{- end }}
