{{- if and .Values.identity.enabled .Values.identity.oidc.enabled (not .Values.identity.oidc.encKey.existingSecret) -}}
{{- $name := printf "%s-identity-oidc-key" (include "gitstack.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $key := "" -}}
{{- if and $existing $existing.data (hasKey $existing.data "key") -}}
  {{- $key = index $existing.data "key" | b64dec -}}
{{- else -}}
  {{- /* Generata una sola volta (stessa logica di identity-db e
         identity-service): `helm upgrade` la ritrova con lookup e non la
         cambia. 32 caratteri casuali in base64 = 32 byte per AES-256. */ -}}
  {{- $key = randAlphaNum 32 | b64enc -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "gitstack.componentLabels" (dict "root" $ "component" "identity") | nindent 4 }}
  annotations:
    # Cifra i client secret nel database e il cookie di stato del login:
    # se sparisce, i segreti già salvati non si decifrano più (identity li
    # riscrive al riavvio dal file di configurazione, ma i login in corso
    # cadono). Sopravvive a `helm uninstall`, come gli altri segreti.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  key: {{ $key | quote }}
{{- end }}
