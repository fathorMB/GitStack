{{- if .Values.postgres.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "gitstack.fullname" . }}-postgres
  labels:
    {{- include "gitstack.componentLabels" (dict "root" $ "component" "postgres") | nindent 4 }}
spec:
  serviceName: {{ include "gitstack.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "gitstack.componentSelectorLabels" (dict "root" $ "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gitstack.componentLabels" (dict "root" $ "component" "postgres") | nindent 8 }}
    spec:
      securityContext:
        {{- include "gitstack.podSecurityContext" (dict) | nindent 8 }}
      containers:
        - name: postgres
          # L'entrypoint dell'immagine parte come root, fa chown del volume e
          # passa all'utente postgres: servono solo queste capability, il
          # resto è tolto. Il filesystem radice resta scrivibile (socket in
          # /var/run/postgresql, file temporanei).
          securityContext:
            {{- include "gitstack.containerSecurityContext" (dict "readOnly" false "add" (list "CHOWN" "DAC_OVERRIDE" "FOWNER" "SETGID" "SETUID")) | nindent 12 }}
          image: {{ include "gitstack.image" (dict "root" $ "component" .Values.postgres) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.auth.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gitstack.postgres.secretName" . }}
                  key: password
            # Sottocartella dedicata, non la radice del volume: alcune
            # storage class (es. con lost+found) la lasciano non vuota, e
            # l'immagine ufficiale postgres richiede una PGDATA vuota o
            # assente al primo avvio.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.auth.username | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.auth.username | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgres.persistence.storageClassName }}
        storageClassName: {{ .Values.postgres.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size | quote }}
{{- end }}
