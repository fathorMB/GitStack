{{- if and .Values.postgres.enabled (not .Values.postgres.auth.existingSecret) -}}
{{- $name := printf "%s-postgres" (include "gitstack.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := .Values.postgres.auth.password -}}
{{- if not $password -}}
  {{- if $existing -}}
    {{- $password = index $existing.data "password" | b64dec -}}
  {{- else -}}
    {{- /* Generata una sola volta: `helm upgrade` non la cambia, perché
           $existing (letto dal cluster) la ritrova già impostata. Con
           `helm template`/`--dry-run` senza cluster, $existing è vuoto e
           viene generata una password diversa a ogni rendering: normale
           per un piano che non tocca lo stato reale. */ -}}
    {{- $password = randAlphaNum 24 -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "gitstack.componentLabels" (dict "root" $ "component" "postgres") | nindent 4 }}
  annotations:
    # Sopravvive a `helm uninstall`, come i dati di Postgres: il volume
    # dello StatefulSet (volumeClaimTemplates) non viene cancellato da un
    # uninstall, ma senza questa annotazione il Secret sì. Un reinstall
    # successivo (stesso namespace) genererebbe allora una password nuova,
    # diversa da quella già scritta nel Postgres esistente su quel volume:
    # "password authentication failed" al primo avvio di core. Con questa
    # annotazione il Secret resta, `lookup` (sopra) lo ritrova e la
    # password non cambia. Va rimosso a mano solo insieme al volume, se
    # davvero si vuole ripartire da un Postgres vuoto.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ $password | quote }}
{{- end }}
