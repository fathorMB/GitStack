{{- if .Values.ingress.enabled -}}
{{- $fullname := include "gitstack.fullname" . -}}
{{- $middlewareName := printf "%s-strip-api" $fullname -}}
{{- $hstsName := printf "%s-hsts" $fullname -}}
{{- $tlsOptionName := printf "%s-tls" $fullname -}}
{{- $middlewares := list -}}
{{- if .Values.gateway.enabled -}}{{- $middlewares = append $middlewares (printf "%s-%s@kubernetescrd" .Release.Namespace $middlewareName) -}}{{- end -}}
{{- if and .Values.ingress.tls.enabled .Values.ingress.tls.hstsSeconds -}}{{- $middlewares = append $middlewares (printf "%s-%s@kubernetescrd" .Release.Namespace $hstsName) -}}{{- end -}}
{{- if and .Values.ingress.tls.enabled (not .Values.ingress.tls.secretName) (not .Values.ingress.tls.certResolver) -}}
{{- fail "ingress.tls.enabled=true: serve ingress.tls.secretName (Secret kubernetes.io/tls) oppure ingress.tls.certResolver (Let's Encrypt)." -}}
{{- end -}}
{{- if .Values.ingress.tls.enabled }}
# F3 (GIT-229, ASVS V9.1.2, V9.1.3): TLS minimo 1.2 e solo suite AEAD con scambio
# ECDHE (le suite TLS 1.3 non sono configurabili e sono tutte forti). Le rotte
# HTTPS (Ingress e IngressRoute git) lo richiamano per nome; senza questo
# oggetto varrebbe il default di Traefik. CRD di Traefik: arrivano dopo il nodo Ready.
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: {{ $tlsOptionName }}
  labels:
    {{- include "gitstack.labels" . | nindent 4 }}
spec:
  minVersion: VersionTLS12
  cipherSuites:
    - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
    - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
  sniStrict: false
---
{{- if .Values.ingress.tls.hstsSeconds }}
# F3 (ASVS V14.4.5): Strict-Transport-Security sulle rotte HTTPS. Lo scrive
# Traefik e non nginx, che dietro il terminatore TLS parla HTTP. La porta 80
# (solo redirect) non lo manda: HSTS su HTTP è ignorato dai browser.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $hstsName }}
  labels:
    {{- include "gitstack.labels" . | nindent 4 }}
spec:
  headers:
    stsSeconds: {{ .Values.ingress.tls.hstsSeconds }}
    stsIncludeSubdomains: false
    stsPreload: false
    forceSTSHeader: true
---
{{- end }}
{{- end }}
{{- if .Values.gateway.enabled }}
# Il gateway espone /healthz, /readyz e /v1/* (non /api/*): questo
# Middleware Traefik toglie il prefisso "/api" dell'Ingress prima di
# instradare al Service, così "/api/healthz" arriva al gateway come
# "/healthz" e "/api/v1/..." come "/v1/...". CRD di Traefik, già incluso in
# k3s (criterio "Ingress Traefik" di GIT-8): richiede il gruppo
# "traefik.io" (Traefik v3, k3s >= 1.28; per k3s più vecchi con Traefik v2
# usa "traefik.containo.us/v1alpha1").
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $middlewareName }}
  labels:
    {{- include "gitstack.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
      - /api
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "gitstack.labels" . | nindent 4 }}
  annotations:
    {{- if $middlewares }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ join "," $middlewares }}
    {{- end }}
    {{- if .Values.ingress.tls.enabled }}
    # N5: UI e API solo su 443 (websecure); la 80 la gestisce ingress-redirect.yaml.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.options: {{ printf "%s-%s@kubernetescrd" .Release.Namespace $tlsOptionName }}
    {{- with .Values.ingress.tls.certResolver }}
    traefik.ingress.kubernetes.io/router.tls.certresolver: {{ . | quote }}
    {{- end }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.secretName }}
  tls:
    - secretName: {{ .Values.ingress.tls.secretName }}
      {{- if .Values.ingress.host }}
      hosts:
        - {{ .Values.ingress.host | quote }}
      {{- end }}
  {{- end }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          {{- if .Values.gateway.enabled }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-gateway
                port:
                  number: {{ .Values.gateway.service.port }}
          {{- end }}
          {{- if .Values.web.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-web
                port:
                  number: {{ .Values.web.service.port }}
          {{- end }}
{{- end }}
