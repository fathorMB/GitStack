{{- if and .Values.apps.enabled (include "gitstack.tlsStore.enabled" .) -}}
{{- /* GIT-494: il defaultCertificate di un TLSStore deve stare nel namespace del TLSStore. Con le app accese
       il TLSStore e' in <release>-certs, quindi qui si copia il Secret dell'installer (gitstack-tls) da quello del
       release. La copia nasce da lookup (nel cluster; con helm template non c'e' e non si rende) e la tiene
       aggiornata il rinnovo notturno di gitstack-tls, che pubblica anche nel namespace dei certificati. */ -}}
{{- $src := lookup "v1" "Secret" .Release.Namespace .Values.ingress.tls.secretName -}}
{{- if $src }}
{{- $data := $src.data | default dict }}
{{- if and (hasKey $data "tls.crt") (hasKey $data "tls.key") }}
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: {{ .Values.ingress.tls.secretName }}
  namespace: {{ include "gitstack.certsNamespace" . }}
  labels:
    {{- include "gitstack.labels" . | nindent 4 }}
data:
  tls.crt: {{ index $data "tls.crt" }}
  tls.key: {{ index $data "tls.key" }}
{{- end }}
{{- end }}
{{- end }}
