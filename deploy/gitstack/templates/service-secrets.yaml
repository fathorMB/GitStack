{{- /* F9 (ASVS V1.6.1, V2.10.1): un segreto di servizio per chiamante, non uno
       condiviso da tutti. Il servizio git, che analizza repository non fidati,
       non conosce la chiave con cui il gateway firma l'identità degli utenti.
       Generato anche con identity.enabled=false: core lo richiede per
       verificare l'identità firmata dal gateway. */ -}}
{{- /* identity.serviceSecret.existingSecret (chart precedente a F9) non è più
       letto: un Secret con la sola chiave `secret` non ha le chiavi per
       chiamante. Lo segnala NOTES.txt; il chart non si ferma, così
       `gitstack upgrade` di un binario precedente a F9 funziona. */ -}}
{{- if not .Values.serviceSecrets.existingSecret -}}
{{- $name := printf "%s-service-secrets" (include "gitstack.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "gitstack.componentLabels" (dict "root" $ "component" "identity") | nindent 4 }}
  annotations:
    # Un segreto per chiamante (chiavi gateway, core, git; 40 caratteri
    # casuali ciascuna). Generato una sola volta: `helm upgrade` ritrova i
    # valori con lookup e non li cambia, quindi nemmeno una rotazione in corso
    # (valore «nuova,vecchia», docs/operations.md). Sopravvive a
    # `helm uninstall`, così un reinstall non li cambia.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range $key := list "gateway" "core" "git" }}
  {{- $value := "" }}
  {{- if and $existing $existing.data (hasKey $existing.data $key) }}
  {{- $value = index $existing.data $key | b64dec }}
  {{- else }}
  {{- $value = randAlphaNum 40 }}
  {{- end }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
