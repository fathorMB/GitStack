{{- if and .Values.ingress.enabled .Values.git.enabled -}}
{{- $fullname := include "gitstack.fullname" . -}}
# Smart HTTP di git (GIT-70): /<owner>/<repo>.git/{info/refs,git-upload-pack,
# git-receive-pack} va direttamente al servizio git, che autentica con Basic
# auth (token personale) e applica i permessi. Non passa dal gateway: git vuole
# 401 + WWW-Authenticate e un push non deve attraversare il suo proxy. Una
# regola PathRegexp con priorità alta batte "/" (web) e "/api" (gateway); la
# regex vuole esattamente due segmenti prima di ".git".
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $fullname }}-git
  labels:
    {{- include "gitstack.labels" . | nindent 4 }}
spec:
  {{- if .Values.ingress.tls.enabled }}
  entryPoints:
    - websecure
  {{- end }}
  routes:
    - kind: Rule
      priority: 10000
      match: >-
        {{ if .Values.ingress.host }}Host(`{{ .Values.ingress.host }}`) && {{ end }}PathRegexp(`^/[^/]+/[^/]+\.git/(info/refs|git-upload-pack|git-receive-pack)$`)
      services:
        - name: {{ $fullname }}-git
          port: {{ .Values.git.service.port }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    {{- if .Values.ingress.tls.secretName }}
    secretName: {{ .Values.ingress.tls.secretName }}
    {{- end }}
    {{- with .Values.ingress.tls.certResolver }}
    certResolver: {{ . | quote }}
    {{- end }}
  {{- end }}
{{- end }}
