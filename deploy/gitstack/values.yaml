# Valori di default del chart gitstack. Configurazione minima (D1): quasi
# tutto ha un default sensato, pensato per un k3s a nodo singolo installato
# da GIT-9. Sovrascrivi solo quello che ti serve davvero.

global:
  # Arresto dei pod dietro l'Ingress (GIT-248): preStop attende che Traefik tolga
  # l'endpoint prima di fermare il processo (azione `sleep` nativa, senza binari
  # nell'immagine). terminationGracePeriodSeconds deve superare preStopSeconds
  # più il tempo di arresto del processo (gateway: 10 s).
  shutdown:
    preStopSeconds: 10
    terminationGracePeriodSeconds: 40
    # git: un push lungo in corso deve potersi chiudere.
    gitTerminationGracePeriodSeconds: 70
  image:
    # Registry di default per le immagini di GitStack (gateway, core, web:
    # pubblicate su ghcr.io dal job "registry" del workflow CI; idem identity). postgres e
    # nats sono immagini di terze parti e hanno il proprio registry di
    # default (Docker Hub, vedi postgres.image.registry/nats.image.registry
    # più sotto): global.image.registry non li tocca.
    # Configurabile qui una volta sola per i componenti GitStack (M-08,
    # mirror air-gapped [c_8458909a21d9035f]): ogni componente può comunque
    # sovrascriverlo singolarmente (vedi gateway.image.registry ecc.), per
    # un mirror parziale.
    registry: ghcr.io
    # Tag comune di default quando gateway/core/web non impostano il
    # proprio image.tag (postgres/nats hanno già il loro tag di default,
    # legato alla versione dell'immagine upstream, non a questo). Vuoto =
    # usa Chart.AppVersion (vedi templates/_helpers.tpl). Oggi
    # Chart.AppVersion non ha ancora un'immagine pubblicata con quel tag:
    # nessun tag di versione è mai stato pubblicato (vedi README.md,
    # sezione "Tag delle immagini"). Per un'installazione di prova, imposta
    # esplicitamente il tag sha pubblicato dalla CI, es.
    # `--set global.image.tag=sha-<commit-sha-completo>`.
    tag: ""
    # IfNotPresent (non "Always"): con un tag specifico (sha o versione,
    # mai "latest"), non serve ricontattare il registry se l'immagine è
    # già sul nodo. Usato anche dall'installazione di prova in CI, che
    # importa le immagini appena costruite in k3d senza pubblicarle prima
    # su un registry: con "Always" il pod ripercorrerebbe un pull remoto e
    # fallirebbe (l'immagine con quel tag sha non è mai stata pubblicata).
    pullPolicy: IfNotPresent
  # Secret(s) di tipo kubernetes.io/dockerconfigjson per un registry privato
  # o un mirror che richiede autenticazione (M-08).
  imagePullSecrets: []

# --- gateway --------------------------------------------------------------
gateway:
  enabled: true
  replicaCount: 1
  image:
    # Vuoto = usa global.image.registry. Sovrascrivibile per componente, per
    # un mirror parziale (M-08 [c_8458909a21d9035f]).
    registry: ""
    # Percorso completo (owner/nome) sotto il registry: così un mirror può
    # anche cambiare organizzazione, non solo host.
    repository: fathormb/gitstack-gateway
    # Vuoto = usa global.image.tag (e, in assenza, Chart.AppVersion).
    tag: ""
  # Porta su cui il processo ascolta nel container (GITSTACK_GATEWAY_ADDR,
  # vedi services/gateway/README.md): fissa, combacia con l'EXPOSE del
  # Dockerfile. `service.port` è la porta del Service k8s, disaccoppiata.
  containerPort: 8080
  service:
    port: 8080
  # GITSTACK_CORE_URL e GITSTACK_IDENTITY_URL (questa solo con
  # identity.enabled) sono calcolate dal nome dei Service (vedi
  # templates/gateway/deployment.yaml): non serve impostarle qui.
  env:
    logLevel: info
    # Timeout complessivo di una richiesta verso core, upload e download di allegati
    # compresi (I9: fino a 10 MB): 30s bastano da ~3 Mbit/s in su.
    coreTimeout: 30s
    identityTimeout: 5s
    # CIDR dei proxy davanti al gateway di cui ci si fida per
    # X-Forwarded-For (GITSTACK_GATEWAY_TRUSTED_PROXIES). Default: rete dei
    # pod di k3s (cluster-cidr 10.42.0.0/16) dove gira Traefik; cambialo se il
    # cluster usa un CIDR diverso. Vuoto = nessun proxy fidato (IP client =
    # indirizzo del peer).
    trustedProxies: "10.42.0.0/16"
    # Cache delle verifiche di credenziale (GITSTACK_GATEWAY_AUTH_CACHE_TTL e
    # ..._NEGATIVE_TTL): esiti positivi (mai oltre expiresAt) e negativi. Dopo
    # una revoca il gateway può accettare la vecchia credenziale fino a
    # authCacheTTL.
    authCacheTTL: 30s
    authCacheNegativeTTL: 5s
    # Rate limiting dell'API (F6, GIT-232): token-bucket in memoria per
    # credenziale (token o sessione) e per IP client (X-Forwarded-For solo dai
    # proxy in trustedProxies). rps = richieste/secondo a regime, burst = quante
    # in raffica. Oltre soglia: 429 con Retry-After. 0 su rps disattiva il
    # limitatore. La soglia per IP è più larga perché più utenti possono
    # stare dietro lo stesso NAT. Vale per replica del gateway.
    rateLimit:
      credentialRps: 20
      credentialBurst: 200
      ipRps: 50
      ipBurst: 500
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi

# --- core -------------------------------------------------------------------
core:
  enabled: true
  replicaCount: 1
  image:
    registry: ""
    repository: fathormb/gitstack-core
    tag: ""
  # Porta su cui il processo ascolta nel container (GITSTACK_CORE_ADDR):
  # fissa, combacia con l'EXPOSE del Dockerfile.
  containerPort: 8080
  service:
    port: 8080
  # core non ritenta la connessione a Postgres/NATS: esce subito se non li
  # trova raggiungibili all'avvio (vedi services/core/internal/db, Open fa
  # un Ping subito). Due initContainer attendono che entrambi accettino
  # connessioni TCP prima di avviare il container principale, invece di
  # affidarsi al riavvio automatico del pod (più lento: backoff
  # esponenziale di k8s tra un CrashLoopBackOff e l'altro).
  waitFor:
    image:
      registry: docker.io
      repository: busybox
      tag: "1.36"
  # GITSTACK_CORE_DB_URL e GITSTACK_CORE_NATS_URL sono calcolati dai
  # Service di postgres/nats (o da postgres.external, vedi sotto): non
  # servono qui.
  env:
    logLevel: info
    dbMaxConns: 10
    migrationsTimeout: 30s
    # Configurazione di host verso git/SSH (nomi fissati in GIT-67).
    # GITSTACK_GIT_URL (Service di git) e GITSTACK_CORE_SSH_PORT (git.ssh.port)
    # sono calcolati. publicUrl e sshHost sono emessi solo se valorizzati: URL
    # con cui i client raggiungono GitStack e host mostrato negli URL di clone SSH.
    publicUrl: ""
    sshHost: ""
  # Webhook (M-06/G): chiave con cui core cifra i segreti dei webhook
  # (GITSTACK_WEBHOOK_SECRET_KEY, AES-256-GCM, 32 byte in esadecimale). Il chart
  # la genera una sola volta in un Secret <release>-core-webhook-key (chiave
  # `key`, helm.sh/resource-policy: keep); non si scrive nei values. Per ruotarla:
  # nuova chiave in `key`, nuovo `keyId`, e la precedente in `oldKeys`
  # (`k1:<chiave>`), che serve solo a decifrare. Alternativa: nome di un
  # Secret esistente con le stesse chiavi.
  webhookSecret:
    existingSecret: ""
    keyId: k1
  # Allegati di issue e commenti (M-05/G, I9). I file stanno su un PVC dedicato,
  # montato su `mountPath` (GITSTACK_CORE_ATTACHMENTS_DIR): va incluso nel backup (D19).
  # Il volume è ReadWriteOnce: con `enabled: true` core gira a UNA replica con
  # strategia Recreate (il chart rifiuta replicaCount > 1). Con `enabled: false`
  # upload e download di allegati rispondono 503.
  attachments:
    enabled: true
    mountPath: /var/lib/gitstack/attachments
    # Limite per file in byte (GITSTACK_CORE_ATTACHMENTS_MAX_BYTES), default 10 MiB.
    maxBytes: 10485760
    # Un allegato mai collegato a una issue o a un commento si elimina dopo questo
    # tempo (GITSTACK_CORE_ATTACHMENTS_ORPHAN_TTL).
    orphanTtl: 24h
    persistence:
      size: 5Gi
      storageClassName: ""
      accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi

# --- SMTP (facoltativo, M-06/F, C5) ------------------------------------------
# Email di notifica (menzioni, assegnazioni, ...). Vuoto = disattivato: GitStack
# manda solo notifiche in-app e la UI nasconde le opzioni email. Con `host`
# valorizzato il chart crea il Secret `<release>-smtp` (chiavi host, port,
# security, username, password, from) e core lo legge come GITSTACK_CORE_SMTP_*.
# Per non tenere la password nei values, usa `existingSecret`: un Secret tuo con
# quelle chiavi (obbligatorie: host e from; le altre facoltative).
# Le email partono dopo una finestra di 10 secondi per issue (raggruppamento),
# con al massimo 3 tentativi; mai agli utenti agent. Dettagli: README del chart.
smtp:
  host: ""
  # 0 = porta standard della protezione scelta (starttls 587, tls 465, none 25).
  port: 0
  # starttls (default) | tls (TLS implicito) | none (solo reti fidate: le
  # credenziali non partono in chiaro verso un host non locale).
  security: starttls
  username: ""
  password: ""
  # Mittente, es. "GitStack <noreply@example.com>". Obbligatorio con host.
  from: ""
  existingSecret: ""

# --- segreti di servizio ----------------------------------------------------
# Un segreto per chiamante (F9, ASVS V1.6.1 e V2.10.1): gateway, core e git
# hanno ciascuno il proprio, usato come Bearer verso /internal/* di identity e
# come chiave HMAC dell'identità firmata. Chi riceve verifica la chiave del
# chiamante: git, che analizza repository non fidati, non può firmare
# l'identità di un utente verso identity e verso core può solo risolvere
# owner/repo. Il chart genera una sola volta il Secret
# <release>-service-secrets (chiavi `gateway`, `core`, `git`,
# helm.sh/resource-policy: keep); non si scrivono nei values. Ogni valore può
# essere un elenco «nuova,vecchia»: la procedura di rotazione con doppia chiave
# è in docs/operations.md («Ciclo di vita delle chiavi»).
serviceSecrets:
  # Alternativa: nome di un Secret esistente con le chiavi gateway, core, git.
  existingSecret: ""

# --- identity ---------------------------------------------------------------
# Utenti, sessioni, token e chiavi SSH (M-02). Usa lo schema dedicato
# "identity" (D6) dello stesso database di core, con un ruolo Postgres
# proprio (identity_app) e una password propria in un Secret generato dal
# chart. L'initContainer del Deployment crea ruolo e schema in modo
# idempotente (files/identity-bootstrap-role.sql) con le credenziali
# amministrative di Postgres (postgres.auth / postgres.external).
identity:
  enabled: true
  replicaCount: 1
  image:
    registry: ""
    repository: fathormb/gitstack-identity
    tag: ""
  # Porta su cui il processo ascolta nel container (GITSTACK_IDENTITY_ADDR):
  # fissa, combacia con l'EXPOSE del Dockerfile.
  containerPort: 8080
  service:
    port: 8080
  db:
    # Password del ruolo identity_app. Se vuota, il chart la genera una sola
    # volta in un Secret <release>-identity-db (helm.sh/resource-policy: keep,
    # non rigenerata da upgrade/reinstall).
    password: ""
    # Alternativa: nome di un Secret esistente con la chiave `password`.
    existingSecret: ""
  admin:
    # Utente admin creato al primo avvio (solo se il database non ha nessun
    # amministratore). Password iniziale: generata una sola volta dal chart in
    # un Secret <release>-identity-admin (chiavi `username` e `password`,
    # helm.sh/resource-policy: keep), mai nei values ne nei log; l'admin deve
    # cambiarla al primo login. Un upgrade/reinstall non la rigenera.
    username: admin
    # Alternativa: nome di un Secret esistente con le chiavi `username` e
    # `password`.
    existingSecret: ""
  # GITSTACK_IDENTITY_DB_URL e calcolato dal Service di postgres (o da
  # postgres.external): non serve qui.
  env:
    logLevel: info
    dbMaxConns: 10
    migrationsTimeout: 30s
    # Durata assoluta della sessione web (GITSTACK_IDENTITY_SESSION_TTL).
    sessionTTL: 168h
    # Inattivita' massima della sessione web (GITSTACK_IDENTITY_SESSION_IDLE_TIMEOUT,
    # F12). "0" la disattiva.
    sessionIdleTimeout: 24h
    # Durata massima dei token personali (GITSTACK_IDENTITY_TOKEN_MAX_LIFETIME,
    # es. 8760h). Vuoto = variabile non impostata, vale il default di identity.
    tokenMaxLifetime: ""
    # CIDR da cui identity si fida dell'header X-Gitstack-Client-Ip messo dal
    # gateway (GITSTACK_IDENTITY_TRUSTED_PROXIES). Default: rete dei pod di
    # k3s (cluster-cidr 10.42.0.0/16); cambialo se il cluster usa un CIDR
    # diverso. Vuoto = nessun proxy fidato (IP client = indirizzo del peer).
    trustedProxies: "10.42.0.0/16"
  # Login esterno OIDC (M-02/K, GIT-39). Spento di default: senza file di
  # configurazione listOidcProviders risponde items [] e start risponde 404.
  # Esempi per Entra ID, Google e Keycloak: docs/identity-oidc.md.
  oidc:
    enabled: false
    # URL pubblico di GitStack, come lo raggiunge il browser (senza slash
    # finale): la redirect_uri da registrare presso il provider e
    # <publicUrl>/api/v1/auth/oidc/<slug>/callback (GITSTACK_IDENTITY_PUBLIC_URL).
    publicUrl: ""
    # Provider, nel formato del file di configurazione di identity
    # (slug, displayName, issuer, clientId, clientSecret, scopes, claims,
    # linkByVerifiedEmail, autoCreateUsers). Il chart li scrive in un Secret
    # <release>-identity-oidc (chiave oidc.json), montato come file: il
    # clientSecret non finisce mai in un ConfigMap. Per non tenerlo nei values
    # usa existingSecret.
    providers: []
    # Alternativa a providers: nome di un Secret esistente con la chiave
    # oidc.json (l'intero file di configurazione).
    existingSecret: ""
    # Chiave AES-256 (GITSTACK_IDENTITY_OIDC_ENC_KEY) che cifra i client secret
    # nel database e il cookie di stato del login. Il chart la genera una sola
    # volta in un Secret <release>-identity-oidc-key (chiave `key`, 32 byte in
    # base64; lookup + helm.sh/resource-policy: keep, come gli altri segreti).
    # Alternativa: nome di un Secret esistente con la chiave `key`.
    encKey:
      existingSecret: ""
      # Identificativo della chiave (GITSTACK_IDENTITY_OIDC_ENC_KEY_ID): va
      # cambiato insieme alla chiave (rotazione) per riscrivere i segreti.
      keyId: k1
  # Secondo fattore TOTP per gli account locali (F11, GIT-237). Ogni utente lo
  # attiva da Settings → Security; qui si decide solo se è obbligatorio per gli
  # amministratori (GITSTACK_IDENTITY_TOTP_REQUIRED_FOR_ADMINS).
  totp:
    requiredForAdmins: false
    # Keyring che cifra i segreti TOTP nel database (GITSTACK_IDENTITY_TOTP_KEYS,
    # "<id>:<base64 di 32 byte>[,<id>:<base64>...]": la prima cifra, le altre
    # solo decifrano). Il chart lo genera una sola volta in un Secret
    # <release>-identity-totp-key (chiave `keys`, resource-policy keep).
    # Alternativa: nome di un Secret esistente con la chiave `keys`.
    keys:
      existingSecret: ""
      # Id della chiave generata dal chart.
      keyId: k1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi

# --- git --------------------------------------------------------------------
# Servizio git (M-03): repo bare sul PVC git-data (gitData.enabled, deve essere
# attivo). Oggi ascolta solo HTTP interno (API chiamata da core); lo smart HTTP
# (Ingress) e il server SSH arrivano con gli item successivi di M-03.
git:
  enabled: true
  image:
    registry: ""
    repository: fathormb/gitstack-git
    tag: ""
  # GITSTACK_GIT_ADDR: fissa, combacia con l'EXPOSE del Dockerfile.
  containerPort: 8080
  service:
    port: 8080
  env:
    logLevel: info
  ssh:
    # Il server SSH (GIT-71) è nell'immagine ed è attivo di default (R7: SSH sulla
    # porta 2222). Con true: Service LoadBalancer sulla porta sotto (k3s: ServiceLB),
    # Secret della chiave host e GITSTACK_GIT_SSH_ADDR=:<porta>. Con false il pod
    # avvia git con GITSTACK_GIT_SSH_ADDR=off e nessun Service SSH.
    # L'installer non modifica mai l'sshd dell'host (R7): se la porta è occupata
    # sul nodo, cambiala qui (e passa lo stesso valore a install.sh con --set).
    enabled: true
    port: 2222
    hostKey:
      # Secret esistente con la chiave `ssh_host_ed25519_key`; vuoto = generata
      # una sola volta dal chart (<release>-git-ssh-host-key, resource-policy keep).
      existingSecret: ""
  # Mirror in push (V8): CA privata per le destinazioni.
  mirror:
    # Nome di un ConfigMap (stesso namespace) con la chiave ca.crt: file PEM di
    # CA di cui git si fida per i soli push dei mirror, per esempio la CA
    # interna di un secondo GitStack. SOSTITUISCE le CA di sistema per quei
    # push: per spingere anche su GitHub il file deve contenere anche le CA
    # pubbliche. Vuoto = CA di sistema (GitHub e simili).
    caConfigMap: ""
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 256Mi

# --- web --------------------------------------------------------------------
# L'immagine di web arriva con GIT-7, in parallelo a questo item: il
# Deployment e il Service sono già pronti, con `web.enabled` per poterli
# disattivare finché l'immagine non esiste (vedi README.md).
web:
  enabled: true
  replicaCount: 1
  image:
    registry: ""
    repository: fathormb/gitstack-web
    tag: ""
  # Porta su cui l'immagine di web ascolta (GIT-7, in parallelo). Default
  # allineato agli altri servizi Go; se GIT-7 sceglie una porta diversa,
  # basta sovrascrivere questo valore, senza toccare il chart.
  containerPort: 8080
  service:
    port: 8080
  # `/healthz` di web: previsto per coerenza con gli altri componenti (vedi
  # README.md del chart). Se GIT-7 non lo implementa subito, imposta
  # `web.probes.enabled: false` per disattivare le probe finché non esiste.
  probes:
    enabled: true
    path: /healthz
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

# --- proxy e CA aziendale (N9) ------------------------------------------------
# Rete aziendale chiusa: webhook (core), mirror (git), OIDC (identity) e SMTP
# (core) escono dal proxy. install.sh li imposta da --http-proxy,
# --https-proxy, --no-proxy e --ca-bundle (N9a); a mano con --set.
# La policy di uscita (egress.*) resta SEMPRE applicata alla destinazione vera:
# risoluzione, liste e blocchi di loopback, cluster e link-local sono giudicati
# prima di contattare il proxy (pkg/egress/README.md).
proxy:
  # URL del proxy per le destinazioni http:// e https:// (CONNECT), per
  # esempio http://proxy.corp:3128. Eventuali credenziali nell'URL finiscono
  # nell'ambiente dei pod, non in una riga di comando.
  http: ""
  https: ""
  # Elementi aggiuntivi di NO_PROXY (virgole). Il chart aggiunge da solo
  # localhost, i Service di GitStack, .svc, .cluster.local e egress.clusterCIDRs.
  noProxy: ""

corporateCA:
  # Nome di un ConfigMap (stesso namespace) con la chiave ca.crt: la CA del
  # proxy che ispeziona TLS o dei servizi interni. Montata in core, git e
  # identity: i servizi Go se ne fidano oltre alle CA di sistema
  # (SSL_CERT_DIR). Per git (mirror) sostituisce invece le CA di sistema, come
  # git.mirror.caConfigMap, che se impostato ha la precedenza: metti nel file
  # anche le CA pubbliche se i mirror vanno direttamente (NO_PROXY).
  configMap: ""

# --- egress (protezione SSRF, C8) ---------------------------------------
# Impostazioni per le chiamate in uscita verso indirizzi dati dagli utenti
# (webhook, pkg/egress): core le legge da GITSTACK_EGRESS_ALLOW, _DENY e
# _CLUSTER_CIDRS (elenchi separati da virgole). Voci: IP, CIDR, nomi host
# ("hooks.example.com") o suffissi ("*.example.com").
# Loopback, link-local, multicast, 0.0.0.0, i CIDR del cluster, gli indirizzi
# del nodo e le reti speciali sono bloccati sempre: allow non sblocca mai
# loopback, link-local, cluster e nodo (vedi pkg/egress/README.md).
# Le reti LAN ammesse si elencano in allow (install.sh --egress-allow).
egress:
  # Se non vuota, sono ammesse solo queste destinazioni (restringe); le voci
  # IP/CIDR sbloccano anche reti speciali come 100.64.0.0/10 (CGNAT).
  allow: []
  # Destinazioni vietate; vince su allow.
  deny: []
  # Reti di pod e servizi del cluster, sempre bloccate. Default di k3s;
  # cambiale solo se il cluster usa altri CIDR.
  clusterCIDRs:
    - 10.42.0.0/16
    - 10.43.0.0/16
  # Indirizzi del nodo, SEMPRE bloccati (F7, ASVS V12.6.1): nessuna voce di
  # allow li sblocca, così un webhook non raggiunge kubelet, l'API di k3s o i
  # servizi in ascolto sull'host. Il chart aggiunge da solo status.hostIP
  # (GITSTACK_NODE_IP); install.sh qui scrive tutti gli IPv4 del nodo.
  nodeAddresses: []
  # Le porte di Kubernetes (6443, 10250, 10255, 2379-2380) sono bloccate su
  # qualunque IP privato, sempre. Non è una voce di configurazione.

# --- postgres -----------------------------------------------------------
# PostgreSQL incluso di default (D6 [c_4df04d65b3ac4910]). Per un Postgres
# esterno del cliente, metti `postgres.enabled: false` e compila
# `postgres.external.*`: gateway/core lo useranno al posto dello
# StatefulSet interno, senza altre modifiche al chart.
postgres:
  enabled: true
  image:
    # Immagine ufficiale su Docker Hub, non su global.image.registry
    # (quello è per le immagini di GitStack, pubblicate su ghcr.io): un
    # componente di terze parti ha il proprio registry di default,
    # comunque sovrascrivibile per un mirror (M-08).
    registry: docker.io
    repository: postgres
    tag: "16-alpine"
  auth:
    database: gitstack
    # Utente applicativo di core (schema dedicato "core", D6). In
    # un'installazione reale, valuta migrations/bootstrap-role.sql
    # (services/core) per un ruolo a permessi limitati: qui, per la
    # configurazione minima di default, questo è anche l'utente
    # superuser del container Postgres bundle.
    username: gitstack
    # Se vuoto, il chart genera una password casuale in un Secret alla
    # prima installazione (non rigenerata da `helm upgrade`, vedi
    # templates/postgres/secret.yaml).
    password: ""
    # Nome di un Secret esistente con la chiave `password`, alternativo a
    # `auth.password` (es. gestito fuori da Helm).
    existingSecret: ""
  persistence:
    size: 5Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  # Postgres esterno del cliente (D6): usato solo quando postgres.enabled
  # è false.
  external:
    host: ""
    port: 5432
    database: ""
    username: ""
    # Nome di un Secret esistente con la chiave `password`.
    existingSecret: ""
    sslMode: require
    # Nome di un Secret con la CA che ha firmato il certificato del
    # database (chiave `ca.crt`), facoltativo: serve a sslMode verify-ca
    # e verify-full con una CA privata. Montato in sola lettura su core,
    # identity e sul pod client.
    caSecret: ""
    # Pod client (N8): resta acceso con il database esterno e serve a
    # `gitstack backup/restore/upgrade/status` (pg_dump e psql, mai sul
    # database bundle). La versione principale del client deve essere
    # QUELLA del server (15, 16 o 17): un pg_dump 17 scrive istruzioni
    # (SET transaction_timeout) che un server 15 o 16 non accetta al
    # restore. L'installer imposta il tag dalla versione rilevata dal
    # preflight; dopo un upgrade di major di Postgres, aggiornalo
    # (gitstack status avvisa se non coincidono).
    client:
      image:
        registry: docker.io
        repository: postgres
        tag: "16-alpine"
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 256Mi

# --- NetworkPolicy (F8, ASVS V1.14.1) ----------------------------------------
# Default-deny su ingresso e uscita di tutti i pod del rilascio, più allow
# espliciti: ingress → web/gateway/git, web → gateway, gateway → core e identity,
# core e git → identity, core → git, git → core, core, git e identity → Postgres,
# core e git → NATS, DNS verso kube-system. Le applica il controller di rete del
# cluster (k3s: kube-router, di default). Con `enabled: false` il chart non
# crea nessuna policy.
networkPolicy:
  enabled: true
  # Namespace del controller di ingresso (Traefik di k3s) che raggiunge web,
  # gateway e git HTTP.
  ingressNamespace: kube-system
  # Namespace del DNS del cluster.
  dnsNamespace: kube-system
  # core, identity e git escono verso internet (webhook, SMTP, OIDC, mirror):
  # la destinazione la giudica pkg/egress. Qui l'uscita è aperta a tutto
  # tranne i CIDR di pod e servizi del cluster (egress.clusterCIDRs), dove
  # valgono solo gli allow espliciti. Con false l'uscita verso fuori è chiusa
  # (webhook, mirror e OIDC non funzionano).
  allowInternetEgress: true

# --- nats (JetStream, D11) -----------------------------------------------
nats:
  # A differenza di postgres, non c'è (ancora) un'opzione NATS esterno del
  # cliente: D11 non la prevede. `enabled` resta comunque qui per
  # coerenza con gli altri componenti; core richiede sempre
  # GITSTACK_CORE_NATS_URL per avviarsi (vedi services/core/main.go), quindi
  # disattivarlo senza un NATS raggiungibile altrove rompe core.
  enabled: true
  image:
    # Immagine ufficiale su Docker Hub, stesso motivo di postgres.image.registry.
    registry: docker.io
    repository: nats
    tag: "2.10-alpine"
  service:
    clientPort: 4222
  # Autenticazione dei client (F8, ASVS V1.2.2): NATS accetta solo connessioni
  # con utente e password. Il chart li genera una sola volta in un Secret
  # <release>-nats-auth (chiavi `user` e `password`,
  # helm.sh/resource-policy: keep) e li passa a core e git. Alternativa: nome
  # di un Secret esistente con le stesse chiavi.
  auth:
    existingSecret: ""
  persistence:
    size: 5Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

# --- git (repo Git su volume persistente, D6) -----------------------------
# Non è un criterio di accettazione di GIT-8 (quello richiede solo PVC per
# postgres e nats): questo PVC è predisposto nei values per quando arriverà
# il servizio "git" (milestone successiva a M-01), ma disattivato di
# default. Motivo: senza un pod che lo monti, la storage class di default
# di k3s ("local-path", volumeBindingMode WaitForFirstConsumer) lo lascia
# per sempre "Pending" — nessun errore, ma `helm install/upgrade --wait`
# (usato anche dall'installazione di prova in CI) resterebbe in attesa
# indefinitamente. Attivalo solo insieme a un Deployment/StatefulSet che lo
# monta subito: il Deployment del servizio "git" (git.enabled), attivo di
# default insieme a questo PVC (GIT-74).
gitData:
  enabled: true
  persistence:
    size: 10Gi
    storageClassName: ""
    accessMode: ReadWriteOnce

# --- ingress (Traefik, già incluso in k3s) --------------------------------
ingress:
  enabled: true
  # IngressClass di k3s: Traefik è il controller di ingresso di default.
  className: traefik
  # Vuoto = nessuna regola "host" (Traefik risponde su qualunque host,
  # comodo per un'installazione a IP fisso senza DNS). Impostalo per
  # restringere l'Ingress a un nome host preciso.
  host: ""
  annotations: {}
  # HTTPS (N5, GIT-143). Il default del chart resta HTTP (job k3d della CI, prove
  # con helm install a mano): l'installer (deploy/install.sh) lo accende da solo,
  # in tre modi (--tls internal, default; --tls letsencrypt; --tls-cert/--tls-key)
  # e lo lascia spento solo con --insecure-http. Vedi docs/tls.md.
  tls:
    enabled: false
    # Secret kubernetes.io/tls (tls.crt/tls.key) con il certificato servito da
    # Traefik. Lo crea e lo rinnova l'installer (gitstack-tls) e il chart non lo
    # genera: serve per CA interna e certificato del cliente. Vuoto con certResolver.
    secretName: ""
    # Resolver ACME di Traefik (--tls letsencrypt): il certificato lo ottiene e
    # lo rinnova Traefik (HTTP-01), nessun Secret.
    certResolver: ""
    # Con tls.enabled la porta 80 risponde con un redirect permanente a https
    # (Middleware + IngressRoute su "web"). "" = porta 443 standard.
    redirect: true
    # Strict-Transport-Security sulle rotte HTTPS (Middleware Traefik, F3).
    # Secondi di max-age; 0 = nessuna intestazione.
    hstsSeconds: 31536000
    redirectPort: ""
    # ConfigMap con la chiave ca.crt (la CA interna): web lo serve su
    # /downloads/ca.crt, anche in HTTP, per fidarsi di HTTPS. Vuoto = nessun download.
    caConfigMap: ""
